name: ${HC_COMPOSE_PROJECT_NAME:-hc-data-platform-single}

x-api: &api
  image: hc-data-platform-backend:${HC_IMAGE_TAG:-full}
  pull_policy: never
  build:
    context: backend
    target: worker
  env_file: ${HC_ENV_FILE:-.env.single-server}
  environment: &api-environment
    HC_ENVIRONMENT: ${HC_ENVIRONMENT:-local}
    HC_RUNTIME_BACKEND: production
    HC_COMPONENT_ROLE: api
    HC_TEMPORAL_TARGET: temporal:7233
    HC_TEMPORAL_TASK_QUEUE: hc-data-pipeline
    HC_MEDIA_TEMPORAL_TASK_QUEUE: hc-media-pipeline
    HC_POSTGRES_DSN: postgresql+asyncpg://hc:${HC_DB_PASSWORD:?set HC_DB_PASSWORD}@postgres:5432/hc_data
    HC_OBJECT_STORE_PROVIDER: s3
    HC_OBJECT_STORE_ENDPOINT: http://minio:9000
    HC_OBJECT_STORE_PUBLIC_ENDPOINT: ${HC_PUBLIC_ORIGIN:?set HC_PUBLIC_ORIGIN}
    HC_OBJECT_STORE_BUCKET: hc-data-local
    HC_OBJECT_STORE_ACCESS_KEY: ${HC_S3_ACCESS_KEY:?set HC_S3_ACCESS_KEY}
    HC_OBJECT_STORE_SECRET_KEY: ${HC_S3_SECRET_KEY:?set HC_S3_SECRET_KEY}
    HC_ENFORCE_SCHEMA_MIGRATIONS: "true"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,size=768m,uid=65532,gid=65532,mode=1777
  cpus: "${HC_API_CPUS:-2}"
  mem_limit: ${HC_API_MEMORY:-2g}
  pids_limit: 128
  command: [uvicorn, hc_data_platform.core.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --limit-concurrency, "48"]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 30s
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:61c57e5eeda4d69232c97cb23ae5d95d170a1a2fd0b40a6b4f34fb56819b056d
    environment:
      POSTGRES_DB: hc_data
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: ${HC_DB_PASSWORD:?set HC_DB_PASSWORD}
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=80]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hc -d hc_data"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: "${HC_DB_CPUS:-1}"
    mem_limit: ${HC_DB_MEMORY:-768m}
    pids_limit: 128
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${HC_S3_ACCESS_KEY:?set HC_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${HC_S3_SECRET_KEY:?set HC_S3_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: "${HC_S3_CPUS:-1}"
    mem_limit: ${HC_S3_MEMORY:-1g}
    pids_limit: 128
    logging: *logging

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment:
      STORAGE_USER: ${HC_S3_ACCESS_KEY:?set HC_S3_ACCESS_KEY}
      STORAGE_PASSWORD: ${HC_S3_SECRET_KEY:?set HC_S3_SECRET_KEY}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'mc alias set local http://minio:9000 "$$STORAGE_USER" "$$STORAGE_PASSWORD" >/dev/null; mc mb --ignore-existing local/hc-data-local'
    depends_on: {minio: {condition: service_healthy}}
    restart: "no"
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 64
    logging: *logging

  migration:
    <<: *api
    command: [hc-data-migrate, upgrade]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
    healthcheck: {disable: true}

  api:
    <<: *api
    depends_on:
      migration: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: hc
      POSTGRES_PWD: ${HC_DB_PASSWORD:?set HC_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      SQL_MAX_CONNS: "4"
      SQL_MAX_IDLE_CONNS: "2"
      SQL_VIS_MAX_CONNS: "2"
      SQL_VIS_MAX_IDLE_CONNS: "1"
      GOMEMLIMIT: 700MiB
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped
    cpus: "${HC_TEMPORAL_CPUS:-1}"
    mem_limit: ${HC_TEMPORAL_MEMORY:-1g}
    pids_limit: 128
    logging: *logging

  worker:
    <<: *api
    environment:
      <<: *api-environment
      HC_COMPONENT_ROLE: worker
      HC_WORKER_ROLE: combined
      HC_LOCAL_SCOPE_DISCOVERY: ${HC_LOCAL_SCOPE_DISCOVERY:-true}
      HC_OUTBOX_SCOPES: ${HC_OUTBOX_SCOPES:-[]}
      HC_STORAGE_INVENTORY_SCOPES: ${HC_STORAGE_INVENTORY_SCOPES:-[]}
      HC_WORKFLOW_ACTIVITY_FACTORY: hc_data_platform.runtime:media_activity_dependencies
      HC_WORKER_MAX_CONCURRENT_ACTIVITIES: "1"
      HC_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: "2"
      HC_WORKER_MAX_CACHED_WORKFLOWS: "8"
      HC_MEDIA_MAX_CONCURRENT_GENERATIONS: "1"
      HC_MEDIA_GLOBAL_MAX_CONCURRENT_GENERATIONS: "1"
      HC_MEDIA_FFMPEG_THREADS: "1"
      HC_ALIGNMENT_STAGING_ROOT: /tmp/hc-data/alignment
      HC_ALIGNED_MEDIA_STAGING_ROOT: /tmp/hc-data/aligned-media
      HC_LEROBOT_CACHE_MAX_BYTES: "5368709120"
      HC_LEROBOT_CACHE_TTL_HOURS: "24"
      HC_WORKER_READINESS_FILE: /tmp/worker-ready
    command: [hc-data-worker]
    volumes:
      - worker-cache:/tmp/hc-data
    tmpfs:
      - /tmp:rw,nosuid,size=256m,uid=65532,gid=65532,mode=1777
    healthcheck:
      test: [CMD, python, -m, hc_data_platform.workflow.healthcheck, --timeout, "8"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      migration: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    cpus: "${HC_WORKER_CPUS:-2}"
    mem_limit: ${HC_WORKER_MEMORY:-3g}
    pids_limit: 192
    stop_grace_period: 90s
    restart: unless-stopped

  web:
    image: hc-data-platform-frontend:${HC_IMAGE_TAG:-full}
    pull_policy: never
    build:
      context: frontend
      target: runtime
    environment:
      VITE_BUILD_VERSION: ${HC_RELEASE_ID:-platform-v0.1.0-full}
      VITE_RELEASE_ENV: ${HC_FRONTEND_RELEASE_ENV:-dev}
      VITE_PLATFORM_VERSION: 0.1.0
      VITE_CHART_VERSION: 0.1.0
      VITE_GIT_COMMIT: ${HC_GIT_COMMIT:-unknown}
      VITE_RELEASE_MANIFEST_DIGEST: ${HC_RELEASE_MANIFEST_DIGEST:-unreleased}
      VITE_MIGRATION_MANIFEST_DIGEST: ${HC_MIGRATION_MANIFEST_DIGEST:-unreleased}
      VITE_COMPONENT_IMAGE_DIGEST: ${HC_FRONTEND_IMAGE_DIGEST:-unreleased}
    volumes:
      - ./deploy/compose/single-server.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${HC_BIND_ADDRESS:-127.0.0.1}:${HC_HTTP_PORT:-8088}:8080"]
    depends_on: {api: {condition: service_healthy}, minio: {condition: service_healthy}}
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=32m,uid=101,gid=101,mode=1777"]
    restart: unless-stopped
    cpus: "${HC_WEB_CPUS:-0.5}"
    mem_limit: ${HC_WEB_MEMORY:-128m}
    pids_limit: 64
    logging: *logging

volumes:
  worker-cache:
    name: ${HC_WORKER_CACHE_VOLUME:-hc-data-platform-single_worker-cache}
  postgres-data:
    name: ${HC_POSTGRES_VOLUME:-hc-data-platform-single_postgres-data}
    external: ${HC_VOLUMES_EXTERNAL:-false}
  minio-data:
    name: ${HC_MINIO_VOLUME:-hc-data-platform-single_minio-data}
    external: ${HC_VOLUMES_EXTERNAL:-false}
