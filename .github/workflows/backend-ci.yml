name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "plan/BACKEND-DATA-PIPELINE-IMPLEMENTATION-PLAN.md"
  push:
    branches: [main, "codex/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "plan/BACKEND-DATA-PIPELINE-IMPLEMENTATION-PLAN.md"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: >-
          uv sync --frozen
          --extra dev --extra database --extra workflow --extra storage --extra data
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=hc_data_platform --cov-report=term-missing
      - run: uv run python -m hc_data_platform.core.openapi --check
      - name: OpenAPI target compatibility
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:backend/openapi.generated.yaml" > /tmp/backend-openapi-baseline.yaml; then
            uv run python -m hc_data_platform.core.openapi \
              --check --baseline /tmp/backend-openapi-baseline.yaml
          fi

  image-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api --tag hc-data-platform-backend:ci .
      - name: Build Worker image without optional LeRobot SDK
        run: docker build --target worker --tag hc-data-platform-worker:ci .
