name: platform-release

on:
  push:
    tags: ["platform-v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hc-data-platform-frontend
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/hc-data-platform-api
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/hc-data-platform-worker

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release test dependencies
        working-directory: backend
        run: >-
          uv sync --frozen
          --extra dev --extra database --extra workflow --extra storage --extra data
      - name: Treat every known release blocker as a failure
        working-directory: backend
        run: uv run pytest --runxfail tests/system/test_release_blockers.py

  build-once:
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      frontend-digest: ${{ steps.frontend.outputs.digest }}
      api-digest: ${{ steps.api.outputs.digest }}
      worker-digest: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Derive reproducible image metadata
        id: metadata
        run: echo "build-date=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build-date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build-date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Build and push Worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build-date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}@${{ steps.frontend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.API_IMAGE }}@${{ steps.api.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.WORKER_IMAGE }}@${{ steps.worker.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable images with GitHub OIDC
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          cosign sign --yes "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
          cosign sign --yes "${API_IMAGE}@${API_DIGEST}"
          cosign sign --yes "${WORKER_IMAGE}@${WORKER_DIGEST}"
      - name: Generate unified release manifest and Helm values
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: >-
          python deploy/scripts/render_release_manifest.py
          --release-id "${GITHUB_REF_NAME}"
          --git-commit "${GITHUB_SHA}"
          --frontend "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
          --api "${API_IMAGE}@${API_DIGEST}"
          --worker "${WORKER_IMAGE}@${WORKER_DIGEST}"
          --output release.yaml
          --values-output release-values.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-release
          path: |
            release.yaml
            release-values.yaml
          if-no-files-found: error
          retention-days: 90
      - name: Publish the permanent release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release.yaml release-values.yaml
          --verify-tag --title "${GITHUB_REF_NAME}" --notes "Immutable HC Data Platform release"
