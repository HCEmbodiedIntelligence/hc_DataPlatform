# Hot-reload development stack: 8 long-running services + 3 one-shot jobs.
# For the consolidated 6-service deployment, use compose.single-server.yaml.
# Stop that deployment first if it uses these data volumes or host ports.
name: ${HC_COMPOSE_PROJECT_NAME:-hc-data-platform-dev}

x-backend-dev: &backend-dev
  image: hc-data-platform-backend:dev
  pull_policy: never

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5174,http://localhost:5174
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${HC_MINIO_API_BIND_ADDRESS:-127.0.0.1}:${HC_MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${HC_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: [minio-data:/data]

  object-store-browser:
    image: ghcr.io/nginx/nginx-unprivileged:1.29.4-alpine@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    volumes:
      - ./deploy/compose/object-store-browser.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    ports: ["127.0.0.1:${HC_OBJECT_EDGE_HOST_PORT:-9000}:9000"]
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:9000/healthz]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |-
        mc alias set local http://minio:9000 minio minio-local-only
        mc mb --ignore-existing local/hc-data-local
        if cors_error=$(mc cors set local/hc-data-local /config/browser-upload-cors.xml 2>&1); then
          echo "Bucket CORS configuration applied."
        else
          case "$$cors_error" in
            *"functionality that is not implemented"*)
              echo "Bucket CORS API unavailable; using the exact MINIO_API_CORS_ALLOW_ORIGIN fallback."
              ;;
            *)
              echo "Bucket CORS configuration failed."
              exit 1
              ;;
          esac
        fi
    volumes:
      - ./deploy/compose/minio-browser-upload-cors.xml:/config/browser-upload-cors.xml:ro

  postgres:
    image: postgres:16.10-bookworm@sha256:61c57e5eeda4d69232c97cb23ae5d95d170a1a2fd0b40a6b4f34fb56819b056d
    environment:
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc
      POSTGRES_DB: hc_data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hc -d hc_data]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:${HC_POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: hc
      POSTGRES_PWD: hc
      POSTGRES_SEEDS: postgres
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 30
    ports: ["127.0.0.1:${HC_TEMPORAL_HOST_PORT:-7233}:7233"]

  temporal-ui:
    profiles: [tools]
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:${HC_TEMPORAL_UI_HOST_PORT:-8080}:8080"]

  migration:
    <<: *backend-dev
    # Build once here; all backend services depend on this migration job.
    build:
      context: backend
      target: worker-dev
    command: [python, -m, hc_data_platform.core.migrations, upgrade]
    healthcheck: {disable: true}
    volumes:
      - ./backend:/app:ro
    environment:
      HC_ENVIRONMENT: local
      HC_POSTGRES_DSN: ${HC_POSTGRES_DSN:-postgresql+asyncpg://hc:hc@postgres:5432/hc_data}
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  runtime-cache-init:
    <<: *backend-dev
    healthcheck: {disable: true}
    depends_on:
      migration:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        chown 65532:65532 /tmp/hc-data/alignment /tmp/hc-data/aligned-media &&
        chmod 0750 /tmp/hc-data/alignment /tmp/hc-data/aligned-media
    restart: no
    volumes:
      - alignment-cache:/tmp/hc-data/alignment
      - media-staging:/tmp/hc-data/aligned-media

  api:
    <<: *backend-dev
    command: [uvicorn, hc_data_platform.core.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --reload, --reload-dir, /app/src]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HC_ENVIRONMENT: ${HC_ENVIRONMENT:-local}
      HC_PLATFORM_ENVIRONMENT_ID: ${HC_PLATFORM_ENVIRONMENT_ID:-hc-local}
      HC_RUNTIME_BACKEND: production
      HC_RELEASE_ID: ${HC_RELEASE_ID:-platform-v0.1.0-dev}
      HC_PLATFORM_VERSION: 0.1.0
      HC_GIT_COMMIT: ${HC_GIT_COMMIT:-unknown}
      HC_CHART_VERSION: 0.1.0
      HC_RELEASE_MANIFEST_DIGEST: ${HC_RELEASE_MANIFEST_DIGEST:-unreleased}
      HC_MIGRATION_MANIFEST_DIGEST: ${HC_MIGRATION_MANIFEST_DIGEST:-unreleased}
      HC_COMPONENT_ROLE: api
      HC_COMPONENT_IMAGE_DIGEST: ${HC_API_IMAGE_DIGEST:-unreleased}
      HC_API_HOST: 0.0.0.0
      HC_API_PORT: 8000
      HC_POSTGRES_DSN: ${HC_POSTGRES_DSN:-postgresql+asyncpg://hc:hc@postgres:5432/hc_data}
      HC_TEMPORAL_TARGET: ${HC_TEMPORAL_TARGET:-temporal:7233}
      HC_MEDIA_TEMPORAL_TASK_QUEUE: ${HC_MEDIA_TEMPORAL_TASK_QUEUE:-hc-media-pipeline}
      HC_OBJECT_STORE_PROVIDER: s3
      HC_OBJECT_STORE_ENDPOINT: http://minio:9000
      HC_OBJECT_STORE_PUBLIC_ENDPOINT: ${HC_PUBLIC_ORIGIN:-http://127.0.0.1:9000}
      HC_OBJECT_STORE_BUCKET: hc-data-local
      HC_OBJECT_STORE_ACCESS_KEY: minio
      HC_OBJECT_STORE_SECRET_KEY: minio-local-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_ARTIFACT_PREFIX: ${HC_ARTIFACT_PREFIX:-artifacts}
      HC_AUTO_ANNOTATION_PROVIDER_NAME: ${HC_AUTO_ANNOTATION_PROVIDER_NAME:-vlm}
      HC_AUTO_ANNOTATION_PROVIDER_ENDPOINT: ${HC_AUTO_ANNOTATION_PROVIDER_ENDPOINT:-}
      HC_AUTO_ANNOTATION_PROVIDER_MODELS: ${HC_AUTO_ANNOTATION_PROVIDER_MODELS:-[]}
      HC_AUTO_ANNOTATION_PROVIDER_API_KEY: ${HC_AUTO_ANNOTATION_PROVIDER_API_KEY:-}
      HC_AUTO_ANNOTATION_PROVIDER_TIMEOUT_SECONDS: ${HC_AUTO_ANNOTATION_PROVIDER_TIMEOUT_SECONDS:-60}
      HC_AUTO_ANNOTATION_MAX_CONCURRENT_JOBS: ${HC_AUTO_ANNOTATION_MAX_CONCURRENT_JOBS:-4}
      HC_AUTO_ANNOTATION_MAX_JOBS_PER_HOUR: ${HC_AUTO_ANNOTATION_MAX_JOBS_PER_HOUR:-60}
      HC_AUTO_ANNOTATION_DAILY_COST_LIMIT_MICROS: ${HC_AUTO_ANNOTATION_DAILY_COST_LIMIT_MICROS:-5000000}
      HC_INGEST_PART_AUTHORIZATION_TTL_SECONDS: ${HC_INGEST_PART_AUTHORIZATION_TTL_SECONDS:-900}
      HC_ALIGNED_MEDIA_STAGING_ROOT: ${HC_ALIGNED_MEDIA_STAGING_ROOT:-/tmp/hc-data/aligned-media}
      HC_ROBOT_MODEL_ASSET_ROOT: ${HC_ROBOT_MODEL_ASSET_ROOT:-/tmp/hc-data/robot-model-upload-staging}
      HC_ALIGNED_MEDIA_STAGING_TTL_HOURS: ${HC_ALIGNED_MEDIA_STAGING_TTL_HOURS:-24}
      HC_ALIGNED_MEDIA_PUBLICATION_ORPHAN_TTL_MINUTES: ${HC_ALIGNED_MEDIA_PUBLICATION_ORPHAN_TTL_MINUTES:-30}
      HC_MEDIA_MAINTENANCE_INTERVAL_SECONDS: ${HC_MEDIA_MAINTENANCE_INTERVAL_SECONDS:-300}
      HC_ALIGNED_MEDIA_ALLOWED_PROFILES: ${HC_ALIGNED_MEDIA_ALLOWED_PROFILES:-["canonical-h264-crf20-v1"]}
      HC_JWT_ISSUER: ${HC_JWT_ISSUER:-https://identity.example.invalid/}
      HC_JWT_AUDIENCE: ${HC_JWT_AUDIENCE:-hc-data-platform}
      HC_JWT_ALGORITHMS: ${HC_JWT_ALGORITHMS:-["HS256"]}
      HC_JWT_JWKS_URL: ${HC_JWT_JWKS_URL:-}
      HC_JWT_SIGNING_KEY: ${HC_JWT_SIGNING_KEY:-local-development-signing-key-change-me}
      HC_CURSOR_SECRET: ${HC_CURSOR_SECRET:-local-cursor-secret-change-me}
      HC_DATA_SOURCE_CREDENTIAL_KEY: ${HC_DATA_SOURCE_CREDENTIAL_KEY:-local-data-source-credential-key-change-me}
      HC_PASSWORD_MIN_LENGTH: ${HC_PASSWORD_MIN_LENGTH:-6}
      HC_PASSWORD_MAX_LENGTH: ${HC_PASSWORD_MAX_LENGTH:-128}
      HC_PASSWORD_SCRYPT_N: ${HC_PASSWORD_SCRYPT_N:-32768}
      HC_PASSWORD_SCRYPT_R: ${HC_PASSWORD_SCRYPT_R:-8}
      HC_PASSWORD_SCRYPT_P: ${HC_PASSWORD_SCRYPT_P:-1}
      HC_SESSION_IDLE_TTL_SECONDS: ${HC_SESSION_IDLE_TTL_SECONDS:-1800}
      HC_SESSION_ABSOLUTE_TTL_SECONDS: ${HC_SESSION_ABSOLUTE_TTL_SECONDS:-86400}
      HC_SESSION_TOUCH_INTERVAL_SECONDS: ${HC_SESSION_TOUCH_INTERVAL_SECONDS:-60}
      HC_MAX_ACTIVE_SESSIONS: ${HC_MAX_ACTIVE_SESSIONS:-5}
      HC_AUTH_ABUSE_ENABLED: ${HC_AUTH_ABUSE_ENABLED:-false}
      HC_AUTH_ABUSE_HMAC_SECRET: ${HC_AUTH_ABUSE_HMAC_SECRET:-}
      HC_AUTH_CLIENT_IP_MODE: ${HC_AUTH_CLIENT_IP_MODE:-peer}
      HC_AUTH_TRUSTED_PROXY_CIDRS: ${HC_AUTH_TRUSTED_PROXY_CIDRS:-[]}
      HC_AUTH_CHALLENGE_PROVIDER: ${HC_AUTH_CHALLENGE_PROVIDER:-disabled}
      HC_AUTH_TURNSTILE_SITE_KEY: ${HC_AUTH_TURNSTILE_SITE_KEY:-}
      HC_AUTH_TURNSTILE_SECRET: ${HC_AUTH_TURNSTILE_SECRET:-}
      HC_AUTH_TURNSTILE_EXPECTED_HOSTNAMES: ${HC_AUTH_TURNSTILE_EXPECTED_HOSTNAMES:-[]}
      HC_AUTH_TURNSTILE_CONNECT_TIMEOUT_SECONDS: ${HC_AUTH_TURNSTILE_CONNECT_TIMEOUT_SECONDS:-3}
      HC_AUTH_TURNSTILE_READ_TIMEOUT_SECONDS: ${HC_AUTH_TURNSTILE_READ_TIMEOUT_SECONDS:-5}
      HC_AUTH_RECOVERY_ENABLED: ${HC_AUTH_RECOVERY_ENABLED:-false}
      HC_AUTH_RECOVERY_EMAIL_VERIFICATION_TTL_SECONDS: ${HC_AUTH_RECOVERY_EMAIL_VERIFICATION_TTL_SECONDS:-600}
      HC_AUTH_RECOVERY_TOKEN_TTL_SECONDS: ${HC_AUTH_RECOVERY_TOKEN_TTL_SECONDS:-900}
      HC_AUTH_RECOVERY_PUBLIC_BASE_URL: ${HC_AUTH_RECOVERY_PUBLIC_BASE_URL:-}
      HC_AUTH_RECOVERY_EMAIL_FROM: ${HC_AUTH_RECOVERY_EMAIL_FROM:-}
      HC_AUTH_SMTP_HOST: ${HC_AUTH_SMTP_HOST:-}
      HC_AUTH_SMTP_PORT: ${HC_AUTH_SMTP_PORT:-587}
      HC_AUTH_SMTP_USERNAME: ${HC_AUTH_SMTP_USERNAME:-}
      HC_AUTH_SMTP_PASSWORD: ${HC_AUTH_SMTP_PASSWORD:-}
      HC_AUTH_SMTP_STARTTLS: ${HC_AUTH_SMTP_STARTTLS:-true}
      HC_AUTH_SMTP_TIMEOUT_SECONDS: ${HC_AUTH_SMTP_TIMEOUT_SECONDS:-10}
      HC_READINESS_TIMEOUT_SECONDS: ${HC_READINESS_TIMEOUT_SECONDS:-3}
      HC_ENFORCE_SCHEMA_MIGRATIONS: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      object-store-browser:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${HC_API_HOST_PORT:-8000}:8000"]
    volumes:
      - ./backend:/app:ro
    tmpfs:
      - /tmp/hc-data/robot-model-upload-staging:rw,nosuid,size=512m,uid=65532,gid=65532,mode=0750

  worker:
    <<: *backend-dev
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp/hc-runtime:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0750
      - /tmp/hc-data/robot-model-upload-staging:rw,nosuid,size=512m,uid=65532,gid=65532,mode=0750
    environment:
      HC_ENVIRONMENT: ${HC_ENVIRONMENT:-local}
      HC_PLATFORM_ENVIRONMENT_ID: ${HC_PLATFORM_ENVIRONMENT_ID:-hc-local}
      HC_RUNTIME_BACKEND: production
      HC_RELEASE_ID: ${HC_RELEASE_ID:-platform-v0.1.0-dev}
      HC_PLATFORM_VERSION: 0.1.0
      HC_GIT_COMMIT: ${HC_GIT_COMMIT:-unknown}
      HC_CHART_VERSION: 0.1.0
      HC_RELEASE_MANIFEST_DIGEST: ${HC_RELEASE_MANIFEST_DIGEST:-unreleased}
      HC_MIGRATION_MANIFEST_DIGEST: ${HC_MIGRATION_MANIFEST_DIGEST:-unreleased}
      HC_COMPONENT_ROLE: worker
      HC_COMPONENT_IMAGE_DIGEST: ${HC_WORKER_IMAGE_DIGEST:-unreleased}
      HC_POSTGRES_DSN: ${HC_POSTGRES_DSN:-postgresql+asyncpg://hc:hc@postgres:5432/hc_data}
      HC_TEMPORAL_TARGET: ${HC_TEMPORAL_TARGET:-temporal:7233}
      HC_TEMPORAL_TASK_QUEUE: ${HC_TEMPORAL_TASK_QUEUE:-hc-data-pipeline}
      HC_MEDIA_TEMPORAL_TASK_QUEUE: ${HC_MEDIA_TEMPORAL_TASK_QUEUE:-hc-media-pipeline}
      HC_WORKER_ROLE: combined
      HC_WORKER_MAX_CONCURRENT_ACTIVITIES: ${HC_WORKER_MAX_CONCURRENT_ACTIVITIES:-2}
      HC_INGEST_MAX_ACTIVE_PER_DATASET: ${HC_INGEST_MAX_ACTIVE_PER_DATASET:-8}
      HC_WORKFLOW_ACTIVITY_FACTORY: hc_data_platform.runtime:media_activity_dependencies
      HC_OBJECT_STORE_PROVIDER: s3
      HC_OBJECT_STORE_ENDPOINT: http://minio:9000
      HC_OBJECT_STORE_PUBLIC_ENDPOINT: ${HC_PUBLIC_ORIGIN:-http://127.0.0.1:9000}
      HC_OBJECT_STORE_BUCKET: hc-data-local
      HC_OBJECT_STORE_ACCESS_KEY: minio
      HC_OBJECT_STORE_SECRET_KEY: minio-local-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_ARTIFACT_PREFIX: ${HC_ARTIFACT_PREFIX:-artifacts}
      HC_LOCAL_SCOPE_DISCOVERY: "true"
      HC_OUTBOX_SCOPES: ${HC_OUTBOX_SCOPES:-[]}
      HC_OUTBOX_POLL_INTERVAL_SECONDS: ${HC_OUTBOX_POLL_INTERVAL_SECONDS:-0.5}
      HC_OUTBOX_BATCH_SIZE: ${HC_OUTBOX_BATCH_SIZE:-32}
      HC_STORAGE_INVENTORY_SCOPES: ${HC_STORAGE_INVENTORY_SCOPES:-[]}
      HC_STORAGE_INVENTORY_INTERVAL_SECONDS: ${HC_STORAGE_INVENTORY_INTERVAL_SECONDS:-3600}
      HC_ALIGNED_MEDIA_STAGING_ROOT: ${HC_ALIGNED_MEDIA_STAGING_ROOT:-/tmp/hc-data/aligned-media}
      HC_ALIGNED_MEDIA_STAGING_TTL_HOURS: ${HC_ALIGNED_MEDIA_STAGING_TTL_HOURS:-24}
      HC_ALIGNED_MEDIA_PUBLICATION_ORPHAN_TTL_MINUTES: ${HC_ALIGNED_MEDIA_PUBLICATION_ORPHAN_TTL_MINUTES:-30}
      HC_MEDIA_MAINTENANCE_INTERVAL_SECONDS: ${HC_MEDIA_MAINTENANCE_INTERVAL_SECONDS:-300}
      HC_ALIGNED_MEDIA_ALLOWED_PROFILES: ${HC_ALIGNED_MEDIA_ALLOWED_PROFILES:-["canonical-h264-crf20-v1"]}
      HC_MEDIA_MAX_CONCURRENT_GENERATIONS: ${HC_MEDIA_MAX_CONCURRENT_GENERATIONS:-2}
      HC_MEDIA_GLOBAL_MAX_CONCURRENT_GENERATIONS: ${HC_MEDIA_GLOBAL_MAX_CONCURRENT_GENERATIONS:-4}
      HC_MEDIA_FFMPEG_THREADS: ${HC_MEDIA_FFMPEG_THREADS:-2}
      HC_AUTO_ANNOTATION_PROVIDER_NAME: ${HC_AUTO_ANNOTATION_PROVIDER_NAME:-vlm}
      HC_AUTO_ANNOTATION_PROVIDER_ENDPOINT: ${HC_AUTO_ANNOTATION_PROVIDER_ENDPOINT:-}
      HC_AUTO_ANNOTATION_PROVIDER_MODELS: ${HC_AUTO_ANNOTATION_PROVIDER_MODELS:-[]}
      HC_AUTO_ANNOTATION_PROVIDER_API_KEY: ${HC_AUTO_ANNOTATION_PROVIDER_API_KEY:-}
      HC_AUTO_ANNOTATION_PROVIDER_TIMEOUT_SECONDS: ${HC_AUTO_ANNOTATION_PROVIDER_TIMEOUT_SECONDS:-60}
      HC_AUTO_ANNOTATION_MAX_CONCURRENT_JOBS: ${HC_AUTO_ANNOTATION_MAX_CONCURRENT_JOBS:-4}
      HC_AUTO_ANNOTATION_MAX_JOBS_PER_HOUR: ${HC_AUTO_ANNOTATION_MAX_JOBS_PER_HOUR:-60}
      HC_AUTO_ANNOTATION_DAILY_COST_LIMIT_MICROS: ${HC_AUTO_ANNOTATION_DAILY_COST_LIMIT_MICROS:-5000000}
      HC_CURSOR_SECRET: ${HC_CURSOR_SECRET:-local-cursor-secret-change-me}
      HC_DATA_SOURCE_CREDENTIAL_KEY: ${HC_DATA_SOURCE_CREDENTIAL_KEY:-local-data-source-credential-key-change-me}
      HC_AUTH_ABUSE_ENABLED: ${HC_AUTH_ABUSE_ENABLED:-false}
      HC_AUTH_ABUSE_HMAC_SECRET: ${HC_AUTH_ABUSE_HMAC_SECRET:-}
      HC_AUTH_CHALLENGE_PROVIDER: ${HC_AUTH_CHALLENGE_PROVIDER:-disabled}
      HC_AUTH_TURNSTILE_SITE_KEY: ${HC_AUTH_TURNSTILE_SITE_KEY:-}
      HC_AUTH_TURNSTILE_SECRET: ${HC_AUTH_TURNSTILE_SECRET:-}
      HC_AUTH_TURNSTILE_EXPECTED_HOSTNAMES: ${HC_AUTH_TURNSTILE_EXPECTED_HOSTNAMES:-[]}
      HC_AUTH_TURNSTILE_CONNECT_TIMEOUT_SECONDS: ${HC_AUTH_TURNSTILE_CONNECT_TIMEOUT_SECONDS:-3}
      HC_AUTH_TURNSTILE_READ_TIMEOUT_SECONDS: ${HC_AUTH_TURNSTILE_READ_TIMEOUT_SECONDS:-5}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      object-store-browser:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      runtime-cache-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app:ro
      - alignment-cache:/tmp/hc-data/alignment
      - media-staging:/tmp/hc-data/aligned-media
    stop_grace_period: 90s

  frontend:
    image: hc-data-platform-frontend:dev
    pull_policy: never
    build:
      context: frontend
      target: frontend-dev
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_LEROBOT_UPLOAD_TRANSPORT: proxy
      VITE_SSE_BASE_URL: /api/v1/events
      VITE_MOCK_MODE: ${HC_FRONTEND_MOCK_MODE:-off}
      VITE_DEFAULT_PROJECT_ID: ${HC_FRONTEND_DEFAULT_PROJECT_ID:-be22-hf-g1-video-20260819-02-p1}
      VITE_DEFAULT_REGION_CODE: ${HC_FRONTEND_DEFAULT_REGION_CODE:-be22-hf-g1-video-20260819-02-cn}
      VITE_BUILD_VERSION: platform-v0.1.0-dev
      VITE_RELEASE_ENV: dev
      VITE_PLATFORM_VERSION: 0.1.0
      VITE_GIT_COMMIT: unknown
      VITE_CHART_VERSION: 0.1.0
      VITE_RELEASE_MANIFEST_DIGEST: unreleased
      VITE_MIGRATION_MANIFEST_DIGEST: unreleased
      VITE_COMPONENT_IMAGE_DIGEST: unreleased
      VITE_DEV_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${HC_FRONTEND_HOST_PORT:-5174}:5173"]
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules

  gateway:
    image: ghcr.io/nginx/nginx-unprivileged:1.29.4-alpine@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports: ["${HC_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${HC_GATEWAY_HOST_PORT:-8088}:8080"]

volumes:
  minio-data:
  postgres-data:
  alignment-cache:
  media-staging:
