name: hc-data-platform-test-gates

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:61c57e5eeda4d69232c97cb23ae5d95d170a1a2fd0b40a6b4f34fb56819b056d
    environment:
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc-test-only
      POSTGRES_DB: hc_data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hc -d hc_data]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio-test
      MINIO_ROOT_PASSWORD: minio-test-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5174,http://localhost:5174
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
    labels:
      hc.test.disposable: "true"
    ports:
      - 127.0.0.1:19000:9000

  object-store-browser:
    image: ghcr.io/nginx/nginx-unprivileged:1.29.4-alpine@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    volumes:
      - ./deploy/compose/object-store-browser.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - 127.0.0.1:9000:9000
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:9000/healthz]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |-
        mc alias set gate http://minio:9000 minio-test minio-test-only
        mc mb --ignore-existing gate/hc-data-test
        if cors_error=$(mc cors set gate/hc-data-test /config/browser-upload-cors.xml 2>&1); then
          echo "Bucket CORS configuration applied."
        else
          case "$$cors_error" in
            *"functionality that is not implemented"*)
              echo "Bucket CORS API unavailable; using the exact MINIO_API_CORS_ALLOW_ORIGIN fallback."
              ;;
            *)
              echo "Bucket CORS configuration failed."
              exit 1
              ;;
          esac
        fi
    volumes:
      - ./deploy/compose/minio-browser-upload-cors.xml:/config/browser-upload-cors.xml:ro
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: hc
      POSTGRES_PWD: hc-test-only
      POSTGRES_SEEDS: postgres
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 3s
      timeout: 5s
      retries: 40

  migration:
    build:
      context: backend
      target: api
    command: [hc-data-migrate, upgrade]
    environment:
      HC_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migration-check:
    build:
      context: backend
      target: api
    command: [hc-data-migrate, status]
    environment:
      HC_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  worker:
    build:
      context: backend
      target: worker
    tmpfs:
      - /tmp/hc-runtime:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0750
    environment:
      HC_ENVIRONMENT: test
      HC_PLATFORM_ENVIRONMENT_ID: hc-test-gates
      HC_RUNTIME_BACKEND: production
      HC_COMPONENT_ROLE: worker
      HC_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
      HC_TEMPORAL_TARGET: temporal:7233
      HC_TEMPORAL_TASK_QUEUE: hc-data-pipeline-test
      HC_OUTBOX_SCOPES: '["be22-be24-proof-a-org/be22-be24-proof-a-p1/be22-be24-proof-a-cn","be22-be24-proof-b-org/be22-be24-proof-b-p1/be22-be24-proof-b-cn"]'
      HC_WORKFLOW_ACTIVITY_FACTORY: hc_data_platform.runtime:activity_dependencies
      HC_OBJECT_STORE_ENDPOINT: http://minio:9000
      HC_OBJECT_STORE_BUCKET: hc-data-test
      HC_OBJECT_STORE_ACCESS_KEY: minio-test
      HC_OBJECT_STORE_SECRET_KEY: minio-test-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_CURSOR_SECRET: test-cursor-secret-not-for-production
      HC_DATA_SOURCE_CREDENTIAL_KEY: test-data-source-credential-key-not-production
      HC_AUTH_ABUSE_ENABLED: "false"
      HC_MCAP_DECODER_FACTORY: tests.system.wave2.decoder:factory
      PYTHONPATH: /test-suite
    depends_on:
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      object-store-browser:
        condition: service_healthy
      migration-check:
        condition: service_completed_successfully
    volumes:
      - ./backend/tests:/test-suite/tests:ro

  api:
    build:
      context: backend
      target: api
    environment:
      HC_ENVIRONMENT: test
      HC_PLATFORM_ENVIRONMENT_ID: hc-test-gates
      HC_RUNTIME_BACKEND: production
      HC_COMPONENT_ROLE: api
      HC_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
      HC_TEMPORAL_TARGET: temporal:7233
      HC_TEMPORAL_TASK_QUEUE: hc-data-pipeline-test
      HC_OBJECT_STORE_ENDPOINT: http://minio:9000
      HC_OBJECT_STORE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      HC_OBJECT_STORE_BUCKET: hc-data-test
      HC_OBJECT_STORE_ACCESS_KEY: minio-test
      HC_OBJECT_STORE_SECRET_KEY: minio-test-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_JWT_ISSUER: https://be22.test.invalid/
      HC_JWT_AUDIENCE: hc-data-platform
      HC_JWT_ALGORITHMS: '["HS256"]'
      HC_JWT_SIGNING_KEY: be22-compose-signing-key-ephemeral-only
      HC_CURSOR_SECRET: test-cursor-secret-not-for-production
      HC_DATA_SOURCE_CREDENTIAL_KEY: test-data-source-credential-key-not-production
      HC_SESSION_IDLE_TTL_SECONDS: "1800"
      HC_SESSION_ABSOLUTE_TTL_SECONDS: "86400"
      HC_SESSION_TOUCH_INTERVAL_SECONDS: "60"
      HC_MAX_ACTIVE_SESSIONS: "5"
      HC_AUTH_ABUSE_ENABLED: "false"
      HC_ENFORCE_SCHEMA_MIGRATIONS: "true"
      HC_API_DOCS_ENABLED: "false"
    depends_on:
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration-check:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/nginx/nginx-unprivileged:1.29.4-alpine@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8088:8080
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:8080/healthz]
      interval: 3s
      timeout: 3s
      retries: 30

  gate-runner:
    build:
      context: backend
      target: api-dev
    # Mount the repository at its real shape: system/security contracts read
    # sibling deploy/, frontend/, and scripts/ files in addition to backend/.
    working_dir: /workspace/backend
    user: "${HC_GATE_UID:-1000}:${HC_GATE_GID:-1000}"
    environment:
      HC_ENVIRONMENT: test
      HC_PLATFORM_ENVIRONMENT_ID: hc-test-gates
      HC_RUNTIME_BACKEND: production
      HC_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
      HC_TEST_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
      HC_ANNOTATION_TEST_POSTGRES_DSN: postgresql://hc:hc-test-only@postgres:5432/hc_data
      HC_MINIO_ENDPOINT: http://minio:9000
      HC_MINIO_BUCKET: hc-data-test
      HC_MINIO_ACCESS_KEY: minio-test
      HC_MINIO_SECRET_KEY: minio-test-only
      HC_TEMPORAL_TARGET: temporal:7233
      HC_OBJECT_STORE_ENDPOINT: http://minio:9000
      HC_OBJECT_STORE_BUCKET: hc-data-test
      HC_OBJECT_STORE_ACCESS_KEY: minio-test
      HC_OBJECT_STORE_SECRET_KEY: minio-test-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_CURSOR_SECRET: test-cursor-secret-not-for-production
      HC_MIGRATIONS_DIR: /workspace/backend/migrations
    depends_on:
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration-check:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace:ro
      - ./artifacts/test-gates:/artifacts
    command: [python, -c, "print('gate dependencies ready')"]

  be22-runner:
    build:
      context: backend
      target: api-dev
    working_dir: /app
    user: "${HC_GATE_UID:-1000}:${HC_GATE_GID:-1000}"
    environment:
      HC_ENVIRONMENT: test
      HC_WAVE2_CLEANUP_ENABLED: "1"
      HC_WAVE2_TEST_DATABASE_ACK: hc_data
      HC_WAVE2_JWT_SIGNING_KEY: be22-compose-signing-key-ephemeral-only
      HC_JWT_ISSUER: https://be22.test.invalid/
      HC_JWT_AUDIENCE: hc-data-platform
      HC_TEST_POSTGRES_DSN: postgresql+asyncpg://hc:hc-test-only@postgres:5432/hc_data
      HC_MINIO_ENDPOINT: http://minio:9000
      HC_MINIO_BUCKET: hc-data-test
      HC_MINIO_ACCESS_KEY: minio-test
      HC_MINIO_SECRET_KEY: minio-test-only
      HC_OBJECT_STORE_REGION: us-east-1
      HC_WAVE2_BASE_URL: http://gateway:8080
      HC_WAVE2_WORKER_TIMEOUT_SECONDS: "180"
    depends_on:
      gateway:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
      - ./artifacts/test-gates:/artifacts
    command: [python, -c, "print('BE22 dependencies ready')"]
