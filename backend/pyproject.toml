[project]
name = "hc-data-platform-backend"
version = "0.1.0"
description = "Platform foundation and ingest bounded context"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "boto3==1.43.53",
  "fastapi==0.139.2",
  "pyjwt==2.10.1",
  "pydantic==2.13.4",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/domains/ingest/schemas.py" = ["E501"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
