[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hc-data-platform-backend"
version = "0.1.0"
description = "Backend data pipeline for embodied intelligence datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-distro>=0.50b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-logging>=0.50b0,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.3,<3",
  "PyYAML>=6,<7",
  "temporalio>=1.8,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
database = [
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]
workflow = ["temporalio>=1.8,<2"]
storage = ["boto3>=1.35,<2", "oss2>=2.19,<3"]
backup = ["boto3>=1.35,<2", "psycopg[binary]>=3.2,<4", "zstandard>=0.25,<1"]
data = [
  "mcap>=1.2,<2",
  "mcap-ros2-support>=0.5.7,<0.6",
  "pyarrow>=16",
  "pylance>=0.22",
  "numpy>=2",
  "Pillow>=10",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12",
]
lerobot-v3-validation = [
  "lerobot[dataset]>=0.6.1,<0.7; python_version == '3.12'",
]

[project.scripts]
hc-data-api = "hc_data_platform.core.app:run"
hc-data-migrate = "hc_data_platform.core.migrations:main"
hc-offline-import = "hc_data_platform.ingest.cli:main"
hc-openapi = "hc_data_platform.core.openapi:main"
hc-capacity-gate = "hc_data_platform.core.capacity_gate:main"
hc-data-worker = "hc_data_platform.workflow.worker:main"
hc-storage-inventory = "hc_data_platform.storage.inventory_cli:main"
hc-postgres-backup = "hc_data_platform.backup.postgresql_cli:main"
hc-object-backup = "hc_data_platform.backup.object_cli:main"
hc-configuration-backup = "hc_data_platform.backup.dependency_cli:main"
hc-temporal-backup = "hc_data_platform.backup.temporal_cli:main"
hc-platform = "hc_data_platform.backup.whole_cli:main"
hc-frontend-heartbeat = "hc_data_platform.platform_ops.frontend_heartbeat:main"
hc-lerobot-import = "hc_data_platform.tools.lerobot_platform_upload:main"
hc-lerobot-platform-upload = "hc_data_platform.tools.lerobot_platform_upload:main"
hc-native-recording = "hc_data_platform.tools.native_unitree_g1_recording:main"
hc-native-recording-upload = "hc_data_platform.tools.native_recording_upload:main"
hc-release-controller = "hc_data_platform.platform_control.release_cli:main"
hc-dr-evidence-gate = "hc_data_platform.platform_control.dr_evidence:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hc_data_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib -p no:launch_testing -p no:launch_ros"
testpaths = ["tests"]
markers = [
  "asyncio: asynchronous tests executed by pytest-asyncio",
  "integration: tests requiring local infrastructure",
  "system: cross-module or capacity tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "asyncpg",
  "asyncpg.*",
  "boto3",
  "boto3.*",
  "botocore",
  "botocore.*",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcap", "mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true
