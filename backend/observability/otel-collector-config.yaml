receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
  resource/environment:
    attributes:
      - key: deployment.environment.name
        action: upsert
        from_attribute: deployment.environment
  batch:
    send_batch_size: 2048
    timeout: 5s

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [0.01s, 0.05s, 0.1s, 0.25s, 0.5s, 1s, 2.5s, 5s, 10s, 30s, 60s, 300s, 600s]
    dimensions:
      - name: project_id
      - name: resource_id
      - name: workflow_id

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus]
