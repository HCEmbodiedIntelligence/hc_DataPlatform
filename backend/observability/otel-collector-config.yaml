extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96
  filter/runtime_contract:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch(body, "^\\{\\\"schema_version\\\":\\\"hc-runtime-log/v1\\\",")'
  batch:
    send_batch_size: 2048
    timeout: 5s

exporters:
  otlp_http/loki:
    endpoint: ${env:HC_LOKI_OTLP_ENDPOINT}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  nop: {}

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/runtime_contract, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
