  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/versions/{version_id}/episode-revisions/{revision_id}/logical/streams/{stream_id}/media/authorize
  : post:
      operationId: authorizeLogicalDataMedia
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: path
        name: revision_id
        required: true
        schema:
          title: Revision Id
          type: string
      - in: path
        name: stream_id
        required: true
        schema:
          title: Stream Id
          type: string
      - in: query
        name: snapshot_token
        required: true
        schema:
          maxLength: 2048
          minLength: 16
          title: Snapshot Token
          type: string
      - in: query
        name: snapshot_id
        required: true
        schema:
          pattern: ^snapshot_[0-9a-f]{64}$
          title: Snapshot Id
