        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: path
        name: revision_id
        required: true
        schema:
          title: Revision Id
          type: string
      - in: query
        name: snapshot_token
        required: true
        schema:
          maxLength: 2048
          minLength: 16
          title: Snapshot Token
          type: string
      - in: query
        name: snapshot_id
        required: true
        schema:
          pattern: ^snapshot_[0-9a-f]{64}$
          title: Snapshot Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalRobotScene'
