components:
  schemas:
    AnnotationLogicalSnapshot:
      additionalProperties: false
      properties:
        snapshot:
          $ref: '#/components/schemas/LogicalSnapshot'
        snapshot_id:
          title: Snapshot Id
          type: string
        snapshot_token:
          maxLength: 2048
          minLength: 16
          title: Snapshot Token
          type: string
        task_id:
          title: Task Id
          type: string
      required:
      - snapshot_id
      - snapshot
      - task_id
      - snapshot_token
      title: AnnotationLogicalSnapshot
      type: object
    FrozenRobotScene:
      additionalProperties: false
      properties:
        asset_manifest_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Asset Manifest Sha256
        assets:
          default: []
          items:
            $ref: '#/components/schemas/RobotModelAsset'
          title: Assets
          type: array
        binding_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Binding Id
        calibration:
          $ref: '#/components/schemas/JsonValue'
        calibration_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Calibration Sha256
          type: string
        captured_at_stage:
          const: PACKAGE_PLANNING
          default: PACKAGE_PLANNING
          title: Captured At Stage
          type: string
        format:
          const: hc-robot-scene/1
          default: hc-robot-scene/1
          title: Format
          type: string
        joint_mapping_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Joint Mapping Sha256
        joint_mappings:
          default: []
          items:
            $ref: '#/components/schemas/RobotModelJointMapping'
          title: Joint Mappings
          type: array
        model_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version Id
        robot_id:
          title: Robot Id
          type: string
        status:
          enum:
          - FROZEN
          - NO_MODEL_BINDING
          title: Status
          type: string
      required:
      - robot_id
      - status
      - calibration
      - calibration_sha256
      title: FrozenRobotScene
      type: object
    LogicalMediaGrant:
      additionalProperties: false
      description: 'Playback mapping for one frozen stream, without storage dispatch fields.


        Logical sample i maps to media_start_seconds + i / sample_rate_hz.

        Original videos retain their real offset; depth previews retain their

        colorizer metadata. The URL grants existing media and never starts encoding.'
      properties:
        colorizer:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Colorizer
        content_type:
          const: video/mp4
          default: video/mp4
          title: Content Type
          type: string
        depth_max_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Depth Max M
        depth_min_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Depth Min M
        expires_at:
          format: date-time
          title: Expires At
          type: string
        height:
          exclusiveMinimum: 0.0
          title: Height
          type: integer
        kind:
          enum:
          - video
          - depth-preview
          title: Kind
          type: string
        media_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Media Sha256
        media_start_seconds:
          minimum: 0.0
          title: Media Start Seconds
          type: number
        media_url:
          title: Media Url
          type: string
        sample_count:
          exclusiveMinimum: 0.0
          title: Sample Count
          type: integer
        sample_rate_hz:
          exclusiveMinimum: 0.0
          title: Sample Rate Hz
          type: number
        snapshot_id:
          title: Snapshot Id
          type: string
        stream_id:
          title: Stream Id
          type: string
        width:
          exclusiveMinimum: 0.0
          title: Width
          type: integer
      required:
      - snapshot_id
      - stream_id
      - kind
      - media_url
      - expires_at
      - sample_count
      - sample_rate_hz
      - media_start_seconds
      - width
      - height
      title: LogicalMediaGrant
      type: object
    LogicalRobotAssetGrant:
      additionalProperties: false
      properties:
        asset:
          $ref: '#/components/schemas/RobotModelAsset'
        authorization:
          $ref: '#/components/schemas/RobotModelAssetDownloadAuthorization'
        scene_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Scene Sha256
          type: string
        snapshot_id:
          title: Snapshot Id
          type: string
      required:
      - snapshot_id
      - scene_sha256
      - asset
      - authorization
      title: LogicalRobotAssetGrant
      type: object
    LogicalRobotScene:
      additionalProperties: false
      properties:
        provenance:
          enum:
          - FROZEN
          - MISSING_HISTORICAL
          title: Provenance
          type: string
        scene:
          anyOf:
          - $ref: '#/components/schemas/FrozenRobotScene'
          - type: 'null'
        scene_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Scene Sha256
        snapshot_id:
          title: Snapshot Id
          type: string
      required:
      - snapshot_id
      - provenance
      title: LogicalRobotScene
      type: object
    LogicalSample:
      additionalProperties: false
      properties:
        repeated:
          title: Repeated
          type: boolean
        sample_id:
          title: Sample Id
          type: string
        sample_index:
          minimum: 0.0
          title: Sample Index
          type: integer
        source_timestamps_ns:
          default: []
          items:
            type: string
          title: Source Timestamps Ns
          type: array
        time_error_ns:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Error Ns
        timestamp_ns:
          anyOf:
          - pattern: ^[0-9]+$
            type: string
          - type: 'null'
          title: Timestamp Ns
        valid:
          title: Valid
          type: boolean
        value:
          title: Value
      required:
      - sample_id
      - sample_index
      - value
      - valid
      - repeated
      title: LogicalSample
      type: object
    LogicalSampleBatch:
      additionalProperties: false
      properties:
        end:
          minimum: 0.0
          title: End
          type: integer
        samples:
          items:
            $ref: '#/components/schemas/LogicalSample'
          title: Samples
          type: array
        snapshot_id:
          title: Snapshot Id
          type: string
        start:
          minimum: 0.0
          title: Start
          type: integer
        stream_id:
          title: Stream Id
          type: string
      required:
      - snapshot_id
      - stream_id
      - start
      - end
      - samples
      title: LogicalSampleBatch
      type: object
    LogicalSnapshot:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Content Sha256
          type: string
        episode_id:
          title: Episode Id
          type: string
        format:
          const: hc-logical-snapshot/1
          default: hc-logical-snapshot/1
          title: Format
          type: string
        selection:
          $ref: '#/components/schemas/SnapshotSelection'
        streams:
          items:
            $ref: '#/components/schemas/LogicalStream'
          title: Streams
          type: array
      required:
      - selection
      - episode_id
      - content_sha256
      - streams
      title: LogicalSnapshot
      type: object
    LogicalSnapshotView:
      additionalProperties: false
      properties:
        snapshot:
          $ref: '#/components/schemas/LogicalSnapshot'
        snapshot_id:
          title: Snapshot Id
          type: string
      required:
      - snapshot_id
      - snapshot
      title: LogicalSnapshotView
      type: object
    LogicalStream:
      additionalProperties: false
      properties:
        end_ns:
          anyOf:
          - pattern: ^[0-9]+$
            type: string
          - type: 'null'
          title: End Ns
        kind:
          minLength: 1
          title: Kind
          type: string
        name:
          minLength: 1
          title: Name
          type: string
        sample_count:
          minimum: 0.0
          title: Sample Count
          type: integer
        start_ns:
          anyOf:
          - pattern: ^[0-9]+$
            type: string
          - type: 'null'
          title: Start Ns
        stream_id:
          minLength: 1
          title: Stream Id
          type: string
        temporal:
          title: Temporal
          type: boolean
        value_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Value Kind
      required:
      - stream_id
      - name
      - kind
      - sample_count
      - temporal
      title: LogicalStream
      type: object
    SnapshotSelection:
      additionalProperties: false
      properties:
        dataset_id:
          minLength: 1
          title: Dataset Id
          type: string
        organization_id:
          minLength: 1
          title: Organization Id
          type: string
        project_id:
          minLength: 1
          title: Project Id
          type: string
        region_code:
          minLength: 1
          title: Region Code
          type: string
        revision_id:
          minLength: 1
          title: Revision Id
          type: string
        version_id:
          minLength: 1
          title: Version Id
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      - dataset_id
      - version_id
      - revision_id
      title: SnapshotSelection
      type: object
info:
  title: HC logical frozen data contract
  version: '2026-10-08'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/annotation-tasks/{task_id}/logical:
    get:
      operationId: getAnnotationLogicalDataSnapshot
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationLogicalSnapshot'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Snapshot
      tags:
      - annotation
      - logical_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/versions/{version_id}/episode-revisions/{revision_id}/logical
  : get:
      operationId: getLogicalDataSnapshot
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      - in: path
        name: revision_id
        required: true
        schema:
          title: Revision Id
          type: string
      - in: query
        name: snapshot_token
        required: true
        schema:
          maxLength: 2048
          minLength: 16
          title: Snapshot Token
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalSnapshotView'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Snapshot
      tags:
      - logical_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/versions/{version_id}/episode-revisions/{revision_id}/logical/robot-scene
  : get:
      operationId: getLogicalRobotScene
