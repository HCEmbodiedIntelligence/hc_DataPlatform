        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Getlogicalrobotscene
      tags:
      - logical_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/versions/{version_id}/episode-revisions/{revision_id}/logical/robot-scene/assets/{asset_id}/authorize
