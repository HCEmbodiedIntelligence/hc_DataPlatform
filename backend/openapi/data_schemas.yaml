components:
  schemas:
    CanonicalRouteQuery:
      additionalProperties: false
      properties:
        component_id:
          maxLength: 128
          minLength: 1
          title: Component Id
          type: string
        detail_tab:
          maxLength: 64
          minLength: 1
          title: Detail Tab
          type: string
        schema_id:
          maxLength: 128
          minLength: 1
          title: Schema Id
          type: string
        schema_version:
          pattern: ^[1-9]\d*$
          title: Schema Version
          type: string
      required:
      - schema_id
      - schema_version
      - component_id
      - detail_tab
      title: CanonicalRouteQuery
      type: object
    CreateStreamSchemaRequest:
      additionalProperties: false
      description: Creates v1 or the next immutable draft version for one schema family.
      properties:
        change_summary:
          maxLength: 2000
          minLength: 1
          title: Change Summary
          type: string
        compatibility_mode:
          pattern: ^(STRICT|BACKWARD|FORWARD|FULL)$
          title: Compatibility Mode
          type: string
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        family_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._:-]{0,127}$
          title: Family Id
          type: string
        logical_type:
          maxLength: 128
          minLength: 1
          title: Logical Type
          type: string
        schema_definition:
          $ref: '#/components/schemas/StreamSchemaDefinition'
        schema_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._:-]{0,127}$
          title: Schema Id
          type: string
      required:
      - schema_id
      - family_id
      - display_name
      - logical_type
      - compatibility_mode
      - schema_definition
      - change_summary
      title: CreateStreamSchemaRequest
      type: object
    DataSchemaDatasetReference:
      additionalProperties: false
      description: Immutable evidence that a dataset consumed a fixed published schema version.
      properties:
        associated_at:
          format: date-time
          title: Associated At
          type: string
        associated_by:
          maxLength: 128
          minLength: 1
          title: Associated By
          type: string
        dataset_id:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
        dataset_version_id:
          maxLength: 128
          minLength: 1
          title: Dataset Version Id
          type: string
        schema_id:
          maxLength: 128
          minLength: 1
          title: Schema Id
          type: string
        schema_version:
          pattern: ^[1-9]\d*$
          title: Schema Version
          type: string
      required:
      - schema_id
      - schema_version
      - dataset_id
      - dataset_version_id
      - associated_by
      - associated_at
      title: DataSchemaDatasetReference
      type: object
    DataSchemaDatasetReferenceEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-21'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSchemaDatasetReference'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaDatasetReferenceScope'
      required:
      - data
      - scope
      - request_id
      title: DataSchemaDatasetReferenceEnvelope
      type: object
    DataSchemaDatasetReferencePage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-21'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/DataSchemaDatasetReference'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaDatasetReferenceScope'
      required:
      - items
      - page_info
      - scope
      - request_id
      title: DataSchemaDatasetReferencePage
      type: object
    DataSchemaDatasetReferenceRequest:
      additionalProperties: false
      description: Pins one READY immutable dataset version to a published schema version.
      properties:
        dataset_id:
          maxLength: 128
          minLength: 1
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        dataset_version_id:
          maxLength: 128
          minLength: 1
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Version Id
          type: string
      required:
      - dataset_id
      - dataset_version_id
      title: DataSchemaDatasetReferenceRequest
      type: object
    DataSchemaDatasetReferenceScope:
      additionalProperties: false
      description: Exact dataset scope for a durable schema-version provenance fact.
      properties:
        organization_id:
          maxLength: 128
          minLength: 1
          title: Organization Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          title: Project Id
          type: string
        region_code:
          maxLength: 64
          minLength: 1
          title: Region Code
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      title: DataSchemaDatasetReferenceScope
      type: object
    DataSchemaEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSchemaVersionRecord'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaScope'
      required:
      - data
      - scope
      - request_id
      title: DataSchemaEnvelope
      type: object
    DataSchemaPage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/DataSchemaVersionRecord'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: DataSchemaPage
      type: object
    DataSchemaPublishPreflight:
      additionalProperties: false
      properties:
        allowed:
          title: Allowed
          type: boolean
        blockers:
          default: []
          items:
            $ref: '#/components/schemas/SchemaBlockedReason'
          title: Blockers
          type: array
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        impacts:
          default: []
          items:
            $ref: '#/components/schemas/SchemaBlockedReason'
          title: Impacts
          type: array
        preflight_token:
          anyOf:
          - maxLength: 256
            minLength: 32
            type: string
          - type: 'null'
          title: Preflight Token
        resource_revision:
          maxLength: 256
          minLength: 1
          title: Resource Revision
          type: string
        warnings:
          default: []
          items:
            $ref: '#/components/schemas/SchemaBlockedReason'
          title: Warnings
          type: array
      required:
      - allowed
      - resource_revision
      title: DataSchemaPublishPreflight
      type: object
    DataSchemaPublishPreflightEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-21'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSchemaPublishPreflight'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaScope'
      required:
      - data
      - scope
      - request_id
      title: DataSchemaPublishPreflightEnvelope
      type: object
    DataSchemaPublishPreflightRequest:
      additionalProperties: false
      properties:
        acknowledge_warning_codes:
          default: []
          items:
            type: string
          maxItems: 64
          title: Acknowledge Warning Codes
          type: array
        change_summary:
          maxLength: 2000
          minLength: 1
          title: Change Summary
          type: string
        compatibility_check_id:
          maxLength: 128
          minLength: 1
          title: Compatibility Check Id
          type: string
        expected_etag:
          maxLength: 256
          minLength: 1
          title: Expected Etag
          type: string
        expected_hash:
          pattern: ^[0-9a-f]{64}$
          title: Expected Hash
          type: string
        validation_report_id:
          maxLength: 128
          minLength: 1
          title: Validation Report Id
          type: string
      required:
      - expected_hash
      - expected_etag
      - validation_report_id
      - compatibility_check_id
      - change_summary
      title: DataSchemaPublishPreflightRequest
      type: object
    DataSchemaPublishRequest:
      additionalProperties: false
      properties:
        preflight_token:
          maxLength: 256
          minLength: 32
          title: Preflight Token
          type: string
      required:
      - preflight_token
      title: DataSchemaPublishRequest
      type: object
    DataSchemaRouteEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSchemaRouteResolution'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaRouteScope'
      required:
      - data
      - scope
      - request_id
      title: DataSchemaRouteEnvelope
      type: object
    DataSchemaRouteResolution:
      additionalProperties: false
      properties:
        allowed_actions:
          default:
          - VIEW
          items:
            type: string
          title: Allowed Actions
          type: array
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/SchemaBlockedReason'
          title: Blocked Reasons
          type: array
        canonical_query:
          $ref: '#/components/schemas/CanonicalRouteQuery'
        relation_revision:
          maxLength: 256
          minLength: 1
          title: Relation Revision
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaRouteScope'
      required:
      - canonical_query
      - scope
      - relation_revision
      title: DataSchemaRouteResolution
      type: object
    DataSchemaRouteScope:
      additionalProperties: false
      properties:
        organization_id:
          maxLength: 128
          minLength: 1
          title: Organization Id
          type: string
        project_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Project Id
        region_code:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Region Code
      required:
      - organization_id
      title: DataSchemaRouteScope
      type: object
    DataSchemaScope:
      additionalProperties: false
      properties:
        organization_id:
          maxLength: 128
          minLength: 1
          title: Organization Id
          type: string
      required:
      - organization_id
      title: DataSchemaScope
      type: object
    DataSchemaValidationFinding:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 512
          minLength: 1
          title: Message
          type: string
        path:
          maxLength: 512
          minLength: 1
          title: Path
          type: string
        severity:
          pattern: ^(ERROR|WARNING)$
          title: Severity
          type: string
      required:
      - code
      - severity
      - message
      - path
      title: DataSchemaValidationFinding
      type: object
    DataSchemaValidationReport:
      additionalProperties: false
      properties:
        checked_at:
          format: date-time
          title: Checked At
          type: string
        checked_by:
          maxLength: 128
          minLength: 1
          title: Checked By
          type: string
        compatibility_check_id:
          maxLength: 128
          minLength: 1
          title: Compatibility Check Id
          type: string
        compatibility_result:
          pattern: ^(PASSED|FAILED)$
          title: Compatibility Result
          type: string
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        findings:
          default: []
          items:
            $ref: '#/components/schemas/DataSchemaValidationFinding'
          title: Findings
          type: array
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        schema_id:
          maxLength: 128
          minLength: 1
          title: Schema Id
          type: string
        schema_version:
          pattern: ^[1-9]\d*$
          title: Schema Version
          type: string
        status:
          pattern: ^(PASSED|FAILED)$
          title: Status
          type: string
      required:
      - id
      - schema_id
      - schema_version
      - content_hash
      - compatibility_check_id
      - compatibility_result
      - status
      - checked_by
      - checked_at
      title: DataSchemaValidationReport
      type: object
    DataSchemaValidationReportEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-21'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSchemaValidationReport'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSchemaScope'
      required:
      - data
      - scope
      - request_id
      title: DataSchemaValidationReportEnvelope
      type: object
    DataSchemaVersionRecord:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/SchemaBlockedReason'
          title: Blocked Reasons
          type: array
        compatibility_mode:
          maxLength: 64
          minLength: 1
          title: Compatibility Mode
          type: string
        compatibility_result:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Compatibility Result
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        family_id:
          maxLength: 128
          minLength: 1
          title: Family Id
          type: string
        logical_type:
          maxLength: 128
          minLength: 1
          title: Logical Type
          type: string
        schema_definition:
          additionalProperties: true
          title: Schema Definition
          type: object
        schema_hash:
          anyOf:
          - $ref: '#/components/schemas/SchemaHash'
          - type: 'null'
        schema_id:
          maxLength: 128
          minLength: 1
          title: Schema Id
          type: string
        schema_version:
          pattern: ^[1-9]\d*$
          title: Schema Version
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
      required:
      - schema_id
      - family_id
      - schema_version
      - display_name
      - logical_type
      - status
      - compatibility_mode
      - schema_definition
      - etag
      title: DataSchemaVersionRecord
      type: object
    SchemaBlockedReason:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 512
          minLength: 1
          title: Message
          type: string
      required:
      - code
      - message
      title: SchemaBlockedReason
      type: object
    SchemaHash:
      additionalProperties: false
      properties:
        algorithm:
          maxLength: 64
          minLength: 1
          title: Algorithm
          type: string
        canonicalization_version:
          maxLength: 128
          minLength: 1
          title: Canonicalization Version
          type: string
        value:
          maxLength: 128
          minLength: 1
          title: Value
          type: string
      required:
      - algorithm
      - canonicalization_version
      - value
      title: SchemaHash
      type: object
    StreamSchemaDefinition:
      additionalProperties: false
      description: Canonical P17 document; unsupported JSON-Schema keywords are rejected.
      properties:
        fields:
          items:
            $ref: '#/components/schemas/StreamSchemaDefinitionField'
          maxItems: 256
          minItems: 1
          title: Fields
          type: array
      required:
      - fields
      title: StreamSchemaDefinition
      type: object
    StreamSchemaDefinitionField:
      additionalProperties: false
      description: The supported, portable field vocabulary for an authored stream schema.
      properties:
        description:
          default: ''
          maxLength: 1024
          title: Description
          type: string
        name:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
          title: Name
          type: string
        required:
          default: false
          title: Required
          type: boolean
        type:
          maxLength: 128
          minLength: 1
          title: Type
          type: string
      required:
      - name
      - type
      title: StreamSchemaDefinitionField
      type: object
    UpdateStreamSchemaDraftRequest:
      additionalProperties: false
      description: Edits only the currently addressed DRAFT version under a strong ETag.
      properties:
        change_summary:
          maxLength: 2000
          minLength: 1
          title: Change Summary
          type: string
        compatibility_mode:
          anyOf:
          - pattern: ^(STRICT|BACKWARD|FORWARD|FULL)$
            type: string
          - type: 'null'
          title: Compatibility Mode
        display_name:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        logical_type:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Logical Type
        schema_definition:
          anyOf:
          - $ref: '#/components/schemas/StreamSchemaDefinition'
          - type: 'null'
      required:
      - change_summary
      title: UpdateStreamSchemaDraftRequest
      type: object
info:
  title: HC data schemas contract
  version: '2026-08-19'
openapi: 3.1.0
paths:
  ? /api/v1/organizations/{organization_id}/projects/{project_id}/regions/{region_code}/stream-schemas/{schema_id}/versions/{schema_version}/dataset-references
  : get:
      operationId: listDataSchemaDatasetReferences
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: schema_id
        required: true
        schema:
          title: Schema Id
          type: string
      - in: path
        name: schema_version
        required: true
        schema:
          title: Schema Version
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSchemaDatasetReferencePage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '428':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
      security:
      - bearerAuth: []
      summary: List Data Schema Dataset References
      tags:
      - data-schemas
    post:
      operationId: associateDataSchemaDatasetReference
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: schema_id
        required: true
        schema:
          title: Schema Id
          type: string
      - in: path
        name: schema_version
        required: true
        schema:
          title: Schema Version
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: If-Match
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSchemaDatasetReferenceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSchemaDatasetReferenceEnvelope'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
        '428':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The data-schema request could not be completed.
      security:
      - bearerAuth: []
      summary: Associate Data Schema Dataset Reference
      tags:
      - data-schemas
  /api/v1/organizations/{organization_id}/stream-schemas:
    get:
      operationId: listStreamSchemas
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - pattern: ^(DRAFT|PUBLISHED)$
            type: string
          - type: 'null'
          title: Status
      - in: query
        name: logical_type
        required: false
        schema:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Logical Type
      - in: query
        name: after
        required: false
        schema:
          anyOf:
          - maxLength: 16384
            minLength: 1
            type: string
          - type: 'null'
          title: After
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - maxLength: 16384
            minLength: 1
            type: string
          - type: 'null'
          title: Before
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: X-Project-ID
        required: true
        schema:
          maxLength: 128
          minLength: 1
