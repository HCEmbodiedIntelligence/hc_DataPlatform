paths:
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions:
    post:
      operationId: createUploadSession
      tags: [ingest]
      description: Creates or returns the one immutable multipart session for a rollout and SHA-256.
      parameters:
        - &authorization_parameter {name: Authorization, in: header, required: true, schema: {type: string, pattern: "^Bearer .+$"}}
        - &project_parameter {name: project_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$"}}
        - &region_parameter {name: region_code, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$"}}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUploadRequest"}
      responses:
        "201":
          description: Multipart session and short-lived direct-upload authorizations.
          headers:
            Cache-Control: {schema: {type: string}, description: Signed URLs are never cached.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionGrant"}
        "401": &unauthorized_response
          description: Verified AuthContext is absent.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
        "403": &forbidden_response
          description: Uploader role or project/region scope is denied.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
        "409": &conflict_response
          description: Immutable identity, content, state, or multipart part conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:
    get:
      operationId: getUploadSession
      tags: [ingest]
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - &session_parameter {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Persisted upload session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "404": &not_found_response
          description: Session does not exist in the authorized scope.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}/parts:
    get:
      operationId: listUploadParts
      tags: [ingest]
      description: Reconciles and returns the object store's uploaded multipart parts.
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      responses:
        "200":
          description: Parts sorted by ascending part_number.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/UploadPart"}
        "404": *not_found_response
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:renew:
    post:
      operationId: renewUploadPartAuthorizations
      tags: [ingest]
      description: Reissues short-lived PUT URLs; object bytes never pass through this API.
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartNumbersRequest"}
      responses:
        "200":
          description: Short-lived direct PUT authorizations.
          headers:
            Cache-Control: {schema: {type: string}, description: Clients must not cache signed URLs.}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PartAuthorization"}
        "409": *conflict_response
        "422": &validation_response
          description: Request or raw-object integrity validation failed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:complete:
    post:
      operationId: completeUploadSession
      tags: [ingest]
      description: Completes multipart only when the sorted client list exactly matches storage.
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteUploadRequest"}
      responses:
        "200":
          description: Multipart object exists but is not committed until the manifest call succeeds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "409": *conflict_response
        "422": *validation_response
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:pause:
    post:
      operationId: pauseUploadSession
      tags: [ingest]
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      responses:
        "200":
          description: Session paused without aborting uploaded parts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "409": *conflict_response
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:resume:
    post:
      operationId: resumeUploadSession
      tags: [ingest]
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResumeUploadRequest"}
      responses:
        "200":
          description: Resumed persisted session and optional renewed PUT URLs.
          headers:
            Cache-Control: {schema: {type: string}, description: Signed URLs are never cached.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionGrant"}
        "409": *conflict_response
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:cancel:
    post:
      operationId: cancelUploadSession
      tags: [ingest]
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      responses:
        "200":
          description: Multipart state aborted and session cancelled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "409": *conflict_response
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions/{session_id}:commit-manifest:
    post:
      operationId: commitRolloutManifest
      tags: [ingest]
      description: Streams integrity checks, then writes the immutable manifest as the final commit marker.
      parameters:
        - *authorization_parameter
        - *project_parameter
        - *region_parameter
        - *session_parameter
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RolloutManifestV1"}
      responses:
        "200":
          description: Immutable raw object committed; same rollout and SHA retries return this resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RawObjectCommittedV1"}
        "409": *conflict_response
        "422": *validation_response
components:
  schemas:
    IngestIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._-]+$"
    RolloutManifestV1:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, task_id, collection_job_id, rollout_id, sequence_no, robot_id, start_time, end_time, expected_topics, actual_topics, file_size, sha256, crc64, compression, recorder_version]
      properties:
        schema_version: {type: integer, const: 1}
        project_id: {$ref: "#/components/schemas/IngestIdentifier"}
        task_id: {$ref: "#/components/schemas/IngestIdentifier"}
        collection_job_id: {$ref: "#/components/schemas/IngestIdentifier"}
        rollout_id: {$ref: "#/components/schemas/IngestIdentifier"}
        sequence_no: {type: integer, minimum: 1}
        robot_id: {$ref: "#/components/schemas/IngestIdentifier"}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        expected_topics: {type: array, items: {type: string}}
        actual_topics: {type: array, items: {type: string}}
        file_size: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        crc64: {type: integer, minimum: 0, maximum: 18446744073709551615}
        compression: {type: string}
        recorder_version: {type: string}
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [manifest]
      properties:
        manifest: {$ref: "#/components/schemas/RolloutManifestV1"}
        part_numbers:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 10000}
    PartNumbersRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 10000}
    ResumeUploadRequest:
      type: object
      additionalProperties: false
      properties:
        part_numbers:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 10000}
    CompletedPart:
      type: object
      additionalProperties: false
      required: [part_number, etag]
      properties:
        part_number: {type: integer, minimum: 1, maximum: 10000}
        etag: {type: string, minLength: 1, maxLength: 512}
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: "#/components/schemas/CompletedPart"}
          x-sorted-by: part_number
    PartAuthorization:
      type: object
      required: [part_number, url, expires_at]
      properties:
        part_number: {type: integer, minimum: 1, maximum: 10000}
        url: {type: string, format: uri, writeOnly: true}
        expires_at: {type: string, format: date-time}
    UploadSession:
      type: object
      required: [session_id, project_id, region_code, rollout_id, object_key, multipart_upload_id, expected_sha256, expected_size, expected_crc64, manifest_fingerprint, status, created_at, updated_at]
      properties:
        session_id: {type: string, format: uuid}
        project_id: {$ref: "#/components/schemas/IngestIdentifier"}
        region_code: {$ref: "#/components/schemas/IngestIdentifier"}
        rollout_id: {$ref: "#/components/schemas/IngestIdentifier"}
        object_key: {type: string, pattern: "^raw/v1/"}
        multipart_upload_id: {type: string}
        expected_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        expected_size: {type: integer, minimum: 1}
        expected_crc64: {type: integer, minimum: 0, maximum: 18446744073709551615}
        manifest_fingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        status: {type: string, enum: [REGISTERED, UPLOADING, PAUSED, MULTIPART_COMPLETED, RAW_COMMITTED, FAILED, CANCELLED]}
        etag: {type: [string, "null"]}
        failure_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    UploadSessionGrant:
      type: object
      required: [session, parts]
      properties:
        session: {$ref: "#/components/schemas/UploadSession"}
        parts:
          type: array
          items: {$ref: "#/components/schemas/PartAuthorization"}
    UploadPart:
      type: object
      required: [session_id, project_id, region_code, part_number, status, updated_at]
      properties:
        session_id: {type: string, format: uuid}
        project_id: {$ref: "#/components/schemas/IngestIdentifier"}
        region_code: {$ref: "#/components/schemas/IngestIdentifier"}
        part_number: {type: integer, minimum: 1, maximum: 10000}
        status: {type: string, enum: [AUTHORIZED, UPLOADED]}
        etag: {type: [string, "null"]}
        size: {type: [integer, "null"], minimum: 0}
        crc64: {type: [integer, "null"], minimum: 0, maximum: 18446744073709551615}
        authorization_expires_at: {type: [string, "null"], format: date-time}
        updated_at: {type: string, format: date-time}
    RawObjectCommittedV1:
      type: object
      required: [event_type, schema_version, project_id, region_code, rollout_id, object_key, manifest_key, sha256, file_size, committed_at]
      properties:
        event_type: {type: string, const: rollout.raw_committed.v1}
        schema_version: {type: integer, const: 1}
        project_id: {$ref: "#/components/schemas/IngestIdentifier"}
        region_code: {$ref: "#/components/schemas/IngestIdentifier"}
        rollout_id: {$ref: "#/components/schemas/IngestIdentifier"}
        object_key: {type: string, pattern: "^raw/v1/"}
        manifest_key: {type: string, pattern: "/rollout_manifest.json$"}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        file_size: {type: integer, minimum: 1}
        committed_at: {type: string, format: date-time}
