components:
  schemas:
    CleaningAsyncJob:
      additionalProperties: false
      properties:
        cancellable:
          title: Cancellable
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        error:
          anyOf:
          - {}
          - type: 'null'
          title: Error
        etag:
          maxLength: 256
          minLength: 3
          pattern: ^"[^"\r\n]+"$
          title: Etag
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        job_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Job Id
          type: string
        kind:
          enum:
          - CLEANING_PREVIEW
          - CLEANING_COMMIT
          title: Kind
          type: string
        progress:
          anyOf:
          - {}
          - type: 'null'
          title: Progress
        resource_ref:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          title: Resource Ref
          type: object
        result_ref:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Result Ref
        retry_of_job_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          - type: 'null'
          title: Retry Of Job Id
        scope:
          $ref: '#/components/schemas/CleaningWorkbenchScope'
        stage:
          maxLength: 128
          minLength: 1
          title: Stage
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
          - EXPIRED
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - job_id
      - kind
      - status
      - stage
      - scope
      - resource_ref
      - created_at
      - updated_at
      - etag
      - cancellable
      title: CleaningAsyncJob
      type: object
    CleaningDraft:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            enum:
            - VIEW
            - ACQUIRE_LEASE
            - SAVE_EDL
            - CREATE_PREVIEW
            - COMMIT
            - OPEN_REVIEW
            - OPEN_SUCCESSOR
            type: string
          title: Allowed Actions
          type: array
        base_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Revision Id
          type: string
        base_version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Version Id
          type: string
        commit_status:
          enum:
          - NONE
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          title: Commit Status
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        etag:
          maxLength: 256
          minLength: 3
          pattern: ^"[^"\r\n]+"$
          title: Etag
          type: string
        manual_issue_count:
          enum:
          - '0'
          - '1'
          title: Manual Issue Count
          type: string
        origin:
          discriminator:
            mapping:
              ISSUE_DERIVED: '#/components/schemas/IssueDerivedOrigin'
              REVIEW_RETURN: '#/components/schemas/ReviewReturnOrigin'
            propertyName: origin_type
          oneOf:
          - $ref: '#/components/schemas/IssueDerivedOrigin'
          - $ref: '#/components/schemas/ReviewReturnOrigin'
          title: Origin
        output_version_status:
          anyOf:
          - enum:
            - REVIEWING
            - READY
            - RETURNED
            type: string
          - type: 'null'
          title: Output Version Status
        preview_status:
          enum:
          - NONE
          - QUEUED
          - RUNNING
          - READY
          - FAILED
          - EXPIRED
          - STALE
          title: Preview Status
          type: string
        review_decision_id:
          anyOf:
          - pattern: ^review_decision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Review Decision Id
        review_finding_count:
          default: '0'
          pattern: ^(0|[1-9][0-9]*)$
          title: Review Finding Count
          type: string
        review_summary:
          anyOf:
          - $ref: '#/components/schemas/ReviewReturnSummary'
          - type: 'null'
        status:
          enum:
          - EDITING
          - COMMITTED
          title: Status
          type: string
        successor_draft_id:
          anyOf:
          - pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Successor Draft Id
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - draft_id
      - etag
      - status
      - origin
      - base_version_id
      - base_revision_id
      - episode_id
      - manual_issue_count
      - preview_status
      - commit_status
      - created_at
      - updated_at
      title: CleaningDraft
      type: object
    CleaningDraftBase:
      additionalProperties: false
      properties:
        calibration_set_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          - type: 'null'
          title: Calibration Set Id
        dataset_id:
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Revision Id
          type: string
        robot_model_version_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          - type: 'null'
          title: Robot Model Version Id
        schema_snapshot_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Schema Snapshot Id
          type: string
        version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Version Id
          type: string
      required:
      - dataset_id
      - version_id
      - episode_id
      - revision_id
      - schema_snapshot_id
      title: CleaningDraftBase
      type: object
    CleaningDraftBootstrapData:
      additionalProperties: false
      properties:
        active_commit:
          anyOf:
          - discriminator:
              mapping:
                FAILED: '#/components/schemas/CommitFailed'
                QUEUED: '#/components/schemas/CommitQueued'
                SUCCEEDED: '#/components/schemas/CommitSucceeded'
              propertyName: status
            oneOf:
            - $ref: '#/components/schemas/CommitQueued'
            - $ref: '#/components/schemas/CommitSucceeded'
            - $ref: '#/components/schemas/CommitFailed'
          - type: 'null'
          title: Active Commit
        active_preview:
          anyOf:
          - discriminator:
              mapping:
                EXPIRED: '#/components/schemas/PreviewExpiredOrStale'
                FAILED: '#/components/schemas/PreviewFailed'
                QUEUED: '#/components/schemas/PreviewQueued'
                READY: '#/components/schemas/PreviewReady'
                RUNNING: '#/components/schemas/PreviewRunning'
                STALE: '#/components/schemas/PreviewExpiredOrStale'
              propertyName: status
            oneOf:
            - $ref: '#/components/schemas/PreviewQueued'
            - $ref: '#/components/schemas/PreviewRunning'
            - $ref: '#/components/schemas/PreviewReady'
            - $ref: '#/components/schemas/PreviewFailed'
            - $ref: '#/components/schemas/PreviewExpiredOrStale'
          - type: 'null'
          title: Active Preview
        allowed_actions:
          default: []
          items:
            enum:
            - VIEW
            - ACQUIRE_LEASE
            - SAVE_EDL
            - CREATE_PREVIEW
            - COMMIT
            - OPEN_REVIEW
            - OPEN_SUCCESSOR
            type: string
          title: Allowed Actions
          type: array
        base:
          $ref: '#/components/schemas/CleaningDraftBase'
        draft:
          $ref: '#/components/schemas/CleaningDraft'
        edl:
          $ref: '#/components/schemas/CleaningEdl'
        lease:
          anyOf:
          - $ref: '#/components/schemas/CooperativeLease'
          - type: 'null'
        origin:
          discriminator:
            mapping:
              ISSUE_DERIVED: '#/components/schemas/IssueDerivedOrigin'
              REVIEW_RETURN: '#/components/schemas/ReviewReturnOrigin'
            propertyName: origin_type
          oneOf:
          - $ref: '#/components/schemas/IssueDerivedOrigin'
          - $ref: '#/components/schemas/ReviewReturnOrigin'
          title: Origin
        review_feedback:
          anyOf:
          - $ref: '#/components/schemas/ReviewReturnFeedback'
          - type: 'null'
        streams:
          items:
            $ref: '#/components/schemas/CleaningStream'
          minItems: 1
          title: Streams
          type: array
        successor_composition:
          anyOf:
          - $ref: '#/components/schemas/ReviewSuccessorComposition'
          - type: 'null'
      required:
      - draft
      - origin
      - base
      - streams
      - edl
      title: CleaningDraftBootstrapData
      type: object
    CleaningDraftBootstrapEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/CleaningDraftBootstrapData'
        request_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/CleaningWorkbenchScope'
      required:
      - data
      - scope
      - request_id
      title: CleaningDraftBootstrapEnvelope
      type: object
    CleaningEdl:
      additionalProperties: false
      properties:
        edl_revision:
          pattern: ^(0|[1-9][0-9]*)$
          title: Edl Revision
          type: string
        etag:
          maxLength: 256
          minLength: 3
          pattern: ^"[^"\r\n]+"$
          title: Etag
          type: string
        operation_hash:
          pattern: ^sha256:[a-f0-9]{64}$
          title: Operation Hash
          type: string
        operations:
          default: []
          items:
            discriminator:
              mapping:
                DISABLE_CHANNEL: '#/components/schemas/DisableChannelOperation'
                EXCLUDE_RANGE: '#/components/schemas/ExcludeRangeOperation'
                INVALIDATE_EPISODE: '#/components/schemas/InvalidateEpisodeOperation'
                INVALID_MASK: '#/components/schemas/InvalidMaskOperation'
                SET_METADATA: '#/components/schemas/SetMetadataOperation'
                SPLIT: '#/components/schemas/SplitOperation'
                TIME_OFFSET: '#/components/schemas/TimeOffsetOperation'
                TRIM: '#/components/schemas/TrimOperation'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/TrimOperation'
            - $ref: '#/components/schemas/ExcludeRangeOperation'
            - $ref: '#/components/schemas/SplitOperation'
            - $ref: '#/components/schemas/TimeOffsetOperation'
            - $ref: '#/components/schemas/DisableChannelOperation'
            - $ref: '#/components/schemas/SetMetadataOperation'
            - $ref: '#/components/schemas/InvalidateEpisodeOperation'
            - $ref: '#/components/schemas/InvalidMaskOperation'
          title: Operations
          type: array
        summary:
          $ref: '#/components/schemas/CleaningSummary'
        updated_at:
          format: date-time
          title: Updated At
          type: string
        validation:
          $ref: '#/components/schemas/CleaningValidation'
      required:
      - edl_revision
      - etag
      - operation_hash
      - validation
      - summary
      - updated_at
      title: CleaningEdl
      type: object
    CleaningOutputRevision:
      additionalProperties: false
      properties:
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        episode_stream_ids:
          items:
            pattern: ^stream_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          minItems: 1
          title: Episode Stream Ids
          type: array
        member_mode:
          enum:
          - EDIT_RESULT
          - CARRY_FORWARD
          title: Member Mode
          type: string
        ordinal:
          minimum: 0.0
          title: Ordinal
          type: integer
        revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Revision Id
          type: string
        source_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Source Revision Id
          type: string
      required:
      - revision_id
      - ordinal
      - episode_id
      - episode_stream_ids
      - source_revision_id
      - member_mode
      title: CleaningOutputRevision
      type: object
    CleaningOutputVersion:
      additionalProperties: false
      properties:
        commit_id:
          pattern: ^commit_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Commit Id
          type: string
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        status:
          enum:
          - REVIEWING
          - READY
          - RETURNED
          title: Status
          type: string
        version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Version Id
          type: string
      required:
      - version_id
      - status
      - draft_id
      - commit_id
      title: CleaningOutputVersion
      type: object
    CleaningStream:
      additionalProperties: false
      properties:
        channel_path:
          maxLength: 512
          minLength: 1
          title: Channel Path
          type: string
        duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Duration Ns
          type: string
        kind:
          maxLength: 64
          minLength: 1
          title: Kind
          type: string
        stream_id:
          pattern: ^stream_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Stream Id
          type: string
      required:
      - stream_id
      - channel_path
      - kind
      - duration_ns
      title: CleaningStream
      type: object
    CleaningSummary:
      additionalProperties: false
      properties:
        calculated_at:
          format: date-time
          title: Calculated At
          type: string
        disabled_stream_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Disabled Stream Count
          type: string
        estimate_status:
          enum:
          - ESTIMATED
          - CONFIRMED
          - COMPUTING
          - FAILED
          title: Estimate Status
          type: string
        excluded_union_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Excluded Union Duration Ns
          type: string
        invalid_mask_union_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Invalid Mask Union Duration Ns
          type: string
        new_derived_bytes:
          pattern: ^(0|[1-9][0-9]*)$
          title: New Derived Bytes
          type: string
        output_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Output Duration Ns
          type: string
        output_segment_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Output Segment Count
          type: string
        requires_materialization:
          title: Requires Materialization
          type: boolean
        reuse_rate:
          pattern: ^(0|1|0\.[0-9]+)$
          title: Reuse Rate
          type: string
        reused_source_bytes:
          pattern: ^(0|[1-9][0-9]*)$
          title: Reused Source Bytes
          type: string
        source_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Source Duration Ns
          type: string
        trimmed_domain_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Trimmed Domain Duration Ns
          type: string
      required:
      - source_duration_ns
      - trimmed_domain_duration_ns
      - excluded_union_duration_ns
      - invalid_mask_union_duration_ns
      - output_duration_ns
      - output_segment_count
      - disabled_stream_count
      - reused_source_bytes
      - new_derived_bytes
      - reuse_rate
      - requires_materialization
      - estimate_status
      - calculated_at
      title: CleaningSummary
      type: object
    CleaningValidation:
      additionalProperties: false
      properties:
        issues:
          default: []
          items:
            $ref: '#/components/schemas/CleaningValidationIssue'
          title: Issues
          type: array
        status:
          enum:
          - PASSED
          - FAILED
          title: Status
          type: string
        validated_edl_revision:
          pattern: ^(0|[1-9][0-9]*)$
          title: Validated Edl Revision
          type: string
        validated_operation_hash:
          pattern: ^sha256:[a-f0-9]{64}$
          title: Validated Operation Hash
          type: string
      required:
      - status
      - validated_edl_revision
      - validated_operation_hash
      title: CleaningValidation
      type: object
    CleaningValidationIssue:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Z0-9_:-]+$
          title: Code
          type: string
        json_pointer:
          anyOf:
          - pattern: ^/[^\s]*$
            type: string
          - type: 'null'
          title: Json Pointer
        message:
          maxLength: 2048
          minLength: 1
          title: Message
          type: string
        operation_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          - type: 'null'
          title: Operation Id
        severity:
          enum:
          - BLOCKER
          - WARNING
          - INFO
          title: Severity
          type: string
      required:
      - code
      - severity
      - message
      title: CleaningValidationIssue
      type: object
    CleaningWorkbenchScope:
      additionalProperties: false
      properties:
        organization_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Organization Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Project Id
          type: string
        region_code:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Region Code
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      title: CleaningWorkbenchScope
      type: object
    CommitAcceptedEnvelope:
      additionalProperties: false
      properties:
        commit:
          discriminator:
            mapping:
              FAILED: '#/components/schemas/CommitFailed'
              QUEUED: '#/components/schemas/CommitQueued'
              SUCCEEDED: '#/components/schemas/CommitSucceeded'
            propertyName: status
          oneOf:
          - $ref: '#/components/schemas/CommitQueued'
          - $ref: '#/components/schemas/CommitSucceeded'
          - $ref: '#/components/schemas/CommitFailed'
          title: Commit
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        job:
          $ref: '#/components/schemas/CleaningAsyncJob'
        request_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/CleaningWorkbenchScope'
      required:
      - commit
      - job
      - scope
      - request_id
      title: CommitAcceptedEnvelope
      type: object
    CommitAcknowledgement:
      additionalProperties: false
      properties:
        compared_preview:
          const: true
          title: Compared Preview
          type: boolean
        reviewed_summary:
          const: true
          title: Reviewed Summary
          type: boolean
      required:
      - reviewed_summary
      - compared_preview
      title: CommitAcknowledgement
      type: object
    CommitCleaningDraftCommand:
      additionalProperties: false
      properties:
        acknowledgement:
          $ref: '#/components/schemas/CommitAcknowledgement'
        base_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Revision Id
          type: string
        edl_revision:
          pattern: ^(0|[1-9][0-9]*)$
          title: Edl Revision
          type: string
        operation_hash:
          pattern: ^sha256:[a-f0-9]{64}$
          title: Operation Hash
          type: string
        preview_id:
          pattern: ^preview_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Preview Id
          type: string
        successor_composition_hash:
          anyOf:
          - pattern: ^sha256:[a-f0-9]{64}$
            type: string
          - type: 'null'
          title: Successor Composition Hash
      required:
      - preview_id
      - base_revision_id
      - edl_revision
      - operation_hash
      - acknowledgement
      title: CommitCleaningDraftCommand
      type: object
    CommitFailed:
      additionalProperties: false
      properties:
        commit_id:
          pattern: ^commit_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Commit Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        error_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Error Ref
          type: string
        job_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Job Id
          type: string
        materialization_status:
          enum:
          - NOT_STARTED
          - FAILED
          title: Materialization Status
          type: string
        output_revisions:
          default: []
          maxItems: 0
          minItems: 0
          title: Output Revisions
          type: array
        output_version:
          title: Output Version
          type: 'null'
        preview_id:
          pattern: ^preview_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Preview Id
          type: string
        status:
          const: FAILED
          default: FAILED
          title: Status
          type: string
        successor_composition_hash:
          anyOf:
          - pattern: ^sha256:[a-f0-9]{64}$
            type: string
          - type: 'null'
          title: Successor Composition Hash
      required:
      - commit_id
      - draft_id
      - preview_id
      - job_id
      - created_at
      - error_ref
      - materialization_status
      title: CommitFailed
      type: object
    CommitQueued:
      additionalProperties: false
      properties:
        commit_id:
          pattern: ^commit_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Commit Id
          type: string
        created_at:
          format: date-time
