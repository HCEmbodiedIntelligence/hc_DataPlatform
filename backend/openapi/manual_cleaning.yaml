          type: string
        discovery_source:
          default: DATA_VIEWER
          enum:
          - DATA_VIEWER
          - ANNOTATOR
          - REVIEWER
          title: Discovery Source
          type: string
        end_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: End Ns
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        episode_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Revision Id
          type: string
        episode_stream_id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Episode Stream Id
          type: string
        etag:
          maxLength: 256
          minLength: 3
          title: Etag
          type: string
        id:
          pattern: ^issue_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Id
          type: string
        issue_type:
          enum:
          - POSE_JITTER
          - TIMESTAMP_DRIFT
          - MISSING_FRAME
          - STREAM_GAP
          - CALIBRATION_MISMATCH
          - INVALID_MASK
          - OTHER
          title: Issue Type
          type: string
        origin_dataset_version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Origin Dataset Version Id
          type: string
        related_draft_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Related Draft Count
          type: string
        resolution_note:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
          title: Resolution Note
        resolution_version:
          anyOf:
          - $ref: '#/components/schemas/ManualIssueResolutionVersion'
          - type: 'null'
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        resolved_by:
          anyOf:
          - $ref: '#/components/schemas/ManualIssuePrincipal'
          - type: 'null'
        scope:
          $ref: '#/components/schemas/ManualIssueScope'
        severity:
          enum:
          - LOW
