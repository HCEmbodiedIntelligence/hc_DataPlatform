          type: string
        related_drafts:
          default: []
          items:
            $ref: '#/components/schemas/ManualIssueDraftRef'
          title: Related Drafts
          type: array
        resolution_note:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
