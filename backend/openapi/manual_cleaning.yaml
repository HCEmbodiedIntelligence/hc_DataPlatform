      - snapshot_at
      title: ManualIssuePageData
      type: object
    ManualIssuePageEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/ManualIssuePageData'
        request_id:
          maxLength: 128
