        etag:
          maxLength: 256
          minLength: 3
          title: Etag
          type: string
        id:
          pattern: ^issue_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Id
          type: string
        issue_type:
          enum:
          - POSE_JITTER
          - TIMESTAMP_DRIFT
          - MISSING_FRAME
