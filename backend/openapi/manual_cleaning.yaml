          type: string
        start_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Start Ns
          type: string
        status:
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - etag
      - scope
      - dataset_id
      - origin_dataset_version_id
      - episode_id
      - episode_revision_id
      - episode_stream_id
      - start_ns
      - end_ns
      - issue_type
      - severity
      - status
      - related_draft_count
      - updated_at
