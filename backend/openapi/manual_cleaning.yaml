        schema_snapshot_id:
          maxLength: 256
          minLength: 1
          title: Schema Snapshot Id
          type: string
        scope:
          $ref: '#/components/schemas/ManualIssueScope'
        severity:
          enum:
          - LOW
          - MEDIUM
          - HIGH
