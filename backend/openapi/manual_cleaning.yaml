components:
  schemas:
    CreateDraftFromIssueCommand:
      additionalProperties: false
      description: The browser may not submit source or draft context to this P09 command.
      properties: {}
      title: CreateDraftFromIssueCommand
      type: object
    CreateManualIssueCommand:
      additionalProperties: false
      properties:
        annotation_task_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Annotation Task Id
        discovery_source:
          default: DATA_VIEWER
          enum:
          - DATA_VIEWER
          - ANNOTATOR
          - REVIEWER
          title: Discovery Source
          type: string
        end_ns:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: End Ns
        episode_id:
          anyOf:
          - pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Episode Id
        episode_revision_id:
          anyOf:
          - pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Episode Revision Id
        episode_stream_id:
          anyOf:
          - pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          - type: 'null'
          title: Episode Stream Id
        issue_type:
          enum:
          - POSE_JITTER
          - TIMESTAMP_DRIFT
          - MISSING_FRAME
          - STREAM_GAP
          - CALIBRATION_MISMATCH
          - INVALID_MASK
          - OTHER
          title: Issue Type
          type: string
        note:
          maxLength: 8192
          title: Note
          type: string
        origin_dataset_version_id:
          anyOf:
          - pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Origin Dataset Version Id
        relative_end_ns:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Relative End Ns
        relative_start_ns:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Relative Start Ns
        severity:
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          title: Severity
          type: string
        source_kind:
          default: DATASET
          enum:
          - DATASET
          - ANNOTATION_TASK
          title: Source Kind
          type: string
        start_ns:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Start Ns
        stream_ref:
          anyOf:
          - maxLength: 512
            minLength: 1
            type: string
          - type: 'null'
          title: Stream Ref
      required:
      - issue_type
      - severity
      - note
      title: CreateManualIssueCommand
      type: object
    ManualIssueBlockedReason:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 1000
          minLength: 1
          title: Message
          type: string
      required:
      - code
      - message
      title: ManualIssueBlockedReason
      type: object
    ManualIssueCounts:
      additionalProperties: false
      properties:
        in_progress:
          pattern: ^(0|[1-9][0-9]*)$
          title: In Progress
          type: string
        open:
          pattern: ^(0|[1-9][0-9]*)$
          title: Open
          type: string
        resolved:
          pattern: ^(0|[1-9][0-9]*)$
          title: Resolved
          type: string
        total:
          pattern: ^(0|[1-9][0-9]*)$
          title: Total
          type: string
      required:
      - total
      - open
      - in_progress
      - resolved
      title: ManualIssueCounts
      type: object
    ManualIssueCreateDraftEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        data:
          discriminator:
            mapping:
              ALREADY_LINKED: '#/components/schemas/ManualIssueDraftCreated'
              CREATED: '#/components/schemas/ManualIssueDraftCreated'
              SELECTION_REQUIRED: '#/components/schemas/ManualIssueDraftSelectionRequired'
            propertyName: disposition
          oneOf:
          - $ref: '#/components/schemas/ManualIssueDraftCreated'
          - $ref: '#/components/schemas/ManualIssueDraftSelectionRequired'
          title: Data
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/ManualIssueScope'
      required:
      - data
      - scope
      - request_id
      title: ManualIssueCreateDraftEnvelope
      type: object
    ManualIssueDetailEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/ManualIssueRecord'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/ManualIssueScope'
      required:
      - data
      - scope
      - request_id
      title: ManualIssueDetailEnvelope
      type: object
    ManualIssueDraftCandidate:
      additionalProperties: false
      properties:
        base_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Revision Id
          type: string
        base_version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Version Id
          type: string
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        manual_issue_ids:
          maxItems: 1
          minItems: 1
          prefixItems:
          - pattern: ^issue_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          title: Manual Issue Ids
          type: array
        status:
          const: EDITING
          default: EDITING
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - draft_id
      - base_version_id
      - base_revision_id
      - manual_issue_ids
      - updated_at
      title: ManualIssueDraftCandidate
      type: object
    ManualIssueDraftContext:
      additionalProperties: false
      properties:
        base_revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Revision Id
          type: string
        base_version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Base Version Id
          type: string
        dataset_id:
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        end_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: End Ns
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        manual_issue_ids:
          maxItems: 1
          minItems: 1
          prefixItems:
          - pattern: ^issue_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          title: Manual Issue Ids
          type: array
        schema_version:
          const: 1
          default: 1
          title: Schema Version
          type: integer
        selected_channel_path:
          anyOf:
          - maxLength: 512
            type: string
          - type: 'null'
          title: Selected Channel Path
        selected_stream_id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Selected Stream Id
          type: string
        start_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Start Ns
          type: string
      required:
      - dataset_id
      - base_version_id
      - episode_id
      - base_revision_id
      - selected_stream_id
      - start_ns
      - end_ns
      - manual_issue_ids
      title: ManualIssueDraftContext
      type: object
    ManualIssueDraftCreated:
      additionalProperties: false
      properties:
        candidates:
          default: []
          maxItems: 0
          minItems: 0
          title: Candidates
          type: array
        context:
          $ref: '#/components/schemas/ManualIssueDraftContext'
        disposition:
          enum:
          - CREATED
          - ALREADY_LINKED
          title: Disposition
          type: string
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        expires_at:
          title: Expires At
          type: 'null'
        selection_token:
          title: Selection Token
          type: 'null'
      required:
      - disposition
      - draft_id
      - context
      title: ManualIssueDraftCreated
      type: object
    ManualIssueDraftRef:
      additionalProperties: false
      properties:
        draft_id:
          pattern: ^draft_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Draft Id
          type: string
        status:
          enum:
          - EDITING
          - COMMITTED
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - draft_id
      - status
      - updated_at
      title: ManualIssueDraftRef
      type: object
    ManualIssueDraftSelectionRequired:
      additionalProperties: false
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/ManualIssueDraftCandidate'
          minItems: 2
          title: Candidates
          type: array
        context:
          title: Context
          type: 'null'
        disposition:
          const: SELECTION_REQUIRED
          default: SELECTION_REQUIRED
          title: Disposition
          type: string
        draft_id:
          title: Draft Id
          type: 'null'
        expires_at:
          format: date-time
          title: Expires At
          type: string
        selection_token:
          maxLength: 2048
          minLength: 16
          title: Selection Token
          type: string
      required:
      - selection_token
      - expires_at
      - candidates
      title: ManualIssueDraftSelectionRequired
      type: object
    ManualIssueFacets:
      additionalProperties: false
      properties:
        assignees:
          default: []
          items:
            $ref: '#/components/schemas/ManualIssuePrincipal'
          title: Assignees
          type: array
        discovery_sources:
          default: []
          items:
            enum:
            - DATA_VIEWER
            - ANNOTATOR
            - REVIEWER
            type: string
          title: Discovery Sources
          type: array
        issue_types:
          default: []
          items:
            enum:
            - POSE_JITTER
            - TIMESTAMP_DRIFT
            - MISSING_FRAME
            - STREAM_GAP
            - CALIBRATION_MISMATCH
            - INVALID_MASK
            - OTHER
            type: string
          title: Issue Types
          type: array
        severities:
          default: []
          items:
            enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
            type: string
          title: Severities
          type: array
        statuses:
          default: []
          items:
            enum:
            - OPEN
            - IN_PROGRESS
            - RESOLVED
            type: string
          title: Statuses
          type: array
      title: ManualIssueFacets
      type: object
    ManualIssueListEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/ManualIssueListItem'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/ManualIssuePageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/ManualIssueScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: ManualIssueListEnvelope
      type: object
    ManualIssueListItem:
      additionalProperties: false
