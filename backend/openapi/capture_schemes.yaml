          - type: 'null'
          title: Maximum Duplicate Timestamps Reject
        maximum_duplicate_timestamps_risk:
          default: 0
          minimum: 0.0
          title: Maximum Duplicate Timestamps Risk
          type: integer
        maximum_gap_ns_reject:
