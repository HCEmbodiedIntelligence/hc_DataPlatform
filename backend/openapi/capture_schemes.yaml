          - MCAP
          - LEROBOT_V3
          - CAPTURE_BUNDLE
          title: Source Format
          type: string
        source_path:
          default: meta/info.json
          maxLength: 2048
          minLength: 1
          title: Source Path
          type: string
      required:
      - project_id
      - region_code
      - raw_source_id
      - source_format
      title: Sample
      type: object
    SchemeDraft:
      additionalProperties: false
      properties:
