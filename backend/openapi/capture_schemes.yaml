          items:
            discriminator:
              mapping:
                CAPTURE_BUNDLE: '#/components/schemas/DraftCaptureBundleAdapter'
                LEROBOT_V3: '#/components/schemas/LeRobotAdapter'
                MCAP: '#/components/schemas/DraftMcapAdapter'
              propertyName: source_format
            oneOf:
            - $ref: '#/components/schemas/DraftMcapAdapter'
            - $ref: '#/components/schemas/LeRobotAdapter'
            - $ref: '#/components/schemas/DraftCaptureBundleAdapter'
