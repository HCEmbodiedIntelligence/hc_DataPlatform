        depth_unit_evidence:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          title: Depth Unit Evidence
        derive_action_from_next_state:
          default: false
          title: Derive Action From Next State
          type: boolean
        fps:
          anyOf:
          - maximum: 240.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Fps
        joint_names:
          default: []
          items:
            type: string
          title: Joint Names
          type: array
        joint_units:
          default: []
          items:
            type: string
          title: Joint Units
          type: array
        maximum_time_error_ms:
          default: 50
          exclusiveMinimum: 0.0
          maximum: 1000.0
          title: Maximum Time Error Ms
          type: number
        metadata_sources:
          additionalProperties:
            type: string
          propertyNames:
            enum:
            - head.calibration
            - head.extrinsics
          title: Metadata Sources
          type: object
        normalization:
          anyOf:
          - $ref: '#/components/schemas/JointNormalization'
          - type: 'null'
        numeric_sources:
          additionalProperties:
            $ref: '#/components/schemas/NumericMapping'
          title: Numeric Sources
          type: object
        primary_camera:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Camera
        semantic_output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Semantic Output
        state_joint_names:
          default: []
          items:
            type: string
          title: State Joint Names
          type: array
        state_joint_units:
          default: []
          items:
            type: string
          title: State Joint Units
          type: array
        state_required_axes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: State Required Axes
        state_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: State Topic
        time_source:
          default: RGB_LOG_TIME
