            type: string
          title: Action Joint Names
          type: array
        action_joint_units:
          default: []
          items:
            type: string
          title: Action Joint Units
          type: array
        action_required_axes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Action Required Axes
        action_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Topic
        alignment_policy:
          default: PRESERVE
          enum:
          - PRESERVE
          - FIXED_GRID
          title: Alignment Policy
          type: string
        cameras:
          default: []
          items:
            $ref: '#/components/schemas/CameraMapping'
          title: Cameras
          type: array
        collection_mode:
          default: RGB
          enum:
          - RGB
          - JOINT_ONLY
          title: Collection Mode
          type: string
        depth_scale_m_per_unit:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 1.0
            type: number
          - type: 'null'
