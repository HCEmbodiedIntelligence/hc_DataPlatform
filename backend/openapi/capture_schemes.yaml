        feature_sources:
          additionalProperties:
            type: string
          title: Feature Sources
          type: object
        parser_version:
          const: lerobot-v3/1
          default: lerobot-v3/1
          title: Parser Version
          type: string
        source_format:
          const: LEROBOT_V3
          default: LEROBOT_V3
          title: Source Format
          type: string
