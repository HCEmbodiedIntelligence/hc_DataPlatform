          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Project Id
          type: string
        raw_source_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Raw Source Id
          type: string
        region_code:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Region Code
          type: string
        source_format:
