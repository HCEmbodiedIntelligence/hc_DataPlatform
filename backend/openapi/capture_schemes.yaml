      type: object
    McapAdapter:
      additionalProperties: false
      properties:
        configuration:
          $ref: '#/components/schemas/McapDraftConfig'
        parser_version:
          default: native-mcap-recording/3
          enum:
          - native-mcap-recording/2
          - native-mcap-recording/3
          - native-mcap-recording/4
          title: Parser Version
          type: string
        source_format:
          const: MCAP
          default: MCAP
          title: Source Format
          type: string
      required:
      - configuration
