      type: object
    OutputContract:
      additionalProperties: false
      description: Shared structure; historical frequency values are informational only.
      properties:
        algorithm:
          default: capture-structure/v1
          enum:
          - capture-structure/v1
          - capture-structure/v2
          - capture-structure/v3
          title: Algorithm
          type: string
        features:
          additionalProperties:
            $ref: '#/components/schemas/Feature'
          minProperties: 1
          title: Features
          type: object
        frequency_hz:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 1000.0
            type: number
          - type: 'null'
          title: Frequency Hz
        frequency_policy:
          const: PRESERVE
          default: PRESERVE
          title: Frequency Policy
          type: string
        metadata_features:
          default: []
          items:
            enum:
            - head.calibration
            - head.extrinsics
            type: string
          title: Metadata Features
          type: array
        normalization:
          anyOf:
          - $ref: '#/components/schemas/JointNormalization'
          - type: 'null'
        time_source:
          enum:
          - FRAME_TIMESTAMP
          - STATE_LOG_TIME
          - RGB_LOG_TIME
          title: Time Source
          type: string
        validity_max_age_ms:
          default: 50
          exclusiveMinimum: 0.0
          maximum: 1000.0
          title: Validity Max Age Ms
          type: number
      required:
      - time_source
      - features
      title: OutputContract
      type: object
    Participant:
      additionalProperties: false
      properties:
        mapping_version:
          minimum: 1.0
          title: Mapping Version
          type: integer
        robot_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Robot Id
          type: string
      required:
      - robot_id
      - mapping_version
      title: Participant
      type: object
    PrepareRecording:
      additionalProperties: false
      properties:
        expected_plan_revision:
          minimum: 1.0
          title: Expected Plan Revision
          type: integer
        recording_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Recording Id
          type: string
        source_format:
          enum:
          - MCAP
          - LEROBOT_V3
          - CAPTURE_BUNDLE
          title: Source Format
          type: string
      required:
      - expected_plan_revision
      - recording_id
      - source_format
      title: PrepareRecording
      type: object
    Revision:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: Revision
      type: object
    Sample:
      additionalProperties: false
      properties:
        episode_index:
          default: 0
          minimum: 0.0
          title: Episode Index
          type: integer
        project_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Project Id
          type: string
        raw_source_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Raw Source Id
          type: string
        region_code:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Region Code
          type: string
        source_format:
          enum:
          - MCAP
          - LEROBOT_V3
          - CAPTURE_BUNDLE
          title: Source Format
          type: string
        source_path:
          default: meta/info.json
          maxLength: 2048
          minLength: 1
          title: Source Path
          type: string
      required:
      - project_id
      - region_code
      - raw_source_id
      - source_format
      title: Sample
      type: object
    SchemeDraft:
      additionalProperties: false
      properties:
        adapters:
          items:
            discriminator:
              mapping:
                CAPTURE_BUNDLE: '#/components/schemas/DraftCaptureBundleAdapter'
                LEROBOT_V3: '#/components/schemas/LeRobotAdapter'
                MCAP: '#/components/schemas/DraftMcapAdapter'
              propertyName: source_format
            oneOf:
            - $ref: '#/components/schemas/DraftMcapAdapter'
            - $ref: '#/components/schemas/LeRobotAdapter'
            - $ref: '#/components/schemas/DraftCaptureBundleAdapter'
          maxItems: 3
          minItems: 1
          title: Adapters
          type: array
        description:
          default: ''
          maxLength: 10000
          title: Description
          type: string
        expected_revision:
          minimum: 0.0
          title: Expected Revision
          type: integer
        input_mode:
          default: EXPLICIT
          enum:
          - EXPLICIT
          - AUTO
          title: Input Mode
          type: string
        model_version_ids:
          default: []
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          title: Model Version Ids
          type: array
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        output:
          $ref: '#/components/schemas/DraftOutputContract'
        quality_policy:
          $ref: '#/components/schemas/CaptureQualityPolicy'
        software:
          default: ''
          maxLength: 120
          title: Software
          type: string
      required:
      - name
      - adapters
      - output
      - expected_revision
      title: SchemeDraft
      type: object
    SetTaskPlan:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 0.0
          title: Expected Revision
          type: integer
        participants:
          items:
            $ref: '#/components/schemas/Participant'
          maxItems: 100
          title: Participants
          type: array
        scheme:
          $ref: '#/components/schemas/VersionReference'
      required:
      - expected_revision
      - scheme
      title: SetTaskPlan
      type: object
    ValidateDraft:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
        sample:
          $ref: '#/components/schemas/Sample'
      required:
      - expected_revision
      - sample
      title: ValidateDraft
      type: object
    ValidateMapping:
      additionalProperties: false
      properties:
        mapping_version:
          minimum: 1.0
          title: Mapping Version
          type: integer
        sample:
          $ref: '#/components/schemas/Sample'
      required:
      - mapping_version
      - sample
      title: ValidateMapping
      type: object
    VersionReference:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Content Sha256
          type: string
        scheme_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - scheme_id
      - version
      - content_sha256
      title: VersionReference
      type: object
info:
  title: Shared capture schemes
  version: '2026-10-21'
openapi: 3.1.0
paths:
  /api/v1/organizations/{organization_id}/capture-schemes:
    get:
      operationId: listCaptureSchemes
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
      - in: query
        name: q
        required: false
        schema:
          default: ''
          maxLength: 200
          title: Q
          type: string
      - in: query
        name: source_format
        required: false
        schema:
          anyOf:
          - enum:
            - MCAP
            - LEROBOT_V3
            - CAPTURE_BUNDLE
            type: string
          - type: 'null'
          title: Source Format
      - in: query
        name: include_archived
        required: false
        schema:
          default: false
          title: Include Archived
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSchemeList'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Schemes
      tags:
      - capture-schemes
  /api/v1/organizations/{organization_id}/capture-schemes/{scheme_id}:
    get:
      operationId: getCaptureScheme
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
      - in: path
        name: scheme_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSchemeDetail'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Get Scheme
      tags:
      - capture-schemes
    put:
      operationId: saveCaptureSchemeDraft
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
      - in: path
        name: scheme_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemeDraft'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSchemeDetail'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Save Scheme
      tags:
      - capture-schemes
  /api/v1/organizations/{organization_id}/capture-schemes/{scheme_id}/references:
    get:
      operationId: getCaptureSchemeReferences
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
      - in: path
        name: scheme_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureSchemeReferences'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Get References
      tags:
      - capture-schemes
  /api/v1/organizations/{organization_id}/capture-schemes/{scheme_id}/versions/{version}:
    get:
      operationId: getCaptureSchemeVersion
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
      - in: path
        name: scheme_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
      - in: path
        name: version
        required: true
        schema:
          minimum: 1
          title: Version
          type: integer
