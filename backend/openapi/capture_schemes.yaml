          minItems: 1
          title: Adapters
          type: array
        description:
          default: ''
          maxLength: 10000
          title: Description
          type: string
        expected_revision:
          minimum: 0.0
          title: Expected Revision
          type: integer
        model_version_ids:
          default: []
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          title: Model Version Ids
          type: array
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        output:
          $ref: '#/components/schemas/DraftOutputContract'
        quality_policy:
          additionalProperties:
            type: string
          title: Quality Policy
          type: object
        software:
          default: ''
          maxLength: 120
          title: Software
          type: string
      required:
      - name
      - adapters
      - output
      - expected_revision
      title: SchemeDraft
      type: object
    SetTaskPlan:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 0.0
          title: Expected Revision
          type: integer
        participants:
          items:
            $ref: '#/components/schemas/Participant'
          maxItems: 100
          title: Participants
          type: array
        scheme:
          $ref: '#/components/schemas/VersionReference'
      required:
      - expected_revision
      - scheme
      title: SetTaskPlan
      type: object
    ValidateDraft:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
        sample:
          $ref: '#/components/schemas/Sample'
      required:
      - expected_revision
      - sample
      title: ValidateDraft
      type: object
    ValidateMapping:
      additionalProperties: false
      properties:
        mapping_version:
          minimum: 1.0
          title: Mapping Version
          type: integer
        sample:
          $ref: '#/components/schemas/Sample'
      required:
      - mapping_version
      - sample
      title: ValidateMapping
      type: object
    VersionReference:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Content Sha256
          type: string
        scheme_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Scheme Id
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - scheme_id
      - version
      - content_sha256
      title: VersionReference
      type: object
