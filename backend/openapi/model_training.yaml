components:
  schemas:
    TrainingConfig:
      additionalProperties: false
      properties:
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        label:
          maxLength: 256
          minLength: 1
          title: Label
          type: string
        parameters:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - type: number
            - type: string
          title: Parameters
          type: object
      required:
      - id
      - label
      - parameters
      title: TrainingConfig
      type: object
    TrainingConfigs:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/TrainingConfig'
          title: Items
          type: array
      required:
      - items
      title: TrainingConfigs
      type: object
    TrainingOption:
      additionalProperties: false
      properties:
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        label:
          maxLength: 256
          minLength: 1
          title: Label
          type: string
      required:
      - id
      - label
      title: TrainingOption
      type: object
    TrainingOptions:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/TrainingOption'
          title: Items
          type: array
      required:
      - items
      title: TrainingOptions
      type: object
    TrainingRun:
      additionalProperties: false
      properties:
        card:
          $ref: '#/components/schemas/TrainingOption'
        config:
          $ref: '#/components/schemas/TrainingOption'
        created_at:
          format: date-time
          title: Created At
          type: string
        dataset:
          $ref: '#/components/schemas/TrainingOption'
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        model:
          $ref: '#/components/schemas/TrainingOption'
        parameters:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - type: number
            - type: string
          title: Parameters
          type: object
        progress_percent:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Progress Percent
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
          type: string
        status_message:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Status Message
      required:
      - id
      - dataset
      - model
      - card
      - config
      - parameters
      - status
      - created_at
      title: TrainingRun
      type: object
    TrainingRunPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/TrainingRun'
          title: Items
          type: array
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      title: TrainingRunPage
      type: object
    TrainingStart:
      additionalProperties: false
      properties:
        card_id:
          maxLength: 128
          minLength: 1
          title: Card Id
          type: string
        config_id:
          maxLength: 128
          minLength: 1
          title: Config Id
          type: string
        dataset_id:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
        model_id:
          maxLength: 128
          minLength: 1
          title: Model Id
          type: string
        parameters:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - type: number
            - type: string
          title: Parameters
          type: object
      required:
      - dataset_id
      - model_id
      - card_id
      - config_id
      - parameters
      title: TrainingStart
      type: object
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/model-training/cards:
    get:
      operationId: listTrainingCards
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: dataset_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
      - in: query
        name: model_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Model Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingOptions'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Cards
      tags:
      - model-training
  /api/v1/projects/{project_id}/regions/{region_code}/model-training/configs:
    get:
      operationId: listTrainingConfigs
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: dataset_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
      - in: query
        name: model_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Model Id
          type: string
      - in: query
        name: card_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Card Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingConfigs'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Configs
      tags:
      - model-training
  /api/v1/projects/{project_id}/regions/{region_code}/model-training/datasets:
    get:
      operationId: listTrainingDatasets
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingOptions'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Datasets
      tags:
      - model-training
  /api/v1/projects/{project_id}/regions/{region_code}/model-training/models:
    get:
      operationId: listTrainingModels
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: dataset_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingOptions'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Models
      tags:
      - model-training
  /api/v1/projects/{project_id}/regions/{region_code}/model-training/runs:
    get:
      operationId: listTrainingRuns
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRunPage'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Runs
      tags:
      - model-training
    post:
      operationId: startTrainingRun
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          title: Idempotency-Key
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingStart'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRun'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Start
      tags:
      - model-training
