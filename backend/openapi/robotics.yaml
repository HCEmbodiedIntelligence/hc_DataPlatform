components:
  schemas:
    BindOrganizationRobotModelRequest:
      additionalProperties: false
      properties:
        robot_etag:
          maxLength: 256
          minLength: 1
          title: Robot Etag
          type: string
        version_id:
          maxLength: 128
          minLength: 1
          title: Version Id
          type: string
      required:
      - version_id
      - robot_etag
      title: BindOrganizationRobotModelRequest
      type: object
    Connectivity:
      additionalProperties: false
      properties:
        observed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Observed At
        reason_code:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Reason Code
        source:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Source
        state:
          maxLength: 64
          minLength: 1
          title: State
          type: string
      required:
      - state
      title: Connectivity
      type: object
    CreateRobotRequest:
      additionalProperties: false
      description: Immutable creation input for a physical robot instance.
      properties:
        connectivity_reason_code:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Connectivity Reason Code
        connectivity_source:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Connectivity Source
        connectivity_state:
          default: OFFLINE
          pattern: ^(ONLINE|OFFLINE|DEGRADED)$
          title: Connectivity State
          type: string
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        lifecycle_status:
          default: DRAFT
          pattern: ^(DRAFT|ACTIVE|MAINTENANCE)$
          title: Lifecycle Status
          type: string
        serial_no:
          maxLength: 128
          minLength: 1
          title: Serial No
          type: string
      required:
      - display_name
      - serial_no
      title: CreateRobotRequest
      type: object
    EffectiveModelBinding:
      additionalProperties: false
      properties:
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        robot_model_version_id:
          maxLength: 128
          minLength: 1
          title: Robot Model Version Id
          type: string
        scope_id:
          maxLength: 128
          minLength: 1
          title: Scope Id
          type: string
        scope_type:
          maxLength: 64
          minLength: 1
          title: Scope Type
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        valid_to:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Valid To
      required:
      - id
      - scope_type
      - scope_id
      - robot_model_version_id
      - valid_from
      - etag
      title: EffectiveModelBinding
      type: object
    OrganizationRobotBootstrapEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-31'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/RobotBootstrap'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/OrganizationRobotScope'
      required:
      - data
      - scope
      - request_id
      title: OrganizationRobotBootstrapEnvelope
      type: object
    OrganizationRobotModelBinding:
      additionalProperties: false
      properties:
        binding_id:
          maxLength: 128
          minLength: 1
          title: Binding Id
          type: string
        bound_at:
          format: date-time
          title: Bound At
          type: string
        robot_id:
          maxLength: 128
          minLength: 1
          title: Robot Id
          type: string
        status:
          pattern: ^(ACTIVE|SUPERSEDED|REVOKED)$
          title: Status
          type: string
        unbound_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Unbound At
        version_id:
          maxLength: 128
          minLength: 1
          title: Version Id
          type: string
      required:
      - binding_id
      - robot_id
      - version_id
      - status
      - bound_at
      title: OrganizationRobotModelBinding
      type: object
    OrganizationRobotModelBindingPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/OrganizationRobotModelBinding'
          title: Items
          type: array
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/OrganizationRobotScope'
      required:
      - items
      - scope
      - request_id
      title: OrganizationRobotModelBindingPage
      type: object
    OrganizationRobotPage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-31'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/RobotRecord'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/OrganizationRobotScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: OrganizationRobotPage
      type: object
    OrganizationRobotScope:
      additionalProperties: false
      properties:
        organization_id:
          maxLength: 128
          minLength: 1
          title: Organization Id
          type: string
      required:
      - organization_id
      title: OrganizationRobotScope
      type: object
    RobotBootstrap:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        effective_model_binding:
          anyOf:
          - $ref: '#/components/schemas/EffectiveModelBinding'
          - type: 'null'
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        robot:
          $ref: '#/components/schemas/RobotRecord'
        topology_revision:
          maxLength: 256
          minLength: 1
          title: Topology Revision
          type: string
      required:
      - robot
      - etag
      - topology_revision
      title: RobotBootstrap
      type: object
    RobotRecord:
      additionalProperties: false
      properties:
        connectivity:
          $ref: '#/components/schemas/Connectivity'
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        lifecycle_status:
          maxLength: 64
          minLength: 1
          title: Lifecycle Status
          type: string
        serial_no:
          maxLength: 128
          minLength: 1
          title: Serial No
          type: string
      required:
      - id
      - display_name
      - serial_no
      - lifecycle_status
      - connectivity
      title: RobotRecord
      type: object
info:
  title: HC robotics contract
  version: '2026-08-19'
openapi: 3.1.0
paths:
  /api/v1/organizations/{organization_id}/robots:
    get:
      operationId: listOrganizationRobots
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: lifecycle_status
        required: false
        schema:
          anyOf:
          - enum:
            - DRAFT
            - ACTIVE
            - MAINTENANCE
            - DISABLED
            - RETIRED
            type: string
          - type: 'null'
          title: Lifecycle Status
      - in: query
        name: connectivity_state
        required: false
        schema:
          anyOf:
          - enum:
            - ONLINE
            - OFFLINE
            - DEGRADED
            type: string
          - type: 'null'
          title: Connectivity State
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRobotPage'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Organization Robots
      tags:
      - organization-robot-assets
    post:
      operationId: createOrganizationRobot
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRobotRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRobotBootstrapEnvelope'
          description: Successful Response
        '401':
          description: The organization robot asset request could not be completed.
        '403':
          description: The organization robot asset request could not be completed.
        '404':
          description: The organization robot asset request could not be completed.
        '409':
          description: The organization robot asset request could not be completed.
        '412':
          description: The organization robot asset request could not be completed.
        '422':
          description: The organization robot asset request could not be completed.
      security:
      - bearerAuth: []
      summary: Create Organization Robot
      tags:
      - organization-robot-assets
  /api/v1/organizations/{organization_id}/robots/model-bindings:
    get:
      operationId: listOrganizationRobotModelBindings
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: query
        name: version_id
        required: true
        schema:
          title: Version Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRobotModelBindingPage'
          description: Successful Response
        '401':
          description: The organization robot asset request could not be completed.
        '403':
          description: The organization robot asset request could not be completed.
        '404':
          description: The organization robot asset request could not be completed.
        '409':
          description: The organization robot asset request could not be completed.
        '412':
          description: The organization robot asset request could not be completed.
        '422':
          description: The organization robot asset request could not be completed.
      security:
      - bearerAuth: []
      summary: List Organization Robot Model Bindings
      tags:
      - organization-robot-assets
  /api/v1/organizations/{organization_id}/robots/{robot_id}/bootstrap:
    get:
      operationId: getOrganizationRobotBootstrap
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: path
        name: robot_id
        required: true
        schema:
          title: Robot Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRobotBootstrapEnvelope'
          description: Successful Response
        '401':
          description: The organization robot asset request could not be completed.
        '403':
          description: The organization robot asset request could not be completed.
        '404':
          description: The organization robot asset request could not be completed.
        '409':
          description: The organization robot asset request could not be completed.
        '412':
          description: The organization robot asset request could not be completed.
        '422':
          description: The organization robot asset request could not be completed.
      security:
      - bearerAuth: []
      summary: Get Organization Robot Bootstrap
      tags:
      - organization-robot-assets
  /api/v1/organizations/{organization_id}/robots/{robot_id}/model-bindings:
    post:
      operationId: bindOrganizationRobotModel
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          title: Organization Id
          type: string
      - in: path
        name: robot_id
        required: true
        schema:
          title: Robot Id
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindOrganizationRobotModelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRobotModelBinding'
          description: Successful Response
        '401':
          description: The organization robot asset request could not be completed.
        '403':
          description: The organization robot asset request could not be completed.
        '404':
          description: The organization robot asset request could not be completed.
        '409':
          description: The organization robot asset request could not be completed.
        '412':
          description: The organization robot asset request could not be completed.
        '422':
          description: The organization robot asset request could not be completed.
      security:
      - bearerAuth: []
      summary: Bind Organization Robot Model
      tags:
      - organization-robot-assets
