          description: The robot-directory request could not be completed.
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The robot-directory request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The robot-directory request could not be completed.
      security:
      - bearerAuth: []
      summary: Update Robot Component
      tags:
      - robotics
