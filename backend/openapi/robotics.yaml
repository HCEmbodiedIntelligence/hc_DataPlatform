      - snapshot_at
      - scope
      - request_id
      title: RobotPage
      type: object
    RobotRecord:
      additionalProperties: false
      properties:
        connectivity:
          $ref: '#/components/schemas/Connectivity'
        display_name:
          maxLength: 256
          minLength: 1
