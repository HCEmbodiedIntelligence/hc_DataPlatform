          - type: 'null'
          title: Parent Frame
        source:
          maxLength: 128
          minLength: 1
          title: Source
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        valid_to:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Valid To
      required:
      - id
      - name
      - source
      - calibration_set_id
      - status
      - valid_from
      title: FrameReference
      type: object
    GlobalRobotSearchPage:
      additionalProperties: false
      description: Bounded robot search within one verified project/region scope.
      properties:
        contract_version:
          default: '2026-08-21'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/GlobalSearchRobotResult'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        query:
          maxLength: 256
          minLength: 1
          title: Query
          type: string
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/RobotScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - query
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: GlobalRobotSearchPage
      type: object
    GlobalSearchRobotResult:
      additionalProperties: false
      description: 'Minimal robot hit returned by the shell discovery surface.


        Search never duplicates protected topology or model-binding data. Selecting a

        result moves the user to the normal robot page, whose existing authorization

        boundary owns those facts.'
      properties:
        entity_type:
          const: ROBOT
          default: ROBOT
          title: Entity Type
          type: string
        robot:
          $ref: '#/components/schemas/RobotRecord'
      required:
      - robot
      title: GlobalSearchRobotResult
      type: object
    RobotBootstrap:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        effective_model_binding:
          anyOf:
          - $ref: '#/components/schemas/EffectiveModelBinding'
          - type: 'null'
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        robot:
          $ref: '#/components/schemas/RobotRecord'
        topology_revision:
          maxLength: 256
          minLength: 1
          title: Topology Revision
          type: string
      required:
      - robot
      - etag
      - topology_revision
      title: RobotBootstrap
      type: object
    RobotBootstrapEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/RobotBootstrap'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/RobotScope'
      required:
      - data
      - scope
      - request_id
      title: RobotBootstrapEnvelope
      type: object
    RobotComponent:
      additionalProperties: false
      properties:
        component_model_id:
          maxLength: 128
          minLength: 1
          title: Component Model Id
          type: string
        component_type:
          maxLength: 128
          minLength: 1
          title: Component Type
          type: string
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        lifecycle_status:
          maxLength: 64
          minLength: 1
          title: Lifecycle Status
          type: string
        parent_component_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Parent Component Id
        robot_id:
          maxLength: 128
          minLength: 1
          title: Robot Id
          type: string
        serial_no:
          maxLength: 128
          minLength: 1
          title: Serial No
          type: string
        sort_order:
          pattern: ^(0|[1-9]\d*)$
          title: Sort Order
          type: string
      required:
