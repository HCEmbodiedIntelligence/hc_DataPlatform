          title: Id
          type: string
        lifecycle_status:
          maxLength: 64
          minLength: 1
          title: Lifecycle Status
          type: string
        serial_no:
          maxLength: 128
          minLength: 1
          title: Serial No
          type: string
      required:
      - id
      - display_name
      - serial_no
      - lifecycle_status
      - connectivity
      title: RobotRecord
      type: object
    RobotScope:
      additionalProperties: false
      properties:
        project_id:
          maxLength: 128
          minLength: 1
          title: Project Id
          type: string
        region_code:
          maxLength: 64
          minLength: 1
          title: Region Code
          type: string
      required:
      - project_id
      - region_code
      title: RobotScope
      type: object
info:
  title: HC robotics contract
  version: '2026-08-19'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/components/{component_id}:
    patch:
      operationId: updateRobotComponent
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: component_id
        required: true
        schema:
          title: Component Id
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: If-Match
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRobotComponentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotComponentMutationEnvelope'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The robot-directory request could not be completed.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The robot-directory request could not be completed.
        '404':
          content:
