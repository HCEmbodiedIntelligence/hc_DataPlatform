components:
  schemas:
    ChannelPage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/ChannelReference'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/RobotScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: ChannelPage
      type: object
    ChannelReference:
      additionalProperties: false
      properties:
        canonical_path:
          maxLength: 512
          minLength: 1
          title: Canonical Path
          type: string
        clock_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Clock Id
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        frame_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Frame Id
        frequency_hz:
          anyOf:
          - pattern: ^(0|[1-9]\d*)(\.\d+)?$
            type: string
          - type: 'null'
          title: Frequency Hz
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        modality:
          maxLength: 128
          minLength: 1
          title: Modality
          type: string
        role:
          maxLength: 128
          minLength: 1
          title: Role
          type: string
        schema_id:
          maxLength: 128
          minLength: 1
          title: Schema Id
          type: string
        schema_version:
          pattern: ^[1-9]\d*$
          title: Schema Version
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
        unit:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Unit
      required:
      - id
      - canonical_path
      - display_name
      - modality
      - schema_id
      - schema_version
      - role
      - status
      title: ChannelReference
      type: object
    ComponentPage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/RobotComponent'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/RobotScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
        topology_revision:
          maxLength: 256
          minLength: 1
          title: Topology Revision
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - topology_revision
      - scope
      - request_id
      title: ComponentPage
      type: object
    Connectivity:
      additionalProperties: false
      properties:
        observed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Observed At
        reason_code:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Reason Code
        source:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Source
        state:
          maxLength: 64
          minLength: 1
          title: State
          type: string
      required:
      - state
      title: Connectivity
      type: object
    EffectiveModelBinding:
      additionalProperties: false
