      - robot_id
      - component_model_id
      - component_type
      - display_name
      - serial_no
      - lifecycle_status
      - sort_order
      title: RobotComponent
      type: object
    RobotPage:
      additionalProperties: false
      properties:
        contract_version:
          default: '2026-08-19'
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/RobotRecord'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/RobotScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
      required:
      - items
