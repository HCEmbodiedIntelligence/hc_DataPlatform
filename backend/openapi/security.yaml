components:
  headers:
    AccessNoStore:
      description: Authentication and authorization material must not be cached.
      schema: {type: string, const: "private, no-store"}
    RetryAfter:
      description: Bounded decimal delay-seconds before a retry; HTTP-date values are not emitted.
      schema: {type: integer, minimum: 1, maximum: 86400}
    AccountETag:
      description: Strong account mutation version.
      schema: {type: string, pattern: '^"v[1-9][0-9]*"$'}
  parameters:
    PlatformAccountId:
      name: principal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AccessProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AccessOrganizationId:
      name: organization_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AccessRequestId:
      name: access_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AccessIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
    AccountIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"v[1-9][0-9]*"$'}
    AuthChallengeResponse:
      name: X-Auth-Challenge-Response
      in: header
      required: false
      description: >-
        Opaque single-use browser challenge response. It is sent only after the server asks for
        a challenge and is never persisted or echoed.
      schema: {type: string, minLength: 1, maxLength: 2048}
  requestBodies:
    RegistrationCommandBody:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RegistrationCommand"}
    LoginCommandBody:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginCommand"}
    MembershipRequestCreateBody:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MembershipRequestCreate"}
    CapabilityRequestCreateBody:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CapabilityRequestCreate"}
    AccessDecisionBody:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AccessDecisionCommand"}
  responses:
    ManagedAccountOk:
      description: Current managed-account representation.
      headers:
        Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagedAccount"}
    MembershipRequestCreated:
      description: Pending project membership request created.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MembershipRequest"}
    MembershipRequestOk:
      description: Current membership request representation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MembershipRequest"}
    CapabilityRequestCreated:
      description: Pending project capability request created.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CapabilityRequest"}
    CapabilityRequestOk:
      description: Current capability request representation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CapabilityRequest"}
    AccessClientNetworkInvalid:
      description: The client-network attribution is malformed or untrusted.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
    AccessUnauthorized:
      description: Authentication failed or a current session is required.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/authentication-required
            title: Authentication required
            status: 401
            detail: A current Bearer session is required.
            code: AUTHENTICATION_REQUIRED
            request_id: req-401
            retryable: false
    AccessForbidden:
      description: Exact project scope or project access-management capability is absent.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/project-scope-denied
            title: Project scope denied
            status: 403
            detail: The exact project scope is not granted.
            code: PROJECT_SCOPE_DENIED
            request_id: req-403
            retryable: false
    AccessChallengeDenied:
      description: A required public-authentication challenge is absent or was rejected.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/auth-challenge-required
            title: Authentication challenge required
            status: 403
            detail: Complete the authentication challenge before trying again.
            code: AUTH_CHALLENGE_REQUIRED
            request_id: req-challenge
            retryable: false
    AccessConflict:
      description: State, concurrency, duplicate-pending, or idempotency conflict.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/access-request-state-conflict
            title: Access request state conflict
            status: 409
            detail: The transition is invalid from the current state.
            code: ACCESS_REQUEST_STATE_CONFLICT
            request_id: req-409
            retryable: false
    AccessUnprocessable:
      description: The request violates the API contract.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/request-validation-failed
            title: Request validation failed
            status: 422
            detail: The request did not satisfy the API contract.
            code: REQUEST_VALIDATION_FAILED
            request_id: req-422
            retryable: false
    AccessTooManyRequests:
      description: An authentication security or session-admission policy denied the request.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/abuse-policy-limited
            title: Request rate limited
            status: 429
            detail: The externally configured abuse policy denied this request.
            code: ABUSE_POLICY_LIMITED
            request_id: req-429
            retryable: true
            retry_after_seconds: 30
    AccessChallengeUnavailable:
      description: A required authentication security provider is temporarily unavailable.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
          example:
            type: https://hc-data-platform.invalid/problems/auth-challenge-unavailable
            title: Authentication challenge unavailable
            status: 503
            detail: Authentication challenge verification is temporarily unavailable.
            code: AUTH_CHALLENGE_UNAVAILABLE
            request_id: req-challenge-unavailable
            retryable: true
    AccountPreconditionFailed:
      description: The account changed after the caller read it.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemDetails"}
  schemas:
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED]
      description: Account lifecycle only; account approval/PENDING is not part of registration.
    ManagedAccountState:
      type: string
      enum: [ACTIVE, DISABLED, DELETED]
    PlatformAccountRole:
      type: string
      enum: [USER, PLATFORM_ADMIN]
    ManagedAccount:
      type: object
      additionalProperties: false
      required:
        [principal_id, username, display_name, state, platform_role,
         recovery_email_configured, active_session_count, created_at, updated_at,
         password_changed_at, revision, etag]
      properties:
        principal_id: {type: string, minLength: 1}
        username: {type: string, minLength: 1, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 128}
        state: {$ref: "#/components/schemas/ManagedAccountState"}
        platform_role: {$ref: "#/components/schemas/PlatformAccountRole"}
        recovery_email_configured: {type: boolean}
        recovery_email_hint: {type: [string, "null"], maxLength: 254}
        active_session_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        password_changed_at: {type: string, format: date-time}
        deleted_at: {type: [string, "null"], format: date-time}
        revision: {type: integer, minimum: 1}
        etag: {type: string, pattern: '^"v[1-9][0-9]*"$'}
    ManagedAccountPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ManagedAccount"}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    ManagedAccountCreate:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        display_name: {type: [string, "null"], minLength: 1, maxLength: 128}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        recovery_email: {type: [string, "null"], minLength: 3, maxLength: 254}
        platform_role:
          allOf: [{$ref: "#/components/schemas/PlatformAccountRole"}]
          default: USER
    ManagedAccountRoleUpdate:
      type: object
      additionalProperties: false
      required: [platform_role]
      properties:
        platform_role: {$ref: "#/components/schemas/PlatformAccountRole"}
    ManagedAccountPasswordReset:
      type: object
      additionalProperties: false
      required: [new_password, confirm_password]
      properties:
        new_password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        confirm_password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    ManagedAccountPasswordResetResult:
      type: object
      additionalProperties: false
      required: [account, sessions_revoked]
      properties:
        account: {$ref: "#/components/schemas/ManagedAccount"}
        sessions_revoked: {type: integer, minimum: 0}
    AccessRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, REVOKED]
    AccountPrincipal:
      type: object
      additionalProperties: false
      required: [principal_id, username, display_name, status, created_at]
      properties:
        principal_id: {type: string, minLength: 1}
        username: {type: string, minLength: 1, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 128}
        status: {$ref: "#/components/schemas/AccountStatus"}
        created_at: {type: string, format: date-time}
    PasswordPolicyView:
      type: object
      additionalProperties: false
      required: [min_length, max_length, disallow_username, blocked_password_count]
      properties:
        min_length: {type: integer, minimum: 1, maximum: 128}
        max_length: {type: integer, minimum: 1, maximum: 128}
        disallow_username: {type: boolean}
        blocked_password_count: {type: integer, minimum: 0}
    PublicAuthChallengeProvider:
      type: string
      enum: [TURNSTILE]
    PublicAuthChallengeConfiguration:
      type: object
      additionalProperties: false
      required: [provider, site_key]
      properties:
        provider: {$ref: "#/components/schemas/PublicAuthChallengeProvider"}
        site_key: {type: string, minLength: 1, maxLength: 256}
    PublicAuthConfiguration:
      type: object
      additionalProperties: false
      required: [password_policy, challenge]
      properties:
        password_policy: {$ref: "#/components/schemas/PasswordPolicyView"}
        challenge:
          anyOf:
            - {$ref: "#/components/schemas/PublicAuthChallengeConfiguration"}
            - {type: "null"}
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: {type: string, minLength: 1, maxLength: 254}
    PasswordRecoveryAccepted:
      type: object
      additionalProperties: false
      description: The response is intentionally identical for known and unknown identities.
      properties:
        accepted: {type: boolean, const: true, default: true}
    PasswordRecoveryConfirmation:
      type: object
      additionalProperties: false
