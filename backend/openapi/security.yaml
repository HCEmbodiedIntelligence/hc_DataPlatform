paths:
  /api/v1/auth/config:
    get:
      operationId: getPublicAuthConfiguration
      tags: [access]
      summary: Discover the public registration policy and optional challenge provider.
      description: >-
        Returns only browser-safe policy metadata. The nullable challenge field is reserved for
        an enabled production challenge provider; no provider secret is ever disclosed.
      security: []
      responses:
        "200":
          description: Current centrally configured public authentication policy.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicAuthConfiguration"}
  /api/v1/auth/registrations:
    post:
      operationId: registerAccount
      tags: [access]
      summary: Register a directly loginable empty account.
      description: >-
        Creates an ACTIVE principal only. It does not create a project, membership,
        capability grant, account approval request, or PENDING account state. New credentials
        are checked against the centrally configured password policy.
      security: []
      parameters:
        - {$ref: "#/components/parameters/AuthChallengeResponse"}
      requestBody: {$ref: "#/components/requestBodies/RegistrationCommandBody"}
      responses:
        "201":
          description: The ACTIVE empty account was created and can log in immediately.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationResult"}
              example:
                principal:
                  principal_id: 1d815948-e486-4ce6-9754-8f9571682c6a
                  username: new-user
                  display_name: new-user
                  status: ACTIVE
                  created_at: "2026-08-17T08:00:00Z"
        "400": {$ref: "#/components/responses/AccessClientNetworkInvalid"}
        "403": {$ref: "#/components/responses/AccessChallengeDenied"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
        "503": {$ref: "#/components/responses/AccessChallengeUnavailable"}
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      tags: [access]
      summary: Create a session for an ACTIVE account.
      description: >-
        Authentication uses the configured password and security policies. If valid credentials
        arrive while the account is already at its active-session limit, no new session is
        created, every existing session remains valid, and the response is 429
        SESSION_LIMIT_REACHED with a bounded Retry-After delay.
      security: []
      parameters:
        - {$ref: "#/components/parameters/AuthChallengeResponse"}
      requestBody: {$ref: "#/components/requestBodies/LoginCommandBody"}
      responses:
        "201":
          description: Opaque Bearer session created.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionCreated"}
        "400": {$ref: "#/components/responses/AccessClientNetworkInvalid"}
        "403": {$ref: "#/components/responses/AccessChallengeDenied"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
        "503": {$ref: "#/components/responses/AccessChallengeUnavailable"}
  /api/v1/auth/password-recovery-requests:
    post:
      operationId: requestPasswordRecovery
      tags: [access]
      summary: Request a password recovery message without disclosing account existence.
      description: >-
        Accepts either a username or recovery email. When Turnstile is enabled the request must
        pass the public challenge. Known, unknown, disabled, and delivery-failure cases return
        the same 202 representation so the endpoint cannot enumerate accounts.
      security: []
      parameters:
        - {$ref: "#/components/parameters/AuthChallengeResponse"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordRecoveryRequest"}
      responses:
        "202":
          description: Request accepted without disclosing whether the identity exists.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasswordRecoveryAccepted"}
        "400": {$ref: "#/components/responses/AccessClientNetworkInvalid"}
        "403": {$ref: "#/components/responses/AccessChallengeDenied"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
        "503": {$ref: "#/components/responses/AccessChallengeUnavailable"}
  /api/v1/auth/password-recovery-confirmations:
    post:
      operationId: confirmPasswordRecovery
      tags: [access]
      summary: Replace a forgotten password with a single-use recovery token.
      description: >-
        Requires only the single-use recovery token and the new password. The original password
        is deliberately not part of this contract. Success revokes every existing session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordRecoveryConfirmation"}
      responses:
        "200":
          description: Password replaced and every existing session revoked.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasswordRecoveryCompleted"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/auth/session/bootstrap:
    get:
      operationId: getSessionBootstrap
      tags: [access]
      summary: Resolve the current principal and effective access.
      description: >-
        Recomputes scopes and capabilities from active memberships and grants on every call,
        and returns the current capability revision for client cache invalidation.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Current principal, available scopes, and capability revision.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionBootstrap"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
  /api/v1/auth/session:logout:
    post:
      operationId: logoutSession
      tags: [access]
      summary: Revoke the current opaque session.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Session is revoked or was already revoked.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
  /api/v1/account/profile:
    get:
      operationId: getOwnAccountProfile
      tags: [access]
      summary: Read the current opaque-session account profile and password policy.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Current immutable identity, editable profile, and active policy.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
            ETag: {$ref: "#/components/headers/AccountETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountSettings"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
    patch:
      operationId: updateOwnAccountProfile
      tags: [access]
      summary: Update the current account display profile with optimistic concurrency.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountProfileUpdate"}
      responses:
        "200":
          description: Updated account settings.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
            ETag: {$ref: "#/components/headers/AccountETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountSettings"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/account/password:change:
    post:
      operationId: changeOwnAccountPassword
      tags: [access]
      summary: Change the current password and revoke every other active session.
      description: >-
        Requires current-password proof. The presented opaque session is retained and advanced
        to the new credential revision; all other active sessions are atomically revoked.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeCommand"}
      responses:
        "200":
          description: Password changed and other sessions revoked.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
            ETag: {$ref: "#/components/headers/AccountETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasswordChangeResult"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
  /api/v1/account/recovery-email-verifications:
    post:
      operationId: requestRecoveryEmailVerification
      tags: [access]
      summary: Send a single-use verification token to the current account's recovery email.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryEmailVerificationRequest"}
      responses:
        "202":
          description: Verification message accepted for the authenticated account.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasswordRecoveryAccepted"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "503": {$ref: "#/components/responses/AccessChallengeUnavailable"}
  /api/v1/account/recovery-email:confirm:
    post:
      operationId: confirmRecoveryEmail
      tags: [access]
      summary: Confirm a current-account recovery email with a single-use token.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryEmailConfirmation"}
      responses:
        "200":
          description: Verified recovery email configured.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryEmailConfigured"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/account/notifications/unread-count:
    get:
      operationId: getAccountNotificationUnreadCount
      tags: [access]
      summary: Count unread notifications for the current account.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Unread notifications for the verified account only.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountNotificationUnreadCount"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
  /api/v1/account/notifications:
    get:
      operationId: listAccountNotifications
      tags: [access]
      summary: List recipient-scoped account notifications, newest first.
      description: >-
        The inbox contains only compact, allowlisted decision and business-event facts for the
        current account. It never exposes project-manager reasons, raw audit details, or another
        recipient's rows.
      security: [{bearerAuth: []}]
      parameters:
        - name: state
          in: query
          required: false
          schema: {$ref: "#/components/schemas/AccountNotificationState"}
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 16, maxLength: 16384}
        - name: limit
          in: query
          required: false
          schema: {type: integer, enum: [20, 50], default: 20}
      responses:
        "200":
          description: Recipient-scoped notification page, newest first.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountNotificationPage"}
        "400":
          description: The cursor does not belong to this account or query.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/account/notifications/{notification_id}:read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: markAccountNotificationRead
      tags: [access]
      summary: Mark one current-account notification as read.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Notification is marked read, or was already read.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "404":
          description: The notification is absent or belongs to another account.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProblemDetails"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts:
    get:
      operationId: listPlatformAccounts
      tags: [access]
      summary: List direct accounts visible to a platform account administrator.
      security: [{bearerAuth: []}]
      parameters:
        - name: query
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: state
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ManagedAccountState"}
        - name: role
          in: query
          required: false
          schema: {$ref: "#/components/schemas/PlatformAccountRole"}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100000, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 10, maximum: 100, default: 20}
      responses:
        "200":
          description: A password-free, token-free account administration page.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedAccountPage"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
    post:
      operationId: createPlatformAccount
      tags: [access]
      summary: Create a direct account as a platform administrator.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManagedAccountCreate"}
      responses:
        "201":
          description: Account created; password material is never returned.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedAccount"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    delete:
      operationId: deletePlatformAccount
      tags: [access]
      summary: Soft-delete an account while preserving history and audit references.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
      responses:
        "204":
          description: Account soft-deleted and all active sessions revoked.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:disable:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    post:
      operationId: disablePlatformAccount
      tags: [access]
      summary: Disable an account and revoke its active sessions.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
      responses:
        "200": {$ref: "#/components/responses/ManagedAccountOk"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:enable:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    post:
      operationId: enablePlatformAccount
      tags: [access]
      summary: Re-enable a non-deleted account.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
      responses:
        "200": {$ref: "#/components/responses/ManagedAccountOk"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:role:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    post:
      operationId: setPlatformAccountRole
      tags: [access]
      summary: Promote or demote a platform account administrator.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManagedAccountRoleUpdate"}
      responses:
        "200": {$ref: "#/components/responses/ManagedAccountOk"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:reset-password:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    post:
      operationId: resetPlatformAccountPassword
      tags: [access]
      summary: Set a new password as a platform security administrator.
      description: The original password is not required; all active sessions are revoked.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccountIfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManagedAccountPasswordReset"}
      responses:
        "200":
          description: Password updated and session revocation count returned.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedAccountPasswordResetResult"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "412": {$ref: "#/components/responses/AccountPreconditionFailed"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/platform/accounts/{principal_id}:unlock:
    parameters:
      - {$ref: "#/components/parameters/PlatformAccountId"}
    post:
      operationId: unlockPlatformAccount
      tags: [access]
      summary: Clear an active temporary login lock for a direct account.
      description: >-
        Requires the global platform.account_security.manage capability. Project roles and
        project-scoped capabilities never satisfy this operation. The operation is idempotent:
        an already-unlocked or unknown account returns 204 and creates no duplicate audit event.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: The active temporary lock was cleared, or the account was already unlocked.
          headers:
            Cache-Control: {$ref: "#/components/headers/AccessNoStore"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
  /api/v1/account/access-overview:
    get:
      operationId: getOwnAccountAccessOverview
      tags: [access]
      summary: Read the current account's organization, project, and request relationships.
      description: This session-level route remains available when the account has no project scope.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Current account access relationships and request history.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessOverview"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
  /api/v1/account/organization-membership-requests:
    post:
      operationId: createOrganizationMembershipRequest
      tags: [access]
      summary: Request an organization relationship without requiring project scope.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganizationMembershipRequestCreate"}
      responses:
        "201":
          description: Organization membership request created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessRequest"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
  /api/v1/account/organization-membership-requests/{access_request_id}:withdraw:
    parameters:
      - {$ref: "#/components/parameters/AccessRequestId"}
    post:
      operationId: withdrawOrganizationMembershipRequest
      tags: [access]
      summary: Withdraw the current account's pending organization request.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      responses:
        "200":
          description: Organization membership request withdrawn.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessRequest"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
  /api/v1/organization-membership-requests/{access_request_id}:approve:
    parameters:
      - {$ref: "#/components/parameters/AccessRequestId"}
    post:
      operationId: approveOrganizationMembershipRequest
      tags: [access]
      summary: Approve a pending organization membership request as a platform administrator.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/AccessDecisionBody"}
      responses:
        "200":
          description: Organization membership request updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessRequest"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
  /api/v1/organization-membership-requests/{access_request_id}:reject:
    parameters:
      - {$ref: "#/components/parameters/AccessRequestId"}
    post:
      operationId: rejectOrganizationMembershipRequest
      tags: [access]
      summary: Reject a pending organization membership request as a platform administrator.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/AccessDecisionBody"}
      responses:
        "200":
          description: Organization membership request updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessRequest"}
        "401": {$ref: "#/components/responses/AccessUnauthorized"}
        "403": {$ref: "#/components/responses/AccessForbidden"}
        "409": {$ref: "#/components/responses/AccessConflict"}
        "422": {$ref: "#/components/responses/AccessUnprocessable"}
        "429": {$ref: "#/components/responses/AccessTooManyRequests"}
  /api/v1/organization-membership-requests/{access_request_id}:revoke:
    parameters:
      - {$ref: "#/components/parameters/AccessRequestId"}
    post:
      operationId: revokeOrganizationMembershipRequest
      tags: [access]
      summary: Revoke an approved organization relationship without deleting the account.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AccessIdempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/AccessDecisionBody"}
      responses:
        "200":
          description: Organization membership request updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountAccessRequest"}
