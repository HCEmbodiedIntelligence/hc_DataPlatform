          maxItems: 0
          minItems: 0
          title: Ordered Operations
          type: array
        origin:
          discriminator:
            mapping:
              ISSUE_DERIVED: '#/components/schemas/CleaningDraftIssueDerivedOrigin'
              REVIEW_RETURN: '#/components/schemas/CleaningDraftReviewReturnOrigin'
            propertyName: origin_type
          oneOf:
          - $ref: '#/components/schemas/CleaningDraftIssueDerivedOrigin'
          - $ref: '#/components/schemas/CleaningDraftReviewReturnOrigin'
          title: Origin
        preview_summary:
          title: Preview Summary
          type: 'null'
        relationships:
          $ref: '#/components/schemas/CleaningDraftRelationships'
        review_summary:
          anyOf:
          - $ref: '#/components/schemas/CleaningDraftReviewSummary'
          - type: 'null'
      required:
      - draft
      - origin
      - relationships
      title: CleaningDraftDetailData
      type: object
    CleaningDraftDetailEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: manual-cleaning.v1
          default: manual-cleaning.v1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/CleaningDraftDetailData'
        request_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/CleaningDraftScope'
      required:
      - data
      - scope
      - request_id
      title: CleaningDraftDetailEnvelope
      type: object
    CleaningDraftEvent:
