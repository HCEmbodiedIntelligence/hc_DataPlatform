info:
  title: HC P10 CleaningDraft contract
  version: '2026-08-19'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/cleaning-drafts:
    get:
      operationId: listCleaningDrafts
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: scope
        required: false
        schema:
          default: all
          enum:
          - mine
          - actionable
          - review
          - returned
          - submitted
          - all
          title: Scope
          type: string
      - in: query
        name: status
        required: false
        schema:
          default: active
          enum:
          - active
          - submitted
          - failed
          - archived
          title: Status
          type: string
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: dataset_id
        required: false
        schema:
          anyOf:
          - maxLength: 256
