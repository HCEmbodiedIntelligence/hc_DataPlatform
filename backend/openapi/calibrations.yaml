          description: The calibration request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The calibration request could not be completed.
      security:
      - bearerAuth: []
      summary: Create Calibration Set
      tags:
      - calibrations
