components:
  schemas:
    AssetState:
      enum:
      - UPLOADING
      - COMPLETED
      - FAILED
      - CANCELLED
      title: AssetState
      type: string
    AttemptOutcome:
      enum:
      - ACCEPTED
      - REJECTED
      - COMMITTED
      - FAILED
      title: AttemptOutcome
      type: string
    AuthorizePartsCommand:
      additionalProperties: false
      properties:
        part_numbers:
          items:
            type: integer
          maxItems: 1000
          minItems: 1
          title: Part Numbers
          type: array
      required:
      - part_numbers
      title: AuthorizePartsCommand
      type: object
    CameraVerification:
      additionalProperties: false
      properties:
        camera_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Camera Id
          type: string
        continuity_status:
          default: PENDING
          maxLength: 64
          minLength: 1
          title: Continuity Status
          type: string
        failure_code:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Failure Code
        synchronization_status:
          default: PENDING
          maxLength: 64
          minLength: 1
          title: Synchronization Status
          type: string
        validation_status:
          default: PENDING
          maxLength: 64
          minLength: 1
          title: Validation Status
          type: string
        verified_duration_ns:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Verified Duration Ns
        verified_fps:
          anyOf:
          - $ref: '#/components/schemas/FpsRational'
          - type: 'null'
        verified_frame_count:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Verified Frame Count
      required:
      - camera_id
      title: CameraVerification
      type: object
    CaptureMode:
      enum:
      - PRESEGMENTED
      - CONTINUOUS
      title: CaptureMode
      type: string
    CompleteAssetCommand:
      additionalProperties: false
      properties:
        parts:
          items:
            $ref: '#/components/schemas/hc_data_platform__robot_ingest__models__CompletedPart'
          maxItems: 10000
          minItems: 1
          title: Parts
          type: array
      required:
      - parts
      title: CompleteAssetCommand
      type: object
    CreateRobotIngestIdentity:
      additionalProperties: false
      properties:
        allowed_formats:
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._+-]+$
            type: string
          title: Allowed Formats
          type: array
        allowed_transports:
          default:
          - HTTPS
          items:
            type: string
          title: Allowed Transports
          type: array
        display_name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Display Name
        robot_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Robot Id
          type: string
        upload_policy:
          $ref: '#/components/schemas/RobotIngestUploadPolicy'
      required:
      - robot_id
      - allowed_formats
      title: CreateRobotIngestIdentity
      type: object
    CredentialState:
      enum:
      - ACTIVE
      - REVOKED
      - EXPIRED
      title: CredentialState
      type: string
    EpisodeProcessingResult:
      additionalProperties: false
      properties:
        annotation_status:
          default: UNKNOWN
          title: Annotation Status
          type: string
        data_readable:
          default: false
          title: Data Readable
          type: boolean
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
        episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Episode Id
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        next_action:
          enum:
          - wait
          - open_episode
          - retry_processing
          - repair_export
          - review_quality
          title: Next Action
          type: string
        quality_status:
          $ref: '#/components/schemas/hc_data_platform__robot_ingest__models__QualityStatus'
        retryable:
          title: Retryable
          type: boolean
        source_episode_id:
          maxLength: 512
          minLength: 1
          title: Source Episode Id
          type: string
        source_episode_index:
          exclusiveMaximum: 10000.0
          minimum: 0.0
          title: Source Episode Index
          type: integer
        status:
          enum:
          - PENDING
          - PROCESSING
          - READY
          - FAILED
          title: Status
          type: string
      required:
      - source_episode_id
      - source_episode_index
      - episode_id
      - dataset_id
      - status
      - quality_status
      - error_code
      - retryable
      - next_action
      title: EpisodeProcessingResult
      type: object
    FpsRational:
      additionalProperties: false
      properties:
        denominator:
          exclusiveMinimum: 0.0
          maximum: 1000000.0
          title: Denominator
          type: integer
        numerator:
          exclusiveMinimum: 0.0
          maximum: 1000000.0
          title: Numerator
          type: integer
      required:
      - numerator
      - denominator
      title: FpsRational
      type: object
    IdentityState:
      enum:
      - ENABLED
      - DISABLED
      title: IdentityState
      type: string
    IssueCredentialCommand:
      additionalProperties: false
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        idempotency_key:
          anyOf:
          - maxLength: 128
            minLength: 8
            type: string
          - type: 'null'
          title: Idempotency Key
        revoke_previous:
          default: false
          title: Revoke Previous
          type: boolean
      title: IssueCredentialCommand
      type: object
    IssuedRobotCredential:
      additionalProperties: false
      properties:
        credential_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Credential Id
          type: string
        credential_version:
          minimum: 1.0
          title: Credential Version
          type: integer
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        issued_at:
          format: date-time
          title: Issued At
          type: string
        token:
          maxLength: 1024
          minLength: 32
          title: Token
          type: string
        token_prefix:
          maxLength: 96
          minLength: 8
          title: Token Prefix
          type: string
      required:
      - credential_id
      - credential_version
      - token
      - token_prefix
      - issued_at
      title: IssuedRobotCredential
      type: object
    PartAuthorizationGrant:
      additionalProperties: false
      properties:
        asset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Asset Id
          type: string
        authorizations:
          items:
            $ref: '#/components/schemas/RobotPartAuthorization'
          title: Authorizations
          type: array
        upload_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Upload Id
          type: string
        uploaded_parts:
          items:
            $ref: '#/components/schemas/UploadedPart'
          title: Uploaded Parts
          type: array
      required:
      - upload_id
      - asset_id
      - uploaded_parts
      - authorizations
      title: PartAuthorizationGrant
      type: object
    ProcessingDiagnostics:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Detail
        generation:
          anyOf:
          - type: integer
          - type: 'null'
          title: Generation
        next_action:
          title: Next Action
          type: string
        retryable:
          title: Retryable
          type: boolean
        upload_id:
          title: Upload Id
          type: string
        workflow_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Id
      required:
      - upload_id
      - workflow_id
      - generation
      - error_code
      - retryable
      - next_action
      title: ProcessingDiagnostics
      type: object
    ProcessingResult:
      additionalProperties: false
      properties:
        episodes:
          items:
            $ref: '#/components/schemas/EpisodeProcessingResult'
          title: Episodes
          type: array
        poll_after_seconds:
          title: Poll After Seconds
          type: integer
        processing_status:
          enum:
          - PENDING
          - DISCOVERING_EPISODES
          - PROCESSING
          - READY
          - PARTIALLY_FAILED
          - FAILED
          title: Processing Status
          type: string
        quality_status:
          $ref: '#/components/schemas/hc_data_platform__robot_ingest__models__QualityStatus'
        raw_source_id:
          title: Raw Source Id
          type: string
        schema_version:
          const: openarm-processing-result/v1
          default: openarm-processing-result/v1
          title: Schema Version
          type: string
        terminal:
          title: Terminal
          type: boolean
        upload_id:
          title: Upload Id
          type: string
      required:
      - upload_id
      - raw_source_id
      - processing_status
      - quality_status
      - terminal
      - poll_after_seconds
      - episodes
      title: ProcessingResult
      type: object
    RecordingResult:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        page_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Path
        poll_after_seconds:
          maximum: 60.0
          minimum: 0.0
          title: Poll After Seconds
          type: integer
        raw_source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Source Id
        recording_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recording Id
        registration_attempts:
          default: 0
          minimum: 0.0
          title: Registration Attempts
          type: integer
        status:
          enum:
          - REGISTERING
          - AWAITING_SLICE
          - SLICED
          - FAILED
          title: Status
          type: string
        terminal:
          title: Terminal
          type: boolean
        upload_id:
          title: Upload Id
          type: string
      required:
      - upload_id
      - raw_source_id
      - recording_id
      - status
      - page_path
      - terminal
      - poll_after_seconds
      title: RecordingResult
      type: object
    RetryProcessing:
      additionalProperties: false
      properties:
        request_id:
          format: uuid
          title: Request Id
          type: string
      required:
      - request_id
      title: RetryProcessing
      type: object
    RobotCredentialSummary:
      additionalProperties: false
      properties:
        credential_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Credential Id
          type: string
        credential_version:
          minimum: 1.0
          title: Credential Version
          type: integer
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        issued_at:
          format: date-time
          title: Issued At
          type: string
        last_authenticated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Authenticated At
        reveal_available:
          default: false
          title: Reveal Available
          type: boolean
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        state:
          $ref: '#/components/schemas/CredentialState'
        token_prefix:
          maxLength: 96
          minLength: 8
          title: Token Prefix
          type: string
      required:
      - credential_id
      - credential_version
      - state
      - token_prefix
      - issued_at
      title: RobotCredentialSummary
      type: object
    RobotIdentityEnvelope:
      additionalProperties: false
      properties:
        credential:
          anyOf:
          - $ref: '#/components/schemas/IssuedRobotCredential'
          - type: 'null'
        data:
          $ref: '#/components/schemas/RobotIngestIdentity'
      required:
      - data
      title: RobotIdentityEnvelope
      type: object
    RobotIdentityList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/RobotIngestIdentity'
          title: Items
          type: array
      required:
      - items
      title: RobotIdentityList
      type: object
    RobotIngestAsset:
      additionalProperties: false
      properties:
        actual_crc64:
          anyOf:
          - pattern: ^(?:0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Actual Crc64
        actual_sha256:
          anyOf:
          - pattern: ^[a-f0-9]{64}$
            type: string
          - type: 'null'
          title: Actual Sha256
        actual_size_bytes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Actual Size Bytes
        asset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Asset Id
          type: string
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        etag:
          anyOf:
          - type: string
          - type: 'null'
          title: Etag
        expected_crc64:
          pattern: ^(?:0|[1-9][0-9]*)$
          title: Expected Crc64
          type: string
        expected_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Expected Sha256
          type: string
        expected_size_bytes:
          exclusiveMinimum: 0.0
          title: Expected Size Bytes
          type: integer
        media_type:
          title: Media Type
          type: string
        multipart_upload_id:
          title: Multipart Upload Id
          type: string
        object_key:
          title: Object Key
          type: string
        path:
          title: Path
          type: string
        role:
          title: Role
          type: string
        state:
          $ref: '#/components/schemas/AssetState'
          default: UPLOADING
      required:
      - asset_id
      - path
      - role
      - media_type
      - object_key
      - multipart_upload_id
      - expected_size_bytes
      - expected_sha256
      - expected_crc64
      title: RobotIngestAsset
      type: object
    RobotIngestAssetManifest:
      additionalProperties: false
      properties:
        asset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Asset Id
          type: string
        camera_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Camera Id
        crc64:
          pattern: ^(?:0|[1-9][0-9]*)$
          title: Crc64
          type: string
        media_type:
          maxLength: 128
          minLength: 1
          title: Media Type
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        path:
          maxLength: 1024
          minLength: 1
          title: Path
          type: string
        role:
          default: RAW
          maxLength: 64
          minLength: 1
          title: Role
          type: string
        sha256:
          pattern: ^[a-f0-9]{64}$
          title: Sha256
          type: string
        size_bytes:
          exclusiveMinimum: 0.0
          title: Size Bytes
          type: integer
      required:
      - asset_id
      - path
      - media_type
      - size_bytes
      - sha256
      - crc64
      title: RobotIngestAssetManifest
      type: object
    RobotIngestAttempt:
      additionalProperties: false
      properties:
        attempt_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Attempt Id
          type: string
        authenticated_robot_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Authenticated Robot Id
        collection_task_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Collection Task Id
        failure_code:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Failure Code
        failure_stage:
          maxLength: 64
          minLength: 1
          title: Failure Stage
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        organization_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Organization Id
        outcome:
          $ref: '#/components/schemas/AttemptOutcome'
        project_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Project Id
        raw_source_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Raw Source Id
        region_code:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Region Code
        request_robot_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Request Robot Id
        source_format:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._+-]+$
            type: string
          - type: 'null'
          title: Source Format
        upload_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Upload Id
      required:
      - attempt_id
      - outcome
      - failure_stage
      - occurred_at
      title: RobotIngestAttempt
      type: object
    RobotIngestAttemptList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/RobotIngestAttempt'
          title: Items
          type: array
      required:
      - items
      title: RobotIngestAttemptList
      type: object
    RobotIngestCameraManifest:
      additionalProperties: false
      properties:
        asset_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Asset Id
        camera_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Camera Id
          type: string
        capture_ended_at:
          format: date-time
          title: Capture Ended At
          type: string
        capture_started_at:
          format: date-time
          title: Capture Started At
          type: string
        clock_domain:
          maxLength: 128
          minLength: 1
          title: Clock Domain
          type: string
        codec:
          maxLength: 128
          minLength: 1
          title: Codec
          type: string
        declared_duration_ns:
          minimum: 0.0
          title: Declared Duration Ns
          type: integer
        declared_fps:
          $ref: '#/components/schemas/FpsRational'
        declared_frame_count:
          minimum: 0.0
          title: Declared Frame Count
          type: integer
        height:
          exclusiveMinimum: 0.0
          maximum: 65535.0
          title: Height
          type: integer
        path:
          anyOf:
          - maxLength: 1024
            minLength: 1
            type: string
          - type: 'null'
          title: Path
        time_base:
          anyOf:
          - $ref: '#/components/schemas/FpsRational'
          - type: 'null'
        width:
          exclusiveMinimum: 0.0
          maximum: 65535.0
          title: Width
          type: integer
      required:
      - camera_id
      - codec
      - width
      - height
      - declared_fps
      - declared_frame_count
      - declared_duration_ns
      - clock_domain
      - capture_started_at
      - capture_ended_at
      title: RobotIngestCameraManifest
      type: object
    RobotIngestEpisodeReadResult:
      additionalProperties: false
      description: Read projection; annotation progress does not change the durable data receipt.
      properties:
        annotation_status:
          default: UNKNOWN
          title: Annotation Status
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        data_readable:
          title: Data Readable
          type: boolean
        data_ref:
          anyOf:
          - $ref: '#/components/schemas/DataVersionRef'
          - type: 'null'
        dataset_version:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Dataset Version
        episode_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Episode Id
          type: string
        frame_count:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Frame Count
        lance_version:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Lance Version
        qc_report_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Qc Report Id
        quality_status:
          $ref: '#/components/schemas/hc_data_platform__robot_ingest__models__QualityStatus'
          default: PENDING
        sample_count:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Sample Count
        source_episode_index:
          minimum: 0.0
          title: Source Episode Index
          type: integer
        status:
          enum:
          - PENDING
          - PROCESSING
          - READY
          - FAILED
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - episode_id
      - source_episode_index
      - status
      - created_at
      - updated_at
      - data_readable
      title: RobotIngestEpisodeReadResult
      type: object
    RobotIngestEpisodeResultList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/RobotIngestEpisodeReadResult'
          title: Items
          type: array
        raw_source_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Raw Source Id
          type: string
        upload_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Upload Id
          type: string
      required:
      - upload_id
      - raw_source_id
      - items
      title: RobotIngestEpisodeResultList
      type: object
    RobotIngestIdentity:
      additionalProperties: false
      properties:
        activity_expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Activity Expires At
        allowed_formats:
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._+-]+$
            type: string
          title: Allowed Formats
          type: array
        allowed_transports:
          default:
          - HTTPS
          items:
            type: string
          title: Allowed Transports
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_revision:
          default: 0
          minimum: 0.0
          title: Credential Revision
          type: integer
        display_name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Display Name
        ingest_identity_id:
          maxLength: 128
          minLength: 1
