        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRobotIngestIdentity'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotIdentityEnvelope'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create Robot Identity
      tags:
      - robot-ingest
  /api/v1/projects/{project_id}/robot-ingest/identities/{ingest_identity_id}:
    delete:
      operationId: deleteRobotIngestIdentity
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: ingest_identity_id
        required: true
        schema:
          title: Ingest Identity Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Organization-Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Delete Robot Identity
      tags:
      - robot-ingest
    get:
      operationId: getRobotIngestIdentity
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: ingest_identity_id
        required: true
        schema:
          title: Ingest Identity Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Organization-Id
          type: string
      responses:
