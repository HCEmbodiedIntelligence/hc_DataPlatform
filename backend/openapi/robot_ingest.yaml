components:
  schemas:
    RetryProcessing:
      additionalProperties: false
      properties:
        request_id:
          format: uuid
          type: string
      required:
      - request_id
      type: object
    RobotIngestUploadCapabilities:
      additionalProperties: false
      properties:
        max_recording_assets:
          maximum: 4095.0
          minimum: 0.0
          title: Max Recording Assets
          type: integer
        max_total_assets:
          maximum: 4096.0
          minimum: 1.0
          title: Max Total Assets
          type: integer
        robot_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Robot Id
          type: string
        schema_version:
          const: robot-ingest-capabilities/v1
          default: robot-ingest-capabilities/v1
          title: Schema Version
          type: string
      required:
      - robot_id
      - max_total_assets
      - max_recording_assets
      title: RobotIngestUploadCapabilities
      type: object
paths:
  /api/v1/projects/{project_id}/robot-ingest/attempts:
    get:
      operationId: listRobotIngestAttempts
      responses: {}
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/robot-ingest/identities:
    get:
      operationId: listRobotIngestIdentities
      responses: {}
      security:
      - bearerAuth: []
