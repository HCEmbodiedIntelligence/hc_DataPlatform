    patch:
      operationId: updateRobotIngestIdentity
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: ingest_identity_id
        required: true
        schema:
          title: Ingest Identity Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
