info:
  title: Robot upload contracts
  version: '2026-10-21'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/robot-ingest/attempts:
    get:
      operationId: listRobotIngestAttempts
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: query
        name: robot_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Robot Id
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Organization-Id
          type: string
      - in: header
        name: X-Region-Code
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Region-Code
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotIngestAttemptList'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Robot Attempts
      tags:
      - robot-ingest
  /api/v1/projects/{project_id}/robot-ingest/identities:
    get:
      operationId: listRobotIngestIdentities
