components:
  schemas:
    AuthorizeRecordingAssetPartsCommand:
      additionalProperties: false
      properties:
        part_numbers:
          items:
            maximum: 10000
            minimum: 1
            type: integer
          maxItems: 256
          minItems: 1
          type: array
          uniqueItems: true
      required:
      - part_numbers
      type: object
    CameraRecordingConfig:
      additionalProperties: false
      properties:
        camera_id:
          $ref: '#/components/schemas/IngestIdentifier'
        capture_start_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        clock_domain:
          maxLength: 128
          minLength: 1
          type: string
        codec:
          maxLength: 64
          minLength: 1
          type: string
        fps:
          exclusiveMinimum: 0
          maximum: 1000
          type: number
        height:
          maximum: 32768
          minimum: 2
          type:
          - integer
          - 'null'
        time_base_denominator:
          maximum: 1000000000
          minimum: 1
          type: integer
        time_base_numerator:
          default: 1
          minimum: 1
          type: integer
        topic:
          type:
          - string
          - 'null'
        width:
          maximum: 32768
          minimum: 2
          type:
          - integer
          - 'null'
      required:
      - camera_id
      - fps
      - codec
      - clock_domain
      - time_base_numerator
      - time_base_denominator
      type: object
    CompleteRecordingAssetCommand:
      additionalProperties: false
      properties:
        parts:
          items:
            $ref: '#/components/schemas/CompletedPart'
          maxItems: 10000
          minItems: 1
          type: array
      required:
      - parts
      type: object
    ContinuousRecording:
      additionalProperties: false
      properties:
        capture_ended_at:
          format: date-time
          type: string
        capture_started_at:
          format: date-time
          type: string
        collection_job_id:
          $ref: '#/components/schemas/IngestIdentifier'
        collection_task_id:
          $ref: '#/components/schemas/IngestIdentifier'
        created_at:
          format: date-time
          type: string
        current_revision:
          minimum: 0
          type: integer
        data_package_id:
          $ref: '#/components/schemas/IngestIdentifier'
        default_task_labels:
          items:
            maxLength: 10000
            minLength: 1
            type: string
          maxItems: 100
          type: array
        device_id:
          $ref: '#/components/schemas/IngestIdentifier'
        duration_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        etag:
          pattern: ^"v[1-9][0-9]*"$
          type: string
        file_name:
          maxLength: 255
          type:
          - string
          - 'null'
        finalized_revision:
          minimum: 1
          type:
          - integer
          - 'null'
        manifest_fingerprint:
          pattern: ^[a-f0-9]{64}$
          type: string
        recording_id:
          $ref: '#/components/schemas/IngestIdentifier'
        recording_upload_id:
          format: uuid
          type:
          - string
          - 'null'
        robot_id:
          $ref: '#/components/schemas/IngestIdentifier'
        robot_name:
          maxLength: 256
          type:
          - string
          - 'null'
        rollout_id:
          $ref: '#/components/schemas/IngestIdentifier'
        schema_version:
          enum:
          - continuous-recording/v1
          - continuous-recording/v2
          type: string
        scope:
          $ref: '#/components/schemas/RecordingScope'
        source_file_name:
          maxLength: 255
          type:
          - string
          - 'null'
        source_sha256:
          pattern: ^[a-f0-9]{64}$
          type: string
        status:
          $ref: '#/components/schemas/RecordingStatus'
        task_code:
          maxLength: 128
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        upload_session_id:
          format: uuid
          type:
          - string
          - 'null'
        video_asset_count:
          maximum: 128
          minimum: 0
          type: integer
      required:
      - scope
      - recording_id
      - rollout_id
      - data_package_id
      - collection_task_id
      - collection_job_id
      - robot_id
      - device_id
      - capture_started_at
      - capture_ended_at
      - duration_ns
      - source_sha256
      - manifest_fingerprint
      - etag
      type: object
    ContinuousRecordingEnvelope:
      additionalProperties: false
      properties:
        current_slice_revision:
          anyOf:
          - $ref: '#/components/schemas/RecordingSliceRevision'
          - type: 'null'
        data:
          $ref: '#/components/schemas/ContinuousRecording'
      required:
      - data
      type: object
    ContinuousRecordingPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContinuousRecording'
          type: array
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      type: object
    CreateRecordingUploadCommand:
      additionalProperties: false
      properties:
        assets:
          items:
            $ref: '#/components/schemas/RecordingAssetManifest'
          maxItems: 4096
          minItems: 3
          type: array
        capture_ended_at:
          format: date-time
          type: string
        capture_started_at:
          format: date-time
          type: string
        collection_job_id:
          $ref: '#/components/schemas/IngestIdentifier'
        collection_task_id:
          $ref: '#/components/schemas/IngestIdentifier'
        data_package_id:
          $ref: '#/components/schemas/IngestIdentifier'
        device_id:
          $ref: '#/components/schemas/IngestIdentifier'
        recording_config:
          $ref: '#/components/schemas/RecordingConfiguration'
        recording_id:
          $ref: '#/components/schemas/IngestIdentifier'
        robot_id:
          $ref: '#/components/schemas/IngestIdentifier'
        rollout_id:
          $ref: '#/components/schemas/IngestIdentifier'
        schema_version:
          const: continuous-recording-upload/v2
          type: string
      required:
      - recording_id
      - rollout_id
      - data_package_id
      - collection_task_id
      - collection_job_id
      - robot_id
      - device_id
      - capture_started_at
      - capture_ended_at
      - recording_config
      - assets
      type: object
    EpisodeProcessing:
      additionalProperties: false
      description: Canonical database row for a continuous-recording Episode.
      properties:
        aligned_media_camera_count:
          anyOf:
          - maximum: 128.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Aligned Media Camera Count
        alignment_attempt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Alignment Attempt Id
        annotation_task_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Annotation Task Id
        collection_version_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Collection Version Id
        created_at:
          format: date-time
          title: Created At
          type: string
        data_ref:
          anyOf:
          - $ref: '#/components/schemas/DataVersionRef'
          - type: 'null'
        dataset_episode_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Dataset Episode Id
        dataset_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Dataset Id
        dataset_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Dataset Version
        dispatch_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Dispatch Error Code
        end_offset_ns:
          description: Nanoseconds encoded as a decimal string for JSON precision.
          pattern: ^(?:0|[1-9][0-9]*)$
          title: End Offset Ns
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        event_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Event Id
        failure_code:
          anyOf:
          - pattern: ^[A-Z0-9_]+$
            type: string
          - type: 'null'
          title: Failure Code
        failure_stage:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Failure Stage
        finalized_revision:
          minimum: 1.0
          title: Finalized Revision
          type: integer
        lance_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Lance Version
        qc_report_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Qc Report Id
        recording_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Recording Id
          type: string
        schema_version:
          const: recording-episode/v1
          default: recording-episode/v1
          title: Schema Version
          type: string
        scope:
          $ref: '#/components/schemas/RecordingScope'
        start_offset_ns:
          description: Nanoseconds encoded as a decimal string for JSON precision.
          pattern: ^(?:0|[1-9][0-9]*)$
          title: Start Offset Ns
          type: string
        status:
          $ref: '#/components/schemas/EpisodeProcessingStatus'
          default: PENDING_QC
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workflow_id:
          anyOf:
          - maxLength: 1024
            minLength: 1
            type: string
          - type: 'null'
          title: Workflow Id
      required:
      - scope
      - recording_id
      - episode_id
      - finalized_revision
      - start_offset_ns
      - end_offset_ns
      title: EpisodeProcessing
      type: object
    EpisodeProcessingPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/EpisodeProcessing'
          title: Items
          type: array
        qc_reports:
          default: []
          items:
            $ref: '#/components/schemas/RecordingEpisodeQc'
          title: Qc Reports
          type: array
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      title: EpisodeProcessingPage
      type: object
    EpisodeProcessingStatus:
      enum:
      - PENDING_QC
      - QC_RUNNING
      - QC_FAILED
      - PENDING_ALIGNMENT
      - ALIGNING
      - READY
      - FAILED
      - DISCARDED
      title: EpisodeProcessingStatus
      type: string
    EpisodeSlice:
      additionalProperties: false
      properties:
        end_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        ended_at:
          format: date-time
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          type: string
        notes:
          maxLength: 4096
          type:
          - string
          - 'null'
        ordinal:
          minimum: 0
          type: integer
        recording_id:
          $ref: '#/components/schemas/IngestIdentifier'
        revision:
          minimum: 1
          type: integer
        schema_version:
          const: recording-episode-slice/v1
          type: string
        scope:
          $ref: '#/components/schemas/RecordingScope'
        source_recording_upload_id:
          format: uuid
          type:
          - string
          - 'null'
        source_sha256:
          pattern: ^[a-f0-9]{64}$
          type: string
        source_upload_session_id:
          format: uuid
          type:
          - string
          - 'null'
        start_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        started_at:
          format: date-time
          type: string
        task_label:
          maxLength: 10000
          minLength: 1
          type:
          - string
          - 'null'
        task_labels:
          items:
            maxLength: 10000
            minLength: 1
            type: string
          maxItems: 100
          type:
          - array
          - 'null'
        title:
          maxLength: 256
          minLength: 1
          type:
          - string
          - 'null'
      required:
      - scope
      - recording_id
      - revision
      - ordinal
      - episode_id
      - start_offset_ns
      - end_offset_ns
      - started_at
      - ended_at
      - source_sha256
      type: object
    EpisodeSliceInput:
      additionalProperties: false
      properties:
        end_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          type: string
        notes:
          maxLength: 4096
          type:
          - string
          - 'null'
        start_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        task_label:
          maxLength: 10000
          minLength: 1
          type:
          - string
          - 'null'
        task_labels:
          items:
            maxLength: 10000
            minLength: 1
            type: string
          maxItems: 100
          type:
          - array
          - 'null'
        title:
          maxLength: 256
          minLength: 1
          type:
          - string
          - 'null'
      required:
      - episode_id
      - start_offset_ns
      - end_offset_ns
      type: object
    EpisodeVideoSource:
      additionalProperties: false
      description: Direct original-video playback descriptor; no preview artifact is generated.
      properties:
        asset_id:
          format: uuid
          title: Asset Id
          type: string
        byte_range_supported:
          default: true
          title: Byte Range Supported
          type: boolean
        camera_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Camera Id
          type: string
        codec:
          title: Codec
          type: string
        end_offset_ns:
          description: Nanoseconds encoded as a decimal string for JSON precision.
          pattern: ^(?:0|[1-9][0-9]*)$
          title: End Offset Ns
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        fps:
          exclusiveMinimum: 0.0
          title: Fps
          type: number
        materialization:
          default: ORIGINAL_VIDEO_TIME_WINDOW
          enum:
          - ORIGINAL_VIDEO_TIME_WINDOW
          - DEPTH_PREVIEW_TIME_WINDOW
          - PROCESSED_PREVIEW_TIME_WINDOW
          title: Materialization
          type: string
        media_type:
          title: Media Type
          type: string
        modality:
          default: rgb
          enum:
          - rgb
          - depth
          title: Modality
          type: string
        preview_status:
          default: READY
          enum:
          - READY
          - UNAVAILABLE
          title: Preview Status
          type: string
        recording_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Recording Id
          type: string
        schema_version:
          const: episode-video-source/v1
          default: episode-video-source/v1
          title: Schema Version
          type: string
        source_url:
          title: Source Url
          type: string
        start_offset_ns:
          description: Nanoseconds encoded as a decimal string for JSON precision.
          pattern: ^(?:0|[1-9][0-9]*)$
          title: Start Offset Ns
          type: string
      required:
      - recording_id
      - episode_id
      - asset_id
      - camera_id
      - media_type
      - source_url
      - start_offset_ns
      - end_offset_ns
      - fps
      - codec
      - expires_at
      title: EpisodeVideoSource
      type: object
    EpisodeVideoSourceEnvelope:
      additionalProperties: false
      properties:
        sources:
          items:
            $ref: '#/components/schemas/EpisodeVideoSource'
          type: array
      required:
      - sources
      type: object
    FinalizeSliceCommand:
      additionalProperties: false
      properties:
        expected_draft_revision:
          minimum: 1
          type: integer
      required:
      - expected_draft_revision
      type: object
    ModelSliceProposalMetadata:
      additionalProperties: false
      properties:
        confidence:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
        model_id:
          maxLength: 256
          minLength: 1
          type: string
        model_version:
          maxLength: 256
          minLength: 1
          type: string
        prompt_version:
          maxLength: 256
          minLength: 1
          type:
          - string
          - 'null'
      required:
      - model_id
      - model_version
      type: object
    NanosecondsDecimal:
      description: Nanoseconds encoded as a canonical decimal string for JSON precision.
      pattern: ^(?:0|[1-9][0-9]*)$
      type: string
    ProposeModelSlicesCommand:
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/ModelSliceProposalMetadata'
        slices:
          items:
            $ref: '#/components/schemas/EpisodeSliceInput'
          maxItems: 10000
          minItems: 1
          type: array
      required:
      - slices
      - model
      type: object
    RecordingAssetManifest:
      additionalProperties: false
      properties:
        camera_id:
          anyOf:
          - $ref: '#/components/schemas/IngestIdentifier'
          - type: 'null'
        crc64:
          minimum: 0
          type:
          - integer
          - 'null'
        media_type:
          maxLength: 255
          minLength: 1
          type: string
        part_count:
          default: 1
          maximum: 10000
          minimum: 1
          type: integer
        path:
          maxLength: 1024
          minLength: 1
          type: string
        role:
          $ref: '#/components/schemas/RecordingAssetRole'
        sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        size:
          minimum: 1
          type: integer
      required:
      - path
      - role
      - media_type
      - size
      - sha256
      type: object
    RecordingAssetPartGrant:
      additionalProperties: false
      properties:
        asset_id:
          format: uuid
          type: string
        parts:
          items:
            $ref: '#/components/schemas/PartAuthorization'
          type: array
      required:
      - asset_id
      - parts
      type: object
    RecordingAssetRole:
      enum:
      - RAW_VIDEO
      - SENSOR_DATA
      - RECORDING_CONFIG
      - CALIBRATION
      - AUXILIARY
      type: string
    RecordingAssetStatus:
      enum:
      - UPLOADING
      - COMMITTED
      - FAILED
      type: string
    RecordingAssetSummary:
      additionalProperties: false
      properties:
        asset_id:
          format: uuid
          type: string
        camera_id:
          anyOf:
          - $ref: '#/components/schemas/IngestIdentifier'
          - type: 'null'
        media_type:
          type: string
        path:
          type: string
        role:
          $ref: '#/components/schemas/RecordingAssetRole'
        sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        size:
          minimum: 1
          type: integer
        status:
          $ref: '#/components/schemas/RecordingAssetStatus'
      required:
      - asset_id
      - path
      - role
      - media_type
      - size
      - sha256
      - status
      type: object
    RecordingAssetUploadGrant:
      additionalProperties: false
      properties:
        asset:
          $ref: '#/components/schemas/RecordingAssetSummary'
        multipart_upload_id:
          type: string
        parts:
          items:
            $ref: '#/components/schemas/PartAuthorization'
          type: array
      required:
      - asset
      - multipart_upload_id
      - parts
      type: object
    RecordingConfiguration:
      additionalProperties: false
      properties:
        cameras:
          items:
            $ref: '#/components/schemas/CameraRecordingConfig'
          maxItems: 128
          minItems: 1
          type: array
        primary_clock_domain:
          maxLength: 128
          minLength: 1
          type: string
        recorder_version:
          maxLength: 128
          minLength: 1
          type: string
        schema_version:
          const: recording-config/v1
          type: string
        sensors:
          default: []
          items:
            $ref: '#/components/schemas/SensorRecordingConfig'
          maxItems: 2048
          type: array
      required:
      - recorder_version
      - primary_clock_domain
      - cameras
      type: object
    RecordingEpisodeQc:
      additionalProperties: false
      properties:
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        finding_codes:
          default: []
          items:
            type: string
          title: Finding Codes
          type: array
        quality_report:
          $ref: '#/components/schemas/QcReportV1'
        report_id:
          title: Report Id
          type: string
        rules:
          default: []
          items:
            $ref: '#/components/schemas/RuleExecution'
          title: Rules
          type: array
        status:
          enum:
          - PASS
          - REJECT
          title: Status
          type: string
      required:
      - episode_id
      - report_id
      - status
      - quality_report
      title: RecordingEpisodeQc
      type: object
    RecordingScope:
      additionalProperties: false
      properties:
        organization_id:
          $ref: '#/components/schemas/IngestIdentifier'
        project_id:
          $ref: '#/components/schemas/IngestIdentifier'
        region_code:
          $ref: '#/components/schemas/IngestIdentifier'
      required:
      - organization_id
      - project_id
      - region_code
      type: object
    RecordingSensorSample:
      additionalProperties: false
      properties:
        offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        source_timestamp_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        value: {}
      required:
      - offset_ns
      - source_timestamp_ns
      - value
      type: object
    RecordingSensorWindow:
      additionalProperties: false
      properties:
        end_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        recording_id:
          $ref: '#/components/schemas/IngestIdentifier'
        samples:
          items:
            $ref: '#/components/schemas/RecordingSensorSample'
          type: array
        schema_version:
          const: recording-sensor-window/v1
          type: string
        start_offset_ns:
          $ref: '#/components/schemas/NanosecondsDecimal'
        topic:
          maxLength: 512
          minLength: 1
          type: string
        truncated:
          default: false
          type: boolean
      required:
      - recording_id
      - topic
      - start_offset_ns
      - end_offset_ns
      - samples
      type: object
    RecordingSliceRevision:
      additionalProperties: false
      properties:
        authoring_mode:
          $ref: '#/components/schemas/SliceAuthoringMode'
        created_at:
          format: date-time
          type: string
        created_by:
          maxLength: 512
          minLength: 1
          type: string
        model:
          anyOf:
          - $ref: '#/components/schemas/ModelSliceProposalMetadata'
          - type: 'null'
        recording_id:
          $ref: '#/components/schemas/IngestIdentifier'
        revision:
          minimum: 1
          type: integer
        schema_version:
          const: recording-slice-revision/v1
          type: string
        scope:
          $ref: '#/components/schemas/RecordingScope'
        slices:
          items:
            $ref: '#/components/schemas/EpisodeSlice'
          type: array
        status:
          $ref: '#/components/schemas/SliceRevisionStatus'
      required:
      - scope
      - recording_id
      - revision
      - status
      - slices
      - created_by
      - created_at
      type: object
    RecordingStatus:
      enum:
      - READY_FOR_SLICING
      - SLICED
      type: string
    RecordingUpload:
      additionalProperties: false
      properties:
        command:
          $ref: '#/components/schemas/CreateRecordingUploadCommand'
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        schema_version:
          const: continuous-recording-upload/v2
          type: string
        scope:
          $ref: '#/components/schemas/RecordingScope'
        status:
          $ref: '#/components/schemas/RecordingUploadStatus'
        updated_at:
          format: date-time
          type: string
        upload_id:
          format: uuid
          type: string
      required:
      - scope
      - upload_id
      - command
      - manifest_sha256
      - status
      - created_by
      - created_at
      - updated_at
      type: object
    RecordingUploadEnvelope:
      additionalProperties: false
      properties:
        assets:
          items:
            $ref: '#/components/schemas/RecordingAssetSummary'
          type: array
        upload:
          $ref: '#/components/schemas/RecordingUpload'
      required:
      - upload
      - assets
      type: object
    RecordingUploadGrant:
      additionalProperties: false
      properties:
        assets:
          items:
            $ref: '#/components/schemas/RecordingAssetUploadGrant'
          type: array
        upload:
          $ref: '#/components/schemas/RecordingUpload'
      required:
      - upload
      - assets
      type: object
    RecordingUploadStatus:
      enum:
      - UPLOADING
      - READY_TO_COMMIT
      - COMMITTED
      - FAILED
      type: string
    RecordingVideoSource:
      additionalProperties: false
      description: Direct whole-recording playback descriptor used by the slice editor.
      properties:
        asset_id:
          format: uuid
          title: Asset Id
          type: string
        byte_range_supported:
          default: true
          title: Byte Range Supported
          type: boolean
        camera_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Camera Id
          type: string
        codec:
          title: Codec
          type: string
        duration_ns:
          description: Nanoseconds encoded as a decimal string for JSON precision.
          pattern: ^(?:0|[1-9][0-9]*)$
          title: Duration Ns
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        fps:
          exclusiveMinimum: 0.0
          title: Fps
          type: number
        materialization:
          default: ORIGINAL_RECORDING
          enum:
          - ORIGINAL_RECORDING
          - DEPTH_PREVIEW
          - PROCESSED_PREVIEW
          title: Materialization
          type: string
        media_type:
          title: Media Type
          type: string
        modality:
          default: rgb
          enum:
          - rgb
          - depth
          title: Modality
          type: string
        preview_status:
          default: READY
          enum:
          - READY
          - UNAVAILABLE
          title: Preview Status
          type: string
        recording_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Recording Id
          type: string
        schema_version:
          const: recording-video-source/v1
          default: recording-video-source/v1
          title: Schema Version
          type: string
        source_url:
          title: Source Url
          type: string
      required:
      - recording_id
      - asset_id
      - camera_id
      - media_type
      - source_url
      - duration_ns
      - fps
      - codec
      - expires_at
      title: RecordingVideoSource
      type: object
    RecordingVideoSourceEnvelope:
      additionalProperties: false
      properties:
        sources:
          items:
            $ref: '#/components/schemas/RecordingVideoSource'
          type: array
      required:
      - sources
      type: object
    RegisterContinuousRecordingCommand:
      additionalProperties: false
      properties:
        upload_session_id:
          format: uuid
          type: string
      required:
      - upload_session_id
      type: object
    RetryEpisodeCommand:
      additionalProperties: false
      properties:
        expected_workflow_id:
          maxLength: 1024
          minLength: 1
          title: Expected Workflow Id
          type: string
        request_id:
          format: uuid
          title: Request Id
          type: string
      required:
      - request_id
      - expected_workflow_id
      title: RetryEpisodeCommand
      type: object
    SaveSliceDraftCommand:
      additionalProperties: false
      properties:
        slices:
          default: []
          items:
            $ref: '#/components/schemas/EpisodeSliceInput'
          maxItems: 10000
          type: array
      type: object
    SensorRecordingConfig:
      additionalProperties: false
      properties:
        clock_domain:
          maxLength: 128
          minLength: 1
          type: string
        required:
          default: true
          type: boolean
        timestamp_mode:
          $ref: '#/components/schemas/SensorTimestampMode'
        topic:
          maxLength: 512
          minLength: 1
          type: string
      required:
      - topic
      - clock_domain
      type: object
    SensorTimestampMode:
      enum:
      - ABSOLUTE_NS
      - RECORDING_OFFSET_NS
      type: string
    SliceAuthoringMode:
      enum:
      - HUMAN
      - MODEL
      type: string
    SliceRevisionEnvelope:
      additionalProperties: false
      properties:
        recording:
          $ref: '#/components/schemas/ContinuousRecording'
        revision:
          $ref: '#/components/schemas/RecordingSliceRevision'
      required:
      - recording
      - revision
      type: object
    SliceRevisionStatus:
      enum:
      - DRAFT
      - FINALIZED
      type: string
info:
  title: HC Data Platform Continuous Recording API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings:
    get:
      operationId: listContinuousRecordings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuousRecordingPage'
          description: Scoped continuous recordings
      security:
      - bearerAuth: []
    post:
      operationId: registerContinuousRecording
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterContinuousRecordingCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuousRecordingEnvelope'
          description: Continuous recording registered
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/uploads:
    post:
      operationId: beginContinuousRecordingUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingUploadCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadGrant'
          description: Per-asset OSS multipart upload grants
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/uploads/{upload_id}:
    get:
      operationId: getContinuousRecordingUpload
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadEnvelope'
          description: Multi-object recording upload state
      security:
      - bearerAuth: []
  ? /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/uploads/{upload_id}/assets/{asset_id}:authorize-parts
  : post:
      operationId: authorizeContinuousRecordingAssetParts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRecordingAssetPartsCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingAssetPartGrant'
          description: Renewed OSS multipart grants
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/uploads/{upload_id}/assets/{asset_id}:complete:
    post:
      operationId: completeContinuousRecordingAsset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRecordingAssetCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadEnvelope'
          description: Asset completed and verified by size, CRC64, and SHA-256
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/uploads/{upload_id}:commit:
    post:
      operationId: commitContinuousRecordingUpload
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuousRecordingEnvelope'
          description: Multi-object recording committed for slicing
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}:
    get:
      operationId: getContinuousRecording
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuousRecordingEnvelope'
          description: Continuous recording and current slice revision
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/episodes:
    get:
      operationId: listContinuousRecordingEpisodes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeProcessingPage'
          description: Finalized Episodes and QC/alignment state
      security:
      - bearerAuth: []
  ? /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/episodes/{episode_id}/video-sources
  : get:
      operationId: authorizeContinuousRecordingEpisodeVideos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeVideoSourceEnvelope'
          description: Signed original-video URLs plus Episode time windows
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/episodes/{episode_id}:discard:
    post:
      operationId: discardContinuousRecordingEpisode
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: recording_id
        required: true
        schema:
          title: Recording Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryEpisodeCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeProcessing'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
      security:
      - bearerAuth: []
      summary: Discard Continuous Recording Episode
      tags:
      - continuous-recordings
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/episodes/{episode_id}:retry:
    post:
      operationId: retryContinuousRecordingEpisode
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: recording_id
        required: true
        schema:
          title: Recording Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryEpisodeCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeProcessing'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The continuous-recording request could not be completed.
      security:
      - bearerAuth: []
      summary: Retry Continuous Recording Episode
      tags:
      - continuous-recordings
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/sensor-window:
    get:
      operationId: readContinuousRecordingSensorWindow
      parameters:
      - in: query
        name: topic
        required: false
        schema:
          maxLength: 512
          minLength: 1
          type:
          - string
          - 'null'
      - in: query
        name: start_offset_ns
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/NanosecondsDecimal'
          default: '0'
      - in: query
        name: end_offset_ns
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/NanosecondsDecimal'
          default: '4000000000'
      - in: query
        name: maximum_samples
        required: false
        schema:
          default: 5000
          maximum: 10000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSensorWindow'
          description: Decoded original SENSOR_DATA samples on the recording clock
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/slice-draft:
    put:
      operationId: saveContinuousRecordingSliceDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSliceDraftCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceRevisionEnvelope'
          description: New immutable slice draft revision
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/slice-draft:finalize:
    post:
      operationId: finalizeContinuousRecordingSlices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeSliceCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceRevisionEnvelope'
          description: Finalized virtual Episodes
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/slice-proposals:
    post:
      operationId: proposeContinuousRecordingSlices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeModelSlicesCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SliceRevisionEnvelope'
          description: Versioned model proposal awaiting human review
      security:
      - bearerAuth: []
  /api/v1/projects/{project_id}/regions/{region_code}/continuous-recordings/{recording_id}/video-sources:
    get:
      operationId: authorizeContinuousRecordingVideos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingVideoSourceEnvelope'
          description: Signed original-video URLs for the manual slice editor
      security:
      - bearerAuth: []
