      required:
      - oss_account_alias
      - bucket_alias
      - prefix_hint
      - role_ref
      - source_region_code
      title: DataSourceOssImportConfiguration
      type: object
    DataSourcePage:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        component_errors:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceComponentError'
          title: Component Errors
          type: array
        contract_version:
          default: ingest.v1alpha1
          title: Contract Version
          type: string
        facets:
          $ref: '#/components/schemas/DataSourceFacets'
        items:
          items:
            $ref: '#/components/schemas/DataSourceSummary'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSourceScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
        summary:
          $ref: '#/components/schemas/DataSourceMetrics'
      required:
      - summary
      - facets
      - items
      - page_info
      - snapshot_at
      - scope
      - request_id
      title: DataSourcePage
      type: object
    DataSourceResourceReference:
      additionalProperties: false
      properties:
        resource_id:
          maxLength: 256
          minLength: 1
          title: Resource Id
          type: string
        resource_type:
          const: DATA_SOURCE
          default: DATA_SOURCE
          title: Resource Type
          type: string
      required:
      - resource_id
      title: DataSourceResourceReference
      type: object
    DataSourceRobotBinding:
      additionalProperties: false
      properties:
        display_name:
          anyOf:
          - maxLength: 200
