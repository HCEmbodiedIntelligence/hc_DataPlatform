components:
  schemas:
    BasicCredentialInput:
      additionalProperties: false
      properties:
        kind:
          const: BASIC
          default: BASIC
          title: Kind
          type: string
        password:
          format: password
          maxLength: 16384
          minLength: 1
          title: Password
          type: string
          writeOnly: true
        username:
          maxLength: 256
          minLength: 1
          title: Username
          type: string
      required:
      - username
      - password
      title: BasicCredentialInput
      type: object
    ConnectionTestJobEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: ingest.v1alpha1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSourceConnectionTestJob'
        job:
          $ref: '#/components/schemas/DataSourceAsyncJob'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSourceScope'
      required:
      - data
      - job
      - scope
      - request_id
      title: ConnectionTestJobEnvelope
      type: object
    CreateDataSourceCommand:
      additionalProperties: false
      properties:
        binding:
          discriminator:
            mapping:
              EDGE_AGENT: '#/components/schemas/WritableEdgeAgentBinding'
              OSS_IMPORT: '#/components/schemas/WritableOssImportBinding'
              ROBOT: '#/components/schemas/WritableRobotBinding'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/WritableRobotBinding'
          - $ref: '#/components/schemas/WritableEdgeAgentBinding'
          - $ref: '#/components/schemas/WritableOssImportBinding'
          title: Binding
        configuration:
          discriminator:
            mapping:
              EDGE_AGENT: '#/components/schemas/WritableEdgeAgentConfiguration'
              OSS_IMPORT: '#/components/schemas/WritableOssImportConfiguration'
              ROBOT: '#/components/schemas/WritableRobotConfiguration'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/WritableRobotConfiguration'
          - $ref: '#/components/schemas/WritableEdgeAgentConfiguration'
          - $ref: '#/components/schemas/WritableOssImportConfiguration'
          title: Configuration
        credential_input:
          anyOf:
          - discriminator:
              mapping:
                BASIC: '#/components/schemas/BasicCredentialInput'
                DEVICE_CERTIFICATE: '#/components/schemas/DeviceCertificateCredentialInput'
                TOKEN: '#/components/schemas/TokenCredentialInput'
              propertyName: kind
            oneOf:
            - $ref: '#/components/schemas/TokenCredentialInput'
            - $ref: '#/components/schemas/BasicCredentialInput'
            - $ref: '#/components/schemas/DeviceCertificateCredentialInput'
          - type: 'null'
          title: Credential Input
        name:
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        source_format:
          maxLength: 128
          minLength: 1
          title: Source Format
          type: string
        source_format_version:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Source Format Version
        source_type:
          enum:
          - ROBOT
          - EDGE_AGENT
          - OSS_IMPORT
          title: Source Type
          type: string
        upload_policy_code:
          maxLength: 128
          minLength: 1
          title: Upload Policy Code
          type: string
      required:
      - name
      - source_type
      - source_format
      - binding
      - configuration
      - upload_policy_code
      title: CreateDataSourceCommand
      type: object
    CredentialSummary:
      additionalProperties: false
      properties:
        credential_ref:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Credential Ref
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        kind:
          maxLength: 64
          minLength: 1
          title: Kind
          type: string
        masked_hint:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Masked Hint
        rotation_due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Rotation Due At
        state:
          enum:
          - NOT_REQUIRED
          - MISSING
          - CONFIGURED
          - ROTATION_DUE
          - EXPIRED
          - REVOKED
          - INVALID
          title: State
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version:
          pattern: ^(0|[1-9]\d*)$
          title: Version
          type: string
      required:
      - kind
      - state
      - version
      title: CredentialSummary
      type: object
    DataSourceBlockedReason:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 512
          minLength: 1
          title: Message
          type: string
      required:
      - code
      - message
      title: DataSourceBlockedReason
      type: object
    DataSourceComponentError:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        component:
          maxLength: 128
          minLength: 1
          title: Component
          type: string
        message:
          maxLength: 512
          minLength: 1
          title: Message
          type: string
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
      required:
      - component
      - code
      - message
      - request_id
      title: DataSourceComponentError
      type: object
    DataSourceConnectionTestJob:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        id:
          maxLength: 256
          minLength: 1
          title: Id
          type: string
        observed_versions:
          $ref: '#/components/schemas/DataSourceObservedVersions'
        progress:
          $ref: '#/components/schemas/DataSourceJobProgress'
        resource_ref:
          $ref: '#/components/schemas/DataSourceResourceReference'
        result_ref:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Result Ref
        safe_error:
          anyOf:
          - $ref: '#/components/schemas/DataSourceJobError'
          - type: 'null'
        stage:
          maxLength: 128
          minLength: 1
          title: Stage
          type: string
        status:
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          title: Status
          type: string
        type:
          const: DATA_SOURCE_CONNECTION_TEST
          default: DATA_SOURCE_CONNECTION_TEST
          title: Type
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - status
      - stage
      - progress
      - resource_ref
      - observed_versions
      - etag
      - created_at
      - updated_at
      title: DataSourceConnectionTestJob
      type: object
    DataSourceDetail:
      additionalProperties: false
      properties:
        adapter_version:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Adapter Version
        administrative_state:
          enum:
          - ENABLED
          - DISABLED
          title: Administrative State
          type: string
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        binding:
          discriminator:
            mapping:
              EDGE_AGENT: '#/components/schemas/DataSourceEdgeAgentBinding'
              OSS_IMPORT: '#/components/schemas/DataSourceOssImportBinding'
              ROBOT: '#/components/schemas/DataSourceRobotBinding'
              UNKNOWN: '#/components/schemas/DataSourceUnknownBinding'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/DataSourceRobotBinding'
          - $ref: '#/components/schemas/DataSourceEdgeAgentBinding'
          - $ref: '#/components/schemas/DataSourceOssImportBinding'
          - $ref: '#/components/schemas/DataSourceUnknownBinding'
          title: Binding
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceBlockedReason'
          title: Blocked Reasons
          type: array
        config_version:
          pattern: ^(0|[1-9]\d*)$
          title: Config Version
          type: string
        configuration:
          discriminator:
            mapping:
              EDGE_AGENT: '#/components/schemas/DataSourceEdgeAgentConfiguration'
              OSS_IMPORT: '#/components/schemas/DataSourceOssImportConfiguration'
              ROBOT: '#/components/schemas/DataSourceRobotConfiguration'
              UNKNOWN: '#/components/schemas/DataSourceUnknownConfiguration'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/DataSourceRobotConfiguration'
          - $ref: '#/components/schemas/DataSourceEdgeAgentConfiguration'
          - $ref: '#/components/schemas/DataSourceOssImportConfiguration'
          - $ref: '#/components/schemas/DataSourceUnknownConfiguration'
          title: Configuration
        connectivity:
          $ref: '#/components/schemas/ConnectivitySummary'
        created_at:
          format: date-time
          title: Created At
          type: string
        credential:
          $ref: '#/components/schemas/CredentialSummary'
        credential_version:
          pattern: ^(0|[1-9]\d*)$
          title: Credential Version
          type: string
        etag:
          maxLength: 256
          minLength: 1
          title: Etag
          type: string
        heartbeat:
          anyOf:
          - $ref: '#/components/schemas/HeartbeatSummary'
          - type: 'null'
        id:
          maxLength: 256
          minLength: 1
          title: Id
          type: string
        last_upload:
          anyOf:
          - $ref: '#/components/schemas/LastUploadSummary'
          - type: 'null'
        name:
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        scope:
          $ref: '#/components/schemas/DataSourceScope'
        source_format:
          maxLength: 128
          minLength: 1
          title: Source Format
          type: string
        source_format_version:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Source Format Version
        source_type:
          maxLength: 128
          minLength: 1
          title: Source Type
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        upload_policy:
          $ref: '#/components/schemas/UploadPolicySummary'
      required:
      - id
      - scope
      - name
      - source_type
      - source_format
      - binding
      - administrative_state
      - credential
      - connectivity
      - upload_policy
      - config_version
      - credential_version
      - etag
      - created_at
      - updated_at
      - configuration
      title: DataSourceDetail
      type: object
    DataSourceEdgeAgentBinding:
      additionalProperties: false
      properties:
        agent_id:
          maxLength: 256
          minLength: 1
          title: Agent Id
          type: string
        display_name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Display Name
        kind:
          const: EDGE_AGENT
          default: EDGE_AGENT
          title: Kind
          type: string
      required:
      - agent_id
      title: DataSourceEdgeAgentBinding
      type: object
    DataSourceEdgeAgentConfiguration:
      additionalProperties: false
      properties:
        agent_id:
          maxLength: 256
          minLength: 1
          title: Agent Id
          type: string
        heartbeat_policy_id:
          maxLength: 256
          minLength: 1
          title: Heartbeat Policy Id
          type: string
        kind:
          const: EDGE_AGENT
          default: EDGE_AGENT
          title: Kind
          type: string
        transport:
          enum:
          - OUTBOUND_HTTPS
          - MQTTS
          title: Transport
          type: string
      required:
      - agent_id
      - transport
      - heartbeat_policy_id
      title: DataSourceEdgeAgentConfiguration
      type: object
    DataSourceEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          default: ingest.v1alpha1
          title: Contract Version
          type: string
        data:
          $ref: '#/components/schemas/DataSourceDetail'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DataSourceScope'
      required:
      - data
      - scope
      - request_id
      title: DataSourceEnvelope
      type: object
    DataSourceFacet:
      additionalProperties: false
      properties:
        count:
          pattern: ^(0|[1-9]\d*)$
          title: Count
          type: string
        label:
          maxLength: 200
          minLength: 1
          title: Label
          type: string
        value:
          maxLength: 128
          minLength: 1
          title: Value
          type: string
      required:
      - value
      - label
      - count
      title: DataSourceFacet
      type: object
    DataSourceFacets:
      additionalProperties: false
      properties:
        administrative_states:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Administrative States
          type: array
        connectivity_states:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Connectivity States
          type: array
        credential_states:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Credential States
          type: array
        heartbeat_states:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Heartbeat States
          type: array
        robots:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceRobotFacet'
          title: Robots
          type: array
        source_formats:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Source Formats
          type: array
        source_types:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Source Types
          type: array
        upload_policies:
          default: []
          items:
            $ref: '#/components/schemas/DataSourceFacet'
          title: Upload Policies
          type: array
      title: DataSourceFacets
      type: object
    DataSourceJobError:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 512
          minLength: 1
          title: Message
          type: string
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        retryable:
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - retryable
      - request_id
      title: DataSourceJobError
      type: object
    DataSourceJobProgress:
      additionalProperties: false
      properties:
        completed:
          pattern: ^(0|[1-9]\d*)$
          title: Completed
          type: string
        total:
          anyOf:
          - pattern: ^(0|[1-9]\d*)$
            type: string
          - type: 'null'
          title: Total
        unit:
          maxLength: 64
          minLength: 1
          title: Unit
          type: string
      required:
      - completed
      - total
      - unit
      title: DataSourceJobProgress
      type: object
    DataSourceMetrics:
      additionalProperties: false
      properties:
        abnormal_count:
          pattern: ^(0|[1-9]\d*)$
          title: Abnormal Count
          type: string
        as_of:
          format: date-time
          title: As Of
          type: string
        definition_version:
          default: p02-data-source-page/v1
          title: Definition Version
          type: string
        online_count:
          pattern: ^(0|[1-9]\d*)$
          title: Online Count
          type: string
        timezone:
          default: UTC
          title: Timezone
          type: string
        total_count:
          pattern: ^(0|[1-9]\d*)$
          title: Total Count
          type: string
        verified_bytes_today:
          pattern: ^(0|[1-9]\d*)$
          title: Verified Bytes Today
          type: string
      required:
      - total_count
      - online_count
      - verified_bytes_today
      - abnormal_count
      - as_of
      title: DataSourceMetrics
      type: object
    DataSourceObservedVersions:
      additionalProperties: false
      properties:
        config_version:
          pattern: ^(0|[1-9]\d*)$
          title: Config Version
          type: string
        credential_version:
          pattern: ^(0|[1-9]\d*)$
          title: Credential Version
          type: string
      required:
      - config_version
      - credential_version
      title: DataSourceObservedVersions
      type: object
    DataSourceOssImportBinding:
      additionalProperties: false
