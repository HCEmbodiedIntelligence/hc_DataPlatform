          minLength: 1
          title: Organization Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          title: Project Id
          type: string
        region_code:
          maxLength: 64
          minLength: 1
          title: Region Code
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      title: DataSourceScope
      type: object
    DataSourceSummary:
      additionalProperties: false
      properties:
        adapter_version:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
