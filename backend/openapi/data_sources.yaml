      title: DataSourceRobotConfiguration
      type: object
    DataSourceRobotFacet:
      additionalProperties: false
      properties:
        count:
          pattern: ^(0|[1-9]\d*)$
          title: Count
          type: string
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - id
      - name
      - count
      title: DataSourceRobotFacet
      type: object
    DataSourceSafeError:
      additionalProperties: false
