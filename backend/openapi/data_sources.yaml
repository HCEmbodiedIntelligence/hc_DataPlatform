        display_name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Display Name
        kind:
          const: OSS_IMPORT
          default: OSS_IMPORT
          title: Kind
          type: string
        source_alias:
          maxLength: 200
          minLength: 1
          title: Source Alias
          type: string
      required:
      - source_alias
      title: DataSourceOssImportBinding
      type: object
    DataSourceOssImportConfiguration:
      additionalProperties: false
