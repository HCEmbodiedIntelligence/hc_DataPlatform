          - type: 'null'
          title: Source Format Version
        source_type:
          maxLength: 128
          minLength: 1
          title: Source Type
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        upload_policy:
          $ref: '#/components/schemas/UploadPolicySummary'
