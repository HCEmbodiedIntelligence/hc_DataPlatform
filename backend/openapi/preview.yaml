paths:
  /api/v1/previews/sessions:
    post:
      operationId: createPreviewSession
      tags: [preview]
      parameters:
        - {in: header, name: X-Organization-Id, required: true, schema: {type: string, minLength: 1}}
        - {in: header, name: X-Region-Code, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewRequestV1'}
      responses:
        "201":
          description: Durable preview is READY; no encoding runs in the API process
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewDescriptorV1'}
        "202":
          description: A single durable generation job is queued or running
          headers:
            Retry-After: {schema: {type: integer, minimum: 1, maximum: 60}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewPendingDescriptorV1'}
  /api/v1/previews/jobs/{job_id}:
    get:
      operationId: getPreviewJob
      tags: [preview]
      parameters:
        - {in: header, name: X-Organization-Id, required: true, schema: {type: string, minLength: 1}}
        - {in: header, name: X-Region-Code, required: true, schema: {type: string, minLength: 1}}
        - {in: path, name: job_id, required: true, schema: {type: string, minLength: 1}}
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200":
          description: Durable media job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewJobDescriptorV1'}
  /api/v1/previews/sessions/{session_id}:
    get:
      operationId: getPreviewSession
      tags: [preview]
      parameters:
        - {in: header, name: X-Organization-Id, required: true, schema: {type: string, minLength: 1}}
        - {in: header, name: X-Region-Code, required: true, schema: {type: string, minLength: 1}}
        - {in: path, name: session_id, required: true, schema: {type: string, minLength: 1}}
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200":
          description: READY descriptor with a refreshed short-lived playlist capability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewDescriptorV1'}
  /api/v1/previews/sessions/{session_id}/media/index.m3u8:
    get:
      operationId: getPreviewPlaylist
      tags: [preview]
      security: []
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string, minLength: 1}}
        - {in: query, name: expires, required: true, schema: {type: integer, minimum: 1}}
        - {in: query, name: sig, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {in: query, name: organization_id, required: true, schema: {type: string, minLength: 1}}
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1}}
        - {in: query, name: region_code, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200":
          description: Small playlist with individually presigned direct object-store members
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/vnd.apple.mpegurl: {schema: {type: string}}
        "403": {description: Invalid or expired media capability}
        "404": {description: Preview session not found}
components:
  schemas:
    EncodingProfileV1:
      type: object
      description: Server-selected immutable profile; never accepted as request input.
      required: [name, width, height, video_codec, pixel_format, video_bitrate_kbps, segment_duration_seconds, preset]
      properties:
        name: {type: string}
        width: {type: integer, minimum: 16, maximum: 4096}
        height: {type: integer, minimum: 16, maximum: 2160}
        video_codec: {type: string, const: h264}
        pixel_format: {type: string, const: yuv420p}
        video_bitrate_kbps: {type: integer, minimum: 64, maximum: 50000}
        segment_duration_seconds: {type: number, minimum: 0.25, maximum: 10}
        preset: {type: string}
    PreviewRequestV1:
      type: object
      required: [project_id, dataset_id, rollout_id, lance_version, camera_id]
      properties:
        project_id: {type: string, minLength: 1}
        dataset_id: {type: string, minLength: 1}
        rollout_id: {type: string, minLength: 1}
        lance_version: {type: string, minLength: 1}
        annotation_revision: {type: integer, minimum: 0, default: 0}
        camera_id: {type: string, minLength: 1}
        view_mode: {type: string, enum: [original, edited, compare], default: original}
        profile_id: {type: string, default: annotation-h264-720p-v1, pattern: '^[a-z0-9][a-z0-9-]*$'}
        frequency_hz: {type: number, exclusiveMinimum: 0, maximum: 240, default: 30}
        start_step: {type: [integer, "null"], minimum: 0}
        end_step: {type: [integer, "null"], minimum: 1}
    TimelineSegmentV1:
      type: object
      required: [playback_start_seconds, playback_end_seconds, source_start_step, source_end_step, excluded]
      properties:
        playback_start_seconds: {type: number, minimum: 0}
        playback_end_seconds: {type: number, exclusiveMinimum: 0}
        source_start_step: {type: integer, minimum: 0}
        source_end_step: {type: integer, minimum: 1}
        excluded: {type: boolean}
    TimelineMappingV1:
      type: object
      required: [frequency_hz, segments]
      properties:
        frequency_hz: {type: number, exclusiveMinimum: 0}
        segments: {type: array, items: {$ref: '#/components/schemas/TimelineSegmentV1'}}
    PreviewDescriptorV1:
      type: object
      required: [schema_version, session_id, artifact_key, project_id, dataset_id, rollout_id, lance_version, annotation_revision, camera_id, view_mode, profile_id, encoding_profile, playlist_url, media_type, frame_count, placeholder_count, placeholders, duration_seconds, timeline, artifact_expires_at, signed_url_expires_at]
      properties:
        schema_version: {type: integer, const: 1}
        session_id: {type: string}
        artifact_key: {type: string, pattern: '^[0-9a-f]{64}$'}
        project_id: {type: string}
        dataset_id: {type: string}
        rollout_id: {type: string}
        lance_version: {type: string}
        annotation_revision: {type: integer}
        camera_id: {type: string}
        view_mode: {type: string, enum: [original, edited, compare]}
        profile_id: {type: string}
        encoding_profile: {$ref: '#/components/schemas/EncodingProfileV1'}
        playlist_url: {type: string}
        media_type: {type: string}
        frame_count: {type: integer, minimum: 0}
        placeholder_count: {type: integer, minimum: 0}
        placeholders: {type: array, items: {$ref: '#/components/schemas/PlaceholderDescriptorV1'}}
        duration_seconds: {type: number, minimum: 0}
        timeline: {$ref: '#/components/schemas/TimelineMappingV1'}
        artifact_expires_at: {type: string, format: date-time}
        signed_url_expires_at: {type: string, format: date-time}
    PreviewPendingDescriptorV1:
      type: object
      required: [schema_version, status, artifact_key, job_id, status_url, retry_after_seconds]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, enum: [QUEUED, RUNNING, FAILED]}
        artifact_key: {type: string, pattern: '^[0-9a-f]{64}$'}
        job_id: {type: string}
        status_url: {type: string}
        retry_after_seconds: {type: integer, minimum: 1, maximum: 60}
        error_code: {type: [string, "null"]}
    PreviewJobDescriptorV1:
      type: object
      required: [schema_version, job_id, artifact_key, status, progress, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        job_id: {type: string}
        artifact_key: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        progress: {type: integer, minimum: 0, maximum: 100}
        retry_after_seconds: {type: [integer, "null"], minimum: 1, maximum: 60}
        error_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    PlaceholderDescriptorV1:
      type: object
      required: [code, invalid_reason, playback_frame, step_index]
      properties:
        code: {type: string, const: INVALID_IMAGE_STEP}
        invalid_reason: {type: string, minLength: 1}
        playback_frame: {type: integer, minimum: 0}
        step_index: {type: integer, minimum: 0}
