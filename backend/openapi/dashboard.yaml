components:
  headers:
    DashboardNoStore:
      required: true
      schema:
        const: no-store
        type: string
  parameters:
    DashboardCursor:
      description: HMAC-protected cursor bound to principal, project, region, range, timezone, endpoint,
        and the endpoint's complete stable source tuple. Cross-scope cursor reuse is rejected.
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 16384
        minLength: 1
        type: string
    DashboardFrom:
      description: Inclusive RFC 3339 instant with an explicit UTC offset.
      in: query
      name: from
      required: true
      schema:
        format: date-time
        type: string
    DashboardLimit:
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    DashboardProjectId:
      in: path
      name: project_id
      required: true
      schema:
        $ref: '#/components/schemas/DashboardIdentifier'
    DashboardRegionCode:
      description: Exact authorized region. Administrators are not aggregated across regions.
      in: query
      name: region_code
      required: true
      schema:
        $ref: '#/components/schemas/DashboardIdentifier'
    DashboardTaskId:
      description: Optional collection task drill-down; omitted requests aggregate all tasks in the scope.
      in: query
      name: task_id
      required: false
      schema:
        $ref: '#/components/schemas/DashboardIdentifier'
    DashboardTimezone:
      description: Explicit project IANA timezone. The UI defaults to 24 hours and may request 7 or 30
        days; the service never reads a browser-local timezone.
      in: query
      name: timezone
      required: true
      schema:
        maxLength: 64
        minLength: 1
        pattern: ^[A-Za-z0-9._+-]+(?:/[A-Za-z0-9._+-]+)*$
        type: string
    DashboardTo:
      description: Exclusive RFC 3339 instant with an explicit UTC offset.
      in: query
      name: to
      required: true
      schema:
        format: date-time
        type: string
  responses:
    DashboardForbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Exact project/region scope and dashboard.read capability are required.
    DashboardInvalidCursor:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Cursor is malformed or belongs to another principal or exact query scope.
    DashboardInvalidQuery:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Validation failed, timestamps lack offsets, timezone is invalid, from is not before
        to, or the configured synchronous technical query budget was exceeded.
    DashboardRateLimited:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The deployment query-admission policy rejected this request.
    DashboardTaskNotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The requested task is not associated with this exact project-region scope.
    DashboardUnauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: A verified Bearer identity is required.
  schemas:
    DashboardActivityEvent:
      additionalProperties: false
      properties:
        deduplication_key:
          maxLength: 512
          minLength: 1
          type: string
        event_id:
          maxLength: 512
          minLength: 1
          type: string
        event_type:
          $ref: '#/components/schemas/DashboardActivityEventType'
        occurred_at:
          format: date-time
          type: string
        source_id:
          maxLength: 512
          minLength: 1
          type: string
        source_state:
          maxLength: 64
          minLength: 1
          type: string
        summary:
          maxLength: 256
          minLength: 1
          type: string
        target:
          $ref: '#/components/schemas/DashboardTargetResource'
        title:
          maxLength: 128
          minLength: 1
          type: string
      required:
      - event_id
      - event_type
      - source_id
      - deduplication_key
      - occurred_at
      - source_state
      - title
      - summary
      - target
      type: object
    DashboardActivityEventType:
      enum:
      - UPLOAD_COMMITTED
      - QC_COMPLETED
      - TAG_REVIEW_DECIDED
      - DATASET_PUBLISHED
      type: string
    DashboardActivityPage:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type:
          - string
          - 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/DashboardSectionError'
          - type: 'null'
        items:
          items:
            $ref: '#/components/schemas/DashboardActivityEvent'
          type: array
        page_info:
          oneOf:
          - $ref: '#/components/schemas/PageInfo'
          - type: 'null'
        status:
          $ref: '#/components/schemas/DashboardSectionStatus'
      required:
      - status
      - as_of
      - error
      - page_info
      - items
      type: object
    DashboardActivityResponse:
      additionalProperties: false
      properties:
        activity:
          $ref: '#/components/schemas/DashboardActivityPage'
        as_of:
          format: date-time
          type: string
        from:
          format: date-time
          type: string
        project_id:
          $ref: '#/components/schemas/DashboardIdentifier'
        region_code:
          $ref: '#/components/schemas/DashboardIdentifier'
        schema_version:
          const: '1'
          type: string
        timezone:
          maxLength: 64
          minLength: 1
          type: string
        to:
          format: date-time
          type: string
      required:
      - schema_version
      - project_id
      - region_code
      - from
      - to
      - timezone
      - as_of
      - activity
      type: object
    DashboardCoverageResponse:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type: string
        coverage:
          $ref: '#/components/schemas/DashboardSectionState'
        from:
          format: date-time
          type: string
        project_id:
          $ref: '#/components/schemas/DashboardIdentifier'
        region_code:
          $ref: '#/components/schemas/DashboardIdentifier'
        schema_version:
          const: '1'
          type: string
        timezone:
          maxLength: 64
          minLength: 1
          type: string
        to:
          format: date-time
          type: string
      required:
      - schema_version
      - project_id
      - region_code
      - from
      - to
      - timezone
      - as_of
      - coverage
      type: object
    DashboardIdentifier:
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9._-]+$
      type: string
    DashboardPendingItem:
      additionalProperties: false
      properties:
        deduplication_key:
          maxLength: 512
          minLength: 1
          type: string
        item_type:
          $ref: '#/components/schemas/DashboardPendingItemType'
        opened_at:
          format: date-time
          type: string
        severity:
          $ref: '#/components/schemas/DashboardPendingSeverity'
        source_id:
          maxLength: 512
          minLength: 1
          type: string
        source_state:
          maxLength: 64
          minLength: 1
          type: string
        target:
          $ref: '#/components/schemas/DashboardTargetResource'
      required:
      - item_type
      - source_id
      - deduplication_key
      - source_state
      - severity
      - opened_at
      - target
      type: object
    DashboardPendingItemType:
      enum:
      - UPLOAD_FAILED
      - QC_ANOMALY
      - TAG_REVIEW_PENDING
      - PUBLICATION_PENDING
      type: string
    DashboardPendingItemsPage:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type:
          - string
          - 'null'
        authorized_source_types:
          items:
            $ref: '#/components/schemas/DashboardPendingItemType'
          type: array
          uniqueItems: true
        error:
          oneOf:
          - $ref: '#/components/schemas/DashboardSectionError'
          - type: 'null'
        items:
          items:
            $ref: '#/components/schemas/DashboardPendingItem'
          type: array
        page_info:
          oneOf:
          - $ref: '#/components/schemas/PageInfo'
          - type: 'null'
        status:
          $ref: '#/components/schemas/DashboardSectionStatus'
      required:
      - status
      - as_of
      - error
      - page_info
      - authorized_source_types
      - items
      type: object
    DashboardPendingItemsResponse:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type: string
        from:
          format: date-time
          type: string
        pending_items:
          $ref: '#/components/schemas/DashboardPendingItemsPage'
        project_id:
          $ref: '#/components/schemas/DashboardIdentifier'
        region_code:
          $ref: '#/components/schemas/DashboardIdentifier'
        schema_version:
          const: '1'
          type: string
        timezone:
          maxLength: 64
          minLength: 1
          type: string
        to:
          format: date-time
          type: string
      required:
      - schema_version
      - project_id
      - region_code
      - from
      - to
      - timezone
      - as_of
      - pending_items
      type: object
    DashboardPendingSeverity:
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      type: string
    DashboardResourceType:
      enum:
      - UPLOAD_SESSION
      - ROLLOUT
      - ANNOTATION_TASK
      - DATASET_VERSION
      type: string
    DashboardSectionError:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          type: string
        message:
          maxLength: 500
          minLength: 1
          type: string
        needs_product_confirmation:
          default: false
          type: boolean
        retryable:
          default: false
          type: boolean
      required:
      - code
      - message
      - retryable
      - needs_product_confirmation
      type: object
    DashboardSectionState:
      additionalProperties: false
      description: BLOCKED is not numeric zero. PARTIAL may include only explicitly identified factual
        data.
      properties:
        as_of:
          format: date-time
          type:
          - string
          - 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/DashboardSectionError'
          - type: 'null'
        status:
          $ref: '#/components/schemas/DashboardSectionStatus'
      required:
      - status
      - as_of
      - error
      type: object
    DashboardSectionStatus:
      enum:
      - READY
      - EMPTY
      - PARTIAL
      - STALE
      - ERROR
      - BLOCKED
      type: string
    DashboardTargetResource:
      additionalProperties: false
      properties:
        deep_link:
          description: Relative link from a fixed upload, annotation, or dataset template.
          maxLength: 1024
          minLength: 1
          type:
          - string
          - 'null'
        resource_id:
          maxLength: 512
          minLength: 1
          type: string
        resource_type:
          $ref: '#/components/schemas/DashboardResourceType'
        resource_version:
          maxLength: 512
          minLength: 1
          type:
          - string
          - 'null'
      required:
      - resource_type
      - resource_id
      - resource_version
      - deep_link
      type: object
    DashboardTaskStatusResponse:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type: string
        pipeline:
          $ref: '#/components/schemas/TaskPipelineStatus'
        project_id:
          $ref: '#/components/schemas/DashboardIdentifier'
        region_code:
          $ref: '#/components/schemas/DashboardIdentifier'
        schema_version:
          const: '1'
          default: '1'
          type: string
        section:
          $ref: '#/components/schemas/DashboardSectionState'
        selected:
          oneOf:
          - $ref: '#/components/schemas/SelectedTaskStatus'
          - type: 'null'
        selected_task_id:
          oneOf:
          - $ref: '#/components/schemas/DashboardIdentifier'
          - type: 'null'
        tasks:
          items:
            $ref: '#/components/schemas/TaskStatusListItem'
          type: array
      required:
      - schema_version
      - project_id
      - region_code
      - as_of
      - section
      - tasks
      - pipeline
      - selected_task_id
      - selected
      type: object
    SelectedTaskStatus:
      additionalProperties: false
      properties:
        actions:
          items:
            $ref: '#/components/schemas/TaskStatusAction'
          type: array
        attainment:
          $ref: '#/components/schemas/TaskAttainment'
        blocker_count:
          minimum: 0
          type: integer
        blockers:
          items:
            $ref: '#/components/schemas/TaskStatusBlocker'
          type: array
        current_stage:
          $ref: '#/components/schemas/TaskProcessingStage'
        current_stage_label:
          maxLength: 128
          minLength: 1
          type: string
        main_state_counts:
          additionalProperties:
            minimum: 0
            type: integer
          type: object
        next_step:
          maxLength: 300
          minLength: 1
          type: string
        qc:
          $ref: '#/components/schemas/TaskQcCounts'
        stages:
          items:
            $ref: '#/components/schemas/TaskStageCounts'
          maxItems: 8
          minItems: 8
          type: array
        standardization:
          $ref: '#/components/schemas/TaskStandardizationCounts'
        task:
          $ref: '#/components/schemas/TaskStatusListItem'
        unavailable_sources:
          items:
            maxLength: 128
            minLength: 1
            type: string
          type: array
      required:
      - task
      - attainment
      - current_stage
      - current_stage_label
      - next_step
      - qc
      - standardization
      - stages
      - main_state_counts
      - blocker_count
      - blockers
      - actions
      - unavailable_sources
      type: object
    TaskAttainment:
      enum:
      - NOT_CONFIGURED
      - IN_PROGRESS
      - ATTAINED
      - EXCEEDED
      - UNKNOWN
      type: string
    TaskDataIssue:
      properties:
        alignment_attempt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Alignment Attempt Id
        category:
          enum:
          - DUPLICATE
          - QUALITY
          - TECHNICAL
          - PROCESSING_CONFLICT
          - RESUME_REQUIRED
          title: Category
          type: string
        data_package_id:
          title: Data Package Id
          type: string
        description:
          title: Description
          type: string
        duplicate_of_rollout_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Duplicate Of Rollout Id
        findings:
          default: []
          items:
            $ref: '#/components/schemas/TaskIssueFinding'
          title: Findings
          type: array
        label:
          title: Label
          type: string
        lance_ready:
          default: false
          title: Lance Ready
          type: boolean
        qc_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Qc Status
        reason_code:
          title: Reason Code
          type: string
        recording_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recording Id
        rollout_id:
          title: Rollout Id
          type: string
        source_episode_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Source Episode Index
        source_import_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Import Id
        stage:
          $ref: '#/components/schemas/TaskProcessingStage'
        task_id:
          title: Task Id
          type: string
      required:
      - task_id
      - rollout_id
      - data_package_id
      - category
      - stage
      - reason_code
      - label
      - description
      title: TaskDataIssue
      type: object
    TaskDeviceProgress:
      additionalProperties: false
      description: Counts only authenticated device-agent CAPTURED/SAVED facts. Upload registration, Raw
        object commit, and Manifest timestamps never populate these values.
      properties:
        captured_count:
          default: 0
          minimum: 0
          type: integer
        confirmed_duration_seconds:
          default: 0
          minimum: 0
          type: number
        saved_count:
          default: 0
          minimum: 0
          type: integer
        source:
          const: DEVICE_ATTESTED_FACT
          default: DEVICE_ATTESTED_FACT
          type: string
      required:
      - source
      - captured_count
      - saved_count
      - confirmed_duration_seconds
      type: object
    TaskIssueFinding:
      properties:
        code:
          title: Code
          type: string
        end_ns:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: End Ns
        message:
          title: Message
          type: string
        observed:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          default: null
          title: Observed
        severity:
          title: Severity
          type: string
        start_ns:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Start Ns
        threshold:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          default: null
          title: Threshold
        topic:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Topic
      required:
      - code
      - severity
      - message
      title: TaskIssueFinding
      type: object
    TaskLifecycle:
      description: Configuration lifecycle only; target attainment is reported separately.
      enum:
      - ACTIVE
      - CLOSED
      - CANCELLED
      type: string
    TaskPackageMainState:
      enum:
      - DISCARDED
      - DUPLICATE
      - REPROCESSING_CONFLICT
      - PROCESSING_RESUME_REQUIRED
      - REGISTERED
      - UPLOADING
      - UPLOAD_PAUSED
      - UPLOAD_FAILED
      - CANCELLED
      - RAW_COMMIT_PENDING
      - RAW_RECEIVED
      - VALIDATION_RUNNING
      - VALIDATION_FAILED
      - AWAITING_SLICE
      - QC_WAITING
      - QC_RISK
      - QC_REJECT
      - STANDARDIZATION_WAITING
      - ALIGNING
      - ALIGNMENT_FAILED
      - LANCE_WRITING
      - LANCE_FAILED
      - STANDARDIZED_READY
      - ANNOTATING
      - REVIEW_PENDING
      - PUBLISH_PENDING
      - PUBLISHED
      - UNKNOWN
      title: TaskPackageMainState
      type: string
    TaskPipelineStatus:
      additionalProperties: false
      description: Current package flow for all tasks when task_id is omitted, or for the selected task
        when task_id is present. Every package is classified exactly once in every stage. Packages that
        have not met a stage's prerequisites are not_started, never waiting. Review waiting requires a
        submitted annotation; publication waiting requires approval.
      properties:
        issues:
          default: []
          items:
            $ref: '#/components/schemas/TaskDataIssue'
          type: array
        package_count:
          minimum: 0
          type: integer
        qc:
          $ref: '#/components/schemas/TaskQcCounts'
        stages:
          items:
            $ref: '#/components/schemas/TaskStageCounts'
          maxItems: 8
          minItems: 8
          type: array
        task_count:
          minimum: 0
          type: integer
        unavailable_sources:
          items:
            maxLength: 128
            minLength: 1
            type: string
          type: array
      required:
      - task_count
      - package_count
      - qc
      - stages
      - unavailable_sources
      type: object
    TaskProcessingStage:
      enum:
      - TASK_EXECUTION
      - PACKAGE_UPLOAD
      - RAW_RECEIPT
      - AUTOMATIC_VALIDATION
      - STANDARDIZATION
      - ANNOTATION
      - REVIEW
      - PUBLICATION
      type: string
    TaskQcCounts:
      additionalProperties: false
      properties:
        awaiting_slice:
          default: 0
          description: Recordings awaiting slice submission; new recordings pass quality checks first.
          minimum: 0
          type: integer
        discarded:
          default: 0
          minimum: 0
          type: integer
        duplicate:
          default: 0
          minimum: 0
          type: integer
        passed:
          minimum: 0
          type: integer
        rejected:
          minimum: 0
          type: integer
        reprocessing_conflicts:
          default: 0
          minimum: 0
          type: integer
        risk:
          minimum: 0
          type: integer
        unavailable:
          default: 0
          minimum: 0
          type: integer
        waiting:
          minimum: 0
          type: integer
      required:
      - waiting
      - passed
      - risk
      - rejected
      - unavailable
      type: object
    TaskStageCounts:
      additionalProperties: false
      properties:
        blocked:
          default: 0
          minimum: 0.0
          title: Blocked
          type: integer
        cancelled:
          default: 0
          minimum: 0.0
          title: Cancelled
          type: integer
        failed:
          default: 0
          minimum: 0.0
          title: Failed
          type: integer
        isolated:
          default: 0
          minimum: 0.0
          title: Isolated
          type: integer
        not_started:
          default: 0
          description: Packages whose prerequisites for this stage are not met.
          minimum: 0.0
          title: Not Started
          type: integer
        risk:
          default: 0
          minimum: 0.0
          title: Risk
          type: integer
        running:
          default: 0
          minimum: 0.0
          title: Running
          type: integer
        stage:
          $ref: '#/components/schemas/TaskProcessingStage'
        succeeded:
          default: 0
          minimum: 0.0
          title: Succeeded
          type: integer
        unavailable:
          default: 0
          minimum: 0.0
          title: Unavailable
          type: integer
        waiting:
          default: 0
          minimum: 0.0
          title: Waiting
          type: integer
      required:
      - stage
      title: TaskStageCounts
      type: object
    TaskStandardizationCounts:
      additionalProperties: false
      properties:
        aligning:
          minimum: 0
          type: integer
        alignment_failed:
          minimum: 0
          type: integer
        isolated_by_quality:
          default: 0
          description: Packages isolated into problem data after automatic QC.
          minimum: 0
          type: integer
        lance_failed:
          minimum: 0
          type: integer
        lance_writing:
          minimum: 0
          type: integer
        ready:
          minimum: 0
          type: integer
        resume_required:
          default: 0
          minimum: 0
          type: integer
        unavailable:
          default: 0
          minimum: 0
          type: integer
        waiting:
          minimum: 0
          type: integer
      required:
      - waiting
      - aligning
      - alignment_failed
      - lance_writing
      - lance_failed
      - ready
      - unavailable
      type: object
    TaskStatusAction:
      additionalProperties: false
      properties:
        action:
          enum:
          - VIEW_UPLOAD_FAILURES
          - VIEW_RAW_DIAGNOSTICS
          - VIEW_QC_ANOMALIES
          - RETRY_TECHNICAL_PROCESSING
          - ENTER_ANNOTATION
          - VIEW_PENDING_REVIEW
          - CLOSE_TASK
          - VIEW_TASK
          type: string
        deep_link:
          maxLength: 1024
          minLength: 1
          type: string
        label:
          maxLength: 128
          minLength: 1
          type: string
      required:
      - action
      - label
      - deep_link
      type: object
    TaskStatusBlocker:
      additionalProperties: false
      properties:
        category:
          enum:
          - UPLOAD
          - RAW_VALIDATION
          - QUALITY
          - TECHNICAL
          - REVIEW
          type: string
        count:
          minimum: 1
          type: integer
        deep_link:
          maxLength: 1024
          minLength: 1
          type:
          - string
          - 'null'
        label:
          maxLength: 200
          minLength: 1
          type: string
        reason_code:
          maxLength: 128
          minLength: 1
          type: string
        retryable:
          default: false
          type: boolean
      required:
      - reason_code
      - label
      - category
      - count
      - retryable
      - deep_link
      type: object
    TaskStatusListItem:
      additionalProperties: false
      properties:
        device_progress:
          $ref: '#/components/schemas/TaskDeviceProgress'
        lifecycle:
          $ref: '#/components/schemas/TaskLifecycle'
        name:
          maxLength: 200
          minLength: 1
          type: string
        received_count:
          minimum: 0
          type: integer
        registered_count:
          minimum: 0
          type: integer
        target:
          oneOf:
          - $ref: '#/components/schemas/TaskStatusTarget'
          - type: 'null'
        task_code:
          maxLength: 16
          minLength: 1
          type: string
        task_id:
          $ref: '#/components/schemas/DashboardIdentifier'
      required:
      - task_id
      - task_code
      - name
      - lifecycle
      - target
      - registered_count
      - received_count
      - device_progress
      type: object
    TaskStatusTarget:
      additionalProperties: false
      properties:
        duration_seconds:
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        package_count:
          minimum: 1
          type:
          - integer
          - 'null'
      required:
      - package_count
      - duration_seconds
      type: object
info:
  title: P01 Dashboard API Fragment
  version: 1.1.0
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/dashboard/activity:
    get:
      description: Recent durable business events, not throughput buckets or byte trends. Every item has
        a stable event ID, source ID, deduplication key, fact time, safe display text, target, and deterministic
        descending ordering by occurred_at, event_type, and source_id.
      operationId: getDashboardActivity
      parameters:
      - $ref: '#/components/parameters/DashboardProjectId'
      - $ref: '#/components/parameters/DashboardRegionCode'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardCursor'
      - $ref: '#/components/parameters/DashboardLimit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardActivityResponse'
          description: Scope-bound recent business-event page; missing lineage is explicit PARTIAL.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DashboardNoStore'
        '400':
          $ref: '#/components/responses/DashboardInvalidCursor'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'
        '422':
          $ref: '#/components/responses/DashboardInvalidQuery'
        '429':
          $ref: '#/components/responses/DashboardRateLimited'
      tags:
      - dashboard
  /api/v1/projects/{project_id}/dashboard/coverage:
    get:
      description: Always returns BLOCKED until a versioned collection plan, robot group, task catalog,
        and denominator exist. Historical observations are not projected as a percentage.
      operationId: getDashboardCoverage
      parameters:
      - $ref: '#/components/parameters/DashboardProjectId'
      - $ref: '#/components/parameters/DashboardRegionCode'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCoverageResponse'
          description: Explicit coverage blocker; no fabricated numeric zero or percentage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DashboardNoStore'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'
        '422':
          $ref: '#/components/responses/DashboardInvalidQuery'
        '429':
          $ref: '#/components/responses/DashboardRateLimited'
      tags:
      - dashboard
  /api/v1/projects/{project_id}/dashboard/pending-items:
    get:
      description: Current upload failures, QC anomalies, pending Tag reviews, and pending publications,
        intersected with principal capabilities. Items are deduplicated and ordered by domain severity,
        oldest opened_at, item_type, and source_id. No SLA duration is implied.
      operationId: getDashboardPendingItems
      parameters:
      - $ref: '#/components/parameters/DashboardProjectId'
      - $ref: '#/components/parameters/DashboardRegionCode'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardCursor'
      - $ref: '#/components/parameters/DashboardLimit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPendingItemsResponse'
          description: Capability-intersected pending page with allowlisted relative deep links.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DashboardNoStore'
        '400':
          $ref: '#/components/responses/DashboardInvalidCursor'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'
        '422':
          $ref: '#/components/responses/DashboardInvalidQuery'
        '429':
          $ref: '#/components/responses/DashboardRateLimited'
      tags:
      - dashboard
  /api/v1/projects/{project_id}/dashboard/task-status:
    get:
      description: Returns the current durable state of collection tasks in one exact project-region scope.
        Package membership is fixed by collection_jobs.task_id and rollouts.collection_job_id; downstream
        facts are the latest persisted facts for that same cohort and are not inferred from independent
        event-time windows. With no task_id, pipeline aggregates every task in the scope; task_id is an
        optional drill-down. Registration is not a device CAPTURED/SAVED fact.
      operationId: getDashboardTaskStatus
      parameters:
      - $ref: '#/components/parameters/DashboardProjectId'
      - $ref: '#/components/parameters/DashboardRegionCode'
      - $ref: '#/components/parameters/DashboardTaskId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTaskStatusResponse'
          description: Current task list and an optional explicitly selected task projection.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DashboardNoStore'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'
        '404':
          $ref: '#/components/responses/DashboardTaskNotFound'
        '422':
          $ref: '#/components/responses/DashboardInvalidQuery'
        '429':
          $ref: '#/components/responses/DashboardRateLimited'
      tags:
      - dashboard
security:
- bearerAuth: []
