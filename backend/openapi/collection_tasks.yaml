components:
  headers:
    CollectionTaskETag:
      required: true
      schema:
        type: string
    CollectionTaskReplay:
      required: true
      schema:
        enum:
        - 'true'
        - 'false'
        type: string
  parameters:
    CollectionTaskId:
      in: path
      name: collection_task_id
      required: true
      schema:
        $ref: '#/components/schemas/CollectionTaskIdentifier'
    CollectionTaskIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 255
        minLength: 1
        type: string
    CollectionTaskIfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        maxLength: 128
        minLength: 1
        type: string
    CollectionTaskOrganizationId:
      description: Selects the exact authorized organization that owns the project task.
      in: header
      name: X-Organization-Id
      required: true
      schema:
        $ref: '#/components/schemas/CollectionTaskIdentifier'
    CollectionTaskProjectId:
      in: path
      name: project_id
      required: true
      schema:
        $ref: '#/components/schemas/CollectionTaskIdentifier'
    CollectionTaskRegionCode:
      description: Selects the exact authorized storage region whose package and QC facts are aggregated;
        it does not identify the robot work area or the logical dataset.
      in: header
      name: X-Region-Code
      required: true
      schema:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9._-]+$
        type: string
  schemas:
    CaptureCounts:
      properties:
        awaiting_slice_count:
          default: 0
          title: Awaiting Slice Count
          type: integer
        blocked_count:
          default: 0
          title: Blocked Count
          type: integer
        episode_count:
          default: 0
          title: Episode Count
          type: integer
        failed_count:
          default: 0
          title: Failed Count
          type: integer
        failed_episode_count:
          default: 0
          title: Failed Episode Count
          type: integer
        processing_count:
          default: 0
          title: Processing Count
          type: integer
        ready_episode_count:
          default: 0
          title: Ready Episode Count
          type: integer
        received_count:
          default: 0
          title: Received Count
          type: integer
        upload_count:
          default: 0
          title: Upload Count
          type: integer
      title: CaptureCounts
      type: object
    CaptureProgress:
      additionalProperties: false
      properties:
        blocked_episode_count:
          default: 0
          minimum: 0.0
          title: Blocked Episode Count
          type: integer
        canonical_episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Episode Id
        capture_mode:
          title: Capture Mode
          type: string
        collection_task_id:
          title: Collection Task Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        data_package_id:
          title: Data Package Id
          type: string
        dataset_id:
          title: Dataset Id
          type: string
        duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Seconds
        episode_count:
          minimum: 0.0
          title: Episode Count
          type: integer
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        failed_episode_count:
          minimum: 0.0
          title: Failed Episode Count
          type: integer
        qc_outcome:
          anyOf:
          - enum:
            - PASS
            - RISK
            - REJECT
            type: string
          - type: 'null'
          title: Qc Outcome
        ready_episode_count:
          minimum: 0.0
          title: Ready Episode Count
          type: integer
        received:
          title: Received
          type: boolean
        received_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Received At
        recording_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recording Id
        robot_id:
          title: Robot Id
          type: string
        rollout_id:
          title: Rollout Id
          type: string
        source_import_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Import Id
        source_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
        stage:
          enum:
          - UPLOADING
          - RECEIVED
          - PREPARING
          - AWAITING_SLICE
          - PROCESSING
          - READY
          - BLOCKED
          - FAILED
          - CANCELLED
          - DISCARDED
          title: Stage
          type: string
        upload_id:
          title: Upload Id
          type: string
        upload_state:
          title: Upload State
          type: string
      required:
      - upload_id
      - capture_mode
      - rollout_id
      - data_package_id
      - collection_task_id
      - robot_id
      - dataset_id
      - upload_state
      - stage
      - received
      - episode_count
      - ready_episode_count
      - failed_episode_count
      - created_at
      title: CaptureProgress
      type: object
    CaptureProgressPage:
      properties:
        counts:
          $ref: '#/components/schemas/CaptureCounts'
        items:
          items:
            $ref: '#/components/schemas/CaptureProgress'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - counts
      title: CaptureProgressPage
      type: object
    CollectionTarget:
      additionalProperties: false
      properties:
        duration_seconds:
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        package_count:
          exclusiveMinimum: 0
          type:
          - integer
          - 'null'
      type: object
    CollectionTask:
      additionalProperties: false
      properties:
        collection_task_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        dataset_id:
          description: Logical target Dataset. Multiple tasks may contribute to it; storage region is
            deliberately excluded from this identity.
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          type: string
        description:
          type: string
        name:
          type: string
        organization_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        project_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        quality_threshold:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
        scenario:
          type: string
        schema_version:
          const: '1'
          default: '1'
          type: string
        status:
          $ref: '#/components/schemas/CollectionTaskStatus'
        target:
          oneOf:
          - $ref: '#/components/schemas/CollectionTarget'
          - type: 'null'
        task_code:
          pattern: ^[0-9]{8}$
          type: string
        type:
          type: string
      required:
      - schema_version
      - collection_task_id
      - organization_id
      - project_id
      - dataset_id
      - task_code
      - name
      - type
      - scenario
      - description
      - target
      - quality_threshold
      - status
      type: object
    CollectionTaskAttainment:
      additionalProperties: false
      properties:
        duration_seconds:
          oneOf:
          - $ref: '#/components/schemas/CollectionTaskTargetMetric'
          - type: 'null'
        package_count:
          oneOf:
          - $ref: '#/components/schemas/CollectionTaskTargetMetric'
          - type: 'null'
        quality_status:
          $ref: '#/components/schemas/CollectionTaskQualityRequirementStatus'
        quality_threshold:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
        status:
          $ref: '#/components/schemas/CollectionTaskAttainmentStatus'
      required:
      - status
      - package_count
      - duration_seconds
      - quality_threshold
      - quality_status
      type: object
    CollectionTaskAttainmentStatus:
      enum:
      - NOT_CONFIGURED
      - IN_PROGRESS
      - ATTAINED
      - EXCEEDED
      type: string
    CollectionTaskDatasetIdentifier:
      maxLength: 104
      minLength: 10
      pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
      type: string
    CollectionTaskIdentifier:
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9._-]+$
      type: string
    CollectionTaskPackage:
      additionalProperties: false
      properties:
        data_package_id:
          maxLength: 256
          minLength: 1
          type: string
        dataset_id:
          default: null
          oneOf:
          - $ref: '#/components/schemas/CollectionTaskDatasetIdentifier'
          - type: 'null'
        episode_id:
          default: null
          maxLength: 128
          type:
          - string
          - 'null'
        error_code:
          default: null
          maxLength: 256
          type:
          - string
          - 'null'
        qc_outcome:
          default: null
          oneOf:
          - $ref: '#/components/schemas/CollectionTaskQcOutcome'
          - type: 'null'
        received_at:
          format: date-time
          type: string
        revision_id:
          default: null
          maxLength: 128
          type:
          - string
          - 'null'
        robot_id:
          maxLength: 256
          minLength: 1
          type: string
        rollout_id:
          maxLength: 256
          minLength: 1
          type: string
        schema_version:
          const: '1'
          default: '1'
          type: string
        state:
          $ref: '#/components/schemas/CollectionTaskPackageState'
        updated_at:
          format: date-time
          type: string
        version_id:
          default: null
          maxLength: 128
          type:
          - string
          - 'null'
        visualizable:
          type: boolean
        workflow_stage:
          default: null
          maxLength: 128
          type:
          - string
          - 'null'
        workflow_status:
          default: null
          maxLength: 128
          type:
          - string
          - 'null'
      required:
      - schema_version
      - data_package_id
      - rollout_id
      - robot_id
      - state
      - visualizable
      - received_at
      - updated_at
      type: object
    CollectionTaskPackageList:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          type: string
        collection_task_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        items:
          items:
            $ref: '#/components/schemas/CollectionTaskPackage'
          type: array
        organization_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        project_id:
          $ref: '#/components/schemas/CollectionTaskIdentifier'
        schema_version:
          const: '1'
          default: '1'
          type: string
      required:
      - schema_version
      - collection_task_id
      - organization_id
      - project_id
      - as_of
      - items
      type: object
    CollectionTaskPackageState:
      enum:
      - PENDING_QC
      - PROCESSING
      - PUBLISHED
      - QUALITY_RISK
      - QUALITY_REJECTED
      - TECHNICAL_FAILED
      - CANCELLED
      - RETRY_PENDING
      - DATASET_MISMATCH
      type: string
    CollectionTaskPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/CollectionTask'
          type: array
        next_cursor:
          default: null
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    CollectionTaskProgress:
      additionalProperties: false
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        attainment:
          $ref: '#/components/schemas/CollectionTaskAttainment'
        captured_duration_seconds:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Captured Duration Seconds
        captures:
          $ref: '#/components/schemas/CaptureCounts'
        collection_task_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Collection Task Id
          type: string
        duration_observed_package_count:
          minimum: 0.0
          title: Duration Observed Package Count
          type: integer
        duration_unknown_package_count:
          minimum: 0.0
          title: Duration Unknown Package Count
          type: integer
        observed_sources:
          $ref: '#/components/schemas/ManifestObservedSources'
        organization_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Organization Id
          type: string
        project_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Project Id
          type: string
        qc:
          $ref: '#/components/schemas/CollectionTaskQcProgress'
        received_package_count:
          minimum: 0.0
          title: Received Package Count
          type: integer
        schema_version:
          default: '1'
          pattern: ^1$
          title: Schema Version
          type: string
        status:
          $ref: '#/components/schemas/CollectionTaskStatus'
      required:
      - collection_task_id
      - organization_id
      - project_id
      - status
      - as_of
      - received_package_count
      - duration_observed_package_count
      - duration_unknown_package_count
      - qc
      - attainment
      - observed_sources
      title: CollectionTaskProgress
      type: object
    CollectionTaskQcOutcome:
      enum:
      - PASS
      - RISK
      - REJECT
      type: string
    CollectionTaskQcProgress:
      additionalProperties: false
      properties:
        evaluated_count:
          minimum: 0
          type: integer
        pass_count:
          minimum: 0
          type: integer
        pass_rate:
          $ref: '#/components/schemas/CollectionTaskRatio'
        pending_count:
          minimum: 0
          type: integer
        reject_count:
          minimum: 0
          type: integer
        risk_count:
          minimum: 0
          type: integer
      required:
      - evaluated_count
      - pass_count
      - risk_count
      - reject_count
      - pending_count
      - pass_rate
      type: object
    CollectionTaskQualityRequirementStatus:
      enum:
      - NOT_CONFIGURED
      - PENDING_QC
      - NOT_MET
      - MET
      type: string
    CollectionTaskRatio:
      additionalProperties: false
      properties:
        denominator:
          minimum: 0
          type: integer
        numerator:
          minimum: 0
          type: integer
        value:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
      required:
      - numerator
      - denominator
      type: object
    CollectionTaskStatus:
      enum:
      - ACTIVE
      - CLOSED
      - CANCELLED
      type: string
    CollectionTaskTargetMetric:
      additionalProperties: false
      properties:
        actual:
          minimum: 0
          type:
          - number
          - 'null'
        progress:
          minimum: 0
          type:
          - number
          - 'null'
        status:
          $ref: '#/components/schemas/CollectionTaskTargetMetricStatus'
        target:
          exclusiveMinimum: 0
          type: number
      required:
      - target
      - status
      type: object
    CollectionTaskTargetMetricStatus:
      enum:
      - IN_PROGRESS
      - MET
      - EXCEEDED
      - UNKNOWN
      type: string
    CreateCollectionTask:
      additionalProperties: false
      properties:
        capture_plan:
          anyOf:
          - $ref: '#/components/schemas/SetTaskPlan'
          - type: 'null'
          description: Atomically bind the new task to a published scheme and participant mappings; expected_revision
            must be zero.
        dataset_id:
          description: Existing active Dataset to receive this task; omission creates a dedicated Dataset
            identity.
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          type: string
        description:
          default: ''
          maxLength: 10000
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        quality_threshold:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
        scenario:
          maxLength: 200
          minLength: 1
          type: string
        target:
          oneOf:
          - $ref: '#/components/schemas/CollectionTarget'
          - type: 'null'
        type:
          default: ''
          description: 任务分类，留空表示未分类。
          maxLength: 100
          type: string
      required:
      - name
      - scenario
      type: object
    ManifestObservedSources:
      additionalProperties: false
      properties:
        camera_ids:
          items:
            type: string
          type: array
        device_ids:
          items:
            type: string
          type: array
        topic_names:
          items:
            type: string
          type: array
      required:
      - device_ids
      - camera_ids
      - topic_names
      type: object
    TaskDeletionResult:
      properties:
        collection_task_id:
          type: string
        deleted_bytes:
          minimum: 0
          type: integer
        deleted_objects:
          minimum: 0
          type: integer
        deleted_rows:
          minimum: 0
          type: integer
        status:
          enum:
          - DELETED
          type: string
        task_code:
          type: string
      required:
      - collection_task_id
      - task_code
      - status
      - deleted_rows
      - deleted_objects
      - deleted_bytes
      type: object
    UpdateCollectionTask:
      additionalProperties: false
      properties:
        dataset_id:
          description: New active Dataset; reassignment is rejected after the first package is received.
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          type: string
        description:
          maxLength: 10000
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        quality_threshold:
          maximum: 1
          minimum: 0
          type:
          - number
          - 'null'
        scenario:
          maxLength: 200
          minLength: 1
          type: string
        target:
          oneOf:
          - $ref: '#/components/schemas/CollectionTarget'
          - type: 'null'
        type:
          description: 任务分类，空字符串可清除分类。
          maxLength: 100
          type: string
      type: object
info:
  title: Collection Tasks API Fragment
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/capture-progress:
    get:
      operationId: listCaptureProgress
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Project Id
          type: string
      - in: query
        name: collection_task_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Collection Task Id
      - in: query
        name: robot_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Robot Id
      - in: query
        name: dataset_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Dataset Id
      - in: query
        name: unfinished_uploads_only
        required: false
        schema:
          default: false
          title: Unfinished Uploads Only
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: header
        name: X-Region-Code
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Region-Code
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureProgressPage'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Capture Progress
      tags:
      - collection-tasks
  /api/v1/projects/{project_id}/collection-tasks:
    get:
      operationId: listCollectionTasks
      parameters:
      - $ref: '#/components/parameters/CollectionTaskProjectId'
      - $ref: '#/components/parameters/CollectionTaskOrganizationId'
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/CollectionTaskStatus'
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          maxLength: 16384
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionTaskPage'
          description: A stable cursor page inside exactly one project scope.
        '400':
          description: The cursor is invalid or belongs to another query.
        '401':
          description: A verified access token is required.
        '403':
          description: Project scope or read permission is missing.
      tags:
      - collection-tasks
    post:
      operationId: createCollectionTask
      parameters:
      - $ref: '#/components/parameters/CollectionTaskProjectId'
      - $ref: '#/components/parameters/CollectionTaskOrganizationId'
      - $ref: '#/components/parameters/CollectionTaskIdempotencyKey'
      - description: Required when capture_plan is supplied; fixes the new task and Dataset Region.
        in: header
        name: X-Region-Code
        required: false
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionTask'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionTask'
          description: An active task definition with a generated identity and task code.
          headers:
            ETag:
              $ref: '#/components/headers/CollectionTaskETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/CollectionTaskReplay'
            Location:
              required: true
              schema:
                type: string
        '401':
          description: A verified access token is required.
        '403':
          description: Project scope or task-management permission is missing.
        '409':
          description: The idempotency key was reused with different content.
        '422':
          description: The request violates the task schema.
      tags:
      - collection-tasks
  /api/v1/projects/{project_id}/collection-tasks/{collection_task_id}:
    delete:
      description: Permanently remove a task, its exclusive Dataset and stored data. Interrupted cleanup
        can be retried.
      operationId: deleteCollectionTask
      parameters:
      - $ref: '#/components/parameters/CollectionTaskProjectId'
      - $ref: '#/components/parameters/CollectionTaskOrganizationId'
      - $ref: '#/components/parameters/CollectionTaskId'
      - $ref: '#/components/parameters/CollectionTaskIfMatch'
      - $ref: '#/components/parameters/CollectionTaskIdempotencyKey'
      - $ref: '#/components/parameters/CollectionTaskRegionCode'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDeletionResult'
          description: All task data and stored objects have been removed.
        '403':
          description: Task-management permission is missing.
        '404':
          description: Task not found in this scope.
        '409':
          description: Processing is active or data is shared or protected.
        '412':
          description: The task changed since it was read.
        '503':
          description: Object cleanup is incomplete; retry the same deletion.
      tags:
      - collection-tasks
    get:
      operationId: getCollectionTask
      parameters:
      - $ref: '#/components/parameters/CollectionTaskProjectId'
      - $ref: '#/components/parameters/CollectionTaskOrganizationId'
      - $ref: '#/components/parameters/CollectionTaskId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionTask'
          description: The scoped task definition.
          headers:
            ETag:
              $ref: '#/components/headers/CollectionTaskETag'
        '401':
          description: A verified access token is required.
        '403':
          description: Project scope or read permission is missing.
        '404':
          description: No task is visible under this project identity.
      tags:
      - collection-tasks
    patch:
      operationId: updateCollectionTask
      parameters:
      - $ref: '#/components/parameters/CollectionTaskProjectId'
      - $ref: '#/components/parameters/CollectionTaskOrganizationId'
      - $ref: '#/components/parameters/CollectionTaskId'
      - $ref: '#/components/parameters/CollectionTaskIfMatch'
