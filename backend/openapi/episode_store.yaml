components:
  schemas:
    DataReviewLocation:
      additionalProperties: false
      description: Zero-based half-open Episode frames, never parent recording frame numbers.
      properties:
        comment:
          maxLength: 2000
          minLength: 1
          title: Comment
          type: string
        end_step:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: End Step
        start_step:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Start Step
        tag:
          anyOf:
          - $ref: '#/components/schemas/DataReviewTagReference'
          - type: 'null'
      required:
      - comment
      title: DataReviewLocation
      type: object
    DataReviewTagReference:
      additionalProperties: false
      properties:
        annotation_id:
          maxLength: 256
          minLength: 1
          title: Annotation Id
          type: string
        revision:
          minimum: 0.0
          title: Revision
          type: integer
        revision_content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Revision Content Hash
          type: string
        task_id:
          maxLength: 256
          minLength: 1
          title: Task Id
          type: string
      required:
      - task_id
      - revision
      - revision_content_hash
      - annotation_id
      title: DataReviewTagReference
      type: object
    DataVersionRef:
      additionalProperties: false
      properties:
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        data_version_id:
          maxLength: 256
          minLength: 1
          title: Data Version Id
          type: string
        frame_count:
          minimum: 1.0
          title: Frame Count
          type: integer
        identity:
          $ref: '#/components/schemas/EpisodeIdentity'
        package_prefix:
          title: Package Prefix
          type: string
        schema_snapshot_id:
          maxLength: 256
          minLength: 1
          title: Schema Snapshot Id
          type: string
        storage_format:
          const: lerobot_v3
          default: lerobot_v3
          title: Storage Format
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - identity
      - data_version_id
      - version
      - content_hash
      - schema_snapshot_id
      - package_prefix
      - frame_count
      title: DataVersionRef
      type: object
    DepthPixelValue:
      additionalProperties: false
      properties:
        coordinate_space:
          const: depth_native
          default: depth_native
          title: Coordinate Space
          type: string
        data:
          $ref: '#/components/schemas/DataVersionRef'
        feature:
          title: Feature
          type: string
        flags:
          title: Flags
          type: integer
        frame_index:
          minimum: 0.0
          title: Frame Index
          type: integer
        profile:
          additionalProperties: true
          title: Profile
          type: object
        quantized:
          const: true
          default: true
          title: Quantized
          type: boolean
        saturated_high:
          title: Saturated High
          type: boolean
        saturated_low:
          title: Saturated Low
          type: boolean
        shape:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: integer
          - type: integer
          title: Shape
          type: array
        source:
          additionalProperties: true
          title: Source
          type: object
        unit:
          enum:
          - m
          - mm
          title: Unit
          type: string
        valid:
          title: Valid
          type: boolean
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        x:
          minimum: 0.0
          title: X
          type: integer
        y:
          minimum: 0.0
          title: Y
          type: integer
      required:
      - data
      - feature
      - frame_index
      - x
      - y
      - shape
      - value
      - unit
      - valid
      - saturated_low
      - saturated_high
      - flags
      - profile
      - source
      title: DepthPixelValue
      type: object
    EpisodeDataReview:
      additionalProperties: false
      properties:
        actor_id:
          maxLength: 256
          minLength: 1
          title: Actor Id
          type: string
        comment:
          title: Comment
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        data:
          $ref: '#/components/schemas/DataVersionRef'
        decision:
          enum:
          - APPROVED
          - RETURNED
          title: Decision
          type: string
        format:
          const: hc-episode-data-review/1
          default: hc-episode-data-review/1
          title: Format
          type: string
        locations:
          items:
            $ref: '#/components/schemas/DataReviewLocation'
          title: Locations
          type: array
        previous_review_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Previous Review Id
        review_id:
          maxLength: 256
          minLength: 1
          title: Review Id
          type: string
        sequence:
          minimum: 1.0
          title: Sequence
          type: integer
      required:
      - review_id
      - data
      - sequence
      - previous_review_id
      - decision
      - actor_id
      - created_at
      - comment
      - locations
      title: EpisodeDataReview
      type: object
    EpisodeDataReviewAction:
      additionalProperties: false
      properties:
        action:
          enum:
          - SUBMIT_DATA_REVIEW
          - LINK_ANNOTATION_TAG
          title: Action
          type: string
        allowed:
          title: Allowed
          type: boolean
        denied_reason:
          anyOf:
          - const: MISSING_CAPABILITY
            type: string
          - type: 'null'
          title: Denied Reason
        required_capabilities:
          items:
            enum:
            - dataset_version.review
            - annotation_task.read
            type: string
          title: Required Capabilities
          type: array
      required:
      - action
      - allowed
      - required_capabilities
      - denied_reason
      title: EpisodeDataReviewAction
      type: object
    EpisodeDataReviewPage:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            $ref: '#/components/schemas/EpisodeDataReviewAction'
          title: Allowed Actions
          type: array
        current_sequence:
          minimum: 0.0
          title: Current Sequence
          type: integer
        data:
          $ref: '#/components/schemas/DataVersionRef'
        items:
          items:
            $ref: '#/components/schemas/EpisodeDataReview'
          title: Items
          type: array
        latest:
          anyOf:
          - $ref: '#/components/schemas/EpisodeDataReview'
          - type: 'null'
        next_before:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Before
        status:
          enum:
          - NOT_REVIEWED
          - APPROVED
          - RETURNED
          title: Status
          type: string
      required:
      - data
      - status
      - current_sequence
      - latest
      - items
      - next_before
      title: EpisodeDataReviewPage
      type: object
    EpisodeIdentity:
      additionalProperties: false
      properties:
        dataset_id:
          maxLength: 256
          minLength: 1
          title: Dataset Id
          type: string
        episode_id:
          maxLength: 256
          minLength: 1
          title: Episode Id
          type: string
        organization_id:
          maxLength: 256
          minLength: 1
          title: Organization Id
          type: string
        project_id:
          maxLength: 256
          minLength: 1
          title: Project Id
          type: string
        region_code:
          maxLength: 256
          minLength: 1
          title: Region Code
          type: string
        rollout_id:
          maxLength: 256
          minLength: 1
          title: Rollout Id
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      - dataset_id
      - episode_id
      - rollout_id
      title: EpisodeIdentity
      type: object
    EpisodePreviewGrant:
      additionalProperties: false
      properties:
        colorizer:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Colorizer
        data:
          $ref: '#/components/schemas/DataVersionRef'
        depth_max_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Depth Max M
        depth_min_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Depth Min M
        expires_at:
          format: date-time
          title: Expires At
          type: string
        feature:
          title: Feature
          type: string
        fps:
          exclusiveMinimum: 0.0
          title: Fps
          type: number
        frame_count:
          exclusiveMinimum: 0.0
          title: Frame Count
          type: integer
        height:
          exclusiveMinimum: 0.0
          title: Height
          type: integer
        kind:
          enum:
          - rgb-video
          - depth-preview
          title: Kind
          type: string
        media_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Media Sha256
          type: string
        media_url:
          title: Media Url
          type: string
        profile_id:
          title: Profile Id
          type: string
        source_reused:
          title: Source Reused
          type: boolean
        source_video_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Source Video Sha256
          type: string
        width:
          exclusiveMinimum: 0.0
          title: Width
          type: integer
      required:
      - data
      - feature
      - profile_id
      - kind
      - source_reused
      - source_video_sha256
      - media_sha256
      - frame_count
      - fps
      - width
      - height
      - media_url
      - expires_at
      title: EpisodePreviewGrant
      type: object
    EpisodeQualityView:
      additionalProperties: false
      properties:
        additional_finding_codes:
          default: []
          items:
            type: string
          title: Additional Finding Codes
          type: array
        data:
          $ref: '#/components/schemas/DataVersionRef'
        evidence:
          anyOf:
          - $ref: '#/components/schemas/QcRuleEvidence'
          - type: 'null'
        evidence_status:
          enum:
          - AVAILABLE
          - LEGACY_MISSING
          - REPORT_MISSING
          title: Evidence Status
          type: string
        report:
          anyOf:
          - $ref: '#/components/schemas/QcReportV1'
          - type: 'null'
        rules:
          items:
            $ref: '#/components/schemas/RuleExecution'
          title: Rules
          type: array
        status:
          enum:
          - PASS
          - RISK
          - REJECT
          - UNKNOWN
          title: Status
          type: string
      required:
      - data
      - status
      - evidence_status
      - report
      - evidence
      - rules
      title: EpisodeQualityView
      type: object
    PackageStepWindow:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DataVersionRef'
        end_step:
          minimum: 0.0
          title: End Step
          type: integer
        start_step:
          minimum: 0.0
          title: Start Step
          type: integer
        steps:
          items:
            $ref: '#/components/schemas/StepRecord'
          title: Steps
          type: array
      required:
      - data
      - start_step
      - end_step
      - steps
      title: PackageStepWindow
      type: object
    QcRuleEvidence:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Content Sha256
          type: string
        end_ns:
          exclusiveMinimum: 0.0
          title: End Ns
          type: integer
        engine_version:
          title: Engine Version
          type: string
        format:
          const: hc-qc-rule-evidence/1
          default: hc-qc-rule-evidence/1
          title: Format
          type: string
        input_mode:
          enum:
          - batch
          - stream
          title: Input Mode
          type: string
        profile:
          $ref: '#/components/schemas/QualityProfileV1'
        report_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Report Sha256
          type: string
        rollout_id:
          title: Rollout Id
          type: string
        rules:
          items:
            $ref: '#/components/schemas/RuleExecution'
          title: Rules
          type: array
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Source Sha256
          type: string
        start_ns:
          minimum: 0.0
          title: Start Ns
          type: integer
      required:
      - report_sha256
      - rollout_id
      - source_sha256
      - start_ns
      - end_ns
      - engine_version
      - profile
      - input_mode
      - rules
      - content_sha256
      title: QcRuleEvidence
      type: object
    RuleExecution:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/QualityCode'
        detector_findings:
          items:
            $ref: '#/components/schemas/QcFinding'
          title: Detector Findings
          type: array
        evaluated_count:
          minimum: 0.0
          title: Evaluated Count
          type: integer
        expected_count:
          minimum: 0.0
          title: Expected Count
          type: integer
        observed:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - type: number
            - type: string
            - type: 'null'
          title: Observed
          type: object
        participates_in_verdict:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Participates In Verdict
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        report_finding_indexes:
          items:
            type: integer
          title: Report Finding Indexes
          type: array
        status:
          enum:
          - pass
          - warn
          - fail
          - skip
          - info
          title: Status
          type: string
        thresholds:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - type: number
            - type: string
            - type: 'null'
          title: Thresholds
          type: object
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
      required:
      - code
      - topic
      - status
      - reason
      - participates_in_verdict
      - evaluated_count
      - expected_count
      - observed
      - thresholds
      - detector_findings
      - report_finding_indexes
      title: RuleExecution
      type: object
    SubmitEpisodeDataReview:
      additionalProperties: false
      properties:
        comment:
          maxLength: 4000
          minLength: 1
          title: Comment
          type: string
        decision:
          enum:
          - APPROVED
          - RETURNED
          title: Decision
          type: string
        expected_content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Expected Content Hash
          type: string
        expected_sequence:
          minimum: 0.0
          title: Expected Sequence
          type: integer
        locations:
          default: []
          items:
            $ref: '#/components/schemas/DataReviewLocation'
          maxItems: 100
          title: Locations
          type: array
      required:
      - expected_content_hash
      - expected_sequence
      - decision
      - comment
      title: SubmitEpisodeDataReview
      type: object
info:
  title: HC Episode package contract
  version: '2026-09-29'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions:
    get:
      operationId: versions
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Before
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataVersionRef'
                title: Response Versions Api V1 Projects  Project Id  Regions  Region Code  Datasets  Dataset
                  Id  Episodes  Episode Id  Data Versions Get
                type: array
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Versions
      tags:
      - episode_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions/{data_version_id}
  : get:
      operationId: detail
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
        name: data_version_id
        required: true
        schema:
          title: Data Version Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Detail
      tags:
      - episode_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions/{data_version_id}/data-reviews
  : get:
      operationId: dataReviewHistory
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
        name: data_version_id
        required: true
        schema:
          title: Data Version Id
          type: string
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Before
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDataReviewPage'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Data Review History
      tags:
      - episode_data
    post:
      operationId: submitDataReview
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
        name: data_version_id
        required: true
        schema:
          title: Data Version Id
          type: string
      - in: header
        name: idempotency-key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEpisodeDataReview'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDataReview'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Submit Data Review
      tags:
      - episode_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions/{data_version_id}/depth/{feature}/{frame_index}
  : get:
      operationId: depth
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
        name: data_version_id
        required: true
        schema:
          title: Data Version Id
          type: string
      - in: path
        name: feature
        required: true
        schema:
          title: Feature
          type: string
      - in: path
        name: frame_index
        required: true
        schema:
          title: Frame Index
          type: integer
      - in: query
        name: unit
        required: false
        schema:
          default: mm
          enum:
          - m
          - mm
          title: Unit
          type: string
      - in: query
        name: representation
        required: false
        schema:
          default: metadata
          enum:
          - metadata
          - npz
          - png
          title: Representation
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Depth
      tags:
      - episode_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions/{data_version_id}/depth/{feature}/{frame_index}/pixel
  : get:
      operationId: depthPixel
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
        name: data_version_id
        required: true
        schema:
          title: Data Version Id
          type: string
      - in: path
        name: feature
        required: true
        schema:
          title: Feature
          type: string
      - in: path
        name: frame_index
        required: true
        schema:
          title: Frame Index
          type: integer
      - in: query
        name: x
        required: true
        schema:
          minimum: 0
          title: X
          type: integer
      - in: query
        name: y
        required: true
        schema:
          minimum: 0
          title: Y
          type: integer
      - in: query
        name: unit
        required: false
        schema:
          default: m
          enum:
          - m
          - mm
          title: Unit
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepthPixelValue'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Depth Pixel
