info:
  title: HC Episode package contract
  version: '2026-09-29'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/annotation-tasks/{task_id}/tag-episodes:
    get:
      operationId: listTagEpisodes
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - pattern: ^td_[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Before
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagDerivationView'
                title: Response List Tag Episodes Api V1 Projects  Project Id  Regions  Region
                  Code  Annotation Tasks  Task Id  Tag Episodes Get
                type: array
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Tag Episodes
      tags:
      - episode_data
      - episode_data
    post:
      description: 'Create a separate primary Episode from one fixed Tag revision/interval.


        Requires upload.manage, dataset_version.read, annotation_task.read and export.download.

        Original tags and media remain immutable; approvals are not inherited.'
      operationId: createTagEpisode
      parameters:
      - in: path
