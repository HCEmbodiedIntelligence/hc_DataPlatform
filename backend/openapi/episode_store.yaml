components:
  schemas:
    DataVersionRef:
      additionalProperties: false
      properties:
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        data_version_id:
          maxLength: 256
          minLength: 1
          title: Data Version Id
          type: string
        frame_count:
          minimum: 1.0
          title: Frame Count
          type: integer
        identity:
          $ref: '#/components/schemas/EpisodeIdentity'
        package_prefix:
          title: Package Prefix
          type: string
        schema_snapshot_id:
          maxLength: 256
          minLength: 1
          title: Schema Snapshot Id
          type: string
        storage_format:
          const: lerobot_v3
          default: lerobot_v3
          title: Storage Format
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - identity
      - data_version_id
      - version
      - content_hash
      - schema_snapshot_id
      - package_prefix
      - frame_count
      title: DataVersionRef
      type: object
    EpisodeIdentity:
      additionalProperties: false
      properties:
        dataset_id:
          maxLength: 256
          minLength: 1
          title: Dataset Id
          type: string
        episode_id:
          maxLength: 256
          minLength: 1
          title: Episode Id
          type: string
        organization_id:
          maxLength: 256
          minLength: 1
          title: Organization Id
          type: string
        project_id:
          maxLength: 256
          minLength: 1
          title: Project Id
          type: string
        region_code:
          maxLength: 256
          minLength: 1
          title: Region Code
          type: string
        rollout_id:
          maxLength: 256
          minLength: 1
          title: Rollout Id
          type: string
      required:
      - organization_id
      - project_id
      - region_code
      - dataset_id
      - episode_id
      - rollout_id
      title: EpisodeIdentity
      type: object
    PackageStepWindow:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DataVersionRef'
        end_step:
          minimum: 0.0
          title: End Step
          type: integer
        start_step:
          minimum: 0.0
          title: Start Step
          type: integer
        steps:
          items:
            $ref: '#/components/schemas/StepRecord'
          title: Steps
          type: array
      required:
      - data
      - start_step
      - end_step
      - steps
      title: PackageStepWindow
      type: object
info:
  title: HC Episode package contract
  version: '2026-09-29'
openapi: 3.1.0
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions:
    get:
      operationId: versions
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Before
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataVersionRef'
                title: Response Versions Api V1 Projects  Project Id  Regions  Region Code  Datasets  Dataset
                  Id  Episodes  Episode Id  Data Versions Get
                type: array
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Versions
      tags:
      - episode_data
  ? /api/v1/projects/{project_id}/regions/{region_code}/datasets/{dataset_id}/episodes/{episode_id}/data-versions/{data_version_id}
  : get:
      operationId: detail
      parameters:
