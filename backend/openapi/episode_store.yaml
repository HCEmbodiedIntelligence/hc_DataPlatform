          minimum: 0
          title: Start Step
          type: integer
      - in: query
        name: end_step
        required: true
        schema:
          minimum: 0
          title: End Step
          type: integer
      - in: query
        name: columns
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
