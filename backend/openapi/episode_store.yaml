        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: path
        name: dataset_id
        required: true
        schema:
          title: Dataset Id
          type: string
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: path
