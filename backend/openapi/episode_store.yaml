components:
  schemas:
    CollectionAnnotationSelection:
      additionalProperties: false
      properties:
        allow_unreviewed:
          default: false
          title: Allow Unreviewed
          type: boolean
        revision:
          minimum: 0.0
          title: Revision
          type: integer
        task_id:
          maxLength: 256
          minLength: 1
          title: Task Id
          type: string
        track:
          $ref: '#/components/schemas/SubtaskTrack'
      required:
      - revision
      - track
      - task_id
      title: CollectionAnnotationSelection
      type: object
    CollectionDeliveryMember:
      additionalProperties: false
      properties:
        annotation:
          anyOf:
          - $ref: '#/components/schemas/AnnotationDeliveryPlan'
          - type: 'null'
        camera_calibration:
          anyOf:
          - $ref: '#/components/schemas/ExportCameraCalibration'
          - type: 'null'
        data:
          $ref: '#/components/schemas/DataVersionRef'
        excluded_depth_features:
          items:
            type: string
          title: Excluded Depth Features
          type: array
        manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Manifest Sha256
          type: string
        selected_depth_profiles:
          additionalProperties:
            pattern: ^[0-9a-f]{64}$
            type: string
          title: Selected Depth Profiles
          type: object
      required:
      - data
      - manifest_sha256
      - selected_depth_profiles
      - excluded_depth_features
      title: CollectionDeliveryMember
      type: object
    CollectionDeliveryPlan:
      additionalProperties: false
      properties:
        annotation_selection:
          const: per_episode_fixed_selection
          default: per_episode_fixed_selection
          title: Annotation Selection
          type: string
        archive_format:
          default: lerobot_collection_zip/1
          title: Archive Format
          type: string
        archive_version:
          const: hc-collection-archive/1
          default: hc-collection-archive/1
          title: Archive Version
          type: string
        contract_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Contract Sha256
          type: string
        format:
          const: hc-collection-delivery-plan/1
          default: hc-collection-delivery-plan/1
          title: Format
          type: string
        members:
          items:
            $ref: '#/components/schemas/CollectionDeliveryMember'
          maxItems: 100
          minItems: 1
          title: Members
          type: array
        modalities:
          enum:
          - rgb
          - rgbd
          title: Modalities
          type: string
        processor_version:
          default: hc-lerobot-collection/1
          enum:
          - hc-lerobot-collection/1
          - hc-lerobot-collection/2
          - hc-export/1
          title: Processor Version
          type: string
        reader_version:
          default: lerobot/0.6.1
          title: Reader Version
          type: string
      required:
      - members
      - modalities
      - contract_sha256
      title: CollectionDeliveryPlan
      type: object
    CollectionEpisodeSelection:
      additionalProperties: false
      properties:
        annotation:
          anyOf:
          - $ref: '#/components/schemas/CollectionAnnotationSelection'
          - type: 'null'
        data:
          $ref: '#/components/schemas/DataVersionRef'
      required:
      - data
      title: CollectionEpisodeSelection
      type: object
    CollectionRelease:
      additionalProperties: false
      properties:
        collection_manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Collection Manifest Sha256
          type: string
        collection_version_id:
          title: Collection Version Id
          type: string
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        dataset_id:
          title: Dataset Id
          type: string
        dataset_version:
          title: Dataset Version
          type: string
        document_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Document Sha256
          type: string
        document_size:
          exclusiveMinimum: 0.0
          maximum: 67108864.0
          title: Document Size
          type: integer
        eligible_episode_ids:
          items:
            type: string
          minItems: 1
          title: Eligible Episode Ids
          type: array
        excluded_episodes:
          items:
            $ref: '#/components/schemas/CollectionReleaseExclusion'
          title: Excluded Episodes
          type: array
        format:
          const: hc-collection-release/1
          default: hc-collection-release/1
          title: Format
          type: string
        version_id:
          pattern: ^version_release_[0-9a-f]{32}$
          title: Version Id
          type: string
      required:
      - dataset_id
      - dataset_version
      - version_id
      - collection_version_id
      - collection_manifest_sha256
      - content_hash
      - document_sha256
      - document_size
      - eligible_episode_ids
      - excluded_episodes
      - created_at
      title: CollectionRelease
      type: object
    CollectionReleaseExclusion:
      additionalProperties: false
      properties:
        episode_id:
          title: Episode Id
          type: string
        reason:
          enum:
          - ANNOTATION_NOT_APPROVED
          - ANNOTATION_TASK_SELECTION_REQUIRED
          - NOT_SELECTED
          title: Reason
          type: string
      required:
      - episode_id
      - reason
      title: CollectionReleaseExclusion
      type: object
    CollectionReleasePreflight:
      additionalProperties: false
      properties:
        annotation_task_options:
          additionalProperties:
            items:
              type: string
            type: array
          title: Annotation Task Options
          type: object
        collection_manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Collection Manifest Sha256
          type: string
        collection_version_id:
          title: Collection Version Id
          type: string
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        dataset_id:
          title: Dataset Id
          type: string
        dataset_version:
          title: Dataset Version
          type: string
        eligible_episode_ids:
          items:
            type: string
          title: Eligible Episode Ids
          type: array
        excluded_episodes:
          items:
            $ref: '#/components/schemas/CollectionReleaseExclusion'
          title: Excluded Episodes
          type: array
      required:
      - dataset_id
      - dataset_version
      - collection_version_id
      - collection_manifest_sha256
      - content_hash
      - annotation_task_options
      - eligible_episode_ids
      - excluded_episodes
      title: CollectionReleasePreflight
      type: object
    DataReviewLocation:
      additionalProperties: false
      description: Zero-based half-open Episode frames, never parent recording frame
        numbers.
      properties:
        comment:
          maxLength: 2000
          minLength: 1
          title: Comment
          type: string
        end_step:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: End Step
        start_step:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Start Step
        tag:
          anyOf:
          - $ref: '#/components/schemas/DataReviewTagReference'
          - type: 'null'
      required:
      - comment
      title: DataReviewLocation
      type: object
    DataReviewTagReference:
      additionalProperties: false
      properties:
        annotation_id:
          maxLength: 256
          minLength: 1
          title: Annotation Id
          type: string
        revision:
          minimum: 0.0
          title: Revision
          type: integer
        revision_content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Revision Content Hash
          type: string
        task_id:
          maxLength: 256
          minLength: 1
          title: Task Id
          type: string
      required:
      - task_id
      - revision
      - revision_content_hash
      - annotation_id
      title: DataReviewTagReference
      type: object
    DataVersionRef:
      additionalProperties: false
      properties:
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        data_version_id:
          maxLength: 256
          minLength: 1
          title: Data Version Id
          type: string
        frame_count:
          minimum: 1.0
          title: Frame Count
          type: integer
        identity:
          $ref: '#/components/schemas/EpisodeIdentity'
        package_prefix:
          title: Package Prefix
          type: string
        schema_snapshot_id:
          maxLength: 256
          minLength: 1
          title: Schema Snapshot Id
          type: string
        storage_format:
          const: lerobot_v3
          default: lerobot_v3
          title: Storage Format
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - identity
      - data_version_id
      - version
      - content_hash
      - schema_snapshot_id
      - package_prefix
      - frame_count
      title: DataVersionRef
      type: object
    DepthPixelValue:
      additionalProperties: false
      properties:
        coordinate_space:
          const: depth_native
          default: depth_native
          title: Coordinate Space
          type: string
        data:
          $ref: '#/components/schemas/DataVersionRef'
        feature:
          title: Feature
          type: string
        flags:
          title: Flags
          type: integer
        frame_index:
          minimum: 0.0
          title: Frame Index
          type: integer
        profile:
          additionalProperties: true
          title: Profile
          type: object
        quantized:
          const: true
          default: true
          title: Quantized
          type: boolean
        saturated_high:
          title: Saturated High
          type: boolean
        saturated_low:
          title: Saturated Low
          type: boolean
        shape:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: integer
          - type: integer
          title: Shape
          type: array
        source:
          additionalProperties: true
          title: Source
          type: object
        unit:
          enum:
          - m
          - mm
          title: Unit
          type: string
        valid:
          title: Valid
          type: boolean
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        x:
          minimum: 0.0
          title: X
          type: integer
        y:
          minimum: 0.0
          title: Y
          type: integer
      required:
      - data
      - feature
      - frame_index
      - x
      - y
      - shape
      - value
      - unit
      - valid
      - saturated_low
      - saturated_high
      - flags
      - profile
      - source
      title: DepthPixelValue
      type: object
    EpisodeAction:
      additionalProperties: false
      properties:
        action:
          title: Action
          type: string
        allowed:
          title: Allowed
          type: boolean
        denied_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Denied Reason
        required_capabilities:
          items:
            type: string
          title: Required Capabilities
          type: array
      required:
      - action
      - allowed
      - required_capabilities
      - denied_reason
      title: EpisodeAction
      type: object
    EpisodeAnnotationMigration:
      additionalProperties: false
      properties:
        document_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Document Sha256
          type: string
        document_size:
          maximum: 16777216.0
          minimum: 1.0
          title: Document Size
          type: integer
        download:
          $ref: '#/components/schemas/EpisodeAction'
        mapping_id:
          pattern: ^am_[0-9a-f]{64}$
          title: Mapping Id
          type: string
        review_automatically_transferred:
          const: false
          default: false
          title: Review Automatically Transferred
          type: boolean
        source_data:
          $ref: '#/components/schemas/LegacyEpisodeRef'
        source_review_count:
          minimum: 0.0
          title: Source Review Count
          type: integer
        source_revision:
          minimum: 0.0
          title: Source Revision
          type: integer
        source_revision_content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Source Revision Content Hash
          type: string
        source_status:
          title: Source Status
          type: string
        source_submission_count:
          minimum: 0.0
          title: Source Submission Count
          type: integer
        source_task_id:
          title: Source Task Id
          type: string
        target_revision:
          const: 1
          default: 1
          title: Target Revision
          type: integer
        target_revision_content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Target Revision Content Hash
          type: string
      required:
      - mapping_id
      - source_task_id
      - source_revision
      - source_revision_content_hash
      - source_data
      - source_status
      - source_submission_count
      - source_review_count
      - target_revision_content_hash
      - document_sha256
      - document_size
      - download
      title: EpisodeAnnotationMigration
      type: object
    EpisodeAnnotationState:
      additionalProperties: false
      properties:
        availability:
          enum:
          - AVAILABLE
          - NOT_CREATED
          - FORBIDDEN
          - SELECTION_REQUIRED
          title: Availability
          type: string
        current_approved_review_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Approved Review Id
        current_revision:
          anyOf:
          - $ref: '#/components/schemas/EpisodeRevisionIdentity'
          - type: 'null'
        current_submission_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Submission Id
        has_unsubmitted_changes:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Unsubmitted Changes
        historical_migrations:
          default: []
          items:
            $ref: '#/components/schemas/EpisodeAnnotationMigration'
          title: Historical Migrations
          type: array
        latest_approval:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Latest Approval
        latest_review:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Latest Review
        latest_submission:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Latest Submission
        revision_files:
          default: []
          items:
            additionalProperties: true
            type: object
          title: Revision Files
          type: array
        state_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Version
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        task_options:
          default: []
          items:
            additionalProperties: true
            type: object
          title: Task Options
          type: array
        task_options_has_more:
          default: false
          title: Task Options Has More
          type: boolean
      required:
      - availability
      title: EpisodeAnnotationState
      type: object
    EpisodeCameraDetail:
      additionalProperties: false
      properties:
        depth:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Depth
        feature:
          title: Feature
          type: string
        kind:
          enum:
          - RGB
          - DEPTH
          title: Kind
          type: string
        preview_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview Reason
        preview_status:
          enum:
          - NOT_GENERATED
          - PREPARING
          - READY
          - FAILED
          - INTEGRITY_FAILED
          title: Preview Status
          type: string
        shape:
          items:
            type: integer
          title: Shape
          type: array
        video_file_id:
          pattern: ^[0-9a-f]{64}$
          title: Video File Id
          type: string
      required:
      - feature
      - kind
      - shape
      - video_file_id
      - preview_status
      title: EpisodeCameraDetail
      type: object
    EpisodeDataReview:
      additionalProperties: false
      properties:
        actor_id:
          maxLength: 256
          minLength: 1
          title: Actor Id
          type: string
        comment:
          title: Comment
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        data:
          $ref: '#/components/schemas/DataVersionRef'
        decision:
          enum:
          - APPROVED
          - RETURNED
          title: Decision
          type: string
        format:
          const: hc-episode-data-review/1
          default: hc-episode-data-review/1
          title: Format
          type: string
        locations:
          items:
            $ref: '#/components/schemas/DataReviewLocation'
          title: Locations
          type: array
        previous_review_id:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Previous Review Id
        review_id:
          maxLength: 256
          minLength: 1
          title: Review Id
          type: string
        sequence:
          minimum: 1.0
          title: Sequence
          type: integer
      required:
      - review_id
      - data
      - sequence
      - previous_review_id
      - decision
      - actor_id
      - created_at
      - comment
      - locations
      title: EpisodeDataReview
      type: object
    EpisodeDataReviewAction:
      additionalProperties: false
      properties:
        action:
          enum:
          - SUBMIT_DATA_REVIEW
          - LINK_ANNOTATION_TAG
          title: Action
          type: string
        allowed:
          title: Allowed
          type: boolean
        denied_reason:
          anyOf:
          - const: MISSING_CAPABILITY
            type: string
          - type: 'null'
          title: Denied Reason
        required_capabilities:
          items:
            enum:
            - dataset_version.review
            - annotation_task.read
            type: string
          title: Required Capabilities
          type: array
      required:
      - action
      - allowed
      - required_capabilities
      - denied_reason
      title: EpisodeDataReviewAction
      type: object
    EpisodeDataReviewPage:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            $ref: '#/components/schemas/EpisodeDataReviewAction'
          title: Allowed Actions
          type: array
        current_sequence:
          minimum: 0.0
          title: Current Sequence
          type: integer
        data:
          $ref: '#/components/schemas/DataVersionRef'
        items:
          items:
            $ref: '#/components/schemas/EpisodeDataReview'
          title: Items
          type: array
        latest:
          anyOf:
          - $ref: '#/components/schemas/EpisodeDataReview'
          - type: 'null'
        next_before:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Before
        status:
          enum:
          - NOT_REVIEWED
          - APPROVED
          - RETURNED
          title: Status
          type: string
      required:
      - data
      - status
      - current_sequence
      - latest
      - items
      - next_before
      title: EpisodeDataReviewPage
      type: object
    EpisodeDeliveryCandidates:
      additionalProperties: false
      properties:
        collection_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection Version Id
        dataset_id:
          title: Dataset Id
          type: string
        items:
          items:
            $ref: '#/components/schemas/DataVersionRef'
          title: Items
          type: array
        legacy_episode_count:
          minimum: 0.0
          title: Legacy Episode Count
          type: integer
        next_offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Offset
        total:
          minimum: 0.0
          title: Total
          type: integer
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      required:
      - dataset_id
      - collection_version_id
      - version
      - items
      - total
      - legacy_episode_count
      - next_offset
      title: EpisodeDeliveryCandidates
      type: object
    EpisodeDeliveryDownload:
      additionalProperties: false
      properties:
        artifact_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Artifact Sha256
          type: string
        expires_seconds:
          const: 300
          default: 300
          title: Expires Seconds
          type: integer
        job_id:
          title: Job Id
          type: string
        size_bytes:
          exclusiveMinimum: 0.0
          title: Size Bytes
          type: integer
        url:
          title: Url
          type: string
      required:
      - job_id
      - artifact_sha256
      - size_bytes
      - url
      title: EpisodeDeliveryDownload
      type: object
    EpisodeDeliveryGeneration:
      additionalProperties: false
      properties:
        expected_generation:
          minimum: 1.0
          title: Expected Generation
          type: integer
      required:
      - expected_generation
      title: EpisodeDeliveryGeneration
      type: object
    EpisodeDeliveryJob:
      additionalProperties: false
      properties:
        artifact_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Artifact Sha256
        attempts:
          minimum: 0.0
          title: Attempts
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        generation:
          minimum: 1.0
          title: Generation
          type: integer
        job_id:
          pattern: ^ed_[0-9a-f]{64}$
          title: Job Id
          type: string
        phase:
          enum:
          - queued
          - verifying
          - projecting
          - archiving
          - uploading
          - completed
          - failed
          - cancelled
          title: Phase
          type: string
        plan:
          discriminator:
            mapping:
              hc-collection-delivery-plan/1: '#/components/schemas/CollectionDeliveryPlan'
              hc-episode-delivery-plan/1: '#/components/schemas/EpisodeDeliveryPlan'
            propertyName: format
          oneOf:
          - $ref: '#/components/schemas/EpisodeDeliveryPlan'
          - $ref: '#/components/schemas/CollectionDeliveryPlan'
          title: Plan
        processed_bytes:
          minimum: 0.0
          title: Processed Bytes
          type: integer
        processed_files:
          minimum: 0.0
          title: Processed Files
          type: integer
        size_bytes:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Size Bytes
        status:
          enum:
          - PENDING
          - RUNNING
          - READY
          - FAILED
          - CANCELLED
          title: Status
          type: string
        total_bytes:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Total Bytes
        total_files:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Total Files
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uploaded_bytes:
          minimum: 0.0
          title: Uploaded Bytes
          type: integer
      required:
      - job_id
      - plan
      - status
      - phase
      - generation
      - attempts
      - processed_files
      - processed_bytes
      - total_files
      - total_bytes
      - uploaded_bytes
      - created_at
      - updated_at
      title: EpisodeDeliveryJob
      type: object
    EpisodeDeliveryMember:
      additionalProperties: false
      properties:
        byte_count:
          exclusiveMinimum: 0.0
          title: Byte Count
          type: integer
        data:
          $ref: '#/components/schemas/DataVersionRef'
        file_count:
          minimum: 3.0
          title: File Count
          type: integer
        manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Manifest Sha256
          type: string
        root:
          pattern: ^(episode|episodes/[0-9]{6})$
          title: Root
          type: string
      required:
      - data
      - manifest_sha256
      - root
      - file_count
      - byte_count
      title: EpisodeDeliveryMember
      type: object
    EpisodeDeliveryPlan:
      additionalProperties: false
      properties:
        annotation_selection:
          const: package_contents_only
          default: package_contents_only
          title: Annotation Selection
          type: string
        archive_format:
          enum:
          - independent_episode_zip/1
          - independent_episode_batch_zip/1
          title: Archive Format
          type: string
        format:
          const: hc-episode-delivery-plan/1
          default: hc-episode-delivery-plan/1
          title: Format
          type: string
        members:
          items:
            $ref: '#/components/schemas/EpisodeDeliveryMember'
          maxItems: 100
          minItems: 1
          title: Members
          type: array
        modalities:
          const: all_collected
          default: all_collected
          title: Modalities
          type: string
        processor_version:
          const: hc-episode-archive/1
          default: hc-episode-archive/1
          title: Processor Version
          type: string
        reader_version:
