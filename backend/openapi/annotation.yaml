openapi: 3.1.0
info:
  title: Annotation API Fragment
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/projects/{project_id}/tag-schemas:
    post:
      operationId: createTagSchemaVersion
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTagSchemaVersionRequest'}
      responses:
        '201':
          description: A mutable draft version was created; its identity is immutable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagSchemaVersion'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Publisher role or project scope is missing.}
        '409': {description: The schema identity already contains different content.}
        '422': {description: The hierarchy, constraint references, or request is invalid.}
  /api/v1/projects/{project_id}/tag-schemas/{schema_id}/versions:
    get:
      operationId: listTagSchemaVersions
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: schema_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: All immutable versions of one project Tag Schema.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TagSchemaVersion'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
  /api/v1/projects/{project_id}/tag-schemas/{schema_id}/versions/{version}:
    get:
      operationId: getTagSchemaVersion
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: schema_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: version
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: One exact Tag Schema version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagSchemaVersion'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The schema version does not exist.}
  /api/v1/projects/{project_id}/tag-schemas/{schema_id}/versions/{version}/publish:
    post:
      operationId: publishTagSchemaVersion
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: schema_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: version
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Published immutable version; replay returns the same resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagSchemaVersion'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Publisher role or project scope is missing.}
        '404': {description: The schema version does not exist.}
        '409': {description: The schema changed concurrently.}
  /api/v1/projects/{project_id}/annotation-tasks:
    parameters:
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: listAnnotationTasks
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AnnotationStatus'
      responses:
        '200':
          description: Project-scoped annotation queue.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AnnotationTask'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
  /api/v1/annotation-tasks/{task_id}:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationTask
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Current task state in the caller's project scope.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationTask'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
  /api/v1/annotation-tasks/{task_id}/claim:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    post:
      operationId: claimAnnotationTask
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: The task is claimed by the Annotator.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationTask'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Annotator role or project scope is missing.}
        '404': {description: The task does not exist.}
        '409': {description: The task is claimed by another Annotator.}
  /api/v1/annotation-tasks/{task_id}/draft:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationDraft
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Current assignee-only draft projection.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationDraft'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: The caller is not the scoped Annotator assignee.}
        '404': {description: The task does not exist.}
  /api/v1/annotation-tasks/{task_id}/current:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationCurrent
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Current workflow pointers.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationCurrent'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
  /api/v1/annotation-tasks/{task_id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: listAnnotationRevisions
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Immutable revision history, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AnnotationRevision'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
    post:
      operationId: saveAnnotationDraft
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveDraftRequest'}
      responses:
        '201':
          description: Immutable revision created, or the identical mutation replayed.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationRevision'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: The caller is not the scoped Annotator assignee.}
        '404': {description: The task does not exist.}
        '409': {description: The revision/ETag is stale or a mutation identifier was reused differently.}
        '422': {description: A hierarchy, half-open boundary, attribute, conflict, relation, or schema check failed.}
  /api/v1/annotation-tasks/{task_id}/revisions/{revision}:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationRevision
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: revision
          in: path
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: One immutable revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationRevision'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task or revision does not exist.}
  /api/v1/annotation-tasks/{task_id}/submit:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    post:
      operationId: submitAnnotationRevision
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, minLength: 1}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRequest'}
      responses:
        '201':
          description: Immutable reviewable version, or an identical idempotent replay.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationSubmission'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: The caller is not the scoped Annotator assignee.}
        '404': {description: The task does not exist.}
        '409': {description: State/revision/ETag is stale or Idempotency-Key was reused differently.}
        '422': {description: A required review check failed.}
  /api/v1/annotation-tasks/{task_id}/submissions:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: listAnnotationSubmissions
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Immutable reviewable versions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AnnotationSubmission'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
  /api/v1/annotation-tasks/{task_id}/submissions/{submission_id}:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationSubmission
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: submission_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: One immutable reviewable version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationSubmission'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task or submission does not exist.}
  /api/v1/annotation-tasks/{task_id}/reviews:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: listAnnotationReviews
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Append-only review history.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AnnotationReview'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
    post:
      operationId: reviewAnnotationRevision
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewRequest'}
      responses:
        '200':
          description: Review appended and current workflow state updated.
          headers:
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationTask'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Reviewer role/scope is missing or configured policy denies self-review.}
        '404': {description: The task or submission does not exist.}
        '409': {description: Submission/ETag is stale, or OPEN-08 policy remains unconfigured.}
  /api/v1/annotation-tasks/{task_id}/history:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getAnnotationHistory
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Current task plus immutable revisions and reviews.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationHistory'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task does not exist.}
  /api/v1/annotation-tasks/{task_id}/exclusions:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getEffectiveExclusions
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: revision
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Canonical disjoint half-open ranges applied to all modalities.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ExclusionRange'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
        '404': {description: The task or revision does not exist.}
  /api/v1/projects/{project_id}/rollouts/{rollout_id}/approved-annotation:
    parameters:
      - {$ref: '#/components/parameters/AnnotationRegion'}
    get:
      operationId: getApprovedAnnotation
      tags: [annotation]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: rollout_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Immutable approved revision snapshot for a Publisher.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnotationApprovedV1'}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Publisher role or project scope is missing.}
        '404': {description: The scoped task does not exist.}
        '409': {description: There is no currently approved revision.}
  /api/v1/capabilities/auto-annotation:
    get:
      operationId: getAutoAnnotationCapability
      tags: [annotation]
      security: []
      responses:
        '200':
          description: Phase-one VLM capability is explicitly disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutoAnnotationCapability'}
  /api/v1/annotation-tasks/{task_id}/auto-annotation:
    parameters:
      - {$ref: '#/components/parameters/AnnotationProject'}
      - {$ref: '#/components/parameters/AnnotationRegion'}
    post:
      operationId: requestAutoAnnotation
      tags: [annotation]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutoAnnotationRequest'}
      responses:
        '501': {description: FEATURE_DISABLED; no task or fake result is created.}
        '401': {description: A verified BE-02 context is missing.}
        '403': {description: Project scope or an annotation role is missing.}
components:
  parameters:
    AnnotationProject:
      name: X-Project-ID
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Must select the exact project that owns the task.
    AnnotationRegion:
      name: X-Region-Code
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Must select the exact region that owns the task; project-wide scope is not a cross-region bypass.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque platform session
  schemas:
    AutoAnnotationRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 0}
    AnnotationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, NEEDS_REVISION, REJECTED]
    ReviewDecision:
      type: string
      enum: [APPROVE, NEEDS_REVISION, REJECT]
    RevisionOrigin:
      type: string
      enum: [ANNOTATION, LEGACY_CLEANING]
    TagSchemaStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    AnnotationTaskKind:
      type: string
      enum: [TAGGING]
    AnnotationTaskCreationSource:
      type: string
      enum: [LEGACY, SYSTEM_LANCE]
    TagAttributeType:
      type: string
      enum: [STRING, INTEGER, NUMBER, BOOLEAN, ENUM]
    ReviewCheckKind:
      type: string
      enum:
        - HIERARCHY
        - BOUNDARY
        - REQUIRED_ATTRIBUTES
        - MUTUAL_EXCLUSION
        - OBJECT_RELATIONS
        - SCHEMA_VERSION
    ReviewCheckStatus:
      type: string
      enum: [PASS]
    TagAttributeDefinition:
      type: object
      required: [key, display_name, value_type]
      properties:
        key: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'}
        display_name: {type: string, minLength: 1, maxLength: 256}
        value_type: {$ref: '#/components/schemas/TagAttributeType'}
        required: {type: boolean, default: false}
        enum_values:
          type: array
          items: {type: string}
          default: []
    TagNodeDefinition:
      type: object
      description: One node in an unbounded-depth, single-parent hierarchy.
      required: [tag_id, code, display_name]
      properties:
        tag_id: {type: string, minLength: 1, maxLength: 256}
        code: {type: string, minLength: 1, maxLength: 256}
        display_name: {type: string, minLength: 1, maxLength: 256}
        parent_tag_id: {type: [string, 'null']}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/TagAttributeDefinition'}
          default: []
    MutualExclusionConstraint:
      type: object
      required: [constraint_id, tag_ids]
      properties:
        constraint_id: {type: string, minLength: 1, maxLength: 256}
        tag_ids:
          type: array
          minItems: 2
          items: {type: string}
    ObjectRelationConstraint:
      type: object
      required: [relation_type, source_tag_ids, target_object_types]
      properties:
        relation_type: {type: string, minLength: 1, maxLength: 128}
        source_tag_ids:
          type: array
          minItems: 1
          items: {type: string}
        target_object_types:
          type: array
          minItems: 1
          items: {type: string}
        required: {type: boolean, default: false}
    TagSchemaDocument:
      type: object
      description: Immutable schema content; OPEN-07 leaves hierarchy depth unbounded.
      required: [nodes]
      properties:
        nodes:
          type: array
          items: {$ref: '#/components/schemas/TagNodeDefinition'}
        mutual_exclusions:
          type: array
          items: {$ref: '#/components/schemas/MutualExclusionConstraint'}
          default: []
        object_relations:
          type: array
          items: {$ref: '#/components/schemas/ObjectRelationConstraint'}
          default: []
    TagSchemaTarget:
      type: object
      additionalProperties: false
      required: [region_code, dataset_id, dataset_schema_snapshot_id]
      properties:
        region_code: {type: string, minLength: 1, maxLength: 128}
        dataset_id: {type: string, minLength: 1, maxLength: 256}
        dataset_schema_snapshot_id: {type: string, minLength: 1, maxLength: 256}
        task_kind: {$ref: '#/components/schemas/AnnotationTaskKind'}
    TagSchemaVersion:
      type: object
      required:
        - schema_id
        - project_id
        - name
        - version
        - document
        - content_hash
        - created_by
        - created_at
      properties:
        schema_id: {type: string, minLength: 1, maxLength: 256}
        project_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 256}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/TagSchemaStatus'}
        document: {$ref: '#/components/schemas/TagSchemaDocument'}
        compatible_targets:
          type: array
          items: {$ref: '#/components/schemas/TagSchemaTarget'}
          default: []
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_by: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        published_by: {type: [string, 'null']}
        published_at: {type: [string, 'null'], format: date-time}
    CreateTagSchemaVersionRequest:
      type: object
      additionalProperties: false
      required: [name, document]
      properties:
        schema_id: {type: [string, 'null'], minLength: 1, maxLength: 256}
        version: {type: [integer, 'null'], minimum: 1}
        name: {type: string, minLength: 1, maxLength: 256}
        document: {$ref: '#/components/schemas/TagSchemaDocument'}
        compatible_targets:
          type: array
          items: {$ref: '#/components/schemas/TagSchemaTarget'}
          default: []
    TagObjectRef:
      type: object
      required: [object_id, object_type]
      properties:
        object_id: {type: string, minLength: 1, maxLength: 512}
        object_type: {type: string, minLength: 1, maxLength: 128}
    AnnotationObjectRelation:
      type: object
      required: [relation_type, target]
      properties:
        relation_type: {type: string, minLength: 1, maxLength: 128}
        target: {$ref: '#/components/schemas/TagObjectRef'}
    AnnotationTag:
      type: object
      description: One schema-pinned Tag instance over a half-open Lance interval.
      required: [annotation_id, tag_id, path, start_step, end_step]
      properties:
        annotation_id: {type: string, minLength: 1, maxLength: 256}
        tag_id: {type: string, minLength: 1, maxLength: 256}
        path:
          type: array
          minItems: 1
          items: {type: string}
        start_step: {type: integer, minimum: 0}
        end_step: {type: integer, minimum: 1}
        attributes:
          type: object
          additionalProperties: {type: [string, integer, number, boolean]}
        subject:
          oneOf:
            - {$ref: '#/components/schemas/TagObjectRef'}
            - {type: 'null'}
        relations:
          type: array
          items: {$ref: '#/components/schemas/AnnotationObjectRelation'}
          default: []
    LegacyAuditReference:
      type: object
      required: [draft_id, source_revision, source_actor_id, source_created_at]
      properties:
        source_system: {type: string, const: P11_CLEANING, default: P11_CLEANING}
        draft_id: {type: string, minLength: 1}
        source_revision: {type: integer, minimum: 0}
