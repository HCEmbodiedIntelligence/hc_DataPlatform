components:
  schemas:
    CreateDatasetCommand:
      additionalProperties: false
      properties:
        description:
          maxLength: 4096
          title: Description
          type: string
        labels:
          default: []
          items:
            type: string
          maxItems: 64
          title: Labels
          type: array
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - description
      title: CreateDatasetCommand
      type: object
    DatasetPageActor:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        id:
          maxLength: 256
          minLength: 1
          title: Id
          type: string
      required:
      - id
      - display_name
      title: DatasetPageActor
      type: object
    DatasetPageAllowedAction:
      additionalProperties: false
      properties:
        action:
          maxLength: 128
          minLength: 1
          title: Action
          type: string
        allowed:
          title: Allowed
          type: boolean
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageBlockedReason'
          title: Blocked Reasons
          type: array
      required:
      - action
      - allowed
      title: DatasetPageAllowedAction
      type: object
    DatasetPageApproveReviewCommand:
      additionalProperties: false
      properties:
        expected_status:
          const: REVIEWING
          title: Expected Status
          type: string
        review_token:
          maxLength: 2048
          minLength: 32
          title: Review Token
          type: string
      required:
      - expected_status
      - review_token
      title: DatasetPageApproveReviewCommand
      type: object
    DatasetPageApproveReviewOutputVersion:
      additionalProperties: false
      properties:
        id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Id
          type: string
        status:
          const: REVIEWING
          default: REVIEWING
          title: Status
          type: string
        version_token:
          maxLength: 256
          minLength: 16
          title: Version Token
          type: string
      required:
      - id
      - version_token
      title: DatasetPageApproveReviewOutputVersion
      type: object
    DatasetPageApproveReviewResult:
      additionalProperties: false
      properties:
        contract_version:
          const: dataset-version-review.v1alpha1
          default: dataset-version-review.v1alpha1
          title: Contract Version
          type: string
        job:
          $ref: '#/components/schemas/DatasetPageAsyncJob'
        output_version:
          $ref: '#/components/schemas/DatasetPageApproveReviewOutputVersion'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        review_decision:
          $ref: '#/components/schemas/DatasetPageReviewDecision'
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
      required:
      - review_decision
      - output_version
      - job
      - scope
      - request_id
      title: DatasetPageApproveReviewResult
      type: object
    DatasetPageAsyncJob:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        job_id:
          maxLength: 256
          minLength: 1
          title: Job Id
          type: string
        job_type:
          maxLength: 128
          minLength: 1
          title: Job Type
          type: string
        progress:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Progress
        resource_id:
          maxLength: 256
          minLength: 1
          title: Resource Id
          type: string
        resource_type:
          maxLength: 128
          minLength: 1
          title: Resource Type
          type: string
        resource_version:
          pattern: ^(0|[1-9][0-9]*)$
          title: Resource Version
          type: string
        result_ref:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result Ref
        status:
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - job_id
      - job_type
      - status
      - resource_type
      - resource_id
      - created_at
      - updated_at
      - resource_version
      title: DatasetPageAsyncJob
      type: object
    DatasetPageBlockedReason:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 1
          title: Code
          type: string
        message:
          maxLength: 1000
          minLength: 1
          title: Message
          type: string
      required:
      - code
      - message
      title: DatasetPageBlockedReason
      type: object
    DatasetPageBootstrapData:
      additionalProperties: false
      properties:
        current_ready_version:
          anyOf:
          - $ref: '#/components/schemas/DatasetPageCurrentReadyVersion'
          - type: 'null'
        dataset:
          $ref: '#/components/schemas/DatasetPageDataset'
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
        suggested_version_id:
          anyOf:
          - pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
            type: string
          - type: 'null'
          title: Suggested Version Id
        summary:
          $ref: '#/components/schemas/DatasetPageDetailSummary'
      required:
      - scope
      - dataset
      - summary
      title: DatasetPageBootstrapData
      type: object
    DatasetPageBootstrapEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DatasetPageBootstrapData'
        meta:
          $ref: '#/components/schemas/DatasetPageMeta'
      required:
      - data
      - meta
      title: DatasetPageBootstrapEnvelope
      type: object
    DatasetPageCapabilities:
      additionalProperties: false
      properties:
        allowed_actions:
          default: []
          items:
            type: string
          title: Allowed Actions
          type: array
        authorization_revision:
          maxLength: 128
          minLength: 1
          title: Authorization Revision
          type: string
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageBlockedReason'
          title: Blocked Reasons
          type: array
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
      required:
      - scope
      - authorization_revision
      title: DatasetPageCapabilities
      type: object
    DatasetPageCapabilitiesEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DatasetPageCapabilities'
        meta:
          $ref: '#/components/schemas/DatasetPageMeta'
      required:
      - data
      - meta
      title: DatasetPageCapabilitiesEnvelope
      type: object
    DatasetPageContentReference:
      additionalProperties: false
      properties:
        reference_id:
          maxLength: 256
          minLength: 1
          title: Reference Id
          type: string
        reference_type:
          maxLength: 128
          minLength: 1
          title: Reference Type
          type: string
        reference_version:
          maxLength: 256
          minLength: 1
          title: Reference Version
          type: string
        sha256:
          pattern: ^[a-fA-F0-9]{64}$
          title: Sha256
          type: string
      required:
      - reference_type
      - reference_id
      - reference_version
      - sha256
      title: DatasetPageContentReference
      type: object
    DatasetPageContentSnapshot:
      additionalProperties: false
      properties:
        calibration_refs:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageContentReference'
          title: Calibration Refs
          type: array
        content_snapshot_hash:
          pattern: ^[a-fA-F0-9]{64}$
          title: Content Snapshot Hash
          type: string
        content_snapshot_id:
          maxLength: 256
          minLength: 1
          title: Content Snapshot Id
          type: string
        revision_refs:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageRevisionSnapshotReference'
          title: Revision Refs
          type: array
        robot_model_refs:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageContentReference'
          title: Robot Model Refs
          type: array
        schema_ref:
          $ref: '#/components/schemas/DatasetPageContentReference'
        source_manifest_refs:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageContentReference'
          title: Source Manifest Refs
          type: array
      required:
      - content_snapshot_id
      - content_snapshot_hash
      - schema_ref
      title: DatasetPageContentSnapshot
      type: object
    DatasetPageCurrentReadyVersion:
      additionalProperties: false
      properties:
        display_version:
          maxLength: 64
          minLength: 1
          title: Display Version
          type: string
        kind:
          maxLength: 64
          minLength: 1
          title: Kind
          type: string
        manifest_sha256:
          pattern: ^[a-fA-F0-9]{64}$
          title: Manifest Sha256
          type: string
        published_at:
          format: date-time
          title: Published At
          type: string
        status:
          const: READY
          default: READY
          title: Status
          type: string
        version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Version Id
          type: string
      required:
      - version_id
      - display_version
      - kind
      - published_at
      - manifest_sha256
      title: DatasetPageCurrentReadyVersion
      type: object
    DatasetPageDataset:
      additionalProperties: false
      properties:
        allowed_actions:
          items:
            $ref: '#/components/schemas/DatasetPageAllowedAction'
          title: Allowed Actions
          type: array
        availability:
          maxLength: 64
          minLength: 1
          title: Availability
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        dataset_id:
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        description:
          maxLength: 4096
          title: Description
          type: string
        etag:
          maxLength: 256
          minLength: 3
          title: Etag
          type: string
        labels:
          default: []
          items:
            type: string
          title: Labels
          type: array
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        owner:
          $ref: '#/components/schemas/DatasetPageActor'
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - scope
      - dataset_id
      - name
      - description
      - availability
      - owner
      - created_at
      - updated_at
      - etag
      - allowed_actions
      title: DatasetPageDataset
      type: object
    DatasetPageDatasetEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DatasetPageDataset'
        meta:
          $ref: '#/components/schemas/DatasetPageMeta'
      required:
      - data
      - meta
      title: DatasetPageDatasetEnvelope
      type: object
    DatasetPageDeletionAsyncImpact:
      additionalProperties: false
      properties:
        dependent_projection_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Dependent Projection Count
          type: string
        estimated_bytes:
          pattern: ^(0|[1-9][0-9]*)$
          title: Estimated Bytes
          type: string
        object_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Object Count
          type: string
        requires_async_job:
          const: true
          default: true
          title: Requires Async Job
          type: boolean
      required:
      - object_count
      - estimated_bytes
      - dependent_projection_count
      title: DatasetPageDeletionAsyncImpact
      type: object
    DatasetPageDeletionCheck:
      additionalProperties: false
      properties:
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageBlockedReason'
          title: Blocked Reasons
          type: array
        check_type:
          enum:
          - ACTIVE_REFERENCES
          - RETENTION
          - LEGAL_HOLD
          - PERMISSION
          - CONCURRENT_JOBS
          - CURRENT_READY
          - AUDIT_PROTECTION
          title: Check Type
          type: string
        observed_policy_version:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Observed Policy Version
        passed:
          title: Passed
          type: boolean
        retained_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Retained Until
      required:
      - check_type
      - passed
      title: DatasetPageDeletionCheck
      type: object
    DatasetPageDeletionPreflight:
      additionalProperties: false
      properties:
        async_impact:
          $ref: '#/components/schemas/DatasetPageDeletionAsyncImpact'
        blocked_reasons:
          default: []
          items:
            $ref: '#/components/schemas/DatasetPageBlockedReason'
          title: Blocked Reasons
          type: array
        capability_status:
          const: RESERVED_CONDITIONAL
          default: RESERVED_CONDITIONAL
          title: Capability Status
          type: string
        checks:
          items:
            $ref: '#/components/schemas/DatasetPageDeletionCheck'
          maxItems: 7
          minItems: 7
          title: Checks
          type: array
        domain_clear:
          title: Domain Clear
          type: boolean
        executable:
          const: false
          default: false
          title: Executable
          type: boolean
        expires_at:
          format: date-time
          title: Expires At
          type: string
        preflight_token:
          maxLength: 2048
          minLength: 32
          title: Preflight Token
          type: string
        resource_id:
          maxLength: 256
          minLength: 1
          title: Resource Id
          type: string
        resource_type:
          enum:
          - DATASET
          - DATASET_VERSION
          title: Resource Type
          type: string
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
      required:
      - scope
      - resource_type
      - resource_id
      - domain_clear
      - preflight_token
      - expires_at
      - checks
      - async_impact
      title: DatasetPageDeletionPreflight
      type: object
    DatasetPageDeletionPreflightCommand:
      additionalProperties: false
      properties:
        expected_etag:
          maxLength: 256
          minLength: 3
          title: Expected Etag
          type: string
        intent:
          const: DELETE
          title: Intent
          type: string
        reason:
          maxLength: 4096
          minLength: 1
          title: Reason
          type: string
      required:
      - intent
      - reason
      - expected_etag
      title: DatasetPageDeletionPreflightCommand
      type: object
    DatasetPageDetailSummary:
      additionalProperties: false
      properties:
        actionable_draft_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Actionable Draft Count
          type: string
        actual_oss_bytes:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Actual Oss Bytes
        calculated_at:
          format: date-time
          title: Calculated At
          type: string
        calculation_state:
          enum:
          - CALCULATING
          - PARTIAL
          - SETTLED
          - FAILED
          title: Calculation State
          type: string
        effective_duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Effective Duration Ns
          type: string
        episode_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Episode Count
          type: string
        pending_review_version_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Pending Review Version Count
          type: string
        required_physical_bytes:
          pattern: ^(0|[1-9][0-9]*)$
          title: Required Physical Bytes
          type: string
        returned_version_count:
          pattern: ^(0|[1-9][0-9]*)$
          title: Returned Version Count
          type: string
        source_bytes:
          pattern: ^(0|[1-9][0-9]*)$
          title: Source Bytes
          type: string
      required:
      - episode_count
      - effective_duration_ns
      - source_bytes
      - required_physical_bytes
      - pending_review_version_count
      - returned_version_count
      - actionable_draft_count
      - calculated_at
      - calculation_state
      title: DatasetPageDetailSummary
      type: object
    DatasetPageDiffJobCommand:
      additionalProperties: false
      properties:
        compare_to:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Compare To
          type: string
        snapshot_token:
          maxLength: 2048
          minLength: 16
          title: Snapshot Token
          type: string
      required:
      - compare_to
      - snapshot_token
      title: DatasetPageDiffJobCommand
      type: object
    DatasetPageEpisodeDataBinding:
      additionalProperties: false
      description: 'Immutable logical lineage for a non-camera Viewer stream.


        This is intentionally narrower than a Lance row: it carries the committed

        catalog version, rollout, modality name and declared value shape, never a

        physical table/object location or arbitrary expression.  The browser can

        therefore request only the bounded step interval promised by its immutable

        episode revision.'
      properties:
        end_step:
          exclusiveMinimum: 0.0
          maximum: 9007199254740991.0
          title: End Step
          type: integer
        lance_version:
          minimum: 1.0
          title: Lance Version
          type: integer
        modality_key:
          maxLength: 512
          minLength: 1
          title: Modality Key
          type: string
        rollout_id:
          maxLength: 256
          minLength: 1
          title: Rollout Id
          type: string
        start_step:
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Start Step
          type: integer
        value_kind:
          enum:
          - SCALAR
          - VECTOR
          - POINTCLOUD_XYZ
          - EVENT
          title: Value Kind
          type: string
      required:
      - rollout_id
      - lance_version
      - modality_key
      - value_kind
      - start_step
      - end_step
      title: DatasetPageEpisodeDataBinding
      type: object
    DatasetPageEpisodeListEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: dataset-version-review.v1alpha1
          default: dataset-version-review.v1alpha1
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/DatasetPageEpisodeListItem'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/DatasetPageInfo'
        request_id:
          maxLength: 128
          minLength: 1
          title: Request Id
          type: string
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
        snapshot_at:
          format: date-time
          title: Snapshot At
          type: string
        snapshot_id:
          maxLength: 256
          minLength: 1
          title: Snapshot Id
          type: string
      required:
      - items
      - page_info
      - snapshot_at
      - snapshot_id
      - scope
      - request_id
      title: DatasetPageEpisodeListEnvelope
      type: object
    DatasetPageEpisodeListItem:
      additionalProperties: false
      properties:
        dataset_id:
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        included:
          title: Included
          type: boolean
        review_finding_count:
          anyOf:
          - pattern: ^(0|[1-9][0-9]*)$
            type: string
          - type: 'null'
          title: Review Finding Count
        review_status:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Review Status
        robot_id:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Robot Id
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
        selected_revision:
          $ref: '#/components/schemas/DatasetPageRevisionSnapshotReference'
        success_state:
          maxLength: 64
          minLength: 1
          title: Success State
          type: string
        task:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Task
        version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Version Id
          type: string
      required:
      - scope
      - dataset_id
      - version_id
      - episode_id
      - selected_revision
      - included
      - success_state
      title: DatasetPageEpisodeListItem
      type: object
    DatasetPageEpisodePreviewBinding:
      additionalProperties: false
      description: 'Immutable, safe link from one collection stream to aligned preview data.


        A dataset-page revision deliberately never stores a physical Lance URI, object

        key, credential, or signed media URL.  This binding carries only the logical

        lineage the browser needs to ask the preview service for a short-lived HLS

        capability.  It is optional so historic revisions remain readable, but a

        camera stream is *not* browser-playable unless its projection supplies one.'
      properties:
        annotation_revision:
          minimum: 0.0
          title: Annotation Revision
          type: integer
        camera_id:
          maxLength: 256
          minLength: 1
          title: Camera Id
          type: string
        end_step:
          exclusiveMinimum: 0.0
          maximum: 9007199254740991.0
          title: End Step
          type: integer
        frequency_hz:
          exclusiveMinimum: 0.0
          maximum: 240.0
          title: Frequency Hz
          type: number
        lance_version:
          minimum: 1.0
          title: Lance Version
          type: integer
        rollout_id:
          maxLength: 256
          minLength: 1
          title: Rollout Id
          type: string
        start_step:
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Start Step
          type: integer
      required:
      - rollout_id
      - lance_version
      - annotation_revision
      - camera_id
      - frequency_hz
      - start_step
      - end_step
      title: DatasetPageEpisodePreviewBinding
      type: object
    DatasetPageEpisodeRevision:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[a-fA-F0-9]{64}$
          title: Content Sha256
          type: string
        dataset_id:
          pattern: ^dataset_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Dataset Id
          type: string
        duration_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Duration Ns
          type: string
        episode_id:
          pattern: ^episode_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Episode Id
          type: string
        ordinal:
          minimum: 0.0
          title: Ordinal
          type: integer
        revision_id:
          pattern: ^revision_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Revision Id
          type: string
        scope:
          $ref: '#/components/schemas/DatasetPageScope'
        started_at_ns:
          pattern: ^(0|[1-9][0-9]*)$
          title: Started At Ns
          type: string
        streams:
          items:
            $ref: '#/components/schemas/DatasetPageEpisodeStream'
          minItems: 1
          title: Streams
          type: array
        version_id:
          pattern: ^version_[A-Za-z0-9][A-Za-z0-9_-]{1,95}$
          title: Version Id
          type: string
      required:
      - scope
      - dataset_id
      - version_id
      - episode_id
      - revision_id
      - ordinal
      - content_sha256
      - started_at_ns
      - duration_ns
      - streams
      title: DatasetPageEpisodeRevision
      type: object
    DatasetPageEpisodeRevisionEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DatasetPageEpisodeRevision'
        meta:
          $ref: '#/components/schemas/DatasetPageMeta'
      required:
      - data
      - meta
      title: DatasetPageEpisodeRevisionEnvelope
      type: object
    DatasetPageEpisodeRevisionHistoryEnvelope:
      additionalProperties: false
      properties:
        contract_version:
          const: dataset-version-review.v1alpha1
          default: dataset-version-review.v1alpha1
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/DatasetPageEpisodeRevisionHistoryItem'
          title: Items
          type: array
        page_info:
          $ref: '#/components/schemas/DatasetPageInfo'
        request_id:
