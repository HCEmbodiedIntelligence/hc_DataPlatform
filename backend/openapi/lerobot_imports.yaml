components:
  schemas:
    NativeConfiguration:
      properties:
        configured:
          type: boolean
          title: Configured
        schema_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Id
        schema_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      type: object
      required:
      - configured
      title: NativeConfiguration
    NativeImportProgress:
      properties:
        import_id:
          title: Import Id
          type: string
        dataset_id:
          title: Dataset Id
          type: string
        status:
          title: Status
          type: string
        episode_count:
          title: Episode Count
          type: integer
        ready:
          title: Ready
          type: integer
        failed:
          title: Failed
          type: integer
        last_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error Code
        updated_at:
          format: date-time
          title: Updated At
          type: string
        source_format:
          default: LEROBOT_V3
          title: Source Format
          type: string
        file_count:
          default: 0
          title: File Count
          type: integer
        total_bytes:
          default: 0
          title: Total Bytes
          type: integer
      required:
      - import_id
      - dataset_id
      - status
      - episode_count
      - ready
      - failed
      - last_error_code
      - updated_at
      title: NativeImportProgress
      type: object
    NativeLabelsRequest:
      properties:
        dataset_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Dataset Id
        labels:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 1
          title: Labels
      type: object
      required:
      - dataset_id
      - labels
      title: NativeLabelsRequest
    LeRobotSourceFileV1:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        size:
          type: integer
          maximum: 5497558138880.0
          exclusiveMinimum: 0.0
          title: Size
        part_count:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Part Count
        last_modified_ms:
          anyOf:
          - type: integer
            maximum: 9007199254740991.0
            minimum: 0.0
          - type: 'null'
          title: Last Modified Ms
      additionalProperties: false
      type: object
      required:
      - path
      - size
      - part_count
      title: LeRobotSourceFileV1
    CreateLeRobotImportV1:
      properties:
        schema_version:
          type: string
          const: lerobot-web-import/v1
          title: Schema Version
          default: lerobot-web-import/v1
        dataset_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Dataset Id
        collection_task_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
          - type: 'null'
          title: Collection Task Id
        robot_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
          - type: 'null'
          title: Robot Id
        source_format:
          type: string
          enum:
          - LEROBOT_V3
          - MCAP
          - ROSBAG
          title: Source Format
          default: LEROBOT_V3
        processing_mode:
          type: string
          enum:
          - STORE_ONLY
          - PROCESS
          title: Processing Mode
          default: STORE_ONLY
        info:
          additionalProperties: true
          type: object
          title: Info
        files:
          items:
            $ref: '#/components/schemas/LeRobotSourceFileV1'
          type: array
          maxItems: 10000
          minItems: 1
          title: Files
      additionalProperties: false
      type: object
      required:
      - dataset_id
      - files
      title: CreateLeRobotImportV1
    LeRobotAssetUploadGrantV1:
      properties:
        path:
          type: string
          title: Path
        multipart_upload_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Multipart Upload Id
        parts:
          items:
            $ref: '#/components/schemas/PartAuthorization'
          type: array
          title: Parts
          default: []
        completed:
          type: boolean
          title: Completed
          default: false
      additionalProperties: false
      type: object
      required:
      - path
      title: LeRobotAssetUploadGrantV1
    LeRobotImportGrantV1:
      properties:
        schema_version:
          type: string
          const: lerobot-web-import-grant/v1
          title: Schema Version
          default: lerobot-web-import-grant/v1
        import_id:
          type: string
          pattern: ^[a-f0-9]{32}$
          title: Import Id
        assets:
          items:
            $ref: '#/components/schemas/LeRobotAssetUploadGrantV1'
          type: array
          title: Assets
      additionalProperties: false
      type: object
      required:
      - import_id
      - assets
      title: LeRobotImportGrantV1
    AuthorizeLeRobotPartsV1:
      properties:
        dataset_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Dataset Id
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        multipart_upload_id:
          type: string
