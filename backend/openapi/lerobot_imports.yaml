components:
  schemas:
    AuthorizeLeRobotPartsV1:
      additionalProperties: false
      properties:
        dataset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Dataset Id
          type: string
        multipart_upload_id:
          maxLength: 2048
          minLength: 1
          title: Multipart Upload Id
          type: string
        part_numbers:
          items:
            type: integer
          maxItems: 256
          minItems: 1
          title: Part Numbers
          type: array
        path:
          maxLength: 1024
          minLength: 1
          title: Path
          type: string
      required:
      - dataset_id
      - path
      - multipart_upload_id
      - part_numbers
      title: AuthorizeLeRobotPartsV1
      type: object
    CommitLeRobotImportV1:
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/CreateLeRobotImportV1'
      required:
      - manifest
      title: CommitLeRobotImportV1
      type: object
    CompleteLeRobotAssetV1:
      additionalProperties: false
      properties:
        dataset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Dataset Id
          type: string
        multipart_upload_id:
          maxLength: 2048
          minLength: 1
          title: Multipart Upload Id
          type: string
        part_count:
          maximum: 10000.0
          minimum: 1.0
          title: Part Count
          type: integer
        path:
          maxLength: 1024
          minLength: 1
          title: Path
          type: string
        size:
          exclusiveMinimum: 0.0
          maximum: 5497558138880.0
          title: Size
          type: integer
      required:
      - dataset_id
      - path
      - multipart_upload_id
      - size
      - part_count
      title: CompleteLeRobotAssetV1
      type: object
    CreateLeRobotImportV1:
      additionalProperties: false
      properties:
        collection_task_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Collection Task Id
        dataset_id:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Dataset Id
          type: string
        files:
          items:
            $ref: '#/components/schemas/LeRobotSourceFileV1'
          maxItems: 10000
          minItems: 1
          title: Files
          type: array
        info:
          additionalProperties: true
          title: Info
          type: object
        processing_capability_revision:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Processing Capability Revision
        processing_mode:
          default: STORE_ONLY
          enum:
          - STORE_ONLY
          - PROCESS
          title: Processing Mode
          type: string
        robot_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          - type: 'null'
          title: Robot Id
        schema_version:
          const: lerobot-web-import/v1
          default: lerobot-web-import/v1
          title: Schema Version
          type: string
        source_format:
          default: LEROBOT_V3
          enum:
          - LEROBOT_V3
          - MCAP
          - ROSBAG
          title: Source Format
          type: string
      required:
      - dataset_id
      - files
      title: CreateLeRobotImportV1
      type: object
    EpisodeResolution:
      properties:
        action:
          anyOf:
          - enum:
            - REPROCESS
            - DISCARD
            type: string
          - type: 'null'
          title: Action
        available:
          title: Available
          type: boolean
        discard_available:
          default: false
          title: Discard Available
          type: boolean
        discard_unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Discard Unavailable Reason
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        expected_attempt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Attempt Id
        resolution_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution Id
        status:
          enum:
          - UNRESOLVED
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - DISCARDED
          title: Status
          type: string
        unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailable Reason
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - status
      - available
      title: EpisodeResolution
      type: object
    LeRobotAssetCompletedV1:
      additionalProperties: false
      properties:
        parts:
          items:
            $ref: '#/components/schemas/CompletedPart-Output'
          title: Parts
          type: array
        path:
          title: Path
          type: string
        size:
          title: Size
          type: integer
      required:
      - path
      - size
      - parts
      title: LeRobotAssetCompletedV1
      type: object
    LeRobotAssetUploadGrantV1:
      additionalProperties: false
      properties:
        completed:
          default: false
          title: Completed
          type: boolean
        multipart_upload_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Multipart Upload Id
        parts:
          default: []
          items:
            $ref: '#/components/schemas/PartAuthorization'
          title: Parts
          type: array
        path:
          title: Path
          type: string
      required:
      - path
      title: LeRobotAssetUploadGrantV1
      type: object
    LeRobotCapabilities:
      additionalProperties: false
      properties:
        capability_revision:
          title: Capability Revision
          type: string
        info_sha256:
          pattern: ^[a-f0-9]{64}$
          title: Info Sha256
          type: string
        output_storage_format:
          anyOf:
          - const: lerobot_v3
            type: string
          - type: 'null'
          title: Output Storage Format
        processing_supported:
          title: Processing Supported
          type: boolean
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
        reasons:
          default: []
          items:
            $ref: '#/components/schemas/LeRobotCapabilityReason'
          title: Reasons
          type: array
        schema_version:
          const: lerobot-capabilities/v1
          default: lerobot-capabilities/v1
          title: Schema Version
          type: string
        storage_supported:
          title: Storage Supported
          type: boolean
        validation_scope:
          const: DECLARED_METADATA
          default: DECLARED_METADATA
          title: Validation Scope
          type: string
      required:
      - capability_revision
      - info_sha256
      - storage_supported
      - processing_supported
      title: LeRobotCapabilities
      type: object
    LeRobotCapabilityReason:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        detail:
          title: Detail
          type: string
        stage:
          enum:
          - STORAGE
          - PROCESSING
          title: Stage
          type: string
      required:
      - stage
      - code
      - detail
      title: LeRobotCapabilityReason
      type: object
    LeRobotCapabilityRequest:
      additionalProperties: false
      properties:
        info:
          additionalProperties: true
          title: Info
          type: object
      required:
      - info
      title: LeRobotCapabilityRequest
      type: object
    LeRobotImportAcceptedV1:
      additionalProperties: false
      properties:
        episode_count:
          maximum: 10000.0
          minimum: 0.0
          title: Episode Count
          type: integer
        episode_plan_key:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          title: Episode Plan Key
        episode_task_count:
          default: 0
          maximum: 10000.0
          minimum: 0.0
          title: Episode Task Count
          type: integer
        import_id:
          title: Import Id
          type: string
        schema_version:
          const: lerobot-web-import-accepted/v1
          default: lerobot-web-import-accepted/v1
          title: Schema Version
          type: string
        source_file_count:
          maximum: 10000.0
          minimum: 1.0
          title: Source File Count
          type: integer
        status:
          default: RAW_COMMITTED
          enum:
          - RAW_COMMITTED
          - EPISODES_QUEUED
          title: Status
          type: string
      required:
      - import_id
      - episode_count
      - source_file_count
      title: LeRobotImportAcceptedV1
      type: object
    LeRobotImportGrantV1:
      additionalProperties: false
      properties:
        assets:
          items:
            $ref: '#/components/schemas/LeRobotAssetUploadGrantV1'
          title: Assets
          type: array
        import_id:
          pattern: ^[a-f0-9]{32}$
          title: Import Id
          type: string
        schema_version:
          const: lerobot-web-import-grant/v1
          default: lerobot-web-import-grant/v1
          title: Schema Version
          type: string
      required:
      - import_id
      - assets
      title: LeRobotImportGrantV1
      type: object
    LeRobotPartGrantV1:
      additionalProperties: false
      properties:
        completed:
          default: false
          title: Completed
          type: boolean
        parts:
          items:
            $ref: '#/components/schemas/PartAuthorization'
          title: Parts
          type: array
        path:
          title: Path
          type: string
        uploaded_part_numbers:
          default: []
          items:
            maximum: 10000.0
            minimum: 1.0
            type: integer
          title: Uploaded Part Numbers
          type: array
      required:
      - path
      - parts
      title: LeRobotPartGrantV1
      type: object
    LeRobotSourceFileV1:
      additionalProperties: false
      properties:
        last_modified_ms:
          anyOf:
          - maximum: 9007199254740991.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Last Modified Ms
        part_count:
          maximum: 10000.0
          minimum: 1.0
          title: Part Count
          type: integer
        path:
          maxLength: 1024
          minLength: 1
          title: Path
          type: string
        size:
          exclusiveMinimum: 0.0
          maximum: 5497558138880.0
          title: Size
          type: integer
      required:
      - path
      - size
      - part_count
      title: LeRobotSourceFileV1
      type: object
    McapProcessingConfig:
      additionalProperties: false
      properties:
        action_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Topic
        depth_scale_m_per_unit:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 1.0
            type: number
          - type: 'null'
          title: Depth Scale M Per Unit
        derive_action_from_next_state:
          default: false
          title: Derive Action From Next State
          type: boolean
        fps:
          default: 30
          maximum: 30.0
          minimum: 30.0
          title: Fps
          type: integer
        joint_names:
          default: []
          items:
            type: string
          title: Joint Names
          type: array
        joint_units:
          default: []
          items:
            type: string
          title: Joint Units
          type: array
        maximum_time_error_ms:
          default: 50
          exclusiveMinimum: 0.0
          maximum: 1000.0
          title: Maximum Time Error Ms
          type: number
        primary_camera:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Camera
        state_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: State Topic
      title: McapProcessingConfig
      type: object
    NativeConfiguration:
      properties:
        configured:
          title: Configured
          type: boolean
        schema_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Id
        schema_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      required:
      - configured
      title: NativeConfiguration
      type: object
    NativeImportProgress:
      properties:
        collection_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection Task Id
        dataset_id:
          title: Dataset Id
          type: string
        discarded:
          default: 0
          title: Discarded
          type: integer
        episode_count:
          title: Episode Count
          type: integer
        failed:
          title: Failed
          type: integer
        file_count:
          default: 0
          title: File Count
          type: integer
        import_id:
          title: Import Id
          type: string
        last_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error Code
        ready:
          title: Ready
          type: integer
        reprocessing_conflicts:
          default: 0
          title: Reprocessing Conflicts
          type: integer
        resume_required:
          default: 0
          title: Resume Required
          type: integer
        source_format:
          default: LEROBOT_V3
          title: Source Format
          type: string
        status:
          title: Status
          type: string
        total_bytes:
          default: 0
          title: Total Bytes
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - import_id
      - dataset_id
      - status
      - episode_count
      - ready
      - failed
      - last_error_code
      - updated_at
      title: NativeImportProgress
      type: object
    NativeLabelsRequest:
      properties:
        dataset_id:
          maxLength: 128
          minLength: 1
          title: Dataset Id
          type: string
        labels:
          items:
            type: string
          maxItems: 50
          minItems: 1
          title: Labels
          type: array
      required:
      - dataset_id
      - labels
      title: NativeLabelsRequest
      type: object
    OriginalArchiveRequest:
      additionalProperties: false
      properties:
        import_ids:
          items:
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          maxItems: 1000
          minItems: 1
          title: Import Ids
          type: array
      required:
      - import_ids
      title: OriginalArchiveRequest
      type: object
    OriginalDirectory:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/OriginalDirectoryEntry'
          title: Entries
          type: array
        file_count:
          title: File Count
          type: integer
        import_id:
          title: Import Id
          type: string
        local_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local Path
        offset:
          title: Offset
          type: integer
        path:
          title: Path
          type: string
        storage_prefix:
          title: Storage Prefix
          type: string
        total:
          title: Total
          type: integer
        total_bytes:
          title: Total Bytes
          type: integer
      required:
      - import_id
      - path
      - storage_prefix
      - local_path
      - entries
      - total
      - offset
      - file_count
      - total_bytes
      title: OriginalDirectory
      type: object
    OriginalDirectoryEntry:
      properties:
        file_count:
          title: File Count
          type: integer
        kind:
          enum:
          - DIRECTORY
          - FILE
          title: Kind
          type: string
        local_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local Path
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        size:
          title: Size
          type: integer
        storage_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Key
        text_preview:
          default: false
          title: Text Preview
          type: boolean
      required:
      - name
      - path
      - kind
      - size
      - file_count
      title: OriginalDirectoryEntry
      type: object
    OriginalEpisode:
      properties:
        duration_ns:
          title: Duration Ns
          type: string
        episode_index:
          title: Episode Index
          type: integer
        fps:
          title: Fps
          type: number
        frame_count:
          title: Frame Count
          type: integer
        videos:
          items:
            $ref: '#/components/schemas/OriginalVideo'
          title: Videos
          type: array
      required:
      - episode_index
      - frame_count
      - fps
      - duration_ns
      - videos
      title: OriginalEpisode
      type: object
    OriginalFile:
      properties:
        path:
          title: Path
          type: string
        sha256:
          title: Sha256
          type: string
        size:
          title: Size
          type: integer
      required:
      - path
      - size
      - sha256
      title: OriginalFile
      type: object
    OriginalFileGrant:
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        path:
          title: Path
          type: string
        url:
          title: Url
          type: string
      required:
      - path
      - url
      - expires_at
      title: OriginalFileGrant
      type: object
    OriginalFilePage:
      properties:
        episode_count:
          title: Episode Count
          type: integer
        files:
          items:
            $ref: '#/components/schemas/OriginalFile'
          title: Files
          type: array
        import_id:
          title: Import Id
          type: string
        offset:
          title: Offset
          type: integer
        source_format:
          title: Source Format
          type: string
        total:
          title: Total
          type: integer
      required:
      - import_id
      - source_format
      - episode_count
      - files
      - total
      - offset
      title: OriginalFilePage
      type: object
    OriginalTextPreview:
      properties:
        path:
          title: Path
          type: string
        preview_bytes:
          title: Preview Bytes
          type: integer
        text:
          title: Text
          type: string
        truncated:
          title: Truncated
          type: boolean
      required:
      - path
      - text
      - truncated
      - preview_bytes
      title: OriginalTextPreview
      type: object
    OriginalVideo:
      properties:
        camera_id:
          title: Camera Id
          type: string
        end_seconds:
          title: End Seconds
          type: number
        media_kind:
          enum:
          - RGB
          - DEPTH
          - UNKNOWN
          title: Media Kind
          type: string
        path:
          title: Path
          type: string
        preview_kind:
          enum:
          - ORIGINAL_VIDEO
          - DOWNLOAD_ONLY
          title: Preview Kind
          type: string
        preview_reason:
          anyOf:
          - enum:
            - RAW_DEPTH_REQUIRES_COLORIZATION
            - MEDIA_KIND_UNDECLARED
            type: string
          - type: 'null'
          title: Preview Reason
        start_seconds:
          title: Start Seconds
          type: number
      required:
      - camera_id
      - path
      - start_seconds
      - end_seconds
      - media_kind
      - preview_kind
      title: OriginalVideo
      type: object
    ResolveEpisode:
      additionalProperties: false
      properties:
        action:
          enum:
          - REPROCESS
          - DISCARD
          title: Action
          type: string
        expected_attempt_id:
          maxLength: 128
          minLength: 1
          title: Expected Attempt Id
          type: string
        request_id:
          format: uuid
          title: Request Id
          type: string
      required:
      - request_id
      - action
      - expected_attempt_id
      title: ResolveEpisode
      type: object
    StartStoredProcessing:
      additionalProperties: false
      properties:
        collection_task_id:
          title: Collection Task Id
          type: string
        robot_id:
          title: Robot Id
          type: string
      required:
      - collection_task_id
      - robot_id
      title: StartStoredProcessing
      type: object
paths:
  /api/v1/projects/{project_id}/regions/{region_code}/lerobot-imports:
    get:
      operationId: listNativeImports
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: dataset_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Dataset Id
      - in: query
        name: include_all_sources
        required: false
        schema:
          default: false
          title: Include All Sources
          type: boolean
      - in: query
        name: recording_id
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Recording Id
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NativeImportProgress'
                title: Response List Native Imports Api V1 Projects  Project Id  Regions  Region Code  Lerobot
                  Imports Get
                type: array
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List Native Imports
      tags:
      - lerobot-imports
    post:
      operationId: beginLerobotImport
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeRobotImportV1'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeRobotImportGrantV1'
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Begin Lerobot Import
      tags:
      - lerobot-imports
  /api/v1/projects/{project_id}/regions/{region_code}/lerobot-imports/archive:
    post:
      operationId: downloadOriginalArchive
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
      - in: header
        name: X-Organization-Id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OriginalArchiveRequest'
        required: true
      responses:
        '200':
          content:
            application/zip:
              schema:
                format: binary
                type: string
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Download Original Archive
      tags:
      - lerobot-imports
  /api/v1/projects/{project_id}/regions/{region_code}/lerobot-imports/configuration:
    get:
      operationId: getNativeConfiguration
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: region_code
        required: true
        schema:
          title: Region Code
          type: string
