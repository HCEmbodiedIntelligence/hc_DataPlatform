        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionGrant'
          description: Multipart session and short-lived direct-upload authorizations.
          headers:
            Cache-Control:
              description: Signed URLs are never cached.
              schema:
                type: string
        '401': *id004
        '403': *id005
        '409': &id010
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Immutable identity, content, state, or multipart part conflict.
        '413': *id006
        '415': *id007
      security:
      - bearerAuth: []
      tags:
      - ingest
