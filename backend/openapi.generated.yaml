    post:
      operationId: cancelUploadSession
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
          description: Multipart state aborted and session cancelled.
