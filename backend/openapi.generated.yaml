components:
  parameters:
    DatasetId:
      in: path
      name: dataset_id
      required: true
      schema:
        minLength: 1
        type: string
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    PublishingDatasetId:
      in: path
      name: dataset_id
      required: true
      schema:
        minLength: 1
        type: string
    PublishingDatasetVersion:
      in: path
      name: dataset_version
      required: true
      schema:
        minLength: 1
        type: string
    QualityProfileId:
      in: path
      name: profile_id
      required: true
      schema:
        minLength: 1
        type: string
    QualityProfileVersion:
      in: path
      name: profile_version
      required: true
      schema:
        minimum: 1
        type: integer
    QualityProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    QualityRegionCode:
      in: path
      name: region_code
      required: true
      schema:
        minLength: 1
        type: string
    QualityRolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    RolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    VerificationProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    VerificationRegionCode:
      in: path
      name: region_code
      required: true
      schema:
        minLength: 1
        type: string
    VerificationRolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    Version:
      in: path
      name: version
      required: true
      schema:
        minimum: 1
        type: integer
  schemas:
    ActionQualityProfileV1:
      additionalProperties: false
      properties:
        dimension_mismatch_is_reject:
          default: true
          type: boolean
        maximum_jump_reject:
          default: null
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        maximum_jump_risk:
          default: null
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        minimum_observation_count_reject:
          default: 0
          minimum: 0
          type: integer
        minimum_observation_count_risk:
          default: 1
          minimum: 0
          type: integer
        topic:
          default: /action
          type: string
      required:
      - topic
      - minimum_observation_count_risk
      - minimum_observation_count_reject
      - maximum_jump_risk
      - maximum_jump_reject
      - dimension_mismatch_is_reject
      type: object
    AlignedFragmentManifestV1:
      additionalProperties: false
      properties:
        attempt_id:
          minLength: 1
          type: string
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        converter_version:
          minLength: 1
          type: string
        frequency_hz:
          minimum: 1
          type: integer
        profile_id:
          minLength: 1
          type: string
        rollout_id:
          minLength: 1
          type: string
        row_count:
          minimum: 0
          type: integer
        schema_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        schema_version:
          const: aligned-fragment-manifest/v1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        staging_format:
          const: arrow-ipc/v1
          type: string
        staging_uri:
          minLength: 1
          type: string
      required:
      - schema_version
      - rollout_id
      - source_sha256
      - attempt_id
      - profile_id
      - converter_version
      - frequency_hz
      - row_count
      - schema_sha256
      - content_sha256
      - staging_uri
      - staging_format
      type: object
    AlignedFragmentReadyV1:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        converter_version:
          minLength: 1
          type: string
        event_version:
          const: aligned-fragment-ready/v1
          type: string
        rollout_id:
          minLength: 1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        staging_uri:
          minLength: 1
          type: string
      required:
      - event_version
      - rollout_id
      - source_sha256
      - converter_version
      - content_sha256
      - staging_uri
      type: object
    AlignedRowV1:
      additionalProperties: false
      properties:
        modalities:
          additionalProperties:
            $ref: '#/components/schemas/AlignedValueV1'
          type: object
        rollout_id:
          minLength: 1
          type: string
        sample_valid:
          type: boolean
        step_index:
          minimum: 0
          type: integer
        timestamp_ns:
          minimum: 0
          type: integer
      required:
      - rollout_id
      - step_index
      - timestamp_ns
      - modalities
      - sample_valid
      type: object
    AlignedValueV1:
      additionalProperties: false
      properties:
        repeated:
          type: boolean
        source_timestamps_ns:
          items:
            minimum: 0
            type: integer
          type: array
        strategy:
          $ref: '#/components/schemas/AlignmentStrategy'
        time_error_ns:
          oneOf:
          - minimum: 0
            type: integer
          - type: 'null'
        valid:
          type: boolean
        value: {}
      required:
      - value
      - source_timestamps_ns
      - time_error_ns
      - valid
      - repeated
      - strategy
      type: object
    AlignmentInputV1:
      additionalProperties: false
      properties:
        attempt_id:
          minLength: 1
          type: string
        end_ns:
          minimum: 1
          type: integer
        rollout_id:
          minLength: 1
          type: string
        schema_version:
          const: alignment-input/v1
          default: alignment-input/v1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        start_ns:
          minimum: 0
          type: integer
        streams:
          additionalProperties:
            $ref: '#/components/schemas/ModalityStreamV1'
          minProperties: 1
          type: object
      required:
      - rollout_id
      - source_sha256
      - attempt_id
      - start_ns
      - end_ns
      - streams
      type: object
    AlignmentProfileV1:
      additionalProperties: false
      properties:
        converter_version:
          default: be07-align/1
          minLength: 1
          type: string
        default_tolerance_ns:
          default: 20000000
          minimum: 0
          type: integer
        frequency_hz:
          default: 30
          maximum: 1000
          minimum: 1
          type: integer
        profile_id:
          minLength: 1
          type: string
        required_modalities:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        schema_version:
          const: alignment-profile/v1
          default: alignment-profile/v1
          type: string
        stream_strategies:
          additionalProperties:
            $ref: '#/components/schemas/AlignmentStrategy'
          default: {}
          type: object
        stream_tolerance_ns:
          additionalProperties:
            minimum: 0
            type: integer
          default: {}
          type: object
      required:
      - profile_id
      - required_modalities
      type: object
    AlignmentStrategy:
      enum:
      - nearest
      - linear
      - causal
      - recent
      - window_mean
      type: string
    AnnotationApprovedV1:
      additionalProperties: false
      properties:
        annotation_revision:
          minimum: 0
          type: integer
        approved_at:
          format: date-time
          type: string
        dataset_id:
          type: string
        dataset_version:
          minimum: 1
          type: integer
        excluded_ranges:
          items:
            $ref: '#/components/schemas/ExclusionRange'
          type: array
        project_id:
          type: string
        review_id:
          type: string
        reviewer_id:
          type: string
        rollout_id:
          type: string
        schema_version:
          const: '1'
          type: string
        task_id:
          type: string
      required:
      - schema_version
      - project_id
      - dataset_id
      - dataset_version
      - rollout_id
      - task_id
      - annotation_revision
      - review_id
      - reviewer_id
      - excluded_ranges
      - approved_at
      type: object
    AnnotationCurrent:
      additionalProperties: false
      properties:
        approved_review_id:
          type:
          - string
          - 'null'
        approved_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        current_revision:
          minimum: 0
          type: integer
        etag:
          type: string
        schema_version:
          const: '1'
          type: string
        state_version:
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/AnnotationStatus'
        submitted_by:
          type:
          - string
          - 'null'
        submitted_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        task_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - schema_version
      - task_id
      - current_revision
      - state_version
      - status
      - etag
      - updated_at
      type: object
    AnnotationDraft:
      additionalProperties: false
      properties:
        author_id:
          type: string
        client_mutation_id:
          type: string
        effective_exclusions:
          items:
            $ref: '#/components/schemas/ExclusionRange'
          type: array
        etag:
          type: string
        operations:
          items:
            $ref: '#/components/schemas/AnnotationOperation'
          type: array
        revision:
          minimum: 0
          type: integer
        schema_version:
          const: '1'
          type: string
        task_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - schema_version
      - task_id
      - revision
      - author_id
      - client_mutation_id
      - operations
      - effective_exclusions
      - etag
      - updated_at
      type: object
    AnnotationHistory:
      additionalProperties: false
      properties:
        reviews:
          items:
            $ref: '#/components/schemas/AnnotationReview'
          type: array
        revisions:
          items:
            $ref: '#/components/schemas/AnnotationRevision'
          type: array
        task:
          $ref: '#/components/schemas/AnnotationTask'
      required:
      - task
      - revisions
      - reviews
      type: object
    AnnotationOperation:
      additionalProperties: false
      properties:
        end_step:
          minimum: 1
          type: integer
        kind:
          enum:
          - EXCLUDE
          - RESTORE
          type: string
        modality_scope:
          const: ALL_MODALITIES
          default: ALL_MODALITIES
          type: string
        operation_id:
          minLength: 1
          type: string
        reason:
          default: ''
          maxLength: 2000
          type: string
        schema_version:
          const: '1'
          default: '1'
          type: string
        start_step:
          minimum: 0
          type: integer
      required:
      - operation_id
      - kind
      - start_step
      - end_step
      type: object
    AnnotationReview:
      additionalProperties: false
      properties:
        comment:
          maxLength: 10000
          type: string
        created_at:
          format: date-time
          type: string
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        review_id:
          type: string
        reviewer_id:
          type: string
        revision:
          minimum: 0
          type: integer
        schema_version:
          const: '1'
          type: string
        task_id:
          type: string
      required:
      - schema_version
      - review_id
      - task_id
      - revision
      - reviewer_id
      - decision
      - comment
      - created_at
      type: object
    AnnotationRevision:
      additionalProperties: false
      properties:
        author_id:
          type: string
        client_mutation_id:
          type: string
        created_at:
          format: date-time
          type: string
        operations:
          items:
            $ref: '#/components/schemas/AnnotationOperation'
          type: array
        parent_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        revision:
          minimum: 0
          type: integer
        schema_version:
          const: '1'
          type: string
        task_id:
          type: string
      required:
      - schema_version
      - task_id
      - revision
      - parent_revision
      - author_id
      - client_mutation_id
      - operations
      - created_at
      type: object
    AnnotationStatus:
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - NEEDS_REVISION
      - REJECTED
      type: string
    AnnotationTask:
      additionalProperties: false
      properties:
        approved_review_id:
          type:
          - string
          - 'null'
        approved_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        assignee_id:
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          type: string
        current_revision:
          minimum: 0
          type: integer
        dataset_id:
          minLength: 1
          type: string
        dataset_version:
          minimum: 1
          type: integer
        etag:
          type: string
        project_id:
          minLength: 1
          type: string
        rollout_id:
          minLength: 1
          type: string
        schema_version:
          const: '1'
          type: string
        state_version:
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/AnnotationStatus'
        submitted_by:
          type:
          - string
          - 'null'
        submitted_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        task_id:
          minLength: 1
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - schema_version
      - task_id
      - project_id
      - dataset_id
      - dataset_version
      - rollout_id
      - current_revision
      - state_version
      - status
      - etag
      - created_at
      - updated_at
      type: object
    AuditRecord:
      additionalProperties: false
      properties:
        action:
          minLength: 1
          type: string
        actor_id:
          minLength: 1
          type: string
        after_hash:
          pattern: ^[a-f0-9]{64}$
          type:
          - string
          - 'null'
        audit_id:
          format: uuid
          type: string
        before_hash:
          pattern: ^[a-f0-9]{64}$
          type:
          - string
          - 'null'
        details:
          additionalProperties: true
          type: object
        occurred_at:
          format: date-time
          type: string
        project_id:
          minLength: 1
          type: string
        region_code:
          type:
          - string
          - 'null'
        request_id:
          minLength: 1
          type: string
        resource_id:
          minLength: 1
          type: string
        resource_type:
          minLength: 1
          type: string
      required:
      - audit_id
      - actor_id
      - action
      - resource_type
      - resource_id
      - project_id
      - request_id
      - occurred_at
      type: object
    AuthContext:
      additionalProperties: false
      properties:
        project_ids:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        region_codes:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        roles:
          items:
            $ref: '#/components/schemas/ProjectRole'
          type: array
          uniqueItems: true
        service_identity:
          description: Workers must still select an issued project and region explicitly.
          type: boolean
        subject_id:
          minLength: 1
          type: string
      required:
      - subject_id
      - project_ids
      - region_codes
      - roles
      - service_identity
      type: object
    AutoAnnotationCapability:
      additionalProperties: false
      properties:
        code:
          const: FEATURE_DISABLED
          type: string
        enabled:
          const: false
          type: boolean
      required:
      - enabled
      - code
      type: object
    ChannelInventoryV1:
      additionalProperties: false
      properties:
        channel_id:
          maximum: 65535
          minimum: 0
          type: integer
        message_encoding:
          type: string
        schema_id:
          maximum: 65535
          minimum: 0
          type: integer
        topic:
          type: string
      required:
      - channel_id
      - schema_id
      - topic
      - message_encoding
      type: object
    CompleteStepProfileV1:
      additionalProperties: false
      properties:
        minimum_ratio_reject:
          default: 0.8
          maximum: 1
          minimum: 0
          type: number
        minimum_ratio_risk:
          default: 0.98
          maximum: 1
          minimum: 0
          type: number
        topic:
          default: __multimodal_step__
          type: string
      required:
      - topic
      - minimum_ratio_risk
      - minimum_ratio_reject
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      properties:
        parts:
          items:
            $ref: '#/components/schemas/CompletedPart'
          maxItems: 10000
          minItems: 1
          type: array
          x-sorted-by: part_number
      required:
      - parts
      type: object
    CompletedPart:
      additionalProperties: false
      properties:
        etag:
          maxLength: 512
          minLength: 1
          type: string
        part_number:
          maximum: 10000
          minimum: 1
          type: integer
      required:
      - part_number
      - etag
      type: object
    CreateUploadRequest:
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/RolloutManifestV1'
        part_numbers:
          items:
            maximum: 10000
            minimum: 1
            type: integer
          maxItems: 10000
          type: array
          uniqueItems: true
      required:
      - manifest
      type: object
    DatasetVersionRef:
      properties:
        committed_rollouts:
          items:
            type: string
          type: array
        content_hash:
          $ref: '#/components/schemas/Sha256'
        created_at:
          format: date-time
          type: string
        dataset_id:
          type: string
        dataset_uri:
          type: string
        frequency_hz:
          exclusiveMinimum: 0
          type: number
        lance_version:
          minimum: 1
          type: integer
        project_id:
          type: string
        schema_fingerprint:
          $ref: '#/components/schemas/Sha256'
        schema_snapshot_id:
          type: string
        storage_commit_id:
          $ref: '#/components/schemas/Sha256'
        version:
          minimum: 1
          type: integer
      required:
      - project_id
      - dataset_id
      - version
      - schema_snapshot_id
      - schema_fingerprint
      - frequency_hz
      - content_hash
      - dataset_uri
      - lance_version
      - storage_commit_id
      - committed_rollouts
      - created_at
      type: object
    DependencyStatus:
      properties:
        detail:
          type:
          - string
          - 'null'
        latency_ms:
          minimum: 0
          type: number
        status:
          enum:
          - ready
          - not_ready
          type: string
      required:
      - status
      - latency_ms
      type: object
    DomainEventEnvelope:
      properties:
        aggregate_id:
          type: string
        aggregate_type:
          type: string
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          format: date-time
          type: string
        payload:
          additionalProperties: true
          type: object
        project_id:
          type: string
        region_code:
          type:
          - string
          - 'null'
        schema_version:
          minimum: 1
          type: integer
        trace_id:
          type:
          - string
          - 'null'
      required:
      - event_id
      - event_type
      - schema_version
      - aggregate_type
      - aggregate_id
      - project_id
      - occurred_at
      - payload
      type: object
    ETag:
      pattern: ^(W/)?"[!#-~\u0080-\u00FF]+"$
      type: string
    EncodingProfileV1:
      properties:
        height:
          default: 720
          maximum: 2160
          minimum: 16
          type: integer
        name:
          default: h264-cmaf-preview-v1
          type: string
        pixel_format:
          const: yuv420p
          default: yuv420p
          type: string
        preset:
          default: veryfast
          enum:
          - ultrafast
          - superfast
          - veryfast
          - faster
          - fast
          - medium
          - slow
          type: string
        segment_duration_seconds:
          default: 2
          maximum: 10
          minimum: 0.25
          type: number
        video_bitrate_kbps:
          default: 2000
          maximum: 50000
          minimum: 64
          type: integer
        video_codec:
          const: h264
          default: h264
          type: string
        width:
          default: 1280
          maximum: 4096
          minimum: 16
          type: integer
      type: object
    EvidenceScalar:
      anyOf:
      - type: boolean
      - type: integer
      - type: number
      - type: string
    ExcludedPublishedRolloutV1:
      additionalProperties: false
      properties:
        derived_status:
          $ref: '#/components/schemas/PublishingDerivedStatus'
        quality_status:
          $ref: '#/components/schemas/PublishingQualityStatus'
        reasons:
          items:
            type: string
          minItems: 1
          type: array
        rollout_id:
          type: string
      required:
      - rollout_id
      - reasons
      - quality_status
      - derived_status
      type: object
    ExclusionRange:
      additionalProperties: false
      properties:
        end_step:
          minimum: 1
          type: integer
        modality_scope:
          const: ALL_MODALITIES
          type: string
        start_step:
          minimum: 0
          type: integer
      required:
      - start_step
      - end_step
      - modality_scope
      type: object
    ExportDatasetRequestV1:
      additionalProperties: false
      properties:
        attempt_id:
          minLength: 1
          type:
          - string
          - 'null'
        format:
          enum:
          - lance_snapshot
          - lerobot_v3
          type: string
        project_id:
          minLength: 1
          type: string
      required:
      - project_id
      - format
      type: object
    ExportResultV1:
      additionalProperties: false
      properties:
        artifact_content_hash:
          pattern: ^[0-9a-f]{64}$
          type: string
        artifact_uri:
          type: string
        attempt_id:
          minLength: 1
          type: string
        dataset_id:
          type: string
        dataset_version:
          type: string
        download_uri:
          type: string
        format:
          enum:
          - lance_snapshot
          - lerobot_v3
          type: string
        manifest_content_hash:
          pattern: ^[0-9a-f]{64}$
          type: string
        media_type:
          type: string
        project_id:
          type: string
        row_count:
          minimum: 0
          type: integer
      required:
      - format
      - project_id
      - dataset_id
      - dataset_version
      - manifest_content_hash
      - attempt_id
      - artifact_uri
      - download_uri
      - artifact_content_hash
      - row_count
      - media_type
      type: object
    FindingSeverity:
      enum:
      - warning
      - error
      type: string
    IdempotencyConflict:
      additionalProperties: false
      properties:
        code:
          const: IDEMPOTENCY_KEY_REUSED
          type: string
        detail:
          type: string
        status:
          const: 409
          type: integer
        title:
          type: string
      required:
      - status
      - code
      - title
      - detail
      type: object
    ImageQualityProfileV1:
      additionalProperties: false
      properties:
        black_luma_threshold:
          default: 5
          maximum: 255
          minimum: 0
          type: number
        maximum_black_frame_ratio_reject:
          default: 0.5
          maximum: 1
          minimum: 0
          type: number
        maximum_black_frame_ratio_risk:
          default: 0.02
          maximum: 1
          minimum: 0
          type: number
        maximum_corrupt_frame_ratio_reject:
          default: 0
          maximum: 1
          minimum: 0
          type: number
