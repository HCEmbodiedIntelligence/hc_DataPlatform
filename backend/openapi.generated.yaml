components:
  headers:
    AccessNoStore:
      description: Authentication and authorization material must not be cached.
      schema:
        const: private, no-store
        type: string
    CollectionTaskETag:
      required: true
      schema:
        type: string
    CollectionTaskReplay:
      required: true
      schema:
        enum:
        - 'true'
        - 'false'
        type: string
    DashboardNoStore:
      required: true
      schema:
        const: no-store
        type: string
    StorageETag:
      required: true
      schema:
        type: string
    StorageIdempotencyReplayed:
      required: true
      schema:
        enum:
        - 'true'
        - 'false'
        type: string
  parameters:
    AccessIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        minLength: 1
        type: string
    AccessProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    AccessRequestId:
      in: path
      name: access_request_id
      required: true
      schema:
        format: uuid
        type: string
    AnnotationProject:
      description: Must select the exact project that owns the task.
      in: header
      name: X-Project-ID
      required: true
      schema:
        minLength: 1
        type: string
    AnnotationRegion:
      description: Must select the exact region that owns the task; project-wide scope is not a cross-region
        bypass.
      in: header
      name: X-Region-Code
      required: true
      schema:
        minLength: 1
        type: string
    CollectionTaskId:
      in: path
      name: collection_task_id
      required: true
      schema:
        $ref: '#/components/schemas/CollectionTaskIdentifier'
    CollectionTaskIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 255
        minLength: 1
        type: string
    CollectionTaskIfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        maxLength: 128
        minLength: 1
        type: string
    CollectionTaskProjectId:
      in: path
      name: project_id
      required: true
      schema:
        $ref: '#/components/schemas/CollectionTaskIdentifier'
    CollectionTaskRegionCode:
      description: Selects the exact authorized region whose package and QC facts are aggregated.
      in: header
      name: X-Region-Code
      required: true
      schema:
        maxLength: 128
        minLength: 1
        pattern: ^[A-Za-z0-9._-]+$
        type: string
    DashboardCursor:
      description: HMAC-protected cursor bound to principal, project, region, range, timezone, endpoint,
        and the endpoint's complete stable source tuple. Cross-scope cursor reuse is rejected.
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 16384
        minLength: 1
        type: string
    DashboardFrom:
      description: Inclusive RFC 3339 instant with an explicit UTC offset.
      in: query
      name: from
      required: true
      schema:
        format: date-time
        type: string
    DashboardLimit:
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    DashboardProjectId:
      in: path
      name: project_id
      required: true
      schema:
        $ref: '#/components/schemas/DashboardIdentifier'
    DashboardRegionCode:
      description: Exact authorized region. Administrators are not aggregated across regions.
      in: query
      name: region_code
      required: true
      schema:
        $ref: '#/components/schemas/DashboardIdentifier'
    DashboardTimezone:
      description: Explicit project IANA timezone. The UI defaults to 24 hours and may request 7 or 30
        days; the service never reads a browser-local timezone.
      in: query
      name: timezone
      required: true
      schema:
        maxLength: 64
        minLength: 1
        pattern: ^[A-Za-z0-9._+-]+(?:/[A-Za-z0-9._+-]+)*$
        type: string
    DashboardTo:
      description: Exclusive RFC 3339 instant with an explicit UTC offset.
      in: query
      name: to
      required: true
      schema:
        format: date-time
        type: string
    DatasetId:
      in: path
      name: dataset_id
      required: true
      schema:
        minLength: 1
        type: string
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    PublishingDatasetId:
      in: path
      name: dataset_id
      required: true
      schema:
        minLength: 1
        type: string
    PublishingDatasetVersion:
      in: path
      name: dataset_version
      required: true
      schema:
        minLength: 1
        type: string
    QualityProfileId:
      in: path
      name: profile_id
      required: true
      schema:
        minLength: 1
        type: string
    QualityProfileVersion:
      in: path
      name: profile_version
      required: true
      schema:
        minimum: 1
        type: integer
    QualityProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    QualityRegionCode:
      in: path
      name: region_code
      required: true
      schema:
        minLength: 1
        type: string
    QualityRolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    RolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    StorageCursor:
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 16384
        type: string
    StorageIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 256
        minLength: 1
        type: string
    StorageIfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        maxLength: 256
        minLength: 1
        type: string
    StorageLimit:
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    StoragePolicyId:
      in: path
      name: policy_id
      required: true
      schema:
        maxLength: 256
        minLength: 1
        type: string
    StorageProjectId:
      in: path
      name: project_id
      required: true
      schema:
        maxLength: 256
        minLength: 1
        type: string
    VerificationProjectId:
      in: path
      name: project_id
      required: true
      schema:
        minLength: 1
        type: string
    VerificationRegionCode:
      in: path
      name: region_code
      required: true
      schema:
        minLength: 1
        type: string
    VerificationRolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        minLength: 1
        type: string
    Version:
      in: path
      name: version
      required: true
      schema:
        minimum: 1
        type: integer
  requestBodies:
    AccessDecisionBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessDecisionCommand'
      required: true
    CapabilityRequestCreateBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapabilityRequestCreate'
      required: true
    LoginCommandBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginCommand'
      required: true
    MembershipRequestCreateBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipRequestCreate'
      required: true
    RegistrationCommandBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationCommand'
      required: true
  responses:
    AccessConflict:
      content:
        application/problem+json:
          example:
            code: ACCESS_REQUEST_STATE_CONFLICT
            detail: The transition is invalid from the current state.
            request_id: req-409
            retryable: false
            status: 409
            title: Access request state conflict
            type: https://hc-data-platform.invalid/problems/access-request-state-conflict
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: State, concurrency, duplicate-pending, or idempotency conflict.
    AccessForbidden:
      content:
        application/problem+json:
          example:
            code: PROJECT_SCOPE_DENIED
            detail: The exact project scope is not granted.
            request_id: req-403
            retryable: false
            status: 403
            title: Project scope denied
            type: https://hc-data-platform.invalid/problems/project-scope-denied
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Exact project scope or project access-management capability is absent.
    AccessTooManyRequests:
      content:
        application/problem+json:
          example:
            code: ABUSE_POLICY_LIMITED
            detail: The externally configured abuse policy denied this request.
            request_id: req-429
            retryable: true
            status: 429
            title: Request rate limited
            type: https://hc-data-platform.invalid/problems/abuse-policy-limited
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: An externally configured OPEN-02 abuse policy denied the request.
    AccessUnauthorized:
      content:
        application/problem+json:
          example:
            code: AUTHENTICATION_REQUIRED
            detail: A current Bearer session is required.
            request_id: req-401
            retryable: false
            status: 401
            title: Authentication required
            type: https://hc-data-platform.invalid/problems/authentication-required
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Authentication failed or a current session is required.
    AccessUnprocessable:
      content:
        application/problem+json:
          example:
            code: REQUEST_VALIDATION_FAILED
            detail: The request did not satisfy the API contract.
            request_id: req-422
            retryable: false
            status: 422
            title: Request validation failed
            type: https://hc-data-platform.invalid/problems/request-validation-failed
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The request violates the API contract.
    CapabilityRequestCreated:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapabilityRequest'
      description: Pending project capability request created.
    CapabilityRequestOk:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapabilityRequest'
      description: Current capability request representation.
    DashboardForbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Exact project/region scope and dashboard.read capability are required.
    DashboardInvalidCursor:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Cursor is malformed or belongs to another principal or exact query scope.
    DashboardInvalidQuery:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Validation failed, timestamps lack offsets, timezone is invalid, from is not before
        to, or the configured synchronous technical query budget was exceeded.
    DashboardRateLimited:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The deployment query-admission policy rejected this request.
    DashboardUnauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: A verified Bearer identity is required.
    MembershipRequestCreated:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipRequest'
      description: Pending project membership request created.
    MembershipRequestOk:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipRequest'
      description: Current membership request representation.
  schemas:
    AccessAuditEvent:
      additionalProperties: false
      properties:
        action:
          minLength: 1
          type: string
        actor_id:
          type:
          - string
          - 'null'
        event_id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        outcome:
          enum:
          - SUCCEEDED
          - DENIED
          - FAILED
          type: string
        project_id:
          type:
          - string
          - 'null'
        request_id:
          minLength: 1
          type: string
        resource_id:
          minLength: 1
          type: string
        resource_type:
          minLength: 1
          type: string
        safe_details:
          additionalProperties: true
          description: Allowlisted metadata only; credentials, tokens, and free-form reasons are absent.
          type: object
        scope_kind:
          enum:
          - PLATFORM
          - PROJECT
          type: string
      required:
      - event_id
      - scope_kind
      - action
      - resource_type
      - resource_id
      - request_id
      - outcome
      - safe_details
      - occurred_at
      type: object
    AccessAuditEventList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccessAuditEvent'
          type: array
      required:
      - items
      type: object
    AccessDecisionCommand:
      additionalProperties: false
      properties:
        reason:
          type:
          - string
          - 'null'
      type: object
    AccessRequestStatus:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - WITHDRAWN
      - REVOKED
      type: string
    AccountPrincipal:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        principal_id:
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        username:
          minLength: 1
          type: string
      required:
      - principal_id
      - username
      - status
      - created_at
      type: object
    AccountStatus:
      description: Account lifecycle only; account approval/PENDING is not part of registration.
      enum:
      - ACTIVE
      - DISABLED
      type: string
    ActionQualityProfileV1:
      additionalProperties: false
      properties:
        dimension_mismatch_is_reject:
          default: true
          type: boolean
        maximum_jump_reject:
          default: null
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        maximum_jump_risk:
          default: null
          exclusiveMinimum: 0
          type:
          - number
          - 'null'
        minimum_observation_count_reject:
          default: 0
          minimum: 0
          type: integer
        minimum_observation_count_risk:
          default: 1
          minimum: 0
          type: integer
        topic:
          default: /action
          type: string
      required:
      - topic
      - minimum_observation_count_risk
      - minimum_observation_count_reject
      - maximum_jump_risk
      - maximum_jump_reject
      - dimension_mismatch_is_reject
      type: object
    AlignedFragmentManifestV1:
      additionalProperties: false
      properties:
        attempt_id:
          minLength: 1
          type: string
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        converter_version:
          minLength: 1
          type: string
        frequency_hz:
          minimum: 1
          type: integer
        profile_id:
          minLength: 1
          type: string
        rollout_id:
          minLength: 1
          type: string
        row_count:
          minimum: 0
          type: integer
        schema_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        schema_version:
          const: aligned-fragment-manifest/v1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        staging_format:
          const: arrow-ipc/v1
          type: string
        staging_uri:
          minLength: 1
          type: string
      required:
      - schema_version
      - rollout_id
      - source_sha256
      - attempt_id
      - profile_id
      - converter_version
      - frequency_hz
      - row_count
      - schema_sha256
      - content_sha256
      - staging_uri
      - staging_format
      type: object
    AlignedFragmentReadyV1:
      additionalProperties: false
      properties:
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        converter_version:
          minLength: 1
          type: string
        event_version:
          const: aligned-fragment-ready/v1
          type: string
        rollout_id:
          minLength: 1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        staging_uri:
          minLength: 1
          type: string
      required:
      - event_version
      - rollout_id
      - source_sha256
      - converter_version
      - content_sha256
      - staging_uri
      type: object
    AlignedRowV1:
      additionalProperties: false
      properties:
        modalities:
          additionalProperties:
            $ref: '#/components/schemas/AlignedValueV1'
          type: object
        rollout_id:
          minLength: 1
          type: string
        sample_valid:
          type: boolean
        step_index:
          minimum: 0
          type: integer
        timestamp_ns:
          minimum: 0
          type: integer
      required:
      - rollout_id
      - step_index
      - timestamp_ns
      - modalities
      - sample_valid
      type: object
    AlignedValueV1:
      additionalProperties: false
      properties:
        repeated:
          type: boolean
        source_timestamps_ns:
          items:
            minimum: 0
            type: integer
          type: array
        strategy:
          $ref: '#/components/schemas/AlignmentStrategy'
        time_error_ns:
          oneOf:
          - minimum: 0
            type: integer
          - type: 'null'
        valid:
          type: boolean
        value: {}
      required:
      - value
      - source_timestamps_ns
      - time_error_ns
      - valid
      - repeated
      - strategy
      type: object
    AlignmentInputV1:
      additionalProperties: false
      properties:
        attempt_id:
          minLength: 1
          type: string
        end_ns:
          minimum: 1
          type: integer
        rollout_id:
          minLength: 1
          type: string
        schema_version:
          const: alignment-input/v1
          default: alignment-input/v1
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        start_ns:
          minimum: 0
          type: integer
        streams:
          additionalProperties:
            $ref: '#/components/schemas/ModalityStreamV1'
          minProperties: 1
          type: object
      required:
      - rollout_id
      - source_sha256
      - attempt_id
      - start_ns
      - end_ns
      - streams
      type: object
    AlignmentProfileV1:
      additionalProperties: false
      properties:
        converter_version:
          default: be07-align/1
          minLength: 1
          type: string
        default_tolerance_ns:
          default: 20000000
          minimum: 0
          type: integer
        frequency_hz:
          default: 30
          maximum: 1000
          minimum: 1
          type: integer
        profile_id:
          minLength: 1
          type: string
        required_modalities:
          items:
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        schema_version:
          const: alignment-profile/v1
          default: alignment-profile/v1
          type: string
        stream_strategies:
          additionalProperties:
            $ref: '#/components/schemas/AlignmentStrategy'
          default: {}
          type: object
        stream_tolerance_ns:
          additionalProperties:
            minimum: 0
            type: integer
          default: {}
          type: object
      required:
      - profile_id
      - required_modalities
      type: object
    AlignmentStrategy:
      enum:
      - nearest
      - linear
      - causal
      - recent
      - window_mean
      type: string
    AnnotationApprovedV1:
      additionalProperties: false
      properties:
        annotation_revision:
          minimum: 0
          type: integer
        approved_at:
          format: date-time
          type: string
        base_lance_version:
          minimum: 1
          type: integer
        dataset_id:
          type: string
        dataset_version:
          minimum: 1
          type: integer
        excluded_ranges:
          items:
            $ref: '#/components/schemas/ExclusionRange'
          type: array
        project_id:
          type: string
        review_id:
          type: string
        reviewer_id:
          type: string
        revision_content_hash:
          pattern: ^[0-9a-f]{64}$
          type: string
        rollout_id:
          type: string
        schema_version:
          const: '1'
          type: string
        submission_id:
          minLength: 1
          type: string
        tag_schema_id:
          minLength: 1
          type: string
        tag_schema_version:
          minimum: 1
          type: integer
        task_id:
          type: string
      required:
      - schema_version
      - project_id
      - dataset_id
      - dataset_version
      - rollout_id
      - task_id
      - annotation_revision
      - submission_id
      - base_lance_version
      - tag_schema_id
      - tag_schema_version
      - revision_content_hash
      - review_id
      - reviewer_id
      - excluded_ranges
      - approved_at
      type: object
    AnnotationCurrent:
      additionalProperties: false
      properties:
        approved_review_id:
          type:
          - string
          - 'null'
        approved_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        current_revision:
          minimum: 0
          type: integer
        current_submission_id:
          type:
          - string
          - 'null'
        etag:
          type: string
        schema_version:
          const: '1'
          type: string
        state_version:
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/AnnotationStatus'
        submitted_by:
          type:
          - string
          - 'null'
        submitted_revision:
          minimum: 0
          type:
          - integer
          - 'null'
        task_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - schema_version
      - task_id
      - current_revision
      - state_version
      - status
      - etag
      - updated_at
      type: object
    AnnotationDraft:
      additionalProperties: false
      properties:
        author_id:
          type: string
        base_lance_version:
          minimum: 1
          type: integer
        base_step_count:
          minimum: 1
          type:
          - integer
          - 'null'
        client_mutation_id:
          type: string
        effective_exclusions:
          items:
            $ref: '#/components/schemas/ExclusionRange'
          type: array
        etag:
          type: string
        operations:
          items:
            $ref: '#/components/schemas/AnnotationOperation'
          type: array
        revision:
          minimum: 0
          type: integer
        schema_version:
          const: '1'
          type: string
        tag_schema_id:
          minLength: 1
          type: string
        tag_schema_version:
          minimum: 1
          type: integer
        tags:
          items:
            $ref: '#/components/schemas/AnnotationTag'
          type: array
        task_id:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - schema_version
      - task_id
      - revision
      - author_id
      - client_mutation_id
      - base_lance_version
      - tag_schema_id
      - tag_schema_version
      - tags
      - operations
      - effective_exclusions
      - etag
      - updated_at
      type: object
    AnnotationHistory:
      additionalProperties: false
      properties:
        reviews:
          items:
            $ref: '#/components/schemas/AnnotationReview'
          type: array
        revisions:
          items:
            $ref: '#/components/schemas/AnnotationRevision'
          type: array
        submissions:
          items:
            $ref: '#/components/schemas/AnnotationSubmission'
          type: array
        task:
          $ref: '#/components/schemas/AnnotationTask'
      required:
      - task
      - revisions
      - submissions
      - reviews
      type: object
    AnnotationObjectRelation:
      properties:
        relation_type:
          maxLength: 128
          minLength: 1
          type: string
        target:
          $ref: '#/components/schemas/TagObjectRef'
      required:
      - relation_type
      - target
      type: object
    AnnotationOperation:
      additionalProperties: false
      properties:
        end_step:
          minimum: 1
          type: integer
        kind:
          enum:
          - EXCLUDE
          - RESTORE
          type: string
        modality_scope:
          const: ALL_MODALITIES
          default: ALL_MODALITIES
          type: string
        operation_id:
          minLength: 1
          type: string
        reason:
          default: ''
          maxLength: 2000
          type: string
        schema_version:
          const: '1'
          default: '1'
          type: string
        start_step:
          minimum: 0
          type: integer
      required:
      - operation_id
      - kind
      - start_step
      - end_step
      type: object
    AnnotationReview:
      additionalProperties: false
      properties:
        checked_kinds:
          items:
