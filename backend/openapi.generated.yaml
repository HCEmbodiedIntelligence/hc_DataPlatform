          pattern: ^[a-f0-9]{64}$
          type: string
        multipart_upload_id:
          type:
          - string
          - 'null'
        object_key:
          pattern: ^raw/v1/
          type: string
        project_id:
          $ref: '#/components/schemas/IngestIdentifier'
        region_code:
          $ref: '#/components/schemas/IngestIdentifier'
        rollout_id:
          $ref: '#/components/schemas/IngestIdentifier'
        session_id:
          format: uuid
          type: string
        source_type:
          enum:
          - BROWSER_MULTIPART
          - OBJECT_STORAGE_REFERENCE
          type: string
        status:
          enum:
          - REGISTERED
          - UPLOADING
          - PAUSED
          - MULTIPART_COMPLETED
          - RAW_COMMITTED
          - FAILED
          - CANCELLED
          type: string
        updated_at:
          format: date-time
          type: string
        workflow:
          oneOf:
          - $ref: '#/components/schemas/IngestWorkflowLocator'
          - type: 'null'
      required:
      - session_id
      - project_id
      - region_code
      - rollout_id
      - data_package_id
      - object_key
      - source_type
      - expected_sha256
      - expected_size
      - expected_crc64
      - manifest_fingerprint
      - status
      - created_at
      - updated_at
      type: object
    UploadSessionGrant:
      properties:
        idempotency_outcome:
          enum:
          - CREATED
          - RESUMED
          - ALREADY_COMMITTED
          type: string
        parts:
          items:
            $ref: '#/components/schemas/PartAuthorization'
          type: array
        session:
          $ref: '#/components/schemas/UploadSession'
      required:
      - session
      - parts
      - idempotency_outcome
      type: object
    UploadSessionListV1:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/UploadSession'
          type: array
        total:
          minimum: 0
          type: integer
      required:
      - items
      - total
      type: object
    VerificationCode:
      enum:
      - MCAP_MISSING_MAGIC
      - MCAP_TRUNCATED
      - MCAP_RECORD_TOO_LARGE
      - MCAP_HEADER_MISSING
      - MCAP_DATA_END_MISSING
      - MCAP_FOOTER_MISSING
      - MCAP_TRAILING_MAGIC_MISSING
      - MCAP_RECORD_INVALID
      - MCAP_DATA_SECTION_CRC_MISMATCH
      - MCAP_CHUNK_CRC_MISMATCH
      - MCAP_CHUNK_SIZE_MISMATCH
      - MCAP_CHUNK_TOO_LARGE
      - MCAP_CHUNK_DECOMPRESSION_FAILED
      - MCAP_UNSUPPORTED_COMPRESSION
      - MCAP_SUMMARY_INVALID
      - MCAP_SUMMARY_CRC_MISMATCH
      - MCAP_INDEX_INVALID
      - MCAP_SCHEMA_MISSING
      - MCAP_REQUIRED_TOPIC_MISSING
      - MCAP_TOPIC_EMPTY
      - MCAP_DECODE_FAILED
      - MCAP_UNKNOWN_OPTIONAL_TOPIC
      type: string
    VerificationFinding:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/VerificationCode'
        message:
          type: string
        record_offset:
          minimum: 0
          type:
          - integer
          - 'null'
        severity:
          $ref: '#/components/schemas/VerificationSeverity'
        topic:
          type:
          - string
          - 'null'
      required:
      - code
      - severity
      - message
      - topic
      - record_offset
      type: object
    VerificationSeverity:
      enum:
      - warning
      - error
      type: string
    VerificationStatus:
      enum:
      - RAW_VERIFIED
      - REJECTED
      type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT or opaque platform session
      scheme: bearer
      type: http
info:
  title: HC Data Platform Backend
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/annotation-tasks/{task_id}:
    get:
      operationId: getAnnotationTask
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: Current task state in the caller's project scope.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/auto-annotation:
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
    post:
      operationId: requestAutoAnnotation
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoAnnotationRequest'
        required: true
      responses:
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '501':
          description: FEATURE_DISABLED; no task or fake result is created.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/claim:
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
    post:
      operationId: claimAnnotationTask
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: The task is claimed by the Annotator.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Annotator role or project scope is missing.
        '404':
          description: The task does not exist.
        '409':
          description: The task is claimed by another Annotator.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/current:
    get:
      operationId: getAnnotationCurrent
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationCurrent'
          description: Current workflow pointers.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/draft:
    get:
      operationId: getAnnotationDraft
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationDraft'
          description: Current assignee-only draft projection.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: The caller is not the scoped Annotator assignee.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/exclusions:
    get:
      operationId: getEffectiveExclusions
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: query
        name: revision
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExclusionRange'
                type: array
          description: Canonical disjoint half-open ranges applied to all modalities.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task or revision does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/history:
    get:
      operationId: getAnnotationHistory
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationHistory'
          description: Current task plus immutable revisions and reviews.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/reviews:
    get:
      operationId: listAnnotationReviews
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnnotationReview'
                type: array
          description: Append-only review history.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
    post:
      operationId: reviewAnnotationRevision
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: Review appended and current workflow state updated.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Reviewer role/scope is missing or configured policy denies self-review.
        '404':
          description: The task or submission does not exist.
        '409':
          description: Submission/ETag is stale
          or OPEN-08 policy remains unconfigured.: null
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/revisions:
    get:
      operationId: listAnnotationRevisions
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnnotationRevision'
                type: array
          description: Immutable revision history, oldest first.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
    post:
      operationId: saveAnnotationDraft
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationRevision'
          description: Immutable revision created, or the identical mutation replayed.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: The caller is not the scoped Annotator assignee.
        '404':
          description: The task does not exist.
        '409':
          description: The revision/ETag is stale or a mutation identifier was reused differently.
        '422':
          attribute: null
          conflict: null
          description: A hierarchy
          half-open boundary: null
          or schema check failed.: null
          relation: null
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/revisions/{revision}:
    get:
      operationId: getAnnotationRevision
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: path
        name: revision
        required: true
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationRevision'
          description: One immutable revision.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task or revision does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/submissions:
    get:
      operationId: listAnnotationSubmissions
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnnotationSubmission'
                type: array
          description: Immutable reviewable versions, oldest first.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/submissions/{submission_id}:
    get:
      operationId: getAnnotationSubmission
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: path
        name: submission_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationSubmission'
          description: One immutable reviewable version.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task or submission does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
  /api/v1/annotation-tasks/{task_id}/submit:
    parameters:
    - $ref: '#/components/parameters/AnnotationProject'
    - $ref: '#/components/parameters/AnnotationRegion'
    post:
      operationId: submitAnnotationRevision
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationSubmission'
          description: Immutable reviewable version, or an identical idempotent replay.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: The caller is not the scoped Annotator assignee.
        '404':
          description: The task does not exist.
        '409':
          description: State/revision/ETag is stale or Idempotency-Key was reused differently.
        '422':
          description: A required review check failed.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/auth/registrations:
    post:
      description: Creates an ACTIVE principal only. It does not create a project, membership, capability
        grant, account approval request, or PENDING account state. OPEN-02 abuse controls are externally
        configured; this contract fixes no thresholds.
      operationId: registerAccount
      requestBody:
        $ref: '#/components/requestBodies/RegistrationCommandBody'
      responses:
        '201':
          content:
            application/json:
              example:
                principal:
                  created_at: '2026-08-17T08:00:00Z'
                  principal_id: 1d815948-e486-4ce6-9754-8f9571682c6a
                  status: ACTIVE
                  username: new-user
              schema:
                $ref: '#/components/schemas/RegistrationResult'
          description: The ACTIVE empty account was created and can log in immediately.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AccessNoStore'
        '409':
          $ref: '#/components/responses/AccessConflict'
        '422':
          $ref: '#/components/responses/AccessUnprocessable'
        '429':
          $ref: '#/components/responses/AccessTooManyRequests'
      security: []
      summary: Register a directly loginable empty account.
      tags:
      - access
  /api/v1/auth/session/bootstrap:
    get:
      description: Recomputes scopes and capabilities from active memberships and grants on every call,
        and returns the current capability revision for client cache invalidation.
      operationId: getSessionBootstrap
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
          description: Current principal, available scopes, and capability revision.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AccessNoStore'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
      security:
      - bearerAuth: []
      summary: Resolve the current principal and effective access.
      tags:
      - access
  /api/v1/auth/session:logout:
    post:
      operationId: logoutSession
      responses:
        '204':
          description: Session is revoked or was already revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AccessNoStore'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
      security:
      - bearerAuth: []
      summary: Revoke the current opaque session.
      tags:
      - access
  /api/v1/auth/sessions:
    post:
      description: OPEN-02 abuse controls are injected and this draft fixes no numeric policy.
      operationId: createSession
      requestBody:
        $ref: '#/components/requestBodies/LoginCommandBody'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
          description: Opaque Bearer session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AccessNoStore'
        '401':
          $ref: '#/components/responses/AccessUnauthorized'
        '422':
          $ref: '#/components/responses/AccessUnprocessable'
        '429':
          $ref: '#/components/responses/AccessTooManyRequests'
      security: []
      summary: Create a session for an ACTIVE account.
      tags:
      - access
  /api/v1/capabilities/auto-annotation:
    get:
      operationId: getAutoAnnotationCapability
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAnnotationCapability'
          description: Phase-one VLM capability is explicitly disabled.
      security: []
      tags:
      - annotation
  /api/v1/datasets/publication-preflight:
    post:
      operationId: preflightDatasetPublication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDatasetRequestV1'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishPreflightReportV1'
          description: Deterministic eligibility and effective-exclusion report.
        '409':
          description: A frozen upstream snapshot is internally inconsistent.
        '422':
          description: The publication target or Lance version is invalid.
      security:
      - bearerAuth: []
      tags:
      - publishing
  /api/v1/datasets/publications:
    post:
      operationId: publishDatasetVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDatasetRequestV1'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedDatasetManifestV1'
          description: Immutable published dataset version and logical asset hashes.
        '409':
          description: The version already exists with different frozen content.
        '422':
          description: No PASS + DERIVED_READY + APPROVED rollout is eligible.
      security:
      - bearerAuth: []
      tags:
      - publishing
  /api/v1/datasets/{dataset_id}/versions/{dataset_version}:
    get:
      operationId: getPublishedDatasetVersion
      parameters:
      - $ref: '#/components/parameters/PublishingDatasetId'
      - $ref: '#/components/parameters/PublishingDatasetVersion'
      - in: query
        name: project_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedDatasetManifestV1'
          description: Frozen publication manifest.
        '404':
          description: The immutable dataset version does not exist.
      security:
      - bearerAuth: []
      tags:
      - publishing
  /api/v1/datasets/{dataset_id}/versions/{dataset_version}/exports:
    post:
      operationId: exportPublishedDatasetVersion
      parameters:
      - $ref: '#/components/parameters/PublishingDatasetId'
      - $ref: '#/components/parameters/PublishingDatasetVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDatasetRequestV1'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResultV1'
          description: Validated promoted export with download authorization.
        '409':
          description: Source coverage
          native reload: null
          or immutable promotion failed.: null
        '501':
          description: The requested exporter or optional data dependency is disabled.
      security:
      - bearerAuth: []
      tags:
      - publishing
  /api/v1/jobs:
    get:
      operationId: listJobs
      parameters:
      - in: query
        name: project_id
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListV1'
          description: Durable workflow jobs ordered newest first
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
