  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions:
    post:
      description: Creates or returns the one immutable multipart session for a rollout and SHA-256.
      operationId: createUploadSession
      parameters:
      - &id001
        in: header
        name: Authorization
        required: true
        schema:
          pattern: ^Bearer .+$
          type: string
      - &id002
        in: path
        name: project_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          type: string
      - &id003
        in: path
        name: region_code
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionGrant'
          description: Multipart session and short-lived direct-upload authorizations.
          headers:
            Cache-Control:
              description: Signed URLs are never cached.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Verified AuthContext is absent.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Uploader role or project/region scope is denied.
        '409': &id006
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Immutable identity, content, state, or multipart part conflict.
      tags:
      - ingest
