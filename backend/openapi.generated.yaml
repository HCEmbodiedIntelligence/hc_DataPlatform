info:
  title: HC Data Platform Backend
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/annotation-tasks/{task_id}:
    get:
      operationId: getAnnotationTask
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: Current task state in the caller's project scope.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/auto-annotation:
    post:
      operationId: requestAutoAnnotation
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                revision:
                  minimum: 0
                  type: integer
              required:
              - revision
              type: object
        required: true
      responses:
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '501':
          description: FEATURE_DISABLED; no task or fake result is created.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/claim:
    post:
      operationId: claimAnnotationTask
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: The task is claimed by the Annotator.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Annotator role or project scope is missing.
        '404':
          description: The task does not exist.
        '409':
          description: The task is claimed by another Annotator.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/current:
    get:
      operationId: getAnnotationCurrent
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationCurrent'
          description: Current workflow pointers.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/draft:
    get:
      operationId: getAnnotationDraft
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationDraft'
          description: Current assignee-only draft projection.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: The caller is not the scoped Annotator assignee.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/exclusions:
    get:
      operationId: getEffectiveExclusions
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: query
        name: revision
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExclusionRange'
                type: array
          description: Canonical disjoint half-open ranges applied to all modalities.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task or revision does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/history:
    get:
      operationId: getAnnotationHistory
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationHistory'
          description: Current task plus immutable revisions and reviews.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/reviews:
    get:
      operationId: listAnnotationReviews
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnnotationReview'
                type: array
          description: Append-only review history.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    post:
      operationId: reviewAnnotationRevision
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationTask'
          description: Review appended and current workflow state updated.
          headers:
            ETag:
              required: true
              schema:
                type: string
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Reviewer role/scope is missing or this is self-review.
        '404':
          description: The task does not exist.
        '409':
          description: Only a submitted revision may be reviewed.
        '412':
          description: The review target or If-Match is stale.
      security:
      - bearerAuth: []
      tags:
      - annotation
  /api/v1/annotation-tasks/{task_id}/revisions:
    get:
      operationId: listAnnotationRevisions
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnnotationRevision'
                type: array
          description: Immutable revision history, oldest first.
        '401':
          description: A verified BE-02 context is missing.
        '403':
          description: Project scope or an annotation role is missing.
        '404':
          description: The task does not exist.
      security:
      - bearerAuth: []
      tags:
      - annotation
    post:
      operationId: saveAnnotationDraft
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          minLength: 1
          type: string
      - in: header
        name: If-Match
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
