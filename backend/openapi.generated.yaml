  /api/v1/projects/{project_id}/regions/{region_code}/upload-manifests:preflight:
    post:
      description: Parses a bounded untrusted Manifest and returns read-only package identifiers, cameras,
        topics, files, checksums, and missing expected topics without writing P20 task configuration.
      operationId: preflightUploadManifest
      parameters:
      - &id001
        in: header
        name: Authorization
        required: true
        schema:
          pattern: ^Bearer .+$
          type: string
      - &id002
        in: path
        name: project_id
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          type: string
      - &id003
        in: path
        name: region_code
        required: true
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutManifestV1'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestPreflightResultV1'
          description: Validated normalized Manifest discovery.
        '401': &id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Verified AuthContext is absent.
        '403': &id005
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Uploader role or project/region scope is denied.
        '413': &id006
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: JSON request exceeds its bounded control-plane limit.
        '415': &id007
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Content-Type is not application/json.
        '422': &id011
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Request or raw-object integrity validation failed.
      security:
      - bearerAuth: []
      tags:
      - ingest
  /api/v1/projects/{project_id}/regions/{region_code}/upload-sessions:
    get:
      description: Lists persisted browser and object-reference upload sessions in one project and region.
      operationId: listUploadSessions
      parameters:
      - *id001
      - *id002
      - *id003
      - in: query
        name: status
        schema:
          enum:
          - REGISTERED
          - UPLOADING
          - PAUSED
          - MULTIPART_COMPLETED
          - RAW_COMMITTED
          - FAILED
          - CANCELLED
          type: string
      - in: query
        name: data_package_id
        schema:
          $ref: '#/components/schemas/IngestIdentifier'
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionListV1'
          description: Upload sessions ordered by most recent update.
        '401': *id004
        '403': *id005
      security:
      - bearerAuth: []
      tags:
      - ingest
    post:
      description: Creates, resumes, or returns the immutable package upload; supports browser multipart
        and an authorized canonical object-storage address.
      operationId: createUploadSession
      parameters:
      - *id001
      - *id002
      - *id003
