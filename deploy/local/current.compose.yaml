# Rebuild application images from this checkout; infrastructure uses the installed
# vendor images. MinIO uses the selected host directory; metadata uses PostgreSQL.
services:
  minio:
    volumes: !override
      - type: bind
        source: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
        target: /data
    image: hc-offline/minio:71eaa560
    pull_policy: never
  minio-init:
    image: hc-offline/mc:71eaa560
    pull_policy: never
  postgres:
    image: hc-offline/postgres:71eaa560
    pull_policy: never
  temporal:
    image: hc-offline/temporal:71eaa560
    pull_policy: never
  migration:
    build:
      args:
        # Identical pinned image, available through ECR when Docker Hub times out.
        PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12.8-slim@sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0
        DEBIAN_MIRROR: https://mirrors.tuna.tsinghua.edu.cn
  frontend:
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      VITE_GIT_COMMIT: ${HC_GIT_COMMIT}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${HC_TUNNEL_HOSTNAME:-localhost}
  frontend-public:
    profiles: [cloudflare]
    image: ghcr.io/nginx/nginx-unprivileged:1.29.4-alpine@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    entrypoint: [/bin/sh, /opt/hc/bin/docker-entrypoint.sh]
    command: [nginx, -g, "daemon off;"]
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_ROBOT_PLATFORM_BASE_URL: ${HC_PUBLIC_ORIGIN:-}
      VITE_SSE_BASE_URL: /api/v1/events
      VITE_MOCK_MODE: "off"
      VITE_BUILD_VERSION: platform-v0.1.0-tunnel
      VITE_RELEASE_ENV: dev
      VITE_PLATFORM_VERSION: 0.1.0
      VITE_GIT_COMMIT: ${HC_GIT_COMMIT}
      VITE_CHART_VERSION: 0.1.0
      VITE_RELEASE_MANIFEST_DIGEST: unreleased
      VITE_MIGRATION_MANIFEST_DIGEST: unreleased
      VITE_COMPONENT_IMAGE_DIGEST: unreleased
    volumes:
      - ../.data-platform-tools/cloudflare/frontend:/usr/share/nginx/html:ro
      - ./frontend/container/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/container/docker-entrypoint.sh:/opt/hc/bin/docker-entrypoint.sh:ro
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    volumes:
      - ./deploy/local/cloudflare-route.inc:/etc/nginx/conf.d/frontend-route-cloudflare.inc:ro
  api:
    environment:
      HC_OBJECT_STORE_BROWSER_PATH: ${HC_LOCAL_FILES_DIRECTORY:-/home/hc_op/workspace/data-platform-files}
      HC_OBJECT_STORE_RAW_BROWSER_PATH: /home/hc_op/workspace/.data-platform-tools/objects
      HC_OBJECT_STORE_LOCAL_PATH: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
  worker:
    environment:
      # A fresh local installation has no fixed project IDs. Discover its
      # persisted project scopes so slicing/QC jobs are actually dispatched.
      HC_LOCAL_SCOPE_DISCOVERY: "true"
      HC_OBJECT_STORE_BROWSER_PATH: ${HC_LOCAL_FILES_DIRECTORY:-/home/hc_op/workspace/data-platform-files}
      HC_OBJECT_STORE_RAW_BROWSER_PATH: /home/hc_op/workspace/.data-platform-tools/objects
      HC_OBJECT_STORE_LOCAL_PATH: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
