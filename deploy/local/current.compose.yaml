# Rebuild application images from this checkout; infrastructure uses the installed
# vendor images. MinIO uses the selected host directory; metadata uses PostgreSQL.
services:
  minio:
    volumes: !override
      - type: bind
        source: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
        target: /data
    image: hc-offline/minio:71eaa560
    pull_policy: never
  minio-init:
    image: hc-offline/mc:71eaa560
    pull_policy: never
  postgres:
    image: hc-offline/postgres:71eaa560
    pull_policy: never
  temporal:
    image: hc-offline/temporal:71eaa560
    pull_policy: never
  migration:
    build:
      args:
        # Identical pinned image, available through ECR when Docker Hub times out.
        PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12.8-slim@sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0
        DEBIAN_MIRROR: https://mirrors.tuna.tsinghua.edu.cn
  frontend:
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      VITE_GIT_COMMIT: ${HC_GIT_COMMIT}
  api:
    environment:
      HC_OBJECT_STORE_BROWSER_PATH: ${HC_LOCAL_FILES_DIRECTORY:-/home/hc_op/workspace/data-platform-files}
      HC_OBJECT_STORE_RAW_BROWSER_PATH: /home/hc_op/workspace/.data-platform-tools/objects
      HC_OBJECT_STORE_LOCAL_PATH: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
  worker:
    environment:
      # A fresh local installation has no fixed project IDs. Discover its
      # persisted project scopes so slicing/QC jobs are actually dispatched.
      HC_LOCAL_SCOPE_DISCOVERY: "true"
      HC_OBJECT_STORE_BROWSER_PATH: ${HC_LOCAL_FILES_DIRECTORY:-/home/hc_op/workspace/data-platform-files}
      HC_OBJECT_STORE_RAW_BROWSER_PATH: /home/hc_op/workspace/.data-platform-tools/objects
      HC_OBJECT_STORE_LOCAL_PATH: ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}
