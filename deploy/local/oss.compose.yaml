x-oss-environment: &oss-environment
  HC_PLATFORM_ENVIRONMENT_ID: hc-oss
  HC_OBJECT_STORE_PROVIDER: oss
  HC_OSS_IMPORT_ARCHIVES: ${HC_OSS_IMPORT_ARCHIVES:-"{}"}
  HC_OBJECT_STORE_COMPACT_PATHS: "true"
  HC_OBJECT_STORE_CACHE_ROOT: /tmp/hc-data/oss-runtime-cache
  HC_OBJECT_STORE_LOCAL_PROCESSING_CACHE: "true"
  HC_OBJECT_STORE_ENDPOINT: ""
  HC_OBJECT_STORE_PUBLIC_ENDPOINT: ""
  HC_OBJECT_STORE_BUCKET: ""
  HC_OBJECT_STORE_ACCESS_KEY: ""
  HC_OBJECT_STORE_SECRET_KEY: ""
  HC_OBJECT_STORE_REGION: cn-beijing
  HC_OBJECT_STORE_PREFIX: ${HC_OSS_OBJECT_PREFIX:-hc_dataplatform}
  HC_OBJECT_STORE_LOCAL_PATH: null
  HC_OBJECT_STORE_BROWSER_PATH: null
  HC_OBJECT_STORE_RAW_BROWSER_PATH: null
  HC_STORAGE_DISK_USAGE_PATH: /var/lib/hc-storage-capacity
x-oss-dependencies: &oss-dependencies
  postgres:
    condition: service_healthy
  migration:
    condition: service_completed_successfully
  temporal:
    condition: service_healthy
  runtime-cache-init:
    condition: service_completed_successfully
services:
  runtime-cache-init:
    command:
      - >-
        chown 65532:65532 /tmp/hc-data/alignment /tmp/hc-data/aligned-media /tmp/hc-data/oss-runtime-cache &&
        chmod 0750 /tmp/hc-data/alignment /tmp/hc-data/aligned-media /tmp/hc-data/oss-runtime-cache
    volumes:
      - oss-runtime-cache:/tmp/hc-data/oss-runtime-cache
  minio:
    profiles: [local-only]
    volumes: !override [minio-data:/data]
  minio-init:
    profiles: [local-only]
  object-store-browser:
    profiles: [local-only]
  postgres:
    ports: !override ["127.0.0.1:5433:5432"]
  temporal:
    ports: !override ["127.0.0.1:7234:7233"]
  api:
    environment:
      <<: *oss-environment
      HC_STORAGE_LOCAL_USAGE_ROOTS: '{"oss_cache": "/tmp/hc-data/oss-runtime-cache", "minio": "/var/lib/hc-storage-capacity", "alignment": "/tmp/hc-data/alignment", "media": "/var/lib/hc-capacity/media", "models": "/var/cache/hc-robot-previews", "legacy_alignment": "/var/lib/hc-capacity/local-alignment", "legacy_media": "/var/lib/hc-capacity/local-media"}'
    depends_on: !override
      <<: *oss-dependencies
    ports: !override ["127.0.0.1:8001:8000"]
    volumes: !override
      - ./backend:/app:ro
      - alignment-cache:/tmp/hc-data/alignment
      - oss-runtime-cache:/tmp/hc-data/oss-runtime-cache
      - media-staging:/var/lib/hc-capacity/media:ro
      - local-alignment-capacity:/var/lib/hc-capacity/local-alignment:ro
      - local-media-capacity:/var/lib/hc-capacity/local-media:ro
      - ${HC_MINIO_DATA_DIRECTORY:-/home/hc_op/workspace/data-platform-storage}:/var/lib/hc-storage-capacity:ro
      - ../.data-platform-tools/robot-previews:/var/cache/hc-robot-previews:ro
  worker:
    volumes:
      - oss-runtime-cache:/tmp/hc-data/oss-runtime-cache
    environment: *oss-environment
    depends_on: !override
      <<: *oss-dependencies
    deploy:
      replicas: 1
  frontend:
    environment:
      VITE_ROBOT_PLATFORM_BASE_URL: ""
    ports: !override ["127.0.0.1:5175:5173"]
  gateway:
    ports: !override ["0.0.0.0:8089:8080"]
    volumes: !override
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  oss-runtime-cache:
    external: true
    name: hc-data-platform-oss_oss-runtime-cache
  local-alignment-capacity:
    external: true
    name: hc-data-platform-dev_alignment-cache
  local-media-capacity:
    external: true
    name: hc-data-platform-dev_media-staging
