{{- if .Values.backend.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-schema-expand
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    hc-data-platform.io/migration-phase: expand
    hc-data-platform.io/release-manifest-digest: {{ .Values.global.releaseManifestDigest | quote }}
    {{- with .Values.backend.migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.backend.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.backend.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.backend.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: expand
          image: {{ include "hc-data-platform.backendImage" .Values.backend.api.image | quote }}
          imagePullPolicy: {{ .Values.backend.api.image.pullPolicy }}
          command: ["hc-data-migrate"]
          args: ["upgrade-expand"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HC_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.existingSecrets.postgres.name is required" .Values.backend.existingSecrets.postgres.name | quote }}
                  key: {{ required "backend.existingSecrets.postgres.dsnKey is required" .Values.backend.existingSecrets.postgres.dsnKey | quote }}
          resources:
            {{- toYaml .Values.backend.migration.resources | nindent 12 }}
{{- if .Values.backend.migration.contract.enabled }}
{{- $approvalDigest := required "backend.migration.contract.approvalDigest is required" .Values.backend.migration.contract.approvalDigest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $approvalDigest) -}}
{{- fail "backend.migration.contract.approvalDigest must be a sha256 digest" -}}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-schema-contract-{{ .Release.Revision }}
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-contract
  annotations:
    hc-data-platform.io/migration-phase: contract
    hc-data-platform.io/approval-digest: {{ $approvalDigest | quote }}
    hc-data-platform.io/release-manifest-digest: {{ .Values.global.releaseManifestDigest | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.backend.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.backend.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-contract
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: contract
          image: {{ include "hc-data-platform.backendImage" .Values.backend.api.image | quote }}
          imagePullPolicy: {{ .Values.backend.api.image.pullPolicy }}
          command: ["hc-data-migrate"]
          args:
            - upgrade-contract
            - --approval-digest
            - {{ $approvalDigest | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HC_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.existingSecrets.postgres.name is required" .Values.backend.existingSecrets.postgres.name | quote }}
                  key: {{ required "backend.existingSecrets.postgres.dsnKey is required" .Values.backend.existingSecrets.postgres.dsnKey | quote }}
          resources:
            {{- toYaml .Values.backend.migration.resources | nindent 12 }}
{{- end }}
{{- end }}
