apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hc-data-platform.fullname" . }}-frontend
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.frontend.strategy.maxUnavailable }}
      maxSurge: {{ .Values.frontend.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        hc-data-platform.io/release-id: {{ .Values.global.releaseId | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "hc-data-platform.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: VITE_API_BASE_URL
              value: {{ .Values.frontend.runtimeConfig.apiBaseUrl | quote }}
            - name: VITE_SSE_BASE_URL
              value: {{ .Values.frontend.runtimeConfig.sseBaseUrl | quote }}
            - name: VITE_MOCK_MODE
              value: {{ .Values.frontend.runtimeConfig.mockMode | quote }}
            - name: VITE_BUILD_VERSION
              value: {{ .Values.global.releaseId | quote }}
            - name: VITE_RELEASE_ENV
              value: {{ .Values.frontend.runtimeConfig.releaseEnvironment | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.frontend.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.frontend.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.frontend.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hc-data-platform.fullname" . }}-frontend
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "hc-data-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http

