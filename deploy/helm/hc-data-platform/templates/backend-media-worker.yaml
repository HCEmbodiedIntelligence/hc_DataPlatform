apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-media-worker
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: media-worker
spec:
  replicas: {{ .Values.backend.mediaWorker.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.mediaWorker.strategy.maxUnavailable }}
      maxSurge: {{ .Values.backend.mediaWorker.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: media-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        hc-data-platform.io/release-manifest-digest: {{ .Values.global.releaseManifestDigest | quote }}
        hc-data-platform.io/component-image-digest: {{ .Values.backend.mediaWorker.image.digest | quote }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: media-worker
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hc-data-platform.backendServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.backend.mediaWorker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: media-worker
          image: {{ include "hc-data-platform.backendImage" .Values.backend.mediaWorker.image | quote }}
          imagePullPolicy: {{ .Values.backend.mediaWorker.image.pullPolicy }}
          command: ["opentelemetry-instrument"]
          args: ["python", "-m", "hc_data_platform.workflow.worker"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "hc-data-platform.backendFullname" . }}
          env:
            - name: OTEL_SERVICE_NAME
              value: hc-data-media-worker
            - name: HC_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HC_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HC_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HC_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HC_COMPONENT_ROLE
              value: media-worker
            - name: HC_COMPONENT_IMAGE_DIGEST
              value: {{ .Values.backend.mediaWorker.image.digest | quote }}
            - name: HC_WORKER_ROLE
              value: media
            - name: HC_WORKER_GRACEFUL_SHUTDOWN_SECONDS
              value: {{ .Values.backend.mediaWorker.gracefulShutdownSeconds | quote }}
            - name: HC_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS
              value: {{ .Values.backend.mediaWorker.maxConcurrentWorkflowTasks | quote }}
            - name: HC_WORKER_MAX_CONCURRENT_ACTIVITIES
              value: {{ .Values.backend.mediaWorker.maxConcurrentActivities | quote }}
            - name: HC_WORKER_MAX_CACHED_WORKFLOWS
              value: {{ .Values.backend.mediaWorker.maxCachedWorkflows | quote }}
            - name: HC_WORKER_READINESS_FILE
              value: /tmp/hc-runtime/worker-ready
            - name: HC_WORKFLOW_ACTIVITY_FACTORY
              value: hc_data_platform.runtime:media_activity_dependencies
            {{- include "hc-data-platform.backendSecretEnv" . | nindent 12 }}
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            {{- toYaml .Values.backend.worker.probes.startup | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/hc-runtime/worker-ready"]
            {{- toYaml .Values.backend.worker.probes.readiness | nindent 12 }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            {{- toYaml .Values.backend.worker.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.mediaWorker.resources | nindent 12 }}
          volumeMounts:
            - name: staging
              mountPath: /tmp/hc-data/aligned-media
            - name: runtime
              mountPath: /tmp/hc-runtime
      volumes:
        - name: staging
          emptyDir:
            sizeLimit: {{ .Values.backend.mediaWorker.stagingSizeLimit }}
        - name: runtime
          emptyDir:
            sizeLimit: {{ required "backend.mediaWorker.runtimeSizeLimit is required" .Values.backend.mediaWorker.runtimeSizeLimit | quote }}
      {{- with .Values.backend.mediaWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.mediaWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.mediaWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.highAvailability.enabled }}
      {{- include "hc-data-platform.haTopologySpreadConstraints" (dict "root" . "component" "media-worker") | nindent 6 }}
      {{- else }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
