{{- if .Values.backend.capacityGate.enabled }}
{{- $configMapName := required "backend.capacityGate.evidenceConfigMap.name is required" .Values.backend.capacityGate.evidenceConfigMap.name }}
{{- $configMapKey := required "backend.capacityGate.evidenceConfigMap.key is required" .Values.backend.capacityGate.evidenceConfigMap.key }}
{{- $evidenceSha := required "backend.capacityGate.evidenceConfigMap.sha256 is required" .Values.backend.capacityGate.evidenceConfigMap.sha256 }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $evidenceSha) }}
{{- fail "backend.capacityGate.evidenceConfigMap.sha256 must be an exact lowercase sha256 digest" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-capacity-gate
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: capacity-gate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    hc-data-platform.io/capacity-evidence-sha256: {{ $evidenceSha | quote }}
    {{- with .Values.backend.capacityGate.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.backend.capacityGate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.backend.capacityGate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.backend.capacityGate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: capacity-gate
      annotations:
        hc-data-platform.io/capacity-evidence-sha256: {{ $evidenceSha | quote }}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: capacity-gate
          image: {{ include "hc-data-platform.backendImage" .Values.backend.api.image | quote }}
          imagePullPolicy: {{ .Values.backend.api.image.pullPolicy }}
          command: ["python", "-m", "hc_data_platform.core.capacity_gate"]
          args:
            - --evidence
            - /evidence/capacity-evidence.json
            - --expected-sha256
            - {{ $evidenceSha | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.capacityGate.resources | nindent 12 }}
          volumeMounts:
            - name: evidence
              mountPath: /evidence
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: evidence
          configMap:
            name: {{ $configMapName | quote }}
            items:
              - key: {{ $configMapKey | quote }}
                path: capacity-evidence.json
        - name: tmp
          emptyDir: {}
{{- end }}
