apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-api
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.backend.api.autoscaling.enabled }}
  replicas: {{ .Values.backend.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.api.strategy.maxUnavailable }}
      maxSurge: {{ .Values.backend.api.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        hc-data-platform.io/release-manifest-digest: {{ .Values.global.releaseManifestDigest | quote }}
        hc-data-platform.io/component-image-digest: {{ .Values.backend.api.image.digest | quote }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hc-data-platform.backendServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.backend.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "hc-data-platform.backendImage" .Values.backend.api.image | quote }}
          imagePullPolicy: {{ .Values.backend.api.image.pullPolicy }}
          command: ["opentelemetry-instrument"]
          args:
            - uvicorn
            - hc_data_platform.core.app:create_app
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.backend.api.port | quote }}
            - --timeout-graceful-shutdown
            - {{ .Values.backend.api.gracefulShutdownSeconds | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "hc-data-platform.backendFullname" . }}
          env:
            - name: OTEL_SERVICE_NAME
              value: hc-data-backend-api
            - name: HC_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HC_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HC_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HC_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HC_COMPONENT_ROLE
              value: api
            - name: HC_COMPONENT_IMAGE_DIGEST
              value: {{ .Values.backend.api.image.digest | quote }}
            {{- include "hc-data-platform.backendSecretEnv" . | nindent 12 }}
            {{- include "hc-data-platform.backendApiSecretEnv" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.backend.api.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.backend.api.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.backend.api.probes.liveness | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.backend.api.drainDelaySeconds }}"]
          resources:
            {{- toYaml .Values.backend.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ required "backend.api.tmpSizeLimit is required" .Values.backend.api.tmpSizeLimit | quote }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.highAvailability.enabled }}
      {{- include "hc-data-platform.haTopologySpreadConstraints" (dict "root" . "component" "api") | nindent 6 }}
      {{- else }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-api
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.backend.api.service.type }}
  selector:
    {{- include "hc-data-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.backend.api.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.backend.api.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hc-data-platform.backendFullname" . }}-metrics
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    {{- include "hc-data-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: metrics
      port: {{ .Values.backend.api.metrics.servicePort }}
      targetPort: http
      protocol: TCP
{{- end }}
