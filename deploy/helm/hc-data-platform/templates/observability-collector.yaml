{{- if .Values.observability.enabled }}
{{- $name := include "hc-data-platform.observabilityFullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-otel-collector
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: {{ .Values.observability.collector.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "hc-data-platform.observabilityImage" .Values.observability.collector.image | quote }}
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HC_LOKI_OTLP_ENDPOINT
              value: {{ ternary (printf "http://%s-loki:3100/otlp" $name) .Values.observability.loki.endpoint .Values.observability.loki.embedded | quote }}
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: prometheus, containerPort: 9464, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.observability.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-collector
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      {{- with .Values.observability.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.observability.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.observability.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.highAvailability.enabled }}
      {{- include "hc-data-platform.haTopologySpreadConstraints" (dict "root" . "component" "otel-collector") | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-otel-collector
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    {{- include "hc-data-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 9464, targetPort: prometheus}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-otel-collector
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-otel-agent
  labels:
    {{- include "hc-data-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-agent
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  selector:
    matchLabels:
      {{- include "hc-data-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-agent
  template:
    metadata:
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
      labels:
        {{- include "hc-data-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: false
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "hc-data-platform.observabilityImage" .Values.observability.collector.image | quote }}
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/agent.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          env:
            - name: HC_OTEL_GATEWAY_ENDPOINT
              value: {{ printf "%s-otel-collector:4317" $name | quote }}
            - name: HC_FRONTEND_LOG_GLOB
              value: {{ printf "/var/log/pods/%s_%s-frontend-*_*/*/*.log" .Release.Namespace (include "hc-data-platform.fullname" .) | quote }}
          ports:
            - {name: health, containerPort: 13133, protocol: TCP}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.observability.frontendLogAgent.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: checkpoint, mountPath: /var/lib/hc-otel-agent}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-agent
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: checkpoint
          hostPath: {path: /var/lib/hc-otel-agent, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      {{- with .Values.observability.frontendLogAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.observability.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
