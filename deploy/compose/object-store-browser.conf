map $http_origin $browser_upload_origin {
    default "";
    "http://127.0.0.1:8088" $http_origin;
    "http://localhost:8088" $http_origin;
    "http://127.0.0.1:5174" $http_origin;
    "http://localhost:5174" $http_origin;
}

map $http_access_control_request_method $browser_upload_method {
    default "";
    PUT PUT;
    HEAD HEAD;
}

map $http_access_control_request_headers $browser_upload_headers_allowed {
    default 0;
    "" 1;
    ~*^content-type$ 1;
}

server {
    listen 9000;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 0;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        if ($request_method = OPTIONS) {
            return 418;
        }
        # Browser uploads and short-lived signed downloads share the public S3
        # endpoint. MinIO still verifies SigV4 for every forwarded operation.
        if ($request_method !~ ^(?:GET|PUT|HEAD)$) {
            return 405;
        }

        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin $browser_upload_origin always;
        add_header Access-Control-Expose-Headers ETag always;
        add_header Vary Origin always;
    }

    error_page 418 = @browser_upload_preflight;
    location @browser_upload_preflight {
        if ($browser_upload_origin = "") {
            return 403;
        }
        if ($browser_upload_method = "") {
            return 403;
        }
        if ($browser_upload_headers_allowed = 0) {
            return 403;
        }

        add_header Access-Control-Allow-Origin $browser_upload_origin always;
        add_header Access-Control-Allow-Methods $browser_upload_method always;
        add_header Access-Control-Allow-Headers "content-type" always;
        add_header Access-Control-Expose-Headers ETag always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
        return 204;
    }
}
