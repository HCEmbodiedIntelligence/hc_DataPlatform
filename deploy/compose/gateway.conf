server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $api_upstream http://api:8000;
    set $frontend_upstream http://frontend:5173;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Public listener fail-closed paths. Metrics are scraped through the backend's
    # internal service; documentation can only be enabled on a non-production app profile.
    location ~ ^/(?:metrics|openapi\.json|docs(?:/oauth2-redirect)?|redoc)$ {
        access_log off;
        return 404;
    }

    location = /health/live {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The real-API overlay may mount narrowly scoped external-abuse controls
    # here. The base development and isolated system-test gateways intentionally
    # have no rate policy so their unrelated test traffic is unaffected.
    include /etc/nginx/conf.d/real-api-location-*.inc;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
