map $upstream_http_x_request_id $hc_response_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}

# Local deployments may route public hostnames to a bundled frontend while
# retaining the development server for LAN access.
map $host $frontend_upstream {
    default http://frontend:5173;
    include /etc/nginx/conf.d/frontend-route-*.inc;
}

# A loopback browser can fetch the local bucket through this gateway using the
# Host that was signed. Forward the raw object path and query byte-for-byte.
map $request_uri $recording_media_uri {
    default "";
    ~^/_recording_media/[A-Za-z0-9.:-]+(/hc-data-local/[^?]+\?.+)$ $1;
}

log_format hc_json escape=json '{"schema_version":"hc-runtime-log/v1","timestamp":"$time_iso8601","severity":"INFO","service":"hc-data-platform-gateway","instance_id":"$hostname:$pid","node_name":"$hostname","role":"gateway","release_id":"unreleased","request_id":"$hc_response_request_id","trace_id":null,"operation_id":null,"workflow_id":null,"event_code":"HTTP.REQUEST_COMPLETED","duration_ms":null,"retry_count":null,"error_type":null,"route":"$hc_route","http_method":"$request_method","status_code":$status}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout hc_json;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=5s ipv6=off;

    set $api_upstream http://api:8000;
    set $object_store_upstream http://minio:9000;
    set $hc_route /;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Public listener fail-closed paths. Metrics are scraped through the backend's
    # internal service; documentation can only be enabled on a non-production app profile.
    location ~ ^/(?:metrics|openapi\.json|docs(?:/oauth2-redirect)?|redoc)$ {
        access_log off;
        return 404;
    }

    location = /health/live {
        set $hc_route /health/live;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        set $hc_route /health/ready;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The real-API overlay may mount narrowly scoped external-abuse controls
    # here. The base development and isolated system-test gateways intentionally
    # have no rate policy so their unrelated test traffic is unaffected.
    include /etc/nginx/conf.d/real-api-location-*.inc;

    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"detail":"Not Found"}';
    }

    # The fixed robot can contain large binary STL files. Compress these private
    # downloads losslessly without changing their authorization or cache policy.
    location ~ ^/api/v1/organizations/[^/]+/robot-model-assets/content$ {
        set $hc_route /api/v1/organizations/:organization_id/robot-model-assets/content;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/octet-stream application/xml text/xml model/stl model/x.stl application/sla model/gltf-binary;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $hc_route /api/;
        # Full sample decoding can exceed nginx's 60s default. Leave time for
        # the browser to recover persisted results before the edge times out.
        proxy_read_timeout 110s;
        # Browser LeRobot uploads use 32 MiB multipart bodies and can grow to
        # ~525 MiB for the largest contract-supported source object. The API
        # streams/spools these only when direct object-storage upload is blocked.
        client_max_body_size 600m;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/_recording_media/(?<recording_signer>[A-Za-z0-9.-]+(?::[0-9]+)?)/hc-data-local/ {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        if ($recording_media_uri = "") { return 404; }
        if ($args !~ "(^|&)X-Amz-Signature=[0-9a-f]+(&|$)") { return 403; }
        access_log off;
        proxy_pass $object_store_upstream$recording_media_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host $recording_signer;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # LAN clients use the page origin for signed uploads, downloads and video.
    # Preserve the original Host (including its port), bucket path and query
    # so that MinIO can verify SigV4 without a separate browser-facing S3 port.
    location ^~ /hc-data-local/ {
        if ($request_method !~ ^(?:GET|PUT|HEAD)$) { return 405; }
        access_log off;
        client_max_body_size 600m;
        proxy_pass $object_store_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
