include /tmp/hc-runtime/logging.conf;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout hc_json;
    error_log /dev/stderr warn;
    client_max_body_size 600m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location = /config.js {
        alias /tmp/hc-runtime/config.js;
        add_header Cache-Control no-store always;
    }
    location ~ ^/(?:metrics|openapi\.json|docs(?:/oauth2-redirect)?|redoc)$ { return 404; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
    # Keep the bucket path, query and original Host intact for S3 SigV4.
    # Direct multipart uploads and video Range reads share the page origin.
    location ^~ /hc-data-local/ {
        if ($request_method !~ ^(?:GET|PUT|HEAD)$) { return 405; }
        access_log off;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache always;
    }
}
