# Loaded only by compose.real-api.yaml at the nginx http level.
# Keep keys/zones bounded to public authentication and bearerless preview-media traffic.
limit_req_zone $binary_remote_addr zone=real_api_auth_sessions:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=real_api_preview_media:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=real_api_preview_media_conn:10m;
