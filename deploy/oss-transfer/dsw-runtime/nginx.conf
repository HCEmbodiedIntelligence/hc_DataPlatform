worker_processes 1;
pid /mnt/workspace/hc-platform/service/nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /mnt/workspace/hc-platform/service/nginx/body;
  proxy_temp_path /mnt/workspace/hc-platform/service/nginx/proxy;
  fastcgi_temp_path /mnt/workspace/hc-platform/service/nginx/fastcgi;
  uwsgi_temp_path /mnt/workspace/hc-platform/service/nginx/uwsgi;
  scgi_temp_path /mnt/workspace/hc-platform/service/nginx/scgi;
  map "$request_method:$uri" $hc_preview_allowed {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    ~^POST:/api/v1/auth/ 1;
  }
  map $http_x_forwarded_proto $public_proto { default $scheme; https https; }
  server {
    listen 127.0.0.1:8089;
    server_name _;
    root /mnt/workspace/hc-platform/runtime/web;
    client_max_body_size 600m;
    location = /healthz { return 200 "ok\n"; }
    location ~ ^/(?:health/(?:ready|live)$|api/) {
      @PREVIEW@
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $public_proto;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 900s;
      proxy_pass http://127.0.0.1:18001;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
  }
}
