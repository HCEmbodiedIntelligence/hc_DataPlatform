global_rules:
  supported_application_window:
    minimum_adjacent_versions: 2
    direction:
      - source_application_on_target_expand_schema
      - target_application_on_source_schema_during_canary
      - source_frontend_on_target_api
      - target_frontend_on_source_api_during_rollback
  expand_phase:
    allowed:
      - add_nullable_column
      - add_column_with_backward_compatible_default
      - add_table_or_index_without_removing_old_access_path
      - add_enum_value_only_after_old_reader_unknown_value_test
      - introduce_dual_read_or_dual_write_path
    forbidden:
      - drop_or_rename_column
      - narrow_type_or_constraint_before_backfill
      - remove_enum_value
      - change_meaning_of_existing_field
      - require_new_config_or_secret_without_source_default
    acceptance:
      - source_and_target_application_tests_on_expanded_schema
      - migration_advisory_lock_single_owner
      - forward_only_checksum_ledger_current
  migrate_phase:
    requirements:
      - checkpointed_and_idempotent
      - bounded_batches_and_rate_limits
      - source_and_target_read_paths_remain_valid
      - progress_and_failure_audited
  contract_phase:
    separate_release_gate: true
    prerequisites:
      - no_source_release_instances_or_temporal_tasks_on_contract_path
      - rollback_observation_window_expired
      - current_release_stable
      - integrity_verified_backup_current
      - restore_verified_drill_within_policy
      - explicit_approval
    database_down_migration_allowed: false
  temporal:
    patch_id_reuse_allowed: false
    patch_removal_requires_replay_evidence_and_worker_routing: true
    old_worker_build_retention_required_through_rollback_window: true
    unknown_or_unrouted_history_policy: stop_rollout
  api_and_client:
    incompatible_change_requires_new_versioned_path_or_dual_contract: true
    deprecation_minimum_adjacent_releases: 2
    generated_client_must_match_target_openapi: true
    both_canary_directions_must_pass: true
  configuration:
    expand_keys_require_source_safe_default: true
    secret_key_removal_is_contract_phase: true
    hot_reload_default: forbidden
    hot_reload_requires_allowlist_schema_revision_audit_and_rollback: true
  rollback:
    database_restore_is_not_routine_application_rollback: true
    before_contract_keep_forward_schema_and_deploy_exact_source_digests: true
    after_incompatible_contract_use_forward_fix_or_verified_restore: true
