api_version: hc-data-platform.io/v1alpha1
kind: SharedProviderHAContract
metadata:
  contract_version: 1
  effective_date: "2026-08-29"
  implementation_task: HA4-04
  evidence_status: REAL_LOCAL_PROTOCOL_FAILOVER_PASSED

application_contract:
  endpoint_identity_changes_on_failover: false
  application_restart_required: false
  credential_rotation_during_provider_failover: false
  sequential_provider_failure_drill: true
  correlated_site_failure_claim: false

providers:
  - id: postgresql
    production_mode: external_ha_writer_endpoint
    source_of_truth: synchronous_or_bounded_rpo_replica_set
    stable_application_endpoint: required
    acceptance_event: terminate_current_writer_and_promote_caught_up_replica
    acceptance_result: existing_session_and_new_idempotent_write_succeed_without_dsn_change
    authority_checks:
      - promoted_node_is_not_in_recovery
      - committed_lsn_is_present_on_promoted_node
      - migration_ledger_remains_current
      - old_writer_is_fenced_before_rejoin
  - id: object_store
    production_mode: external_versioned_ha_s3
    source_of_truth: erasure_coded_or_provider_replicated_bucket
    stable_application_endpoint: required
    acceptance_event: terminate_one_serving_storage_node
    acceptance_result: existing_object_read_and_new_presigned_multipart_part_succeed
    authority_checks:
      - versioning_remains_enabled
      - exact_object_hash_is_unchanged
      - incomplete_multipart_identity_is_preserved
      - quorum_is_healthy_before_and_after_failure
  - id: temporal
    production_mode: external_managed
    source_of_truth: provider_supported_ha_namespace
    stable_application_endpoint: required
    acceptance_event: terminate_one_serving_frontend
    acceptance_result: in_flight_and_new_workflows_reach_one_terminal_result_without_target_change
    authority_checks:
      - namespace_identity_is_unchanged
      - workflow_ids_remain_unique
      - task_queue_backlog_returns_to_zero
      - provider_rpo_and_rto_evidence_is_current

secret_consistency:
  manager_mode: external_versioned_secret_manager
  public_revision_setting: HC_SECRET_BUNDLE_REVISION
  revision_format: sha256
  plaintext_fingerprint_exported: false
  pod_sources:
    - postgres_secret_reference
    - object_store_secret_reference
    - application_secret_reference
  rotation_method: create_new_immutable_bundle_then_roll_all_backend_pods
  forbidden_methods:
    - in_place_partial_key_update
    - dynamic_dsn_or_credential_hot_reload
    - replacement_secret_generation_during_failover
  rollback: exact_previous_bundle_revision_and_secret_references

acceptance:
  required_providers:
    - postgresql
    - object_store
    - temporal
  request_probe_during_each_failure: required
  secret_revision_equal_across_api_and_workers: required
  final_application_restarts: 0
  database_side_effect_duplicates: 0
  workflow_side_effect_duplicates: 0
  capacity_claim: NOT_APPLICABLE

evidence:
  observed_at: "2026-08-29T00:51:27Z"
